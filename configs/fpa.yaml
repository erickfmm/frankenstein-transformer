# First Passage Attention (arXiv:2610.22714) — paper reference configuration,
# adapted to this toolkit's model class and vocab defaults.
# Paper: 110M causal decoder, width 768, 12 layers, 12 heads (head dim 64),
# SwiGLU-2048, RMSNorm, no positional encoding (the learned walk is
# positional), tied 32k (Mistral) vocabulary, context 2048, beta init 1,
# straight-through soft-minimum temperature tau = 1.
model_class: frankenstein_text_decoder
model:
  dims:
    vocab_size: 32000
    hidden_size: 768
    num_layers: 12
    num_loops: 1
    num_heads: 12
    num_kv_heads: 12
    dropout: 0.0
    mode: decoder
    layer_pattern:
    - fpa
  norm:
    type: rms_norm
  attention:
    fpa:
      beta_init: 1.0
      tau: 1.0
    retnet:
      heads: 12
  moe:
    enabled: false
  bitnet:
    enabled: false
  ffn:
    hidden_size: 2048
    activation: swiglu
  positional_encoding: none
training:
  task: causal_lm
  seed: 42
  batch_size: 8
  dataloader_workers: 2
  max_length: 2048
  gradient_accumulation_steps: 8
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_other: 3.0e-4
      adamw-lr_attention: 3.0e-4
      adamw-betas_other:
      - 0.9
      - 0.95
      adamw-betas_attention:
      - 0.9
      - 0.95
      adamw-eps_other: 1.0e-8
      adamw-eps_attention: 1.0e-8
      adamw-wd_other: 0.1
      adamw-wd_attention: 0.01
  # Paper: 5150 steps with a 512-step linear warm-up (ratio 0.0994).
  scheduler_total_steps: 5150
  scheduler_warmup_ratio: 0.0994
  scheduler_type: cosine
  grad_clip_max_norm: 1.0
  max_nan_retries: 4
  gradient_log_interval: 10
  csv_log_path: training_metrics_fpa.csv
  telemetry_log_interval: 5
