# Vision Transformer with the Conformer mixer (arXiv:2005.08100) in
# `layer_pattern`: the convolution-augmented block also works on image patch
# sequences (the conv module then mixes neighbouring patches along the
# sequence axis). Empty `dataset_name` -> synthetic DummyImageDataset.
model_class: frankenstein_vit
model:
  dims:
    vocab_size: 512
    hidden_size: 64
    num_layers: 2
    num_loops: 1
    num_heads: 4
    dropout: 0.1
    layer_pattern:
      - conformer_attn
      - standard_attn
    mode: encoder
  norm:
    type: layer_norm
  embedding:
    factorized:
      enabled: false
    conv:
      enabled: false
  attention:
    conformer:
      kernel_size: 16
      macaron: true
      conv_norm: batch
  moe:
    enabled: false
  bitnet:
    enabled: false
  ffn:
    hidden_size: 256
    activation: silu
image:
  image_size:
    height: 32
    width: 32
  patch_size: 8
  in_channels: 3
  pos_embedding_type: learned_1d
  cls_token: true
  pooling_mode: cls
  num_classes: 10
vision_dataset:
  dataset_name: ""
  rescale:
    height: 32
    width: 32
training:
  task: classification
  batch_size: 8
  num_epochs: 1
  dataloader_workers: 0
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_other: 0.001
      adamw-wd_other: 0.1
