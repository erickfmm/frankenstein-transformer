model_class: frankenstein
model:
  dims:
    vocab_size: 50000
    hidden_size: 384
    # Middle-cycle at 6 physical layers, paper-style at small scale:
    # 2L begin -> 2L middle (x3 loops) -> 2L end (unrolled depth 10).
    num_layers: 6
    num_loops: 3
    num_heads: 6
    retention_heads: 6
    layer_pattern:
    - titan_attn
    - retnet
    - standard_attn
    - sigmoid_attn
    - retnet
    - titan_attn
  norm:
    type: layer_norm
  embedding:
    factorized:
      enabled: true
  ffn_hidden_size: 1056
  # Hyperloop Transformers (arXiv:2604.21254): loop-level hyper-connections
  # over the looped middle block. Requires mhc.enabled=true and num_loops>=2.
  # Here: 2 begin layers -> 2 looped middle layers x3 -> 2 end layers.
  mhc:
    enabled: true
    expansion_rate: 4
    gating_init: 0.01
    checkpoint: false
    full_prec_under_bitnet: true
    hyperloop: true
    hyperloop_begin_layers: 2
    hyperloop_end_layers: 2
    hyperloop_res_parameterization: diagonal
training:
  task: mlm
  num_epochs: 4
  batch_size: 4
  dataloader_workers: 2
  max_length: 512
  mlm_probability: 0.15
  max_samples: 6000000
  dataset_batch_size: 15000
  num_workers: 6
  cache_dir: ./temp_data/v2_dataset_cache
  prefer_local_cache: true
  stream_local_parquet: true
  join_temp_data_context_window: 0
  join_temp_data_min_remainder_tokens: 128
  gradient_accumulation_steps: 8
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_embeddings: 1e-6
      adamw-lr_norms: 5e-6
      adamw-lr_attention: 3e-6
      adamw-lr_other: 2e-6
      adamw-wd_embeddings: 0.01
      adamw-wd_norms: 0.001
      adamw-wd_attention: 0.01
      adamw-wd_other: 0.01
      adamw-betas_embeddings:
      - 0.9
      - 0.95
      adamw-betas_norms:
      - 0.9
      - 0.95
      adamw-betas_attention:
      - 0.9
      - 0.95
      adamw-betas_other:
      - 0.9
      - 0.95
      adamw-eps_embeddings: 1e-8
      adamw-eps_norms: 1e-8
      adamw-eps_attention: 1e-8
      adamw-eps_other: 1e-8
  scheduler_total_steps: 9000
  max_nan_retries: 4
  gradient_log_interval: 10
  csv_log_path: training_metrics_hyperloop_mhc_adamw.csv
  telemetry_log_interval: 5