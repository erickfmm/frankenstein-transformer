model_class: frankenstein_text_encoder
model:
  dims:
    vocab_size: 50000
    hidden_size: 768
    num_layers: 12
    num_loops: 1
    num_heads: 12
    layer_pattern:
    - retnet
    - titan
    - mamba
    - ode
  norm:
    type: layer_norm
  embedding:
    conv:
      enabled: false
  bitnet:
    enabled: false
  ffn:
    hidden_size: 3072
  attention:
    ode:
      solver: rk4
      steps: 2
    retnet:
      heads: 12
training:
  task: mlm
  seed: 42
  num_epochs: 4
  batch_size: 2
  dataloader_workers: 2
  max_length: 256
  mlm_probability: 0.15
  max_samples: 6000000
  dataset_batch_size: 15000
  num_workers: 6
  cache_dir: ./temp_data/v2_dataset_cache
  local_parquet_dir: /home/erickfmm/.cache/huggingface/hub/datasets--erickfmm--red_pajama_es_hq_35/snapshots/bd7286c289a95dc3803c375bc36aaaeb138b1eab/train/
  prefer_local_cache: true
  stream_local_parquet: true
  join_temp_data_context_window: 0
  join_temp_data_min_remainder_tokens: 128
  gradient_accumulation_steps: 1
  optimizer:
    optimizer_class: eve
    parameters:
      eve-lr_embeddings: 1e-6
      eve-lr_pos: 2e-6
      eve-lr_attention: 3e-6
      eve-lr_ffn: 2e-6
      eve-lr_norms: 5e-6
      eve-lr_head: 2e-6
      eve-lr_mhc: 3e-6
      eve-lr_router: 2e-6
      eve-lr_residual: 2e-6
      eve-lr_other: 2e-6
      eve-wd_embeddings: 5.0e-4
      eve-wd_pos: 5.0e-4
      eve-wd_attention: 5.0e-4
      eve-wd_ffn: 5.0e-4
      eve-wd_norms: 5.0e-4
      eve-wd_head: 5.0e-4
      eve-wd_mhc: 5.0e-4
      eve-wd_router: 5.0e-4
      eve-wd_residual: 5.0e-4
      eve-wd_other: 5.0e-4
      eve-betas_embeddings:
      - 0.9
      - 0.999
      eve-betas_pos:
      - 0.9
      - 0.999
      eve-betas_attention:
      - 0.9
      - 0.999
      eve-betas_ffn:
      - 0.9
      - 0.999
      eve-betas_norms:
      - 0.9
      - 0.999
      eve-betas_head:
      - 0.9
      - 0.999
      eve-betas_mhc:
      - 0.9
      - 0.999
      eve-betas_router:
      - 0.9
      - 0.999
