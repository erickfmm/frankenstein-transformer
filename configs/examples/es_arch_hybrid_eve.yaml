      eve-eps_attention: 1e-8
      eve-eps_ffn: 1e-8
      eve-eps_norms: 1e-8
      eve-eps_head: 1e-8
      eve-eps_mhc: 1e-8
      eve-eps_router: 1e-8
      eve-eps_residual: 1e-8
      eve-eps_other: 1e-8
      eve-de_weight: 0.5
      eve-de_jitter: 1.0e-4
      eve-init_sigma: 0.1
