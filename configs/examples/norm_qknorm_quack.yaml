# QuacK: parameter-dependent query/key learning rates (arXiv:2511.21377).
# Initial Frobenius norms are cached and, before every step,
# lr(W_Q) = tau * eta * ||W_K||_init / ||W_K|| and symmetrically for W_K.
# This bounds the change in attention logits per step without a forward-time
# normalization op (about 10% cheaper than QK-norm in the paper).
model_class: frankenstein_text_encoder
model:
  dims:
    vocab_size: 50000
    hidden_size: 512
    num_layers: 6
    num_loops: 1
    num_heads: 8
    layer_pattern:
    - standard
  norm:
    type: rms_norm
    qk_norm:
      enabled: true
      method: quack
      quack_tau: 1.0
  embedding:
    conv:
      enabled: false
  attention:
    retnet:
      heads: 8
  moe:
    enabled: false
  bitnet:
    enabled: false
  ffn:
    hidden_size: 2048
    activation: silu
training:
  task: mlm
  seed: 42
  num_epochs: 4
  batch_size: 8
  dataloader_workers: 2
  max_length: 512
  mlm_probability: 0.15
  max_samples: 1000000
  dataset_batch_size: 15000
  num_workers: 6
  cache_dir: ./temp_data/qknorm_quack_cache
  gradient_accumulation_steps: 4
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_embeddings: 1e-5
      adamw-lr_norms: 5e-5
      adamw-lr_attention: 3e-4
      adamw-lr_other: 2e-4
      adamw-wd_embeddings: 0.01
      adamw-wd_norms: 0.001
      adamw-wd_attention: 0.01
      adamw-wd_other: 0.01
      adamw-betas_attention:
      - 0.9
      - 0.95
      adamw-eps_attention: 1e-8
  max_nan_retries: 4
  gradient_log_interval: 10
  csv_log_path: training_metrics_qknorm_quack.csv
  telemetry_log_interval: 5
