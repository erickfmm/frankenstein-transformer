# Causal Language Modeling with Sliding Window Attention + sinks.
# SWA(w, s) per arXiv:2608.28444: each token attends to the first `num_sinks`
# tokens and the `window_size - num_sinks` most recent tokens. The paper
# finds window_size=512 best for generative tasks.
model_class: frankenstein_text_decoder
model:
  dims:
    vocab_size: 50000
    hidden_size: 768
    num_layers: 12
    num_loops: 1
    num_heads: 12
    layer_pattern:
    - swa_attn
    mode: decoder
  norm:
    type: layer_norm
  embedding:
    conv:
      enabled: false
  attention:
    swa:
      window_size: 512
      num_sinks: 4
    retnet:
      heads: 12
  moe:
    enabled: false
  bitnet:
    enabled: false
  ffn:
    hidden_size: 3072
    activation: gelu
  positional_encoding: rope
training:
  task: causal_lm
  batch_size: 4
  dataloader_workers: 2
  max_length: 512
  max_samples: 20000000
  dataset_batch_size: 25000
  num_workers: 8
  cache_dir: ./temp_data/v2_dataset_cache
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_embeddings: 1e-6
      adamw-lr_norms: 5e-6
      adamw-lr_attention: 3e-6
      adamw-lr_other: 2e-6
      adamw-wd_embeddings: 0.01
      adamw-wd_norms: 0.001
      adamw-wd_attention: 0.01
      adamw-wd_other: 0.01
      adamw-betas_embeddings:
      - 0.9
      - 0.95
      adamw-betas_norms:
      - 0.9
      - 0.95
      adamw-betas_attention:
      - 0.9
      - 0.95
      adamw-betas_other:
      - 0.9
      - 0.95
      adamw-eps_embeddings: 1e-8
      adamw-eps_norms: 1e-8
      adamw-eps_attention: 1e-8
      adamw-eps_other: 1e-8
  scheduler_total_steps: 10000
  scheduler_warmup_ratio: 0.1
  scheduler_type: cosine
  gradient_log_interval: 10
