model_class: frankenstein_vit
model:
  dims:
    hidden_size: 64
    num_layers: 2
    num_heads: 4
    num_loops: 1
    layer_pattern: ["standard_attn"]
    mode: encoder
    dropout: 0.1
  norm:
    type: layer_norm
  embedding: {}
  moe:
    enabled: false
  bitnet:
    enabled: false
  ffn:
    hidden_size: 256
    activation: gelu
image:
  image_size:
    height: 32
    width: 32
  patch_size: 16
  in_channels: 3
  pos_embedding_type: learned_1d
  cls_token: true
  seg_head_type: pixel
  num_seg_classes: 5
vision_dataset:
  dataset_name: ""
  rescale:
    height: 32
    width: 32
training:
  task: segmentation
  seed: 42
  batch_size: 4
  num_epochs: 1
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_other: 0.0001
      adamw-wd_other: 0.1
