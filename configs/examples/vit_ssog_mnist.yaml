# ViT de clasificación MNIST con SSOG-Attention (Separable Sum of Gaussians,
# Pisoni 2026, https://www.pisoni.ai/posts/ssog/)
# Dataset: Hugging Face `ylecun/mnist` (imágenes 28x28 en escala de grises, 10 dígitos)
# Arquitectura: ViT-Tiny (D=128, L=6, heads=4, patch=14 -> 2x2=4 parches) con `ssog_attn`
# en cada capa. La rejilla del campo se deriva automáticamente: 28/14 x 28/14 = 2x2.
# Nota: `cls_token: false` + `pooling_mode: gap` — SSOG requiere el raster puro de la
# rejilla (sin [CLS] prepended). El costo de atención es O(R·N·√N·d), nunca N².
model_class: frankenstein_vit
model:
  dims:
    vocab_size: 0
    hidden_size: 128
    num_layers: 6
    num_heads: 4
    num_loops: 1
    layer_pattern: ["ssog_attn"]
    mode: encoder
    dropout: 0.1
  norm:
    type: layer_norm
  embedding: {}
  attention:
    ssog:
      num_atoms: 4
      lookat: true
      max_offset: 1.0
      cold_init: true
      sigma_floor: 0.25
    titan:
      use_hope: false
  use_moe: false
  use_bitnet: false
  ffn_activation: gelu
  ffn_hidden_size: 512
image:
  image_size:
    height: 28
    width: 28
  patch_size: 14
  in_channels: 1
  to_grayscale: false
  pos_embedding_type: learned_1d
  cls_token: false
  pooling_mode: gap
  num_classes: 10
dataset:
  dataset_name: ylecun/mnist
  rescale:
    height: 28
    width: 28
training:
  task: classification
  batch_size: 128
  num_epochs: 10
  dataloader_workers: 4
  optimizer:
    optimizer_class: adamw
    parameters:
      adamw-lr_other: 0.001
      adamw-wd_other: 0.01
  classification:
    label_smoothing: 0.1
