name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # include-only on purpose: an `include` entry that matches an existing
        # combination MERGES into it instead of adding a job. With the old
        # `python-version: [...] + include:` shape the "extra leg" below
        # silently replaced the py3.12 leg, so py3.12 + the current stack was
        # never tested. Listing every leg here keeps all four.
        include:
          - python-version: "3.10"
          - python-version: "3.11"
          - python-version: "3.12"
          # Extra leg: transformers 4.x on py3.12. The dependency range allows
          # both transformers majors (<6), so keep the 4.x path covered too —
          # it is what Python 3.9 installs resolve to, and the fallback for
          # dashai envs that pin transformers 4.
          - python-version: "3.12"
            transformers-pin: "<5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Install CPU-only torch so the full test matrix runs quickly without
      # needing CUDA drivers.  All torch-dependent tests use TORCH_AVAILABLE
      # guards and will execute; GPU-specific code paths are skipped when no
      # CUDA device is present.
      - name: Install CPU-only torch
        run: |
          pip install torch==2.7.0+cpu --index-url https://download.pytorch.org/whl/cpu

      # Install all non-torch requirements from requirements.txt (CPU variant).
      # Strip the --extra-index-url directive and the torch line so that the
      # CPU torch installed above is not overridden.
      - name: Install package requirements
        run: |
          grep -v "^torch\|^--extra-index-url\|^#\|^$" requirements.txt \
            > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      # Only on the legacy leg: downgrade the whole HF stack to the 4.x/0.x/3.x
      # series. transformers 4.x requires huggingface_hub <1 (hub 1.x removed
      # symbols it imports), hub <1 does not export BucketNotFoundError
      # (datasets>=5 needs it), and datasets 4+ drags torchcodec into every
      # Audio path. sentence-transformers <6 is part of the same pin: 6.x
      # requires transformers>=5.0 + huggingface_hub>=1.3.0 and imports httpx
      # (via the hub 1.x re-export or standalone), which leaves the legacy
      # env without the `httpx` module and breaks `import sentence_transformers`
      # (all SBERT tests). 5.7.x allows transformers<6,>=4.41 + hub>=0.23.
      - name: Pin transformers 4.x (legacy leg)
        if: matrix.transformers-pin == '<5'
        run: pip install "transformers<5" "huggingface_hub<1" "datasets<4" "sentence-transformers<6"

      # Install the package itself without pulling in deps (torch already
      # installed as CPU above; --no-deps avoids overriding it with cu118).
      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --continue-on-collection-errors \
            -v \
            --tb=short \
            -p no:warnings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.transformers-pin || 'latest' }}
          path: |
            .pytest_cache/
          retention-days: 7
