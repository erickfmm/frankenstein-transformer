[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashai-frankenstein"
version = "0.3.1"
description = "DashAI plugin that registers Frankenstein Transformer model classes (MLM encoder, causal decoder, ViT) as DashAI components."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Erick Merino", email = "erickfmm@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # Frankenstein ships the importable ``src`` package and the engine API.
    # >=1.2.0 adds the text_dataset engine block + causal_lm caller-dataset
    # support consumed by the plugin's use_dashai_dataset toggle.
    "frankenstein-transformer>=1.2.0",
    "torch>=2.0",
    "transformers>=4.45.0,<5.0.0",
    "datasets>=3.0.0",
    "numpy>=1.26.0,<3.0",
    "PyYAML>=6.0.1",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=3.3.0", "sentencepiece>=0.2.0"]

# DashAI discovers plugins whose distribution name startswith("dashai").
# Each entry points to a class that inherits a DashAI base (BaseModel /
# BaseGenerativeModel / BaseTask) carrying a TYPE attribute.
[project.entry-points."dashai.plugins"]
frankenstein_mlm = "dashai_frankenstein:FrankensteinMLMModel"
frankenstein_decoder = "dashai_frankenstein:FrankensteinDecoderModel"
frankenstein_pretrainer = "dashai_frankenstein:FrankensteinPretrainer"
frankenstein_causal_lm = "dashai_frankenstein:FrankensteinCausalLMModel"
frankenstein_vit_cls = "dashai_frankenstein:FrankensteinViTClassifier"
frankenstein_vit_seg = "dashai_frankenstein:FrankensteinViTSegmenter"
segmentation_task = "dashai_frankenstein:SegmentationTask"
masked_language_modeling_task = "dashai_frankenstein:MaskedLanguageModelingTask"
causal_lm_pretraining_task = "dashai_frankenstein:CausalLMPretrainingTask"

[tool.hatch.build.targets.wheel]
packages = ["src/dashai_frankenstein"]
