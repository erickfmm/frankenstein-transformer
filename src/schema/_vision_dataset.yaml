type: object
title: Vision Dataset Configuration
title_es: Configuración de Dataset de Visión
description: |-
  Vision dataset configuration for image-based tasks (`patch_prediction`,
  `classification`, `segmentation`). Specifies the data source (HuggingFace
  dataset or local directory), column mappings, image rescaling, normalization,
  and augmentations.

  Required when `model_class: frankenstein_vit`. For text/NLP tasks use
  `text_dataset` instead.

  **References:** (paper: arxiv:2010.11929) (paper: arxiv:2111.06377)
description_es: |-
  Configuración de dataset de visión para tareas de imagen (`patch_prediction`,
  `classification`, `segmentation`). Especifica la fuente de datos, mapeo de
  columnas, reescalado de imagen, normalización y aumentaciones.

  Obligatorio cuando `model_class: frankenstein_vit`. Para tareas de texto/NLP
  usa `text_dataset` en su lugar.

  **Referencias:** (paper: arxiv:2010.11929) (paper: arxiv:2111.06377)
additionalProperties: false
properties:
  dataset_name:
    type: string
    title: Dataset Name
    title_es: Nombre de Dataset
    description: HuggingFace dataset identifier (e.g. `cifar10`, `imagenet-1k`).
    description_es: Identificador de dataset de HuggingFace.
  dataset_dir:
    type: string
    title: Dataset Directory
    title_es: Directorio de Dataset
    description: |-
      Local directory path containing images. For classification, expects
      per-class subfolders or a labels CSV. For segmentation, expects images
      + segmentation maps.
    description_es: Ruta local del directorio que contiene las imágenes.
  image_column:
    type: string
    title: Image Column
    title_es: Columna de Imagen
    description: Column name for images in a HuggingFace dataset.
    description_es: Nombre de columna para imágenes en un dataset de HuggingFace.
    default: image
  label_column:
    type: string
    title: Label Column
    title_es: Columna de Etiqueta
    description: Column name for classification labels in a HuggingFace dataset.
    description_es: Nombre de columna para etiquetas de clasificación.
    default: label
  segmentation_column:
    type: string
    title: Segmentation Column
    title_es: Columna de Segmentación
    description: Column name for segmentation maps in a HuggingFace dataset.
    description_es: Nombre de columna para mapas de segmentación.
    default: segmentation_map
  rescale:
    type: object
    title: Rescale
    title_es: Reescalado
    description: |-
      Fallback target (height, width) when the top-level `image.image_size`
      block is absent. For ViT configs `image.image_size` is required and takes
      precedence; keep this only for dataset-only consumers.
    description_es: |-
      Objetivo de respaldo (alto, ancho) cuando el bloque top-level
      `image.image_size` está ausente. Para configs ViT `image.image_size` es
      obligatorio y tiene precedencia; mantener esto solo para consumidores
      basados únicamente en el dataset.
    additionalProperties: false
    properties:
      height:
        type: integer
        minimum: 1
        title: Rescale Height
        title_es: Alto de Reescalado
        description: |-
          Fallback height in pixels when the top-level `image.image_size` is not set.
        description_es: |-
          Alto de respaldo en píxeles cuando no se fija `image.image_size`.
      width:
        type: integer
        minimum: 1
        title: Rescale Width
        title_es: Ancho de Reescalado
        description: |-
          Fallback width in pixels when the top-level `image.image_size` is not set.
        description_es: |-
          Ancho de respaldo en píxeles cuando no se fija `image.image_size`.
    required:
      - height
      - width
  normalize:
    type: object
    title: Normalize
    title_es: Normalización
    description: |-
      Per-channel mean and std for normalization. Applied after rescaling.
      If omitted, no normalization is applied.
    description_es: Media y desviación estándar por canal para normalización.
    additionalProperties: false
    properties:
      mean:
        type: array
        items:
          description: |-
            Mean value for one channel.
          description_es: |-
            Valor de media para un canal.
          type: number
        title: Mean
        title_es: Media
        description: |-
          Per-channel means applied after rescaling (ImageNet default: `[0.485, 0.456, 0.406]`).
        description_es: |-
          Medias por canal aplicadas tras el reescalado (por defecto ImageNet: `[0.485, 0.456, 0.406]`).
      std:
        type: array
        items:
          description: |-
            Standard deviation for one channel.
          description_es: |-
            Desviación estándar para un canal.
          type: number
        title: Std
        title_es: Desviación Estándar
        description: |-
          Per-channel standard deviations applied after rescaling (ImageNet default: `[0.229, 0.224, 0.225]`).
        description_es: |-
          Desviaciones estándar por canal aplicadas tras el reescalado (por defecto ImageNet: `[0.229, 0.224, 0.225]`).
  augmentations:
    type: object
    title: Augmentations
    title_es: Aumentaciones
    description: Data augmentation options applied during training.
    description_es: Opciones de aumentación de datos aplicadas durante el entrenamiento.
    additionalProperties: false
    properties:
      random_crop:
        type: boolean
        title: Random Crop
        title_es: Recorte Aleatorio
        description: |-
          Random crop augmentation applied during training.
        description_es: |-
          Aumentación de recorte aleatorio aplicada durante el entrenamiento.
        default: false
      horizontal_flip:
        type: boolean
        title: Horizontal Flip
        title_es: Volteo Horizontal
        description: |-
          Random horizontal flip applied during training.
        description_es: |-
          Volteo horizontal aleatorio aplicado durante el entrenamiento.
        default: true
      color_jitter:
        type: boolean
        title: Color Jitter
        title_es: Variación de Color
        description: |-
          Random brightness/contrast/saturation jitter applied during training.
        description_es: |-
          Variación aleatoria de brillo/contraste/saturación aplicada durante el entrenamiento.
        default: false
      mixup_alpha:
        type: number
        minimum: 0
        title: Mixup Alpha
        title_es: Alpha de Mixup
        description: |-
          Mixup interpolation strength; `0` disables mixup.
        description_es: |-
          Fuerza de interpolación Mixup; `0` desactiva mixup.
        default: 0