- anyOf:
  - required:
    - base_model
  - required:
    - model_class
    - model
- if:
    properties:
      training:
        properties:
          task:
            const: mlm
  then:
    properties:
      training:
        required:
        - optimizer
- if:
    properties:
      training:
        properties:
          task:
            const: sbert
  then:
    properties:
      training:
        required:
        - sbert
- if:
    properties:
      training:
        properties:
          task:
            const: causal_lm
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankensteindecoder
    required:
    - model_class
- if:
    required:
    - base_model
  then:
    properties:
      training:
        required:
        - task
    allOf:
    - if:
        properties:
          training:
            properties:
              task:
                const: mlm
      then:
        properties:
          tokenizer:
            required:
            - name_or_path
- if:
    not:
      required:
      - base_model
  then:
    required:
    - model_class
    - model
- if:
    properties:
      training:
        properties:
          task:
            const: patch_prediction
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_vit
      image:
        required:
        - image_size
        - patch_size
    required:
    - model_class
    - model
    - image
    - dataset
- if:
    properties:
      training:
        properties:
          task:
            const: classification
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_vit
      image:
        required:
        - image_size
        - patch_size
        - num_classes
    required:
    - model_class
    - model
    - image
    - dataset
- if:
    properties:
      model:
        properties:
          dims:
            properties:
              layer_pattern:
                contains:
                  const: ssog_attn
  then:
    properties:
      model:
        properties:
          dims:
            properties:
              mode:
                const: encoder
- if:
    properties:
      training:
        properties:
          task:
            const: segmentation
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_vit
      image:
        required:
        - image_size
        - patch_size
    required:
    - model_class
    - model
    - image
    - dataset