- anyOf:
  - required:
    - base_model
  - required:
    - model_class
    - model
- if:
    properties:
      training:
        properties:
          task:
            const: mlm
  then:
    properties:
      training:
        required:
        - optimizer
- if:
    properties:
      training:
        properties:
          task:
            const: sbert
  then:
    properties:
      training:
        required:
        - sbert
- if:
    properties:
      training:
        properties:
          task:
            const: causal_lm
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_text_decoder
    required:
    - model_class
- if:
    properties:
      training:
        properties:
          task:
            const: text_classification
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_text_encoder
    required:
    - model_class
    - model
- if:
    required:
    - base_model
  then:
    properties:
      training:
        required:
        - task
    allOf:
    - if:
        properties:
          training:
            properties:
              task:
                const: mlm
      then:
        properties:
          tokenizer:
            required:
            - name_or_path
- if:
    properties:
      tokenizer:
        required:
        - source
        properties:
          source:
            const: train_from_dataset
  then:
    properties:
      tokenizer:
        required:
        - training
        allOf:
        - if:
            properties:
              training:
                required:
                - algorithm
                properties:
                  algorithm:
                    enum: [bpe, wordpiece, wordlevel]
          then:
            properties:
              training:
                required:
                - vocab_size
- if:
    properties:
      tokenizer:
        required:
        - name_or_path
  then:
    properties:
      tokenizer:
        properties:
          source:
            const: hf_repo
- if:
    properties:
      training:
        properties:
          task:
            const: patch_prediction
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_vit
      image:
        required:
        - image_size
        - patch_size
    required:
    - model_class
    - model
    - image
    - vision_dataset
- if:
    properties:
      training:
        properties:
          task:
            const: classification
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_vit
      image:
        required:
        - image_size
        - patch_size
        - num_classes
    required:
    - model_class
    - model
    - image
    - vision_dataset
- if:
    properties:
      model:
        properties:
          dims:
            properties:
              layer_pattern:
                contains:
                  const: ssog_attn
  then:
    properties:
      model:
        properties:
          dims:
            properties:
              mode:
                const: encoder
- if:
    properties:
      model:
        properties:
          mhc:
            required:
            - hyperloop
            properties:
              hyperloop:
                const: true
  then:
    properties:
      model:
        properties:
          mhc:
            required:
            - enabled
- if:
    properties:
      training:
        properties:
          task:
            const: segmentation
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_vit
      image:
        required:
        - image_size
        - patch_size
    required:
    - model_class
    - model
    - image
    - vision_dataset
# ---- Audio tasks (frankenstein_audio, Conformer/ASR) ----
- if:
    properties:
      training:
        properties:
          task:
            const: asr
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_audio
      audio_dataset:
        anyOf:
        - required:
          - dataset_name
        - required:
          - dataset_dir
    required:
    - model_class
    - model
    - audio
    - audio_dataset
- if:
    properties:
      training:
        properties:
          task:
            const: audio_classification
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_audio
      audio:
        required:
        - num_classes
      audio_dataset:
        anyOf:
        - required:
          - dataset_name
        - required:
          - dataset_dir
    required:
    - model_class
    - model
    - audio
    - audio_dataset
# ---- inference / KV-cache conditional rules (plan §11.1) ----
# compression.method != none  =>  kv_cache.enabled == true
# (the window >= protected_window cross-key comparison is enforced
# in Python by config_loader.load_inference_error, since JSON Schema
# cannot compare two properties against each other)
- if:
    properties:
      inference:
        properties:
          kv_cache:
            properties:
              compression:
                required:
                - method
                properties:
                  method:
                    const: window_sinks
  then:
    properties:
      inference:
        kv_cache:
          required:
          - enabled
          properties:
            enabled:
              const: true