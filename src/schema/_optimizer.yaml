    examples: [adamw]
  parameters:
    type: object
    title: "Optimizer Parameters"
    title_es: "Parámetros del Optimizador"
    description: |
      Optimizer hyperparameters with per-parameter-group settings. All keys are prefixed
      with the optimizer class name. Format: `<optimizer>-<param_group>_<hyperparam>=value`.

      **Shared suffixes** (all optimizers):
      - `lr_*`: Learning rate per group (embeddings, pos, attention, ffn, norms, head, mhc, router, residual, other)
      - `wd_*`: Weight decay per group
      - `betas_*`: Adam-style beta1/beta2 per group
      - `eps_*`: Epsilon per group

      **Optimizer-specific suffixes** (see `x_parameter_reference.by_optimizer`):
      - `sgd_momentum`: `momentum`, `nesterov`
      - `adam_pm`: `group_size`, `pool_dim`. Row/column group-mean pooling of the second moment only; `s=1` reduces to vanilla Adam, `s` ≥ axis length gives one statistic per row/column (AdamPM-inf); the first moment stays element-wise; the shared `lr_*`, `wd_*` (decoupled), `betas_*`, `eps_*` apply per group
      - `adafactor`: `beta2_decay`, `clip_threshold`, `eps1`, `eps2`
      - `galore_adamw`: `rank`, `update_proj_gap`
      - `prodigy`: `d_coef`
      - `sophia`: `rho`, `update_k`
      - `muon`/`turbo_muon`: `momentum`, `nesterov`, `ns_steps`, `ns_eps`. Only hidden-layer 2-D matrices are orthogonalized; the `embeddings`, `pos` and `head` groups, plus every non-2-D parameter, use a decoupled AdamW fallback configured by the shared `lr_*`, `wd_*`, `betas_*` and `eps_*` suffixes
      - `af_muon`: `momentum`, `nesterov`, `ns_steps`, `ns_eps`, `vector_lr`, `tied_cap`, `tied_scale`, `rho_hidden`, `rho_output`, `chunk_rows`, `bisection_steps`, `max_bracket_steps`
      - `ada_muon`: `momentum`, `ns_steps`, `ns_eps`
      - `cautious_adamw`: `cautious_clip`
      - `anon`: `gamma`
      - `apollo`: `rank`, `update_proj_gap`, `scale`, `scale_type`, `proj_type`, `scale_front`, `disable_nl`
      - `apollo_mini`: `update_proj_gap`, `scale`, `proj_type`, `scale_front`, `disable_nl`
      - `q_apollo`: `rank`, `update_proj_gap`, `scale`, `scale_type`, `proj_type`, `scale_front`, `disable_nl`, `quant_bits`
      - `dion3`: `fraction`, `momentum`, `ns_steps`, `ns_eps`, `normuon`
      - `root`: `momentum`, `nesterov`, `ns_steps`, `ns_eps`, `quantile`, `softthresh`, `ada_newton`. Same hybrid routing as `muon`: only hidden-layer 2-D matrices are orthogonalized, using per-shape calibrated Newton-Schulz coefficients when `ada_newton` is on; `quantile` is the percentile `p` defining the dynamic soft-threshold `ε_t = Quantile(|M_t|, p)` (default 0.90); `softthresh: false` disables outlier suppression; the `embeddings`, `pos` and `head` groups plus every non-2-D parameter use a decoupled AdamW fallback configured by the shared suffixes
      - `muon2`: `ns_steps`, `ns_eps`, `factored`. Adam-style second-moment preconditioning of the momentum before Newton-Schulz (β₁, β₂ from the shared `betas_*`; the Eq. 4 epsilon is the shared `eps_*`); the update scales by η√(m/n); `factored: true` switches to the memory-efficient row/column-factored second moment (Muon²-F). Same hybrid routing as `muon`: only hidden-layer 2-D matrices take the Muon² path; the `embeddings`, `pos` and `head` groups plus every non-2-D parameter use a decoupled AdamW fallback configured by the shared suffixes
      - `nor_muon`: `momentum`, `ns_steps`, `ns_eps`. Muon orthogonalization followed by neuron-wise normalization: a per-row second-moment EMA v_t of the orthogonalized update rescales each neuron row (β2 from the shared `betas_*`, ε from the shared `eps_*`); the update is rescaled to RMS 0.2η via η̂ = 0.2η√(mn)/‖O_t‖_F; same hybrid routing as `muon`
      - `conda`: `update_proj_gap`, `scale`, `correct_bias`. Adam-style update in the SVD subspace of the first moment: the second moment is an EMA of the squared projected gradients `(P^T G)^2` (β from the shared `betas_*`, ε from the shared `eps_*`); the SVD basis is refreshed every `update_proj_gap` steps (default 2000); `scale` multiplies the update (0.25 in the paper's pretraining, 1.0 in its LoRA runs); every non-2-D parameter uses a decoupled AdamW fallback configured by the shared suffixes
      - `tuon`: `momentum`, `ns_steps`, `ns_eps`, `refresh_interval`, `rms_eps`, `transform`, `stack`. Tensor-aware Muon: within each parameter group, same-shape hidden 2-D matrices are stacked along the layer mode; a unitary transform Q (`transform: decorq` diagonalizes the layer Gram matrix via eigendecomposition and refreshes every `refresh_interval` steps — default 200; `dct`/`haar`/`dft` are fixed transforms) mixes the slices, each transformed slice is polarized with Newton-Schulz (`ns_steps`/`ns_eps`), the transform is inverted, and the whole stack is rescaled to RMS 1/√max(m,n) via `gamma_t = s/(RMS(P_t) + rms_eps)` (default 1e-8); `stack: full` groups every same-shape matrix of the group (paper default), `stack: pairs` stacks consecutive pairs (K=2); the momentum β is `momentum` (default 0.95) and `wd_*` stays decoupled; same hybrid routing as `muon` — the shared `betas_*`/`eps_*` configure the AdamW fallback for the `embeddings`/`pos`/`head` groups and every non-2-D parameter
      - `namo`: `betas`, `ns_steps`, `ns_eps`. Norm-based Adam-type adaptive stepsize α_t on the orthogonalized momentum: `betas` is (μ₁, μ₂) of the momentum and the scalar norm EMA (default [0.95, 0.99], the paper's GPT-2 values; distinct from the shared per-group `betas_*`, which configure only the AdamW fallback); the shared `eps_*` is α_t's denominator epsilon; the shared `wd_*` is decoupled and scaled by α_t; same hybrid routing as `muon` — the `embeddings`/`pos`/`head` groups and every non-2-D parameter take the AdamW fallback
      - `namo_d`: `betas`, `ns_steps`, `ns_eps`, `clamp`. Diagonal extension of `namo`: a per-column second-moment EMA and the same (μ₁, μ₂) momenta yield neuron-wise stepsizes that right-multiply the orthogonalized momentum; `clamp` is the bound parameter c ∈ (0,1] (default 0.1, the paper's GPT-2 124M value) that keeps the diagonal well-conditioned (`d̃ = clamp(d, c·d̄, d̄/c)`); the shared `eps_*` is the denominator epsilon and, together with the shared `betas_*`, configures the AdamW fallback; the shared `wd_*` is decoupled and right-multiplied by the diagonal; same hybrid routing as `muon`
      - `eve`: `de_weight`, `de_jitter`, `init_sigma`, `adam_steps`, `use_pm`, `pm_eta`, `seed`. Population-of-4 differential evolution over the unit cube with a targeted Adam fallback; the shared `lr_*`, `wd_*`, `betas_*`, `eps_*` configure the fallback per group (`wd` is L2 folded into the fallback gradient, not decoupled). Requires `gradient_accumulation_steps: 1`; not available for SBERT; closure-based step supplied by the trainer
      - `ea4llm`: `population`, `sigma`, `antithetic`, `rank_shaping`, `nes_scaling`, `seed`. Gradient-free (zeroth-order) evolution strategies scoring the token-level log-likelihood fitness on the current minibatch; the shared `lr_*` is the per-group step size and `wd_*` a decoupled decay extension (the paper defines no weight decay); `betas_*`/`eps_*` are accepted but unused because no moment buffers exist. Requires `gradient_accumulation_steps: 1`; not available for SBERT; closure-based step supplied by the trainer
      - Others: no specific suffixes (only shared ones)

      **Impact:** Fine-grained per-group control. Example: lower LR for embeddings (2e-6),
      higher for attention (3e-6). See `x_parameter_reference` for optimizer-specific
      suffixes.

      **References:** (paper: arxiv:1412.6980) (paper: arxiv:1711.05101)
    description_es: |-
      Hiperparámetros con configuraciones por grupo de parámetros. Todas las claves llevan
      prefijo de la clase del optimizador. Formato: `<optimizador>-<grupo>_<hiperparam>=valor`.

      **Sufijos compartidos** (todos los optimizadores):
      - `lr_*`: Learning rate por grupo (embeddings, pos, attention, ffn, norms, head, mhc, router, residual, other)
      - `wd_*`: Weight decay por grupo
      - `betas_*`: Beta1/beta2 estilo Adam por grupo
      - `eps_*`: Epsilon por grupo

      **Grupos:** `embeddings` (tabla de tokens), `pos` (encodings posicionales
      aprendidos), `attention` (mixers y sus parámetros internos), `ffn` (FFN y
      expertos MoE), `norms` (normalizaciones de bloque), `head` (heads de
      tarea), `mhc` (mHC e Hyperloop), `router` (routers MoE/MoD), `residual`
      (AttnRes) y `other` (resto). Coinciden con la taxonomía del estimador de
      parámetros y de las columnas `grad_norm_<bloque>` del logging.

      **Sufijos específicos por optimizador** (ver `x_parameter_reference.by_optimizer`):
      - `sgd_momentum`: `momentum`, `nesterov`
      - `adam_pm`: `group_size`, `pool_dim`. Pooling por media de grupo del segundo momento únicamente (filas o columnas); `s=1` equivale a Adam vainilla, `s` ≥ longitud del eje deja un estadístico por fila/columna (AdamPM-inf); el primer momento queda por elemento; los sufijos compartidos `lr_*`, `wd_*` (desacoplado), `betas_*`, `eps_*` aplican por grupo
      - `adafactor`: `beta2_decay`, `clip_threshold`, `eps1`, `eps2`
      - `galore_adamw`: `rank`, `update_proj_gap`
      - `prodigy`: `d_coef`
      - `sophia`: `rho`, `update_k`
      - `muon`/`turbo_muon`: `momentum`, `nesterov`, `ns_steps`, `ns_eps`. Solo se ortogonalizan las matrices 2-D de capas ocultas; los grupos `embeddings`, `pos` y `head`, más todo parámetro que no sea 2-D, usan un respaldo AdamW desacoplado configurado por los sufijos compartidos `lr_*`, `wd_*`, `betas_*` y `eps_*`
      - `af_muon`: `momentum`, `nesterov`, `ns_steps`, `ns_eps`, `vector_lr`, `tied_cap`, `tied_scale`, `rho_hidden`, `rho_output`, `chunk_rows`, `bisection_steps`, `max_bracket_steps`
      - `ada_muon`: `momentum`, `ns_steps`, `ns_eps`
      - `cautious_adamw`: `cautious_clip`
      - `anon`: `gamma`
      - `apollo`: `rank`, `update_proj_gap`, `scale`, `scale_type`, `proj_type`, `scale_front`, `disable_nl`
      - `apollo_mini`: `update_proj_gap`, `scale`, `proj_type`, `scale_front`, `disable_nl`
      - `q_apollo`: `rank`, `update_proj_gap`, `scale`, `scale_type`, `proj_type`, `scale_front`, `disable_nl`, `quant_bits`
      - `dion3`: `fraction`, `momentum`, `ns_steps`, `ns_eps`, `normuon`
      - `root`: `momentum`, `nesterov`, `ns_steps`, `ns_eps`, `quantile`, `softthresh`, `ada_newton`. Mismo enrutamiento híbrido que `muon`: solo se ortogonalizan las matrices 2-D de capas ocultas, con coeficientes Newton-Schulz calibrados por forma cuando `ada_newton` está activo; `quantile` es el percentil `p` del umbral dinámico `ε_t = Quantile(|M_t|, p)` (por defecto 0.90); `softthresh: false` desactiva la supresión de atípicos; los grupos `embeddings`, `pos` y `head` más todo parámetro no 2-D usan un respaldo AdamW desacoplado configurado por los sufijos compartidos
      - `muon2`: `ns_steps`, `ns_eps`, `factored`. Precondicionamiento del momentum con segundo momento estilo Adam antes de Newton-Schulz (β₁, β₂ de los `betas_*` compartidos; el épsilon de la Ec. 4 es el `eps_*` compartido); la actualización escala por η√(m/n); `factored: true` activa el segundo momento factorizado por filas/columnas (Muon²-F). Mismo enrutamiento híbrido que `muon`: solo las matrices 2-D de capas ocultas toman la ruta Muon²; los grupos `embeddings`, `pos` y `head` más todo parámetro no 2-D usan un respaldo AdamW desacoplado configurado por los sufijos compartidos
      - `nor_muon`: `momentum`, `ns_steps`, `ns_eps`. Ortogonalización de Muon seguida de normalización por neurona: una EMA de segundo momento por fila v_t de la actualización ortogonalizada reescala cada fila-neurona (β2 de los `betas_*` compartidos, ε de los `eps_*` compartidos); la actualización se reescala a un RMS 0.2η mediante η̂ = 0.2η√(mn)/‖O_t‖_F; mismo enrutamiento híbrido que `muon`
      - `conda`: `update_proj_gap`, `scale`, `correct_bias`. Actualización estilo Adam en el subespacio SVD del primer momento: el segundo momento es una EMA de los gradientes proyectados al cuadrado `(P^T G)^2` (β de los `betas_*` compartidos, ε de los `eps_*` compartidos); la base SVD se refresca cada `update_proj_gap` pasos (por defecto 2000); `scale` multiplica la actualización (0.25 en el preentrenamiento del paper, 1.0 en sus ejecuciones LoRA); todo parámetro no 2-D usa un respaldo AdamW desacoplado configurado por los sufijos compartidos
      - `tuon`: `momentum`, `ns_steps`, `ns_eps`, `refresh_interval`, `rms_eps`, `transform`, `stack`. Muon consciente de tensores: dentro de cada grupo de parámetros, las matrices 2-D ocultas de la misma forma se apilan por el modo de capas; una transformación unitaria Q (`transform: decorq` diagonaliza la matriz de Gram de capas mediante autodescomposición y se refresca cada `refresh_interval` pasos — 200 por defecto; `dct`/`haar`/`dft` son transformaciones fijas) mezcla los slices, cada slice transformado se polariza con Newton-Schulz (`ns_steps`/`ns_eps`), la transformación se invierte y la pila completa se reescala a RMS 1/√max(m,n) mediante `gamma_t = s/(RMS(P_t) + rms_eps)` (por defecto 1e-8); `stack: full` agrupa toda matriz de la misma forma del grupo (por defecto del paper), `stack: pairs` apila pares consecutivos (K=2); el momentum β es `momentum` (por defecto 0.95) y `wd_*` permanece desacoplado; mismo enrutamiento híbrido que `muon` — los `betas_*`/`eps_*` compartidos configuran el respaldo AdamW para los grupos `embeddings`/`pos`/`head` y todo parámetro no 2-D
      - `namo`: `betas`, `ns_steps`, `ns_eps`. Paso adaptativo estilo Adam basado en normas sobre el momentum ortogonalizado: `betas` es (μ₁, μ₂) del momentum y de la EMA escalar de normas (por defecto [0.95, 0.99], los valores GPT-2 del artículo; distinto de los `betas_*` compartidos por grupo, que solo configuran el respaldo AdamW); el `eps_*` compartido es el épsilon del denominador de α_t; el `wd_*` compartido es desacoplado y escalado por α_t; mismo enrutamiento híbrido que `muon` — los grupos `embeddings`/`pos`/`head` y todo parámetro no 2-D usan el respaldo AdamW
      - `namo_d`: `betas`, `ns_steps`, `ns_eps`, `clamp`. Extensión diagonal de `namo`: una EMA del segundo momento por columna y los mismos momenta (μ₁, μ₂) producen pasos por neurona que multiplican por la derecha el momentum ortogonalizado; `clamp` es el parámetro de cota c ∈ (0,1] (por defecto 0.1, el valor GPT-2 124M del artículo) que mantiene la diagonal bien condicionada (`d̃ = clamp(d, c·d̄, d̄/c)`); el `eps_*` compartido es el épsilon del denominador y, junto con los `betas_*` compartidos, configura el respaldo AdamW; el `wd_*` compartido es desacoplado y multiplicado por la derecha por la diagonal; mismo enrutamiento híbrido que `muon`
      - `eve`: `de_weight`, `de_jitter`, `init_sigma`, `adam_steps`, `use_pm`, `pm_eta`, `seed`. Evolución diferencial con población de 4 sobre el cubo unitario y respaldo Adam dirigido; los sufijos compartidos `lr_*`, `wd_*`, `betas_*`, `eps_*` configuran el respaldo por grupo (`wd` es L2 plegado en el gradiente del respaldo, no desacoplado). Requiere `gradient_accumulation_steps: 1`; no disponible para SBERT; paso basado en closure que aporta el trainer
      - `ea4llm`: `population`, `sigma`, `antithetic`, `rank_shaping`, `nes_scaling`, `seed`. Estrategias evolutivas sin gradientes (orden cero) que puntúan la aptitud de log-verosimilitud por token sobre el minilote actual; el `lr_*` compartido es el tamaño de paso por grupo y `wd_*` un decaimiento desacoplado como extensión (el paper no define weight decay); `betas_*`/`eps_*` se aceptan pero no se usan porque no hay búferes de momentos. Requiere `gradient_accumulation_steps: 1`; no disponible para SBERT; paso basado en closure que aporta el trainer
      - Otros: sin sufijos específicos (solo los compartidos)

      **Referencias:** (paper: arxiv:1412.6980) (paper: arxiv:1711.05101)
