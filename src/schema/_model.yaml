type: object
description: |-
  FrankensteinModelConfig model parameters. All architectural hyperparameters that define the model's
  structure, capacity, and behavior. Required when building a model from scratch (i.e., when
  `base_model` is not set). Organized into hierarchical sub-objects: `dims` (core dimensions
  and layer pattern), `norm` (normalization), `embedding` (factorized embeddings and conv),
  `attention` (per-mixer configuration), `moe`, `bitnet`, `mixture_of_depths`, `ssmax`,
  `ffn` (feed-forward), and `classification_head` — plus `mhc` and `residuals`.

  **Examples explained:**
  - Typical BERT-base style: `dims.hidden_size=768, dims.num_layers=12, dims.num_heads=12, ffn.hidden_size=3072` — ~110M params, good starting point for MLM pre-training.
  - Memory-efficient: `embedding.factorized.enabled=true, embedding.factorized.dim=128, moe.enabled=false` — reduces embedding params ~4.5× for large vocabularies.
  - Experimental hybrid: `dims.layer_pattern: [retnet, titan_attn, mamba, standard_attn, ode]` — mixes recurrent, attention, state-space, and continuous-depth layers for diverse representation learning.
description_es: |-
  Parámetros FrankensteinModelConfig del modelo. Todos los hiperparámetros arquitectónicos que definen
  la estructura, capacidad y comportamiento del modelo. Obligatorio al construir un modelo desde
  cero (cuando `base_model` no está configurado). Organizado en sub-objetos jerárquicos: `dims`
  (dimensiones núcleo y patrón de capas), `norm` (normalización), `embedding` (embeddings
  factorizados y conv), `attention` (configuración por mixer), `moe`, `bitnet`,
  `mixture_of_depths`, `ssmax`, `ffn` (feed-forward) y `classification_head` — además de
  `mhc` y `residuals`.

  **Ejemplos explicados:**
  - Estilo BERT-base típico: `dims.hidden_size=768, dims.num_layers=12, dims.num_heads=12, ffn.hidden_size=3072` — ~110M params, buen punto de partida para preentrenamiento MLM.
  - Eficiente en memoria: `embedding.factorized.enabled=true, embedding.factorized.dim=128, moe.enabled=false` — reduce params de embedding ~4.5× para vocabularios grandes.
  - Híbrido experimental: `dims.layer_pattern: [retnet, titan_attn, mamba, standard_attn, ode]` — mezcla capas recurrentes, de atención, de espacio de estados y de profundidad continua para aprendizaje de representaciones diverso.
additionalProperties: false
required:
  - dims
properties:
  dims:
    $ref: "_model/_dims.yaml"
  norm:
    $ref: "_model/_norm.yaml"
  embedding:
    $ref: "_model/_embedding.yaml"
  positional_encoding:
    $ref: "_model/_positional_encoding.yaml#/properties/positional_encoding"
  positional_encoding_parameters:
    $ref: "_model/_positional_encoding.yaml#/properties/positional_encoding_parameters"
  attention:
    type: object
    description: |-
      Per-mixer configuration sub-objects. Each mixer with dedicated hyperparameters has
      its own sub-object here; mixers without config knobs (standard_attn, sigmoid_attn,
      gated_softmax_attn, gla_attn, deltanet_attn, gated_deltanet_attn,
      gated_deltanet2_attn, hgrn2_attn, fox_attn, longformer_attn, bigbird_attn,
      sparse_transformer_attn, sparsek_attn, nsa_attn, sparge_attn, fasa_attn, kda_attn,
      mamba) do not need a sub-object. `gqa_attn` reads `dims.num_kv_heads`.
    description_es: |-
      Sub-objetos de configuración por mixer. Cada mixer con hiperparámetros dedicados tiene
      su propio sub-objeto aquí; los mixers sin parámetros de configuración (standard_attn,
      sigmoid_attn, gated_softmax_attn, gla_attn, deltanet_attn, gated_deltanet_attn,
      gated_deltanet2_attn, hgrn2_attn, fox_attn, longformer_attn, bigbird_attn,
      sparse_transformer_attn, sparsek_attn, nsa_attn, sparge_attn, fasa_attn, kda_attn,
      mamba) no necesitan sub-objeto. `gqa_attn` lee `dims.num_kv_heads`.
    additionalProperties: false
    properties:
      mla:
        $ref: "_model/_attention_latent.yaml#/properties/mla"
      gqla:
        $ref: "_model/_attention_latent.yaml#/properties/gqla"
      mlra:
        $ref: "_model/_attention_latent.yaml#/properties/mlra"
      tucker:
        $ref: "_model/_attention_latent.yaml#/properties/tucker"
      iha:
        $ref: "_model/_attention_latent.yaml#/properties/iha"
      gta:
        $ref: "_model/_attention_latent.yaml#/properties/gta"
      mtla:
        $ref: "_model/_attention_latent.yaml#/properties/mtla"
      cca:
        $ref: "_model/_attention_cca.yaml#/properties/cca"
      ccgqa:
        $ref: "_model/_attention_cca.yaml#/properties/ccgqa"
      msa:
        $ref: "_model/_attention_sparse.yaml#/properties/msa"
      sparda:
        $ref: "_model/_attention_sparse.yaml#/properties/sparda"
      engram:
        $ref: "_model/_attention_engram.yaml#/properties/engram"
      gma:
        $ref: "_model/_attention_gma.yaml#/properties/gma"
      ssog:
        $ref: "_model/_attention_ssog.yaml#/properties/ssog"
      swa:
        $ref: "_model/_attention_swa.yaml#/properties/swa"
      falcon:
        $ref: "_model/_attention_falcon.yaml#/properties/falcon"
      ode:
        $ref: "_model/_attention_ode.yaml"
      retnet:
        $ref: "_model/_attention_retnet.yaml"
  moe:
    $ref: "_model/_moe.yaml"
  bitnet:
    $ref: "_model/_bitnet.yaml"
  mixture_of_depths:
    $ref: "_model/_mixture_of_depths.yaml"
  ssmax:
    $ref: "_model/_ssmax.yaml"
  ffn:
    $ref: "_model/_ffn.yaml"
  classification_head:
    $ref: "_model/_classification_head.yaml"
  mhc:
    $ref: "_model/_mhc.yaml"
  residuals:
    $ref: "_model/_residuals.yaml"
