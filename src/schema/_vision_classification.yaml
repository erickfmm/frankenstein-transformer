type: object
title: Image Classification Task Configuration
title_es: Configuración de Tarea Classification
description: |-
  Task-specific configuration for `training.task: classification` (image
  classification, arXiv:2010.11929). The model predicts a multiclass Y
  objective via a classification head (Linear or MLP) applied to the pooled
  image representation ([CLS] token or GAP).
description_es: |-
  Configuración específica de tarea para `training.task: classification`
  (clasificación de imágenes).
additionalProperties: false
properties:
  batch_size:
    type: integer
    minimum: 1
    title: Batch Size
    title_es: Tamaño de Batch
    default: 512
  num_epochs:
    type: integer
    minimum: 1
    title: Epochs
    title_es: Épocas
    default: 90
  learning_rate:
    type: number
    exclusiveMinimum: 0
    title: Learning Rate
    title_es: Tasa de Aprendizaje
    default: 0.001
  weight_decay:
    type: number
    minimum: 0
    title: Weight Decay
    title_es: Decaimiento de Peso
    default: 0.1
  warmup_steps:
    type: integer
    minimum: 0
    title: Warmup Steps
    title_es: Pasos de Calentamiento
    default: 1000
  scheduler_type:
    type: string
    enum:
      - cosine
      - linear
    title: Scheduler Type
    title_es: Tipo de Scheduler
    default: cosine
  grad_clip_max_norm:
    type: number
    minimum: 0
    title: Gradient Clip Max Norm
    title_es: Norma Máxima de Clip de Gradiente
    default: 1.0
  evaluation_steps:
    type: integer
    minimum: 0
    title: Evaluation Steps
    title_es: Pasos de Evaluación
    default: 5000
  checkpoint_save_steps:
    type: integer
    minimum: 0
    title: Checkpoint Save Steps
    title_es: Pasos de Guardado de Checkpoint
    default: 10000
  output_dir:
    type: string
    title: Output Directory
    title_es: Directorio de Salida
    default: ./checkpoints/vit_classification
  label_smoothing:
    type: number
    minimum: 0
    maximum: 1
    title: Label Smoothing
    title_es: Suavizado de Etiquetas
    default: 0