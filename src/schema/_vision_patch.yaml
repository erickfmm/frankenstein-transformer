type: object
title: Patch Prediction Task Configuration
title_es: Configuración de Tarea Patch Prediction
description: |-
  Task-specific configuration for `training.task: patch_prediction` (masked
  patch prediction / autosupervised pre-training, arXiv:2010.11929 App. B.1.2).
  Patches are corrupted (50% default) and the model predicts the reconstruction
  target (3-bit mean color, downsampled 3-bit, or full-patch L2) for each
  corrupted patch.

  General training fields (batch_size, num_epochs, optimizer, scheduler,
  gradient clipping, checkpointing, etc.) are read from the top-level
  `training:` block — the same fields used by `mlm` and `causal_lm` tasks.
  This sub-block currently carries no patch-prediction-specific knobs; it
  exists for forward compatibility and schema consistency with the other
  vision task sub-blocks.
description_es: |-
  Configuración específica de tarea para `training.task: patch_prediction`
  (predicción de parches enmascarados / preentrenamiento autosupervisado).

  Los campos generales de entrenamiento (batch_size, num_epochs, optimizer,
  scheduler, gradient clipping, checkpointing, etc.) se leen del bloque
  top-level `training:` — los mismos campos usados por `mlm` y `causal_lm`.
  Este sub-bloque actualmente no contiene parámetros específicos de
  patch_prediction; existe por compatibilidad hacia adelante y consistencia
  de esquema con los demás sub-bloques de tareas de visión.
additionalProperties: false
properties: {}