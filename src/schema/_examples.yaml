- model_class: frankenstein_text_encoder
  model:
    dims:
      vocab_size: 50000
      hidden_size: 768
      num_layers: 12
      num_loops: 1
      num_heads: 12
      dropout: 0.1
      layer_pattern: [standard_attn]
    norm:
      type: layer_norm
    embedding:
      factorized:
        enabled: false
        dim: 128
      conv:
        enabled: false
        kernel: 3
    positional_encoding: hope
    positional_encoding_parameters:
      hope:
        base: 10000.0
        damping: 0.01
    moe:
      enabled: false
      num_experts: 4
      top_k: 2
    bitnet:
      enabled: false
      routers: false
      conv: false
    mixture_of_depths:
      enabled: false
    ssmax:
      enabled: false
    ffn:
      hidden_size: 3072
      activation: gelu
  training:
    task: mlm
    batch_size: 4
    dataloader_workers: 2
    max_length: 512
    mlm_probability: 0.15
    max_samples: 20000000
    dataset_batch_size: 25000
    num_workers: 8
    cache_dir: "./temp_data/v2_dataset_cache"
    use_amp: false
    gradient_accumulation_steps: 4
    optimizer:
      optimizer_class: adamw
      parameters:
        adamw-lr_embeddings: 1e-6
        adamw-lr_norms: 5e-6
        adamw-lr_attention: 3e-6
        adamw-lr_other: 2e-6
        adamw-wd_embeddings: 0.01
        adamw-wd_norms: 0.001
        adamw-wd_attention: 0.01
        adamw-wd_other: 0.01
        adamw-betas_embeddings: [0.9, 0.95]
        adamw-betas_norms: [0.9, 0.95]
        adamw-betas_attention: [0.9, 0.95]
        adamw-betas_other: [0.9, 0.95]
        adamw-eps_embeddings: 1e-8
        adamw-eps_norms: 1e-8
        adamw-eps_attention: 1e-8
        adamw-eps_other: 1e-8
    scheduler_total_steps: 10000
    scheduler_warmup_ratio: 0.1
    scheduler_type: cosine
    grad_clip_max_norm: 5.0
    inf_post_clip_threshold: 100.0
    max_nan_retries: 3
    checkpoint_every_n_steps: 500
    max_rolling_checkpoints: 3
    num_best_checkpoints: 2
    nan_check_interval: 10
    log_gradient_stats: true
    gradient_log_interval: 10
    csv_log_path: "training_metrics.csv"
    csv_rotate_on_schema_change: true
    gpu_metrics_backend: nvml
    nvml_device_index: 0
    enable_block_grad_norms: true
    telemetry_log_interval: 1
    gpu_temp_guard_enabled: true
    switch_on_thermal: false
    gpu_temp_pause_threshold_c: 90.0
    gpu_temp_resume_threshold_c: 80.0
    gpu_temp_critical_threshold_c:
    gpu_temp_poll_interval_seconds: 30.0
    gpu_temp_checkpoint_grace_seconds: 30.0
    resume_from_checkpoint:
    use_galore: false
    galore_rank: 64
    galore_update_interval: 1
    galore_scale: 1.0
    galore_max_dim: 4096
- model_class: frankenstein_audio
  model:
    dims:
      vocab_size: 128
      hidden_size: 96
      num_layers: 4
      num_loops: 1
      num_heads: 4
      dropout: 0.1
      layer_pattern: [conformer_attn, conformer_attn, conformer_attn, standard_attn]
      mode: encoder
    norm:
      type: layer_norm
    embedding:
      factorized:
        enabled: false
      conv:
        enabled: false
    attention:
      conformer:
        kernel_size: 32
        macaron: true
        conv_norm: batch
    moe:
      enabled: false
    bitnet:
      enabled: false
    ffn:
      hidden_size: 384
      activation: silu
    positional_encoding: sinusoidal_absolute
  audio:
    feature: logmel
    sample_rate: 16000
    n_mels: 80
    window_ms: 25.0
    stride_ms: 10.0
    n_fft: 400
    conv_channels: 32
    asr_loss: ctc
    asr_decoder_dim: 96
    asr_decoder_layers: 1
    asr_decoder_dropout: 0.1
    num_classes: 2
    pooling_mode: gap
    spec_augment:
      enabled: true
      freq_mask_width: 27
      time_masks: 10
      time_mask_ratio: 0.05
  audio_dataset:
    dataset_name: astroza/chilean-jokes-festival-de-vina
    split: test
    audio_column: audio
    text_column: text
    max_duration_sec: 30.0
    resample: true
  training:
    task: asr
    batch_size: 2
    num_epochs: 1
    optimizer:
      optimizer_class: adamw
      parameters:
        adamw-lr_other: 0.001
        adamw-wd_other: 0.01

