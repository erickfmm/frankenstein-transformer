type: object
additionalProperties: false
title: "Fixed Numerics"
title_es: "Numéricas Corregidas"
description: |-
  Numerical fixes for softmax and cross-entropy from Barron, Gnanapragasam &
  Tschannen (arXiv:2610.31642, "A Fix for Softmax and Cross-Entropy").
  Standard implementations subtract the maximum logit before exponentiating,
  which prevents overflow but still rounds the target/argmax gradient to zero
  once the logit margin passes the floating-point precision cliff (Softmax
  Collapse: ≈5.5 in bf16, 16.6 in fp32, 36.7 in fp64). This leaves gradients
  that no longer sum to zero and produces the "Slingshot" loss spikes seen
  with adaptive optimizers. Both flags are off by default and preserve the
  mathematical semantics of the standard operations.
description_es: |-
  Correcciones numéricas de softmax y cross-entropy de Barron, Gnanapragasam
  y Tschannen (arXiv:2610.31642, "A Fix for Softmax and Cross-Entropy").
  Las implementaciones estándar restan el logit máximo antes de exponenciar,
  lo que evita el desbordamiento pero aún redondea a cero el gradiente del
  logit objetivo/argmax cuando el margen de logits cruza el acantilado de
  precisión (Softmax Collapse: ≈5.5 en bf16, 16.6 en fp32, 36.7 en fp64).
  Esto deja gradientes que ya no suman cero y produce los picos de pérdida
  "Slingshot" con optimizadores adaptativos. Ambos flags están desactivados
  por defecto y preservan la semántica matemática de las operaciones estándar.
properties:
  fixed_softmax:
    type: boolean
    title: "Fixed Softmax / Log-Softmax"
    title_es: "Softmax / Log-Softmax Corregido"
    description: |-
      Replace every explicit softmax and log-softmax in the model (attention
      mixers, MoE/MoD routers, depth-wise attention residuals, KV-cache
      recompute paths and decoder sampling) with the cancellation-free
      formulation: the argmax logit is excluded from the log-sum-exp and the
      resulting margin is combined with `softplus`, so the argmax/softmax
      Jacobian keeps its true magnitude past the precision cliff instead of
      rounding to zero. Forward outputs are mathematically identical to
      standard softmax; only the backward pass changes. Note: the internal
      SSOG LSE kernels keep their own formulation.
    description_es: |-
      Reemplaza cada softmax y log-softmax explícito del modelo (mixers de
      atención, routers MoE/MoD, residuales de atención en profundidad, rutas
      de recomputación de la caché KV y muestreo del decoder) por la
      formulación sin cancelación: el logit argmax se excluye del log-sum-exp
      y el margen resultante se combina con `softplus`, de modo que el
      jacobiano argmax/softmax conserva su magnitud real más allá del
      acantilado de precisión en lugar de redondearse a cero. Las salidas
      forward son matemáticamente idénticas a softmax estándar; solo cambia
      el backward. Nota: los núcleos LSE internos de SSOG conservan su propia
      formulación.
    default: false
    examples: [false, true]
  fixed_cross_entropy:
    type: boolean
    title: "Fixed Cross-Entropy"
    title_es: "Cross-Entropy Corregida"
    description: |-
      Replace the task cross-entropy losses (mlm, causal_lm, classification,
      segmentation, text_classification and patch_prediction) with the
      hard-target formulation from arXiv:2610.31642 §2: the target logit is
      used as the reference and the loss is `softplus(logsumexp(z - z_t))`
      over the non-target logits, so autograd yields a target gradient equal
      to minus the sum of the non-target gradients — the gradient sums to
      zero by construction even when the margin exceeds the precision cliff.
      Soft-target/distillation cross-entropy is not affected. `ignore_index`
      and the `mean` reduction follow `torch.nn.functional.cross_entropy`
      semantics.
    description_es: |-
      Reemplaza las pérdidas de cross-entropy de las tareas (mlm, causal_lm,
      classification, segmentation, text_classification y patch_prediction)
      por la formulación de objetivo duro de arXiv:2610.31642 §2: el logit
      objetivo se usa como referencia y la pérdida es
      `softplus(logsumexp(z - z_t))` sobre los logits no objetivo, de modo que
      autograd produce un gradiente objetivo igual a menos la suma de los
      gradientes no objetivo — el gradiente suma cero por construcción incluso
      cuando el margen supera el acantilado de precisión. La cross-entropy de
      objetivo blando/destilación no se ve afectada. `ignore_index` y la
      reducción `mean` siguen la semántica de
      `torch.nn.functional.cross_entropy`.
    default: false
    examples: [false, true]
