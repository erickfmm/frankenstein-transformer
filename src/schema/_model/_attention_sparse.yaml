type: object
additionalProperties: false
properties:
  msa:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `msa` (MiniMax Sparse Attention): block size, top-k block selection, Index Branch dimension and its KL alignment loss. Only applies when `msa` appears in `layer_pattern`.
      **References:** (paper: arxiv:2606.13392)
    description_es: |-
      Hiperparámetros para `msa` (MiniMax Sparse Attention): tamaño de bloque, selección top-k de bloques, dimensión de la rama índice y su pérdida de alineación KL. Solo aplica cuando `msa` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2606.13392)
    properties:
      block_size:
        type: integer
        title: "MSA Block Size"
        title_es: "Tamaño de Bloque MSA"
        description: |-
          Block size `B_k` for `msa` (MiniMax Sparse Attention,
          (paper: arxiv:2606.13392)). Tokens are partitioned into contiguous blocks of
          this size; the Index Branch scores blocks and the Main Branch
          attends to selected blocks. Paper default: 128.

          **References:** (paper: arxiv:2606.13392)
        description_es: |-
          Tamaño de bloque `B_k` para `msa` (MiniMax Sparse Attention,
          (paper: arxiv:2606.13392)). Los tokens se particionan en bloques contiguos de
          este tamaño; la rama índice puntúa bloques y la rama principal atiende
          a los seleccionados. Por defecto del paper: 128.

          **Referencias:** (paper: arxiv:2606.13392)
        examples: [128]
      topk_blocks:
        type: integer
        title: "MSA Top-k Blocks"
        title_es: "Top-k Bloques MSA"
        description: |-
          Number of blocks selected per GQA group per query for `msa`.
          The block containing the query is always forced into the selected
          set. Paper default: 16 (giving a fixed 2048-token budget per
          query at `block_size=128`).

          **References:** (paper: arxiv:2606.13392)
        description_es: |-
          Número de bloques seleccionados por grupo GQA por consulta para
          `msa`. El bloque que contiene la consulta siempre se incluye.
          Por defecto del paper: 16 (presupuesto fijo de 2048 tokens por
          consulta con `block_size=128`).

          **Referencias:** (paper: arxiv:2606.13392)
        examples: [16]
      index_dim:
        type: integer
        title: "MSA Index Head Dim"
        title_es: "Dim de Cabeza Índice MSA"
        description: |-
          Dimensionality `d_idx` of the Index Branch heads for `msa`.
          Constraint: `num_kv_heads * d_idx << num_heads * head_dim`. Default:
          64. The exact value is an appendix hyperparameter in the paper.

          **References:** (paper: arxiv:2606.13392)
        description_es: |-
          Dimensionalidad `d_idx` de las cabezas de la rama índice para
          `msa`. Restricción: `num_kv_heads * d_idx << num_heads *
          head_dim`. Por defecto: 64.

          **Referencias:** (paper: arxiv:2606.13392)
        examples: [64]
      kl_loss_weight:
        type: number
        title: "MSA KL Loss Weight"
        title_es: "Peso de Pérdida KL MSA"
        description: |-
          Weight `lambda` of the KL alignment loss that trains the Index Branch
          of `msa`. Set to 0 to disable (Index Branch then only learns via
          the indexer warmup). The paper leaves the exact value to appendix
          ablations. Default: 0.0.

          **References:** (paper: arxiv:2606.13392)
        description_es: |-
          Peso `lambda` de la pérdida de alineación KL que entrena la rama
          índice de `msa`. 0 para deshabilitar. El paper deja el valor
          exacto a ablacions del apéndice. Por defecto: 0.0.

          **Referencias:** (paper: arxiv:2606.13392)
        examples: [0.0]
  sparda:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `sparda` (SparDA): KV block size, top-k block selection and the Forecast projection dimension. Only applies when `sparda` appears in `layer_pattern`.
      **References:** (paper: arxiv:2606.04511)
    description_es: |-
      Hiperparámetros para `sparda` (SparDA): tamaño de bloque KV, selección top-k de bloques y la dimensión de la proyección Forecast. Solo aplica cuando `sparda` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2606.04511)
    properties:
      block_size:
        type: integer
        title: "SparDA Block Size"
        title_es: "Tamaño de Bloque SparDA"
        description: |-
          KV block size for `sparda` (SparDA (paper: arxiv:2606.04511)). The
          Forecast projection scores blocks of this size. Default: 128.

          **References:** (paper: arxiv:2606.04511)
        description_es: |-
          Tamaño de bloque KV para `sparda` (SparDA (paper: arxiv:2606.04511)). La
          proyección Forecast puntúa bloques de este tamaño. Por defecto: 128.

          **Referencias:** (paper: arxiv:2606.04511)
        examples: [128]
      topk_blocks:
        type: integer
        title: "SparDA Top-k Blocks"
        title_es: "Top-k Bloques SparDA"
        description: |-
          Number of KV blocks selected per GQA group per query for
          `sparda`. Default: 16.

          **References:** (paper: arxiv:2606.04511)
        description_es: |-
          Número de bloques KV seleccionados por grupo GQA por consulta para
          `sparda`. Por defecto: 16.

          **Referencias:** (paper: arxiv:2606.04511)
        examples: [16]
      forecast_dim:
        type: integer
        title: "SparDA Forecast Dim"
        title_es: "Dim de Forecast SparDA"
        description: |-
          Dimensionality of the Forecast projection for `sparda`. One
          Forecast head per GQA group. Default: 64.

          **References:** (paper: arxiv:2606.04511)
        description_es: |-
          Dimensionalidad de la proyección Forecast para `sparda`. Una
          cabeza Forecast por grupo GQA. Por defecto: 64.

          **Referencias:** (paper: arxiv:2606.04511)
        examples: [64]
  probsparse:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `probsparse` (ProbSparse self-attention): the key-sampling factor `c1` used by the max-mean sparsity probe and the query-selection factor `c2` that sets how many dominant queries are scored. Both follow the paper's `L' = c * ceil(ln L)` rule. Only applies when `probsparse` appears in `layer_pattern`.
      **References:** (paper: arxiv:2209.00260) (paper: arxiv:2012.07436)
    description_es: |-
      Hiperparámetros para `probsparse` (atención ProbSparse): el factor de muestreo de claves `c1` usado por la sonda de dispersidad max-mean y el factor de selección de consultas `c2` que fija cuántas consultas dominantes se puntúan. Ambos siguen la regla del paper `L' = c * ceil(ln L)`. Solo aplica cuando `probsparse` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2209.00260) (paper: arxiv:2012.07436)
    properties:
      c1:
        type: number
        exclusiveMinimum: 0.0
        default: 5.0
        title: "ProbSparse Key-Sampling Factor c₁"
        title_es: "Factor de Muestreo de Claves c₁ de ProbSparse"
        description: |-
          Key-sampling factor `c1` for the max-mean sparsity probe of
          `probsparse` (paper: arxiv:2209.00260). Only
          `L'_K = c1 · ceil(ln L_K)` keys are read when ranking queries,
          which is what keeps the layer at `O(L log L)`. Paper value: 5.0.
          Clamped to the current sequence length.

          **References:** (paper: arxiv:2209.00260) (paper: arxiv:2012.07436)
        description_es: |-
          Factor de muestreo de claves `c1` para la sonda de dispersidad
          max-mean de `probsparse` (paper: arxiv:2209.00260). Solo se leen
          `L'_K = c1 · ceil(ln L_K)` claves al ordenar las consultas, lo que
          mantiene la capa en `O(L log L)`. Valor del paper: 5.0. Se recorta
          a la longitud actual de la secuencia.

          **Referencias:** (paper: arxiv:2209.00260) (paper: arxiv:2012.07436)
        examples: [5.0]
      c2:
        type: number
        exclusiveMinimum: 0.0
        default: 5.0
        title: "ProbSparse Query-Selection Factor c₂"
        title_es: "Factor de Selección de Consultas c₂ de ProbSparse"
        description: |-
          Query-selection factor `c2` for `probsparse` (paper:
          arxiv:2209.00260). The layer keeps the top
          `L'_Q = c2 · ceil(ln L_Q)` dominant queries and scores only those
          against every key; the remaining rows keep the head-mean of `V`.
          Paper value: 5.0. Clamped to the query length (so short sequences
          select every query and behave as dense attention). Ignored in
          decoder mode, which always scores all queries causally.

          **References:** (paper: arxiv:2209.00260) (paper: arxiv:2012.07436)
        description_es: |-
          Factor de selección de consultas `c2` para `probsparse` (paper:
          arxiv:2209.00260). La capa conserva las `L'_Q = c2 · ceil(ln L_Q)`
          consultas dominantes y solo las puntúa frente a todas las claves;
          las filas restantes conservan la media por cabeza de `V`. Valor del
          paper: 5.0. Se recorta a la longitud de consultas (las secuencias
          cortas seleccionan todas y se comportan como atención densa). Se
          ignora en modo decoder, que siempre puntúa todas las consultas de
          forma causal.

          **Referencias:** (paper: arxiv:2209.00260) (paper: arxiv:2012.07436)
        examples: [5.0]
