type: object
additionalProperties: false
title: "Manifold-Constrained Hyper-Connections (mHC)"
title_es: "Hyper-Connexiones Restringidas por Variedad (mHC)"
description: |-
  Configuration for Manifold-Constrained Hyper-Connections (mHC,
  arXiv:2512.24880). mHC expands the residual stream width by a factor
  `expansion_rate` (the residual stream becomes `n × hidden_size`) and
  constrains the stream-mixing matrix `H[res]` to the Birkhoff polytope
  (the set of doubly stochastic matrices) via the Sinkhorn-Knopp
  projection. This restores the identity-mapping property lost by
  unconstrained Hyper-Connections, stabilising training at scale.

  **Examples explained:**
  - `enabled: true` with the paper default `expansion_rate: 4`: an
    n=4 stream residual, matching DeepSeek's experimental setup. Increases
    activation memory ~4× (mitigate with `checkpoint: true`).
  - `enabled: true` with `expansion_rate: 2`: a lighter variant with less
    memory/compute overhead while still benefiting from the constrained
    residual mixing.
  - `expansion_rate: 1` degenerates to the exact identity mapping.

  ⚠️ mHC is incompatible with `use_mixture_of_depths` (MoD token routing
  operates on a single C-dimensional stream, conflicting with the n-stream
  residual).

  **Hyperloop mode** (`hyperloop: true`, arXiv:2604.21254): instead of the
  per-sublayer wiring above, hyper-connections fire once per loop iteration
  over a middle-cycle partitioned stack (begin → looped middle → end), with
  per-loop parameters, copy/average stream expansion, and a diagonal-sigmoid
  `H^res` by default. See the `hyperloop` property below. Hyperloop requires
  `enabled: true` and `dims.num_loops >= 2`; it lifts the MoD incompatibility
  (middle-block layers run the standard C-dim path) but is incompatible with
  AttnRes residuals (`residuals.type: full_attn|block_attn`).
description_es: |-
  Configuración para Hyper-Connexiones Restringidas por Variedad (mHC,
  arXiv:2512.24880). mHC expande el ancho del flujo residual por un factor
  `expansion_rate` (el flujo residual pasa a ser `n × hidden_size`) y
  restringe la matriz de mezcla de flujo `H[res]` al politopo de Birkhoff
  (el conjunto de matrices doblemente estocásticas) mediante la proyección
  Sinkhorn-Knopp. Esto restaura la propiedad de mapeo de identidad que
  pierden las Hyper-Connexions sin restricción, estabilizando el
  entrenamiento a escala.

  **Ejemplos explicados:**
  - `enabled: true` con el valor por defecto del paper `expansion_rate: 4`:
    un flujo residual de n=4, coincidiendo con la configuración experimental
    de DeepSeek. Aumenta la memoria de activaciones ~4× (mitigar con
    `checkpoint: true`).
  - `enabled: true` con `expansion_rate: 2`: una variante más ligera con
    menos sobrecarga de memoria/cómputo y aun así el beneficio de la mezcla
    residual restringida.
  - `expansion_rate: 1` degenera al mapeo de identidad exacto.

  ⚠️ mHC es incompatible con `use_mixture_of_depths` (el enrutamiento MoD de
  tokens opera sobre un flujo C-dimensional único, en conflicto con el flujo
  residual de n streams).
properties:
  enabled:
    type: boolean
    title: "Enable mHC"
    title_es: "Habilitar mHC"
    description: |
      When true, replaces the standard residual connection with the
      manifold-constrained n-stream residual. Defaults to false (standard
      residual connection).
    description_es: |
      Cuando es true, reemplaza la conexión residual estándar por el flujo
      residual de n streams restringido por variedad. Por defecto es false
      (conexión residual estándar).
    default: false
    examples: [true, false]
  expansion_rate:
    type: integer
    minimum: 1
    title: "Expansion Rate (n)"
    title_es: "Tasa de Expansión (n)"
    description: |
      Factor by which the residual stream width is expanded. The residual
      stream becomes `n × hidden_size` while layer internals stay at
      `hidden_size`. `1` recovers the identity mapping. The paper uses `4`.
    description_es: |
      Factor por el que se expande el ancho del flujo residual. El flujo
      residual pasa a ser `n × hidden_size` mientras los internos de la capa
      permanecen en `hidden_size`. `1` recupera el mapeo de identidad. El
      paper usa `4`.
    default: 4
    examples: [2, 4]
  sinkhorn_iters:
    type: integer
    minimum: 1
    title: "Sinkhorn-Knopp Iterations"
    title_es: "Iteraciones Sinkhorn-Knopp"
    description: |
      Number of row/column normalisation rounds in the Sinkhorn-Knopp
      projection that constrains `H[res]` to be doubly stochastic. More
      iterations give a more accurate projection at higher cost. The paper
      uses `20`.
    description_es: |
      Número de rondas de normalización fila/columna en la proyección
      Sinkhorn-Knopp que restringe `H[res]` a ser doblemente estocástica.
      Más iteraciones dan una proyección más precisa a mayor costo. El paper
      usa `20`.
    default: 20
    examples: [20]
  gating_init:
    type: number
    exclusiveMinimum: 0
    title: "Gating Factor Init"
    title_es: "Inicialización del Factor de Compuerta"
    description: |
      Initial value of the learnable gating scalars `α` applied to the mHC
      coefficient computations. Small values stabilise early training. The
      paper uses `0.01`.
    description_es: |
      Valor inicial de los escalares de compuerta aprendibles `α` aplicados
      a los cálculos de coeficientes mHC. Valores pequeños estabilizan el
      entrenamiento temprano. El paper usa `0.01`.
    default: 0.01
    examples: [0.01]
  checkpoint:
    type: boolean
    title: "Gradient Checkpointing"
    title_es: "Gradient Checkpointing"
    description: |
      When true, uses gradient checkpointing on the mHC layer blocks to trade
      compute for memory, mitigating the ~`n`× activation-memory increase of
      the n-stream residual.
    description_es: |
      Cuando es true, usa gradient checkpointing en los bloques de capa mHC
      para intercambiar cómputo por memoria, mitigando el aumento ~`n`× de
      memoria de activaciones del flujo residual de n streams.
    default: false
    examples: [false, true]
  full_prec_under_bitnet:
    type: boolean
    title: "Full Precision Under BitNet"
    title_es: "Precisión Completa Bajo BitNet"
    description: |
      When true (default), the mHC coefficient projection `φ_l` is kept as a
      full-precision `nn.Linear` even when `use_bitnet` is true, avoiding
      ternary-quantisation noise on the small mHC coefficients. When false
      (and `use_bitnet` is true), `φ_l` uses `BitLinear`.
    description_es: |
      Cuando es true (por defecto), la proyección de coeficientes mHC `φ_l`
      se mantiene como `nn.Linear` de precisión completa incluso cuando
      `use_bitnet` es true, evitando ruido de cuantización ternaria en los
      pequeños coeficientes mHC. Cuando es false (y `use_bitnet` es true),
      `φ_l` usa `BitLinear`.
    default: true
    examples: [true, false]
  hyperloop:
    type: boolean
    title: "Hyperloop Transformer (loop-level hyper-connections)"
    title_es: "Transformer Hyperloop (hiperconexiones a nivel de bucle)"
    description: |-
      Enable the **Hyperloop Transformer** architecture (Zeitoun,
      Torroba-Hennigen & Kim, arXiv:2604.21254). Instead of applying mHC
      hyper-connections after every attention/FFN sub-layer, the layer stack
      is partitioned middle-cycle into a **begin block** (runs once), a
      **looped middle block** wrapped in loop-level hyper-connections, and an
      **end block** (runs once):

      `x → begin → copy×n → { read(H^pre) → middle → +e_l → update(H^res, H^post) } × num_loops → avg → end → head`

      Key properties (all measured in the paper):
      - Loop-level hyper-connections with **per-loop** parameters
        `{W_l, b_l, α_l, e_l}` relax strict weight sharing across loops —
        this is what recovers depth-matched quality with ~50% fewer
        parameters.
      - The stream is created by **copying** (`expansion_rate` copies) and
        collapsed by **averaging**, replacing mHC's learned in/out
        projections.
      - `H^res` uses a **diagonal sigmoid** parameterization by default (the
        paper's best ablation: fewer parameters than Sinkhorn AND better
        perplexity). See `hyperloop_res_parameterization`.
      - Only fires once per loop, so overhead is minimal (~5% throughput vs
        mHC's ~33% slowdown in plain PyTorch).
      - Post-training INT4 (GPTQ) perplexity degrades less than plain looped
        models.
      - **Requires** `enabled: true` and `dims.num_loops >= 2` (paper uses
        3). Incompatible with `residuals.type: full_attn|block_attn`
        (AttnRes assumes a per-logical-layer n-stream residual). Unlike
        per-layer mHC, **Mixture-of-Depths stays compatible** (middle-block
        layers run the standard C-dim path).

      Parameter budget: per loop `≈ 3n²C + 3n + 3 + C` (diagonal) — for the
      paper's 136M model (C=1024, n=4, 3 loops) this is ~150K extra
      parameters over the plain looped Transformer.
    description_es: |-
      Habilita la arquitectura **Hyperloop Transformer** (Zeitoun,
      Torroba-Hennigen & Kim, arXiv:2604.21254). En lugar de aplicar las
      hiperconexiones mHC tras cada subcapa attention/FFN, la pila de capas
      se particiona en ciclo medio: un **bloque inicial** (se ejecuta una
      vez), un **bloque intermedio en bucle** envuelto en hiperconexiones a
      nivel de bucle y un **bloque final** (se ejecuta una vez).

      Propiedades clave (todas medidas en el paper):
      - Hiperconexiones a nivel de bucle con parámetros **por bucle**
        `{W_l, b_l, α_l, e_l}` que relajan la compartición estricta de pesos
        entre bucles — esto recupera calidad equivalente a profundidad
        completa con ~50% menos parámetros.
      - El stream se crea **copiando** (`expansion_rate` copias) y se colapsa
        **promediando**, reemplazando las proyecciones aprendidas de mHC.
      - `H^res` usa una parametrización **sigmoide diagonal** por defecto
        (la mejor ablación del paper). Ver `hyperloop_res_parameterization`.
      - Se aplica una vez por bucle, así que la sobrecarga es mínima.
      - **Requiere** `enabled: true` y `dims.num_loops >= 2` (el paper usa
        3). Incompatible con `residuals.type: full_attn|block_attn`. A
        diferencia de mHC por capa, **Mixture-of-Depths sigue siendo
        compatible**.
    default: false
    examples: [true, false]
  hyperloop_begin_layers:
    type: integer
    minimum: 0
    title: "Hyperloop Begin Block Layers"
    title_es: "Capas del Bloque Inicial Hyperloop"
    description: |
      Number of physical layers at the start of the stack that run exactly
      once before the looped middle block (the "begin block" / prelude). The
      paper allocates ~25% of parameters to the begin block, 50% to the
      middle, 25% to the end (e.g. `2L → 4L(×3) → 2L` at 16 unrolled layers).

      Only meaningful when `hyperloop` is true. `0` (default) loops the whole
      stack with no begin/end split.

      Must satisfy `hyperloop_begin_layers + hyperloop_end_layers <
      dims.num_layers`.
    description_es: |
      Número de capas físicas al inicio de la pila que se ejecutan una sola
      vez antes del bloque intermedio en bucle (el "bloque inicial"). El
      paper asigna ~25% de los parámetros al bloque inicial, 50% al
      intermedio y 25% al final (p. ej. `2L → 4L(×3) → 2L` a 16 capas
      desenrolladas).

      Solo es significativo cuando `hyperloop` es true. `0` (por defecto)
      recorre la pila completa sin partición begin/end.

      Debe satisfacer `hyperloop_begin_layers + hyperloop_end_layers <
      dims.num_layers`.
    default: 0
    examples: [0, 2, 3]
  hyperloop_end_layers:
    type: integer
    minimum: 0
    title: "Hyperloop End Block Layers"
    title_es: "Capas del Bloque Final Hyperloop"
    description: |
      Number of physical layers at the end of the stack that run exactly once
      after the looped middle block (the "end block" / coda). The paper
      allocates ~25% of parameters to it. Only meaningful when `hyperloop` is
      true; `0` (default) loops the whole stack.

      Must satisfy `hyperloop_begin_layers + hyperloop_end_layers <
      dims.num_layers`.
    description_es: |
      Número de capas físicas al final de la pila que se ejecutan una sola
      vez tras el bloque intermedio en bucle (el "bloque final"). El paper le
      asigna ~25% de los parámetros. Solo es significativo cuando `hyperloop`
      es true; `0` (por defecto) recorre la pila completa.

      Debe satisfacer `hyperloop_begin_layers + hyperloop_end_layers <
      dims.num_layers`.
    default: 0
    examples: [0, 2, 3]
  hyperloop_res_parameterization:
    type: string
    title: "H^res Parameterization"
    title_es: "Parametrización de H^res"
    description: |
      Parameterization of the transition matrix `H^res` that mixes the
      parallel residual streams between loop iterations (paper §3, ablation
      Table 6). Only meaningful when `hyperloop` is true.

      - `"diagonal"` (default, paper's choice): `H^res = diag(σ(α·W·z+b))` —
        a data-dependent per-stream gate. Cheapest (W_res is `n×nC` instead
        of `n²×nC`) **and** the paper's best perplexity (14.40).
      - `"sinkhorn"`: full mHC-style `sinkhorn(W·z+b)` doubly stochastic
        matrix (14.59 in the paper's ablation). Available for ablation
        parity with `mhc.enabled` without `hyperloop`.
      - `"identity"`: `H^res = I` — no mixing parameters at all. The
        paper's simplest ablation (14.61).
    description_es: |
      Parametrización de la matriz de transición `H^res` que mezcla los
      streams residuales paralelos entre iteraciones de bucle (paper §3,
      ablación Tabla 6). Solo es significativa cuando `hyperloop` es true.

      - `"diagonal"` (por defecto, elección del paper):
        `H^res = diag(σ(α·W·z+b))` — compuerta por stream dependiente de los
        datos. La más barata **y** la de mejor perplejidad (14.40).
      - `"sinkhorn"`: matriz doblemente estocástica completa estilo mHC
        (14.59 en la ablación). Disponible para paridad de ablación con
        `mhc.enabled` sin `hyperloop`.
      - `"identity"`: `H^res = I` — sin parámetros de mezcla. La ablación
        más simple del paper (14.61).
    enum: [diagonal, sinkhorn, identity]
    default: diagonal
    examples: [diagonal, sinkhorn, identity]
