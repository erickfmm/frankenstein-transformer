type: object
additionalProperties: false
properties:
  mla:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `mla` (Multi-Head Latent Attention): rank of the joint key-value latent. Only applies when `mla` appears in `layer_pattern`.
      **References:** (paper: arxiv:2506.09342)
    description_es: |-
      Hiperparámetros para `mla` (Multi-Head Latent Attention): rango del latente conjunto clave-valor. Solo aplica cuando `mla` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2506.09342)
    properties:
      latent_rank:
        type: [integer, "null"]
        default: null
        title: "MLA Latent Rank"
        title_es: "Rango Latente MLA"
        description: |-
          Rank of the joint key-value latent for `mla` (Multi-Head Latent
          Attention (paper: arxiv:2506.09342)). The paper's Pareto-optimal setting is
          `hidden_size // 2` with RoPE, which halves the KV cache while
          matching MHA quality. Set to `null` (the default) to use
          `hidden_size // 2`. Only applies when `mla` appears in
          `layer_pattern`.

          **Examples explained:**
          - `mla_latent_rank=384` with `hidden_size=768`: half-rank latent, the
            paper's recommended setting. ~50% KV-cache reduction with negligible
            quality loss on small models.
          - `mla_latent_rank=192` with `hidden_size=768`: quarter-rank, more
            aggressive compression. Larger quality impact, useful for very
            cache-constrained deployment.
          - `mla_latent_rank=null`: defaults to `hidden_size // 2`.

          **References:** (paper: arxiv:2506.09342)
        description_es: |-
          Rango del latente conjunto clave-valor para `mla` (Multi-Head
          Latent Attention (paper: arxiv:2506.09342)). La configuración Pareto-óptima del
          paper es `hidden_size // 2` con RoPE, lo que reduce a la mitad el caché
          KV manteniendo la calidad de MHA. `null` (por defecto) usa
          `hidden_size // 2`. Solo aplica cuando `mla` está en `layer_pattern`.

          **Referencias:** (paper: arxiv:2506.09342)
        examples: [384]
      num_heads:
        type: [integer, "null"]
        default: null
        title: "MLA Number of Heads"
        title_es: "Número de Cabezas MLA"
        description: |-
          Attention-head count for `mla`, overriding `dims.num_heads`. Kimi K3
          uses 96 heads. `null` (default) uses `dims.num_heads`.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Número de cabezas de atención para `mla`, sobrescribiendo
          `dims.num_heads`. Kimi K3 usa 96 cabezas. `null` (por defecto) usa
          `dims.num_heads`.
          **Referencias:** (paper: arxiv:2607.24653)
        minimum: 1
        examples: [96]
      head_dim:
        type: [integer, "null"]
        default: null
        title: "MLA Head Dimension"
        title_es: "Dimensión de Cabeza MLA"
        description: |-
          Per-head width for `mla`. `null` (default) uses
          `hidden_size // num_heads`. Set it explicitly to decouple the head
          geometry from `hidden_size` (Kimi K3 MLA head width: 128).
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Ancho por cabeza para `mla`. `null` (por defecto) usa
          `hidden_size // num_heads`. Definirlo explícitamente desacopla la
          geometría de cabezas de `hidden_size` (ancho de cabeza MLA de Kimi K3:
          128).
          **Referencias:** (paper: arxiv:2607.24653)
        minimum: 1
        examples: [128]
  gqla:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `gqla` (Group-Query Latent Attention): joint KV latent rank, GQA groups and the decoding path. Only applies when `gqla` appears in `layer_pattern`.
      **References:** (paper: arxiv:2605.15250)
    description_es: |-
      Hiperparámetros para `gqla` (Group-Query Latent Attention): rango del latente KV conjunto, grupos GQA y la ruta de decodificación. Solo aplica cuando `gqla` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2605.15250)
    properties:
      latent_rank:
        type: [integer, "null"]
        default: null
        title: "GQLA Latent Rank"
        title_es: "Rango Latente GQLA"
        description: |-
          Rank of the joint KV latent for `gqla` (Group-Query Latent
          Attention (paper: arxiv:2605.15250)). `null` defaults to `hidden_size // 2`.
          Only applies when `gqla` is in `layer_pattern`.

          **References:** (paper: arxiv:2605.15250)
        description_es: |-
          Rango del latente KV conjunto para `gqla` (Group-Query Latent
          Attention (paper: arxiv:2605.15250)). `null` por defecto es `hidden_size // 2`.
          Solo aplica cuando `gqla` está en `layer_pattern`.

          **Referencias:** (paper: arxiv:2605.15250)
        examples: [384]
      num_groups:
        type: [integer, "null"]
        default: null
        title: "GQLA Number of Groups"
        title_es: "Número de Grupos GQLA"
        description: |-
          Number of GQA groups used by the expanded `gqa` decoding path of
          `gqla`. Must divide `num_heads` evenly. `null` defaults to
          `num_heads // 4`. Only applies when `gqla` is in `layer_pattern`.

          **References:** (paper: arxiv:2605.15250)
        description_es: |-
          Número de grupos GQA usados por la ruta de decodificación `gqa`
          expandida de `gqla`. Debe dividir `num_heads`. `null` por
          defecto es `num_heads // 4`. Solo aplica con `gqla`.

          **Referencias:** (paper: arxiv:2605.15250)
        examples: [4]
      decode_path:
        type: string
        title: "GQLA Decode Path"
        title_es: "Ruta de Decodificación GQLA"
        description: |-
          Selected decoding path for `gqla`. `"mqa_absorb"` matches MLA's
          absorbed MQA form (best for H100-class bandwidth). `"gqa"` expands the
          latent into per-group full heads (best for commodity GPUs with MTP).
          Both paths are algebraically equivalent for the forward output.

          **References:** (paper: arxiv:2605.15250)
        description_es: |-
          Ruta de decodificación seleccionada para `gqla`. `"mqa_absorb"`
          corresponde a la forma MQA absorbida de MLA (mejor para H100).
          `"gqa"` expande el latente en cabezas completas por grupo (mejor para
          GPUs commodity con MTP). Ambas rutas son algebraicamente equivalentes.

          **Referencias:** (paper: arxiv:2605.15250)
        enum: [mqa_absorb, gqa]
        examples: [gqa]
  mlra:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `mlra` (Multi-Head Low-Rank Attention): total latent rank and number of disjoint latent sub-spaces. Only applies when `mlra` appears in `layer_pattern`.
      **References:** (paper: arxiv:2603.02188)
    description_es: |-
      Hiperparámetros para `mlra` (Multi-Head Low-Rank Attention): rango latente total y número de sub-espacios latentes disjuntos. Solo aplica cuando `mlra` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2603.02188)
    properties:
      latent_rank:
        type: [integer, "null"]
        default: null
        title: "MLRA Latent Rank"
        title_es: "Rango Latente MLRA"
        description: |-
          Total latent rank for `mlra` (Multi-Head Low-Rank Attention,
          (paper: arxiv:2603.02188)), partitioned across `mlra_num_latent_heads`
          sub-heads for tensor-parallel decoding. `null` defaults to
          `hidden_size // 2`. Must be divisible by `mlra_num_latent_heads`.

          **References:** (paper: arxiv:2603.02188)
        description_es: |-
          Rango latente total para `mlra` (Multi-Head Low-Rank Attention,
          (paper: arxiv:2603.02188)), particionado entre `mlra_num_latent_heads`
          sub-cabezas para decodificación tensor-paralela. `null` por defecto es
          `hidden_size // 2`. Debe ser divisible por `mlra_num_latent_heads`.

          **Referencias:** (paper: arxiv:2603.02188)
        examples: [384]
      num_latent_heads:
        type: integer
        title: "MLRA Latent Heads"
        title_es: "Cabezas Latentes MLRA"
        description: |-
          Number of disjoint latent sub-spaces for `mlra`. Enables
          partitionable 4-way tensor-parallel decoding (each device loads a
          disjoint slice). Must divide `mlra_latent_rank` evenly. Default: 4.

          **References:** (paper: arxiv:2603.02188)
        description_es: |-
          Número de sub-espacios latentes disjuntos para `mlra`. Habilita
          decodificación tensor-paralela de 4 vías (cada dispositivo carga un
          slice disjunto). Debe dividir `mlra_latent_rank`. Por defecto: 4.

          **Referencias:** (paper: arxiv:2603.02188)
        examples: [4]
  tucker:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `tucker` (Tucker Attention): ranks of the Tucker factorization for the query, key and value weight tensors. Only applies when `tucker` appears in `layer_pattern`.
      **References:** (paper: arxiv:2603.30033)
    description_es: |-
      Hiperparámetros para `tucker` (Tucker Attention): rangos de la factorización Tucker de los tensores de pesos de query, key y value. Solo aplica cuando `tucker` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2603.30033)
    properties:
      query_rank:
        type: [integer, "null"]
        default: null
        title: "Tucker Query Rank"
        title_es: "Rango de Query Tucker"
        description: |-
          Tucker rank along the hidden axis for the query weight tensor of
          `tucker` (paper: arxiv:2603.30033). `null` defaults to `hidden_size`
          (recovers MHA query rank). Special cases: MHA = `hidden_size`;
          MLA = latent rank.

          **References:** (paper: arxiv:2603.30033)
        description_es: |-
          Rango Tucker a lo largo del eje oculto para el tensor de pesos de
          query de `tucker` (paper: arxiv:2603.30033). `null` por defecto es
          `hidden_size` (recupera el rango de query de MHA).

          **Referencias:** (paper: arxiv:2603.30033)
        examples: [768]
      key_rank:
        type: [integer, "null"]
        default: null
        title: "Tucker Key Rank"
        title_es: "Rango de Key Tucker"
        description: |-
          Tucker rank for the key weight tensor of `tucker`. `null`
          defaults to `hidden_size // 2`. Setting `key_rank = value_rank =
          hidden_size` recovers MHA; setting both to a small latent rank
          recovers MLA.

          **References:** (paper: arxiv:2603.30033)
        description_es: |-
          Rango Tucker para el tensor de pesos de key de `tucker`. `null`
          por defecto es `hidden_size // 2`. Igualar `key_rank = value_rank =
          hidden_size` recupera MHA; igualar ambos a un rango latente pequeño
          recupera MLA.

          **Referencias:** (paper: arxiv:2603.30033)
        examples: [384]
      value_rank:
        type: [integer, "null"]
        default: null
        title: "Tucker Value Rank"
        title_es: "Rango de Value Tucker"
        description: |-
          Tucker rank for the value weight tensor of `tucker`. `null`
          defaults to `hidden_size // 2`. See `tucker_key_rank` for the
          MHA/MLA special cases.

          **References:** (paper: arxiv:2603.30033)
        description_es: |-
          Rango Tucker para el tensor de pesos de value de `tucker`. `null`
          por defecto es `hidden_size // 2`. Ver `tucker_key_rank` para los
          casos especiales MHA/MLA.

          **Referencias:** (paper: arxiv:2603.30033)
        examples: [384]
  iha:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `iha` (Interleaved Head Attention): number of interleaved pseudo-heads per head. Only applies when `iha` appears in `layer_pattern`.
      **References:** (paper: arxiv:2602.21371)
    description_es: |-
      Hiperparámetros para `iha` (Interleaved Head Attention): número de pseudo-cabezas intercaladas por cabeza. Solo aplica cuando `iha` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2602.21371)
    properties:
      num_pseudo_heads:
        type: [integer, "null"]
        default: null
        title: "IHA Pseudo-Heads"
        title_es: "Pseudo-Cabezas IHA"
        description: |-
          Number of pseudo-heads `P` per head for `iha` (Interleaved Head
          Attention (paper: arxiv:2602.21371)). Typically `P = num_heads`. Pseudo
          Q/K/V are learned linear combinations of all `H` original heads,
          inducing up to `P**2` attention patterns per head with modest
          `O(H**2 * P)` parameter overhead. `null` defaults to `num_heads`.

          **References:** (paper: arxiv:2602.21371)
        description_es: |-
          Número de pseudo-cabezas `P` por cabeza para `iha` (Interleaved
          Head Attention (paper: arxiv:2602.21371)). Típicamente `P = num_heads`. Las
          pseudo Q/K/V son combinaciones lineales aprendidas de todas las `H`
          cabezas originales, induciendo hasta `P**2` patrones de atención por
          cabeza con overhead `O(H**2 * P)`. `null` por defecto es `num_heads`.

          **Referencias:** (paper: arxiv:2602.21371)
        examples: [12]
  gta:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `gta` (Grouped-head laTenT Attention): head groups sharing one attention map and the value latent rank. Only applies when `gta` appears in `layer_pattern`.
      **References:** (paper: arxiv:2506.17286)
    description_es: |-
      Hiperparámetros para `gta` (Grouped-head laTenT Attention): grupos de cabezas que comparten un mapa de atención y el rango del latente de valores. Solo aplica cuando `gta` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2506.17286)
    properties:
      num_shared_groups:
        type: [integer, "null"]
        default: null
        title: "GTA Shared Groups"
        title_es: "Grupos Compartidos GTA"
        description: |-
          Number of head groups sharing a single attention map for `gta`
          (Grouped-head laTenT Attention (paper: arxiv:2506.17286)). Must divide
          `num_heads`. `null` defaults to `num_heads // 4`. Smaller values =
          more sharing = smaller key cache.

          **References:** (paper: arxiv:2506.17286)
        description_es: |-
          Número de grupos de cabezas que comparten un único mapa de atención
          para `gta` (Grouped-head laTenT Attention (paper: arxiv:2506.17286)).
          Debe dividir `num_heads`. `null` por defecto es `num_heads // 4`.
          Valores menores = más compartir = menor caché de claves.

          **Referencias:** (paper: arxiv:2506.17286)
        examples: [4]
      value_latent_rank:
        type: [integer, "null"]
        default: null
        title: "GTA Value Latent Rank"
        title_es: "Rango Latente de Value GTA"
        description: |-
          Rank of the value-cache latent for `gta`. The value cache is
          compressed by a down-projection and reconstructed by a non-linear
          (silu) decoder. `null` defaults to `hidden_size // 2`.

          **References:** (paper: arxiv:2506.17286)
        description_es: |-
          Rango del latente del caché de valores para `gta`. El caché de
          valores se comprime con una proyección de bajada y se reconstruye con
          un decodificador no lineal (silu). `null` por defecto es
          `hidden_size // 2`.

          **Referencias:** (paper: arxiv:2506.17286)
        examples: [384]
  mtla:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `mtla` (Multi-head Temporal Latent Attention): feature-axis latent rank plus the temporal KV merge factor and stride. Only applies when `mtla` appears in `layer_pattern`.
      **References:** (paper: arxiv:2505.13544)
    description_es: |-
      Hiperparámetros para `mtla` (Multi-head Temporal Latent Attention): rango latente del eje de características más el factor y el stride de fusión temporal de KV. Solo aplica cuando `mtla` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2505.13544)
    properties:
      latent_rank:
        type: [integer, "null"]
        default: null
        title: "MTLA Latent Rank"
        title_es: "Rango Latente MTLA"
        description: |-
          Latent rank along the feature axis for `mtla` (Multi-head
          Temporal Latent Attention (paper: arxiv:2505.13544)). `null` defaults to
          `hidden_size // 2`.

          **References:** (paper: arxiv:2505.13544)
        description_es: |-
          Rango latente a lo largo del eje de features para `mtla`
          (Multi-head Temporal Latent Attention (paper: arxiv:2505.13544)). `null` por
          defecto es `hidden_size // 2`.

          **Referencias:** (paper: arxiv:2505.13544)
        examples: [384]
      merge_factor:
        type: integer
        title: "MTLA Merge Factor"
        title_es: "Factor de Fusión MTLA"
        description: |-
          Number of consecutive KV cache entries merged into a single
          temporal slot for `mtla`. Shrinks the temporal length by this
          factor. Must be >= 1. Default: 2.

          **References:** (paper: arxiv:2505.13544)
        description_es: |-
          Número de entradas consecutivas del caché KV fusionadas en un único
          slot temporal para `mtla`. Reduce la longitud temporal por este
          factor. Debe ser >= 1. Por defecto: 2.

          **Referencias:** (paper: arxiv:2505.13544)
        examples: [2]
      stride:
        type: [integer, "null"]
        default: null
        title: "MTLA Stride"
        title_es: "Stride MTLA"
        description: |-
          Stride between merged temporal slots for `mtla`. `null`
          defaults to `mtla_merge_factor`. Smaller stride = overlapping
          windows; larger stride = non-overlapping.

          **References:** (paper: arxiv:2505.13544)
        description_es: |-
          Stride entre slots temporales fusionados para `mtla`. `null`
          por defecto es `mtla_merge_factor`. Stride menor = ventanas
          superpuestas; stride mayor = no superpuestas.

          **Referencias:** (paper: arxiv:2505.13544)
        examples: [2]
  gmla:
    type: object
    additionalProperties: false
    description: |-
      Hyperparameters for `gmla` (DeepSeek-style Gated MLA): joint KV latent rank, low-rank query bottleneck, decoupled NoPE/RoPE key widths, value width and the full-rank output gate. Only applies when `gmla` appears in `layer_pattern`.
      **References:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)
    description_es: |-
      Hiperparámetros para `gmla` (Gated MLA estilo DeepSeek): rango del latente KV conjunto, cuello de botella low-rank de queries, anchos NoPE/RoPE desacoplados de claves, ancho de valores y compuerta de salida full-rank. Solo aplica cuando `gmla` aparece en `layer_pattern`.
      **Referencias:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)
    properties:
      latent_rank:
        type: [integer, "null"]
        default: null
        title: "GMLA Latent Rank"
        title_es: "Rango Latente GMLA"
        description: |-
          Rank of the joint key-value latent `c_KV` cached per token. Kimi K3
          uses 512. `null` (default) uses `hidden_size // 2`.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Rango del latente clave-valor conjunto `c_KV` cacheado por token.
          Kimi K3 usa 512. `null` (por defecto) usa `hidden_size // 2`.
          **Referencias:** (paper: arxiv:2607.24653)
        examples: [512]
      q_lora_rank:
        type: [integer, "null"]
        default: null
        title: "GMLA Query LoRA Rank"
        title_es: "Rango LoRA de Queries GMLA"
        description: |-
          Query bottleneck width `W_UQ(W_DQ x)`. Kimi K3 uses 1536. `null`
          (default) skips the low-rank path (a direct query projection).
          **References:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)
        description_es: |-
          Ancho del cuello de botella de queries `W_UQ(W_DQ x)`. Kimi K3 usa
          1536. `null` (por defecto) omite la ruta low-rank (proyección directa).
          **Referencias:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)
        examples: [1536]
      num_heads:
        type: [integer, "null"]
        default: null
        title: "GMLA Number of Heads"
        title_es: "Número de Cabezas GMLA"
        description: |-
          Attention-head count, overriding `dims.num_heads`. Kimi K3 uses 96.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Número de cabezas de atención, sobrescribiendo `dims.num_heads`.
          Kimi K3 usa 96.
          **Referencias:** (paper: arxiv:2607.24653)
        minimum: 1
        examples: [96]
      qk_nope_head_dim:
        type: integer
        default: 128
        title: "GMLA NoPE Head Width"
        title_es: "Ancho de Cabeza NoPE GMLA"
        description: |-
          Width of the non-positional (NoPE) key/query slice per head. Kimi K3
          uses 128.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Ancho de la porción de clave/query no posicional (NoPE) por cabeza.
          Kimi K3 usa 128.
          **Referencias:** (paper: arxiv:2607.24653)
        minimum: 1
        examples: [128]
      qk_rope_head_dim:
        type: integer
        default: 64
        title: "GMLA RoPE Head Width"
        title_es: "Ancho de Cabeza RoPE GMLA"
        description: |-
          Width of the rotary key/query slice per head (unused when
          `use_nope: true`). Kimi K3 uses 64.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Ancho de la porción rotatoria de clave/query por cabeza (sin uso con
          `use_nope: true`). Kimi K3 usa 64.
          **Referencias:** (paper: arxiv:2607.24653)
        minimum: 1
        examples: [64]
      v_head_dim:
        type: integer
        default: 128
        title: "GMLA Value Head Width"
        title_es: "Ancho de Cabeza de Valores GMLA"
        description: |-
          Value width per head. Kimi K3 uses 128.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Ancho de valores por cabeza. Kimi K3 usa 128.
          **Referencias:** (paper: arxiv:2607.24653)
        minimum: 1
        examples: [128]
      use_nope:
        type: boolean
        default: true
        title: "GMLA NoPE"
        title_es: "NoPE GMLA"
        description: |-
          Drop the rotary key/query slice entirely (NoPE). Kimi K3 sets
          `mla_use_nope: true`, so the latent attention is position-independent
          and extrapolates to 1M tokens without RoPE retuning.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Elimina por completo la porción rotatoria de clave/query (NoPE).
          Kimi K3 usa `mla_use_nope: true`, así que la atención latente es
          independiente de la posición y extrapola a 1M de tokens sin reajustar
          RoPE.
          **Referencias:** (paper: arxiv:2607.24653)
        examples: [true]
      use_output_gate:
        type: boolean
        default: true
        title: "GMLA Output Gate"
        title_es: "Compuerta de Salida GMLA"
        description: |-
          Apply the full-rank input-dependent output gate `silu(W_g x)`. Kimi
          K3 enables it.
          **References:** (paper: arxiv:2607.24653)
        description_es: |-
          Aplica la compuerta de salida full-rank dependiente de la entrada
          `silu(W_g x)`. Kimi K3 la activa.
          **Referencias:** (paper: arxiv:2607.24653)
        examples: [true]
