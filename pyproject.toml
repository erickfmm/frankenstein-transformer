[project]
name = "frankenstein-transformer"
version = "1.0.0"
description = "Config-driven, schema-validated training library and CLI for building, training, and deploying hybrid Transformer architectures (attention mixers, BitNet, MoE, SBERT, and Vision Transformers)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Erick Merino", email = "erickfmm@gmail.com" },
]
requires-python = ">=3.9, <3.13"  # CI matrix: 3.10/3.11/3.12; conda env: 3.9

dependencies = [
    "torch>=2.0",                              # unpinned: DashAI/CI bring their own (cpu/cuda) torch
    "transformers>=4.45.0,<5.0.0",             # 4.45+ for current SBERT/ModernBERT examples
    "datasets>=3.0.0",                         # HuggingFace streaming dataset for MLM + SBERT
    "tqdm>=4.66.0",
    "numpy>=1.26.0,<3.0",                      # last 1.x series (still Py 3.9 friendly); transformers caps it
    "psutil>=5.9.0",                           # optional — startup disk-usage log in training main
    "PyYAML>=6.0.1",
]

[project.scripts]
frankenstein-transformer = "src.cli:main"

[project.optional-dependencies]
# For a CPU-only install (CI uses this):    pip install -e ".[cpu]"
cpu = [
    "torch==2.7.0+cpu",
]
# For a CUDA 11.8 install (default, P40 OK): pip install -e ".[cu118]"
cu118 = [
    "torch==2.6.0+cu118",
]
# For CUDA 12.6 (driver >= 560):              pip install -e ".[cu126]"
cu126 = [
    "torch==2.7.0+cu126",
]
# For CUDA 12.8 (driver >= 570):              pip install -e ".[cu128]"
cu128 = [
    "torch==2.7.0+cu128",
]
# Optional capability extras — kept out of core so the DashAI plugin (and the
# CI CPU-only install) don't pull streamlit/sentence-transformers/sentencepiece
# unless the components that need them are used.
# SBERT fine-tuning/inference:                pip install -e ".[sbert]"
sbert = [
    "sentence-transformers>=3.3.0",            # 3.3 unlocks ModernBERT
    "sentencepiece>=0.2.0",                    # Spanish SPM tokenizer (spm_spa_redpajama35)
]
# Streamlit web builder:                      pip install -e ".[web]"
web = [
    "streamlit>=1.39.0",
]
# Full local dev install (union of sbert + web):  pip install -e ".[train]"
train = [
    "sentence-transformers>=3.3.0",
    "sentencepiece>=0.2.0",
    "streamlit>=1.39.0",
]

# Dev/test tooling (uv dependency-groups, PEP 735). Synced by default — no
# extra flag needed: `uv sync --extra cpu` already brings pytest in.
# Run tests: `uv run --extra cpu python -m pytest tests/ -v`
[dependency-groups]
dev = [
    "pytest>=8.0",
]

# PyTorch wheel indexes for the torch extras (`cpu`/`cu118`/`cu126`/`cu128`).
# The core `torch>=2.0` resolves from PyPI; the extras pin specific
# +cpu/+cuXXX wheels that only exist on the PyTorch index, so uv is pointed
# at the matching index per extra via `[tool.uv.sources]`.
[tool.uv]
# The torch-wheel extras (cpu/cu118/cu126/cu128) each pin a mutually-exclusive
# PyTorch index. Declaring them as a conflict group lets uv resolve each in
# isolation instead of erroring with "conflicting indexes in all marker
# environments". Always install exactly ONE, e.g. `uv sync --extra cpu`.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
