name: frankenstein
channels:
  - defaults
dependencies:
  - python>=3.10
  - pip
  - pip:
    # Torch pinned to cu118 (Tesla P40 / driver 12.4 compatible).
    # Override with the matching pyproject extra (.[cu126]/[cu128]/[cpu]) on hosts with newer drivers.
    - torch==2.6.0+cu118
    - transformers>=4.45.0,<5.0.0
    - sentence-transformers>=3.3.0
    - sentencepiece>=0.2.0
    - datasets>=3.0.0
    - tqdm>=4.66.0
    - numpy>=1.26.0,<3.0
    - psutil>=5.9.0
    - PyYAML>=6.0.1
    - streamlit>=1.39.0
