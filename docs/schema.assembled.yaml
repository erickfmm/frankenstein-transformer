      sbert:
        type: object
        title: SBERT Training
        title_es: Entrenamiento SBERT
        description: 'Sentence-BERT training for semantic embedding fine-tuning (when `training.task=sbert`).

          SBERT learns to produce similar embeddings for semantically similar texts via contrastive learning.

          Supports: `paired_similarity`, `triplets`, `qa`. Faster than MLM pre-training; produces models

          for semantic search, clustering, and retrieval.


          **Impact:** SBERT converts the base model into a sentence encoder. The choice of

          dataset type determines the loss function and model behavior.


          **References:** (paper: arxiv:1908.10084)

          '
        description_es: 'Entrenamiento Sentence-BERT para fine-tuning de embeddings semánticos (cuando `training.task=sbert`).

          SBERT aprende a producir embeddings similares para textos semánticamente similares mediante

          aprendizaje contrastivo. Soporta: `paired_similarity`, `triplets`, `qa`. Más rápido que MLM;

          produce modelos para búsqueda semántica, clustering y recuperación.


          **Impacto:** SBERT convierte el modelo base en un codificador de oraciones. La elección del

          dataset type determines the loss function and model behavior.


          **Referencias:** (paper: arxiv:1908.10084)

          '
        additionalProperties: false
        properties:
          dataset_name:
            type: string
            title: Dataset Name
            title_es: Nombre del Dataset
            description: 'HuggingFace dataset ID or local path. Must be compatible with `dataset_type`. Example: `erickfmm/agentlans__multilingual-sentences__paired_10_sts`.

              '
            description_es: 'ID de dataset HuggingFace o ruta local. Debe ser compatible con `dataset_type`. Ejemplo: `erickfmm/agentlans__multilingual-sentences__paired_10_sts`.

              '
            examples:
            - erickfmm/agentlans__multilingual-sentences__paired_10_sts
          dataset_type:
            type: string
            title: Dataset Type
            title_es: Tipo de Dataset
            description: 'Dataset format and training strategy:

              - `paired_similarity`: sentence pairs with similarity scores (STS). Uses CosineSimilarityLoss.

              - `triplets`: anchor-positive-negative (IR). Uses MultipleNegativesRankingLoss.

              - `qa`: question-answer pairs. Optimizes QA embedding similarity.


              **Impact:** Determines the loss function and how data is interpreted.


              **References:** (paper: arxiv:1908.10084) (paper: arxiv:2004.11362)

              '
            description_es: 'Formato de dataset y estrategia de entrenamiento:

              - `paired_similarity`: pares de oraciones con puntajes de similitud (STS). Usa CosineSimilarityLoss.

              - `triplets`: ancla-positivo-negativo (RI). Usa MultipleNegativesRankingLoss.

              - `qa`: pares pregunta-respuesta. Optimiza similitud de embeddings QA.


              **Impacto:** Determina la función de pérdida y cómo se interpretan los datos.


              **Referencias:** (paper: arxiv:1908.10084) (paper: arxiv:2004.11362)

              '
            enum:
            - paired_similarity
            - triplets
            - qa
            examples:
            - paired_similarity
            - triplets
            - qa
          columns:
            type: object
            title: Column Mappings
            title_es: Mapeo de Columnas
            description: 'Optional column name overrides. Maps expected names to actual dataset columns.

              Keys depend on `dataset_type`: `paired_similarity` → sentence1, sentence2, similarity;

              `triplets` → query, positive, negatives; `qa` → question, answer. Case-sensitive.

              '
            description_es: 'Sobrescrituras opcionales de nombres de columna. Mapea nombres esperados a columnas reales.

              Las claves dependen de `dataset_type`: `paired_similarity` → sentence1, sentence2, similarity;

              `triplets` → query, positive, negatives; `qa` → question, answer. Sensible a mayúsculas.

              '
            additionalProperties: false
            properties:
              sentence1:
                type: string
                title: Sentence 1 Column
                title_es: Columna de Oración 1
                description: 'Column name for first sentence in paired_similarity datasets. Default: ''sentence1'' if not specified. Points to the first text column in your dataset. Example: if dataset has ''text_a'', set sentence1=''text_a''. Used for constructing sentence pairs with sentence2.'
                description_es: 'Nombre de la columna para la primera oración en datasets `paired_similarity`. Valor por defecto: `sentence1` si no se especifica. Apunta a la primera columna de texto de tu dataset. Ejemplo: si el dataset tiene `text_a`, configura `sentence1=''text_a''`. Se usa para construir pares de oraciones junto con `sentence2`.'
                examples:
                - sentence1
              sentence2:
                type: string
                title: Sentence 2 Column
                title_es: Columna de Oración 2
                description: 'Column name for second sentence in paired_similarity datasets. Default: ''sentence2'' if not specified. Points to the second text column in your dataset. Example: if dataset has ''text_b'', set sentence2=''text_b''. Used with sentence1 to form pairs for similarity learning.'
                description_es: 'Nombre de la columna para la segunda oración en datasets `paired_similarity`. Valor por defecto: `sentence2` si no se especifica. Apunta a la segunda columna de texto de tu dataset. Ejemplo: si el dataset tiene `text_b`, configura `sentence2=''text_b''`. Se usa junto con `sentence1` para formar pares para aprendizaje de similitud.'
                examples:
                - sentence2
              similarity:
                type: string
                title: Similarity Score Column
                title_es: Columna de Puntaje de Similitud
                description: 'Column name for similarity scores in paired_similarity datasets. Default: ''score'' or ''similarity'' if not specified. Should contain numeric values (typically 0-1 or 0-5 scale). Higher values indicate more similar sentences. Used as regression target in CosineSimilarityLoss. Example: if dataset has ''similarity_score'', set similarity=''similarity_score''.'
                description_es: 'Nombre de la columna para los puntajes de similitud en datasets `paired_similarity`. Valor por defecto: `score` o `similarity` si no se especifica. Debe contener valores numéricos (normalmente en escala 0-1 o 0-5). Los valores más altos indican oraciones más similares. Se usa como objetivo de regresión en `CosineSimilarityLoss`. Ejemplo: si el dataset tiene `similarity_score`, configura `similarity=''similarity_score''`.'
                examples:
                - score
                - similarity
              query:
                type: string
                title: Query/Anchor Column
                title_es: Columna de Consulta/Ancla
                description: 'Column name for query/anchor text in triplets datasets. Default: ''query'' if not specified. This is the reference text (e.g., search query, anchor sentence). Positive and negative examples are compared against this. Example: if dataset has ''anchor'', set query=''anchor''. Used as anchor in MultipleNegativesRankingLoss.'
                description_es: 'Nombre de la columna para el texto de consulta/ancla en datasets `triplets`. Valor por defecto: `query` si no se especifica. Este es el texto de referencia (por ejemplo, consulta de búsqueda u oración ancla). Los ejemplos positivos y negativos se comparan contra este. Ejemplo: si el dataset tiene `anchor`, configura `query=''anchor''`. Se usa como ancla en `MultipleNegativesRankingLoss`.'
                examples:
                - Q
              positive:
                type: string
                title: Positive Example Column
                title_es: Columna de Ejemplo Positivo
                description: 'Column name for positive/matching text in triplets datasets. Default: ''positive'' or ''pos'' if not specified. This text should be semantically similar to the query. Example: if dataset has ''POS'', set positive=''POS''. Used as positive example in contrastive learning.'
                description_es: 'Nombre de la columna para el texto positivo/coincidente en datasets `triplets`. Valor por defecto: `positive` o `pos` si no se especifica. Este texto debe ser semánticamente similar a la consulta. Ejemplo: si el dataset tiene `POS`, configura `positive=''POS''`. Se usa como ejemplo positivo en aprendizaje contrastivo.'
                examples:
                - POS
              negatives:
                type: string
                title: Negatives List Column
                title_es: Columna de Lista de Negativos
                description: 'Column name for list of negative/dissimilar texts in triplets datasets. Default: ''negatives'' or ''neg'' if not specified. Should contain a list or array of texts dissimilar to the query. Example: if dataset has ''NEGs'', set negatives=''NEGs''. Used as hard negatives in contrastive learning to improve model discrimination.'
                description_es: 'Nombre de la columna para la lista de textos negativos/disímiles en datasets `triplets`. Valor por defecto: `negatives` o `neg` si no se especifica. Debe contener una lista o arreglo de textos distintos de la consulta. Ejemplo: si el dataset tiene `NEGs`, configura `negatives=''NEGs''`. Se usa como negativos duros en aprendizaje contrastivo para mejorar la discriminación del modelo.'
                examples:
                - NEGs
              question:
                type: string
                title: Question Column
                title_es: Columna de Pregunta
                description: 'Column name for question text in qa datasets. Default: ''question'' if not specified. The query text to be matched with answers. Example: if dataset has ''Question'', set question=''Question''. Used in QA pair training for semantic similarity.'
                description_es: 'Nombre de la columna para el texto de pregunta en datasets `qa`. Valor por defecto: `question` si no se especifica. Es el texto de consulta que se empareja con las respuestas. Ejemplo: si el dataset tiene `Question`, configura `question=''Question''`. Se usa en entrenamiento de pares QA para similitud semántica.'
                examples:
                - Question
              answer:
                type: string
                title: Answer Column
                title_es: Columna de Respuesta
                description: 'Column name for answer text in qa datasets. Default: ''answer'' if not specified. The response text corresponding to the question. Model learns to bring question and answer embeddings closer. Example: if dataset has ''Answer'', set answer=''Answer''. Used with question for pair training.'
                description_es: 'Nombre de la columna para el texto de respuesta en datasets `qa`. Valor por defecto: `answer` si no se especifica. Es el texto de respuesta correspondiente a la pregunta. El modelo aprende a acercar los embeddings de pregunta y respuesta. Ejemplo: si el dataset tiene `Answer`, configura `answer=''Answer''`. Se usa junto con `question` para entrenamiento por pares.'
                examples:
                - Answer
          query_prefix:
            type: string
            title: Query Prefix
            title_es: Prefijo de Consulta
            description: 'Text prepended to query/question fields during tokenization. Example: `query: `. Helps model distinguish query vs document role.

              '
            description_es: 'Texto antepuesto a campos de consulta/pregunta durante tokenización. Ejemplo: `query: `. Ayuda al modelo a distinguir rol de consulta vs documento.

              '
            examples:
            - 'query: '
          document_prefix:
            type: string
            title: Document Prefix
            title_es: Prefijo de Documento
            description: 'Text prepended to answer/positive/negative fields. Example: `document: `. Helps distinguish document from query embeddings.

              '
            description_es: 'Texto antepuesto a campos de respuesta/positivo/negativo. Ejemplo: `document: `. Ayuda a distinguir embeddings de documento de consulta.

              '
            examples:
            - 'document: '
          output_dir:
            type: string
            title: Output Dir
            title_es: Directorio de Salida
            description: 'Directory for SBERT artifacts. Checkpoints → `output_dir/checkpoints/`. Final model loadable with `SentenceTransformer(output_dir)`.

              '
            description_es: 'Directorio para artefactos SBERT. Checkpoints → `output_dir/checkpoints/`. Modelo final cargable con `SentenceTransformer(output_dir)`.

              '
            examples:
            - ./output/sbert_base_model
          batch_size:
            type: integer
            title: Batch Size
            title_es: Tamaño de Lote
            description: 'Examples per batch. Typical: 16–64. Larger = more negatives, better contrastive learning. Use `gradient_accumulation_steps` to increase effective batch.


              **References:** (paper: arxiv:2004.11362)

              '
            description_es: 'Ejemplos por lote. Típico: 16–64. Mayor = más negativos, mejor aprendizaje contrastivo. Usar `gradient_accumulation_steps` para aumentar lote efectivo.


              **Referencias:** (paper: arxiv:2004.11362)

              '
            examples:
            - 16
          gradient_accumulation_steps:
            type: integer
            title: Gradient Accumulation Steps
            title_es: Pasos de Acumulación de Gradientes
            description: 'Accumulate over N mini-batches. Effective batch = `batch_size × N`. Typical: 1–8. SBERT benefits from larger effective batches.

              '
            description_es: 'Acumular sobre N mini-lotes. Lote efectivo = `batch_size × N`. Típico: 1–8. SBERT se beneficia de lotes efectivos más grandes.

              '
            examples:
            - 1
            - 4
          grad_clip_max_norm:
            type: number
            title: Max Gradient Norm
            title_es: Norma Máx de Gradiente
            description: 'Gradient clipping threshold for SBERT. Typical: 0.5–2.0 (often lower than MLM due to contrastive loss sensitivity). 0 = disabled.


              **References:** (paper: arxiv:1905.11881)

              '
            description_es: 'Umbral de recorte de gradiente para SBERT. Típico: 0.5–2.0 (a menudo menor que MLM por sensibilidad de pérdida contrastiva). 0 = deshabilitado.


              **Referencias:** (paper: arxiv:1905.11881)

              '
            examples:
            - 1.0
          num_epochs:
            type: integer
            title: Epochs
            title_es: Épocas
            description: 'Complete passes through SBERT dataset. Typical: 1–10. SBERT converges faster than MLM (2–5 often enough). Monitor validation metrics.

              '
            description_es: 'Pasadas completas por dataset SBERT. Típico: 1–10. SBERT converge más rápido que MLM (2–5 suele ser suficiente). Monitorear métricas de validación.

              '
            examples:
            - 4
          warmup_steps:
            type: integer
            title: Warmup Steps
            title_es: Pasos de Calentamiento
            description: 'Steps for LR warmup in SBERT. Typical: 10–20% of total steps. Formula: `int(epochs × (dataset_size/batch_size) × warmup_ratio)`.


              **References:** (paper: arxiv:1908.03265)

              '
            description_es: 'Pasos para calentamiento de LR en SBERT. Típico: 10–20% del total. Fórmula: `int(epochs × (dataset_size/batch_size) × warmup_ratio)`.


              **Referencias:** (paper: arxiv:1908.03265)

              '
            examples:
            - 1000
          evaluation_steps:
            type: integer
            title: Evaluation Steps
            title_es: Pasos de Evaluación
            description: 'Evaluate every N steps. Typical: 500–5000. More frequent = better checkpointing, slower training.

              '
            description_es: 'Evaluar cada N pasos. Típico: 500–5000. Más frecuente = mejor checkpointing, entrenamiento más lento.

              '
            examples:
            - 5000
          checkpoint_save_steps:
            type: integer
            title: Checkpoint Save Interval
            title_es: Intervalo de Guardado de Checkpoint
            description: 'Save rolling checkpoint every N steps. Typical: 1000–10000. 0 = disabled (only best checkpoints).

              '
            description_es: 'Guardar checkpoint rodante cada N pasos. Típico: 1000–10000. 0 = deshabilitado (solo mejores checkpoints).

              '
            examples:
            - 1000
          resume_from_checkpoint:
            type:
            - string
            - 'null'
            title: Resume from Checkpoint
            title_es: Reanudar desde Checkpoint
            description: 'Resume SBERT training. `auto` resumes from the latest checkpoint in

              `output_dir/checkpoints/`; `null` starts from scratch. The current SBERT

              trainer only supports the latest-checkpoint form, so any non-null value

              behaves like `auto`.

              '
            description_es: 'Reanuda el entrenamiento SBERT. `auto` reanuda desde el último checkpoint

              en `output_dir/checkpoints/`; `null` empieza desde cero. El trainer SBERT

              actual solo soporta la forma de último checkpoint, así que cualquier

              valor no nulo se comporta como `auto`.

              '
            default: null
            examples:
            - auto
            - null
          learning_rate:
            type: number
            title: Learning Rate
            title_es: Tasa de Aprendizaje
            description: 'Initial LR for SBERT. Typical: 1e-5 to 1e-4. Fine-tuning: 1e-5–2e-5; from scratch: 5e-5–1e-4. 2e-5 works well for fine-tuning.

              '
            description_es: 'LR inicial para SBERT. Típico: 1e-5 a 1e-4. Fine-tuning: 1e-5–2e-5; desde cero: 5e-5–1e-4. 2e-5 funciona bien para fine-tuning.

              '
            examples:
            - 2.0e-05
          max_train_samples:
            type:
            - integer
            - 'null'
            title: Max Training Samples
            title_es: Máx Muestras de Entrenamiento
            description: 'Limit training to N samples. Useful for debugging or quick experiments. Training set only.

              '
            description_es: 'Limitar entrenamiento a N muestras. Útil para debugging o experimentos rápidos. Solo conjunto de entrenamiento.

              '
            examples:
            - 100000
          max_eval_samples:
            type:
            - integer
            - 'null'
            title: Max Eval Samples
            title_es: Máx Muestras de Evaluación
            description: 'Limit evaluation to N samples. Typical: 1000–10000. Speeds up eval with large validation sets.

              '
            description_es: 'Limitar evaluación a N muestras. Típico: 1000–10000. Acelera eval con conjuntos de validación grandes.

              '
            examples:
            - 10000
          max_length:
            type:
            - integer
            - 'null'
            title: Max Sequence Length
            title_es: Longitud Máx de Secuencia
            description: 'Max token length for input texts. Typical: 128–512. SBERT often works with shorter sequences (128–256) than MLM. For retrieval: 256–512; classification: 128.


              **References:** (paper: arxiv:1908.10084)

              '
            description_es: 'Longitud máxima de tokens para textos de entrada. Típico: 128–512. SBERT suele funcionar con secuencias más cortas (128–256) que MLM. Para recuperación: 256–512; clasificación: 128.


              **Referencias:** (paper: arxiv:1908.10084)

              '
            examples:
            - 512
          pooling_mode:
            type: string
            title: Pooling Mode
            title_es: Modo de Pooling
            description: 'Token aggregation into sentence embedding:

              - `mean`: average all tokens — **recommended**, most stable.

              - `cls`: CLS token only (BERT-style, less stable).

              - `max`: max-pooling across tokens (salient features).


              **Impact:** `mean` is the most common and robust option. `cls` for classification-style tasks.


              **References:** (paper: arxiv:1908.10084)

              '
            description_es: 'Agregación de tokens en embedding de oración:

              - `mean`: promedio de todos los tokens — **recomendado**, más estable.

              - `cls`: solo token CLS (estilo BERT, menos estable).

              - `max`: max-pooling entre tokens (características salientes).


              **Impacto:** `mean` es la opción más común y robusta. `cls` para tareas estilo clasificación.


              **Referencias:** (paper: arxiv:1908.10084)

              '
            enum:
            - mean
            - cls
            - max
            examples:
            - mean
          trust_remote_code:
            type: boolean
            title: Trust Remote Code
            title_es: Confiar en Código Remoto
            description: 'Allow custom code from model repo. Required for some custom models. Security risk for untrusted sources.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Permitir código personalizado del repo del modelo. Requerido para algunos modelos custom. Riesgo de seguridad para fuentes no confiables.


              **Referencias:** (paper: arxiv:1910.03771)

              '
            examples:
            - false
          use_amp:
            type: boolean
            title: Use AMP
            title_es: Usar Precisión Mixta
            description: 'Enable FP16 mixed precision for SBERT. ~50% less memory, faster on Tensor Core GPUs. Recommended.

              '
            description_es: 'Habilitar precisión mixta FP16 para SBERT. ~50% menos memoria, más rápido en GPUs Tensor Core. Recomendado.

              '
            examples:
            - true
          resample_balanced:
            type: boolean
            title: Resample Balanced
            title_es: Remuestreo Balanceado
            description: 'Resample to balanced distribution over similarity scores. Useful for imbalanced paired_similarity datasets. May duplicate/discard data.


              **References:** (paper: arxiv:1908.10084)

              '
            description_es: 'Remuestrear a distribución balanceada sobre puntajes de similitud. Útil para datasets paired_similarity desbalanceados. Puede duplicar/descartar datos.


              **Referencias:** (paper: arxiv:1908.10084)

              '
            examples:
            - true
          standardize_scores:
            type: boolean
            title: Standardize Scores
            title_es: Estandarizar Puntajes
            description: 'Z-score normalize similarity scores (mean=0, std=`resample_std`). Alternative to `resample_balanced`. Preserves all data.


              **References:** (paper: arxiv:1908.10084)

              '
            description_es: 'Normalizar puntajes de similitud con z-score (media=0, std=`resample_std`). Alternativa a `resample_balanced`. Preserva todos los datos.


              **Referencias:** (paper: arxiv:1908.10084)

              '
            examples:
            - false
          resample_std:
            type: number
            title: Resample Std Dev
            title_es: Desviación Estándar de Remuestreo
            description: 'Target std dev when `standardize_scores=true`. Typical: 0.2–0.5. Formula: `(score - mean) / resample_std`.


              **References:** (paper: arxiv:1908.10084)

              '
            description_es: 'Desviación estándar objetivo cuando `standardize_scores=true`. Típico: 0.2–0.5. Fórmula: `(score - mean) / resample_std`.


              **Referencias:** (paper: arxiv:1908.10084)

              '
            examples:
            - 0.3
          optimizer:
            type: object
            title: SBERT Optimizer
            title_es: Optimizador SBERT
            description: 'Custom optimizer for SBERT. Overrides default sentence-transformers AdamW when specified.

              Uses the same classes as MLM training. If omitted, default AdamW is used.


              **Impact:** Only specify if a different optimizer than standard AdamW is needed.


              **References:** (paper: arxiv:1711.05101)

              '
            description_es: 'Optimizador personalizado para SBERT. Anula el AdamW por defecto de sentence-transformers

              cuando se especifica. Usa las mismas clases que entrenamiento MLM. Si se omite, se usa AdamW por defecto.


              **Impacto:** Solo especificar si se necesita un optimizador diferente al AdamW estándar.


              **Referencias:** (paper: arxiv:1711.05101)

              '
            additionalProperties: false
            required:
            - optimizer_class
            properties:
              optimizer_class:
                type: string
                title: Optimizer Class
                title_es: Clase de Optimizador
                description: 'Optimizer algorithm. Summary by use case:


                  | Optimizer | Use Case | Notes |

                  |-----------|----------|-------|

                  | `adamw` | General purpose **(recommended)** | Decoupled weight decay, stable |

                  | `adam_pm` | Memory-constrained training | Pooled second moment: group size `s` shrinks the V-state to 1/s, Adam hyperparameters transfer (paper: arxiv:2610.24598) |

                  | `sgd` | Pure SGD baseline | Mini-batch update, no momentum, zero optimizer state (source: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

                  | `sgd_momentum` | Baselines, classic tasks | Simple, less adaptive |

                  | `rmsprop` | Classical adaptive baseline | Divides the gradient by a running average of its recent squared magnitude; one state buffer, no bias correction (source: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

                  | `adafactor` | Large models, low memory | Memory-efficient factored moments |

                  | `galore_adamw` | Memory-constrained large models | Gradient low-rank projection |

                  | `prodigy` | Minimal LR tuning | Adaptive, auto-LR |

                  | `lion` | Memory-efficient | Sign-based updates, reduced state |

                  | `sophia` | Robust training | Hessian-aware with diagonal preconditioning |

                  | `muon` | Stable training | Newton-Schulz orthogonalization for hidden matrices; AdamW fallback for embeddings, pos, heads and non-matrix params |

                  | `turbo_muon` | Faster muon | AOL-preconditioned orthogonalization for hidden matrices; AdamW fallback for embeddings, pos, heads and non-matrix params |

                  | `af_muon` | AdamW-free tied-vocab models | Spectral matrices + capped-row LMO table + RMS vectors |

                  | `ada_muon` | Adaptive orthogonal updates | Element-wise second moment on orthogonalized directions + sign stabilization + RMS-aligned scaling (paper: arxiv:2507.11005) |

                  | `radam` | Adaptive warmup | Rectified Adam, automatic warmup |

                  | `adan` | Nesterov-accelerated | Adaptive with Nesterov, 3 buffers |

                  | `adopt` | Momentum-based | Decoupled gradient/variance, optimal convergence |

                  | `ademamix` | Dual-EMA mixing | Combines fast/slow momentum for data efficiency |

                  | `mars_adamw` | Variance reduction | Recursive momentum correction (SVRG-style) |

                  | `cautious_adamw` | Gradient masking | Masks conflicted gradient dimensions |

                  | `lamb` | Large batch training | LARS-style layer-wise adaptive |

                  | `schedulefree_adamw` | No LR schedule needed | Eliminates scheduler tuning |

                  | `shampoo` | Second-order | Kronecker-factored preconditioners |

                  | `soap` | Second-order + Adam | Adam in Shampoo eigenbasis |

                  | `anon` | Tunable adaptivity | gamma parameter (paper: arxiv:2605.02317) |

                  | `apollo` | Low-rank scaling | Projected gradient scaling (SGD-like memory) |

                  | `apollo_mini` | Rank-1 APOLLO | Tensor-wise scaled, extreme memory savings |

                  | `q_apollo` | Quantized APOLLO | Quantized optimizer states |

                  | `dion3` | Faster orthogonal updates | Fractional Gram-Newton-Schulz Muon with error feedback (paper: arxiv:2608.11612) |

                  | `eve` | Fast proxy training, search loops | Population-of-4 differential evolution with targeted Adam fallback; monotone best-so-far; needs its own LR search (paper: arxiv:2609.35614) |

                  | `ea4llm` | Gradient-free training, memory-constrained regimes | Zeroth-order evolution strategies on the token-level log-likelihood fitness; Gaussian perturbations with z-score/rank shaping; no optimizer state, N forward evaluations per step (paper: arxiv:2510.10603) |

                  | `root` | Robust orthogonal updates | Dimension-calibrated Newton-Schulz coefficients + soft-threshold outlier suppression on the momentum; AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2511.20626) |

                  | `muon2` | Adaptive orthogonal updates | Adam-style second-moment preconditioning of the momentum before Newton-Schulz; 40% fewer NS iterations; optional factored moments (Muon²-F); AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2604.09967) |

                  | `nor_muon` | Balanced neuron updates | Neuron-wise (row) second-moment normalization after Newton-Schulz; Muon memory + m scalars; Adam-RMS-aligned update (paper: arxiv:2510.05491) |

                  | `conda` | Spectral + coordinate-wise adaptive pretraining | Adam update inside the SVD subspace of the first moment; second moment of *projected* gradients (column-wise adaptive); lazy SVD every `update_proj_gap` steps; AdamW fallback for non-matrix params (paper: arxiv:2509.24218) |

                  | `tuon` | Cross-layer orthogonal updates | Tensor-aware Muon: stacks same-shape hidden matrices per group, mixes them with a unitary layer transform (DecorQ from the layer Gram matrix, refreshed every `refresh_interval` steps), polarizes each slice with Newton-Schulz, inverts the transform and rescales the stack to RMS 1/√max(m,n); K=1 reduces to `muon`; AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2610.35130) |

                  | `namo` | Noise-adaptive orthogonal updates | Norm-based Adam-type adaptive stepsize α_t on Muon''s orthogonalized momentum: a scalar second-moment EMA of the squared Frobenius gradient norm rescales the whole orthogonal update (zero extra memory); AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2602.17080) |

                  | `namo_d` | Noise-adaptive orthogonal updates (diagonal) | Diagonal extension of `namo`: a neuron-wise (column) second-moment EMA gives clamped per-column stepsizes that right-multiply the orthogonalized momentum (one extra ℝⁿ vector per matrix); AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2602.17080) |


                  **Examples explained:**

                  - `adamw`: Start here. Most reliable for transformer training. Works well with default hyperparameters (lr=2e-4, betas=[0.9,0.95], wd=0.01). Best general-purpose choice.

                  - `sgd_momentum`: Use for baselines or when you need maximum simplicity and reproducibility. Usually needs higher LR (1e-2 to 1e-1) and careful momentum tuning.

                  - `galore_adamw` or `apollo`: Use when training >1B param models with limited GPU memory. Reduces optimizer memory by projecting to low-rank subspace. Slight quality tradeoff for significant memory savings.

                  - `prodigy`: Use when you don''t want to tune learning rate. Automatically adapts step size. Good for quick experiments or when hyperparameter search is impractical.

                  - `schedulefree_adamw`: Use when you want to eliminate LR scheduler tuning. The optimizer handles scheduling internally. Simplifies training pipeline.


                  **References:** `adamw` (paper: arxiv:1711.05101); `sgd_momentum` (paper:

                  https://doi.org/10.1016/0041-5553(64)90137-5); `adafactor` (paper: arxiv:1804.04235); `galore_adamw`

                  (paper: arxiv:2403.03507); `prodigy` (paper: arxiv:2306.06101); `lion` (paper: arxiv:2302.06675);

                  `sophia` (paper: arxiv:2305.14342); `muon` (paper: arxiv:2505.23737) (paper:

                  https://openreview.net/forum?id=yRtgZ1K8hO); `turbo_muon` (paper: arxiv:2512.04632); `af_muon`

                  (paper: arxiv:2610.01395); `ada_muon` (paper: arxiv:2507.11005); `radam` (paper: arxiv:1908.03265);

                  `adan` (paper: arxiv:2208.06677); `adopt` (paper: arxiv:2411.02853); `ademamix` (paper:

                  arxiv:2409.03137); `mars_adamw` (paper: arxiv:2411.10438); `cautious_adamw` (paper:

                  arxiv:2411.16085); `lamb` (paper: arxiv:1904.00962); `schedulefree_adamw` (paper: arxiv:2405.15682);

                  `shampoo` (paper: arxiv:1802.09568); `soap` (paper: arxiv:2409.11321); `anon` (paper:

                  arxiv:2605.02317); `apollo`/`apollo_mini`/`q_apollo` (paper: arxiv:2412.05270); `dion3` (paper:

                  arxiv:2608.11612); `eve` (paper: arxiv:2609.35614); `ea4llm` (paper: arxiv:2510.10603);

                  `root` (paper: arxiv:2511.20626); `muon2` (paper: arxiv:2604.09967); `adam_pm` (paper:

                  arxiv:2610.24598); `nor_muon` (paper: arxiv:2510.05491); `conda` (paper: arxiv:2509.24218);

                  `tuon` (paper: arxiv:2610.35130); `namo`/`namo_d` (paper: arxiv:2602.17080); `sgd`/`rmsprop` (paper: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf)'
                description_es: 'Algoritmo optimizador. Resumen por caso de uso:


                  | Optimizador | Caso de Uso | Notas |

                  |-------------|-------------|-------|

                  | `adamw` | Propósito general **(recomendado)** | Weight decay desacoplado, estable |

                  | `adam_pm` | Entrenamiento con memoria limitada | Segundo momento agrupado: el tamaño de grupo `s` reduce el estado V a 1/s, los hiperparámetros de Adam se transfieren (paper: arxiv:2610.24598) |

                  | `sgd` | Línea base SGD pura | Actualización por mini-lotes, sin momentum, sin estado del optimizador (fuente: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

                  | `sgd_momentum` | Líneas base, tareas clásicas | Simple, menos adaptativo |

                  | `rmsprop` | Línea base adaptativa clásica | Divide el gradiente por un promedio móvil de su magnitud cuadrada reciente; un búfer de estado, sin corrección de sesgo (fuente: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

                  | `adafactor` | Modelos grandes, baja memoria | Eficiente en memoria |

                  | `galore_adamw` | Modelos grandes con memoria limitada | Proyección de gradiente de bajo rango |

                  | `prodigy` | Mínimo ajuste de LR | Adaptativo, LR automático |

                  | `lion` | Eficiencia de memoria | Actualizaciones basadas en signo |

                  | `sophia` | Entrenamiento robusto | Consciente del Hessiano |

                  | `muon` | Entrenamiento estable | Ortogonalización Newton-Schulz para matrices ocultas; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales |

                  | `turbo_muon` | Muon acelerado | Ortogonalización precondicionada con AOL para matrices ocultas; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales |

                  | `af_muon` | Modelos con vocabulario atado sin AdamW | Matrices espectrales + LMO por fila con tope + vectores RMS |

                  | `ada_muon` | Actualizaciones ortogonales adaptativas | Segundo momento por elemento sobre direcciones ortogonalizadas + estabilización por signo + escalado alineado por RMS (paper: arxiv:2507.11005) |

                  | `radam` | Warmup adaptativo | Rectified Adam |

                  | `adan` | Acelerado con Nesterov | Adaptativo con Nesterov |

                  | `adopt` | Basado en momentum | Momentum adaptativo con convergencia óptima |

                  | `ademamix` | Mezcla de momentos | Combina EMAs de corto y largo plazo |

                  | `mars_adamw` | Regularizado con MARS | Reducción de varianza |

                  | `cautious_adamw` | Enmascaramiento de gradientes | Enmascara gradientes conflictivos |

                  | `lamb` | Entrenamiento con lotes grandes | Escalado por capa estilo LARS |

                  | `schedulefree_adamw` | Sin scheduler de LR | Elimina ajuste de scheduler |

                  | `shampoo` | Segundo orden | Gradientes precondicionados |

                  | `soap` | Optimización dispersa | Segundo orden eficiente en memoria |

                  | `anon` | Adaptividad ajustable | Parámetro gamma (paper: arxiv:2605.02317) |

                  | `apollo` | Escalado de bajo rango | Escalado de gradiente proyectado |

                  | `apollo_mini` | APOLLO rango-1 | Proyección mínima tensorial |

                  | `q_apollo` | APOLLO cuantizado | Estados cuantizados |

                  | `dion3` | Ortogonalización acelerada | Muon fraccional con Gram-Newton-Schulz y retroalimentación de error (paper: arxiv:2608.11612) |

                  | `eve` | Entrenamiento proxy rápido, bucles de búsqueda | Evolución diferencial con población de 4 y respaldo Adam dirigido; mejor-observado monótono; requiere su propia búsqueda de LR (paper: arxiv:2609.35614) |

                  | `ea4llm` | Entrenamiento sin gradientes, regímenes con memoria limitada | Estrategias evolutivas de orden cero sobre la aptitud de log-verosimilitud por token; perturbaciones gaussianas con z-score/shaping por rangos; sin estado del optimizador, N evaluaciones forward por paso (paper: arxiv:2510.10603) |

                  | `root` | Ortogonalización robusta | Coeficientes Newton-Schulz calibrados por dimensión + supresión de atípicos por soft-threshold sobre el momentum; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2511.20626) |

                  | `muon2` | Ortogonalización adaptativa | Precondicionamiento del momentum con segundo momento estilo Adam antes de Newton-Schulz; 40% menos iteraciones NS; momentos factorizados opcionales (Muon²-F); respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2604.09967) |

                  | `nor_muon` | Actualizaciones por neurona equilibradas | Normalización por segundo momento de fila (neurona) tras Newton-Schulz; memoria de Muon + m escalares; actualización alineada al RMS de Adam (paper: arxiv:2510.05491) |

                  | `conda` | Preentrenamiento espectral + adaptativo por coordenada | Actualización de Adam dentro del subespacio SVD del primer momento; segundo momento de gradientes *proyectadas* (adaptativo por columna); SVD perezoso cada `update_proj_gap` pasos; respaldo AdamW para parámetros no matriciales (paper: arxiv:2509.24218) |

                  | `tuon` | Actualizaciones ortogonales entre capas | Muon consciente de tensores: apila matrices ocultas de la misma forma por grupo, las mezcla con una transformación unitaria de capas (DecorQ desde la matriz de Gram de capas, refrescada cada `refresh_interval` pasos), polariza cada slice con Newton-Schulz, invierte la transformación y reescala la pila a RMS 1/√max(m,n); K=1 reduce a `muon`; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2610.35130) |

                  | `namo` | Actualizaciones ortogonales adaptativas al ruido | Paso adaptativo estilo Adam basado en normas sobre el momentum ortogonalizado de Muon: una EMA escalar del segundo momento de la norma de Frobenius al cuadrado del gradiente reescala toda la actualización ortogonal (sin memoria extra); respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2602.17080) |

                  | `namo_d` | Actualizaciones ortogonales adaptativas al ruido (diagonal) | Extensión diagonal de `namo`: una EMA por neurona (columna) del segundo momento produce pasos por columna acotados que multiplican por la derecha el momentum ortogonalizado (un vector ℝⁿ extra por matriz); respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2602.17080) |

                  **Ejemplos explicados:**

                  - `adamw`: Empezar aquí. El más confiable para entrenamiento de transformers. Funciona bien con hiperparámetros por defecto (lr=2e-4, betas=[0.9,0.95], wd=0.01). Mejor opción de propósito general.

                  - `sgd_momentum`: Usar para líneas base o cuando se necesita máxima simplicidad y reproducibilidad. Generalmente requiere LR más alto (1e-2 a 1e-1) y ajuste cuidadoso de momentum.

                  - `galore_adamw` o `apollo`: Usar al entrenar modelos >1B params con memoria GPU limitada. Reduce memoria del optimizador proyectando a subespacio de bajo rango. Ligero compromiso de calidad para ahorro significativo de memoria.

                  - `prodigy`: Usar cuando no se quiere ajustar el learning rate. Adapta automáticamente el tamaño de paso. Bueno para experimentos rápidos o cuando la búsqueda de hiperparámetros es impráctica.

                  - `schedulefree_adamw`: Usar cuando se quiere eliminar el ajuste de scheduler de LR. El optimizador maneja el scheduling internamente. Simplifica el pipeline de entrenamiento.

                  - `lamb`: Usar para entrenamiento con lotes muy grandes (efectivos > 1024). Escala adaptativamente por capa para mantener estabilidad.

                  - `shampoo` o `soap`: Usar cuando se necesita optimización de segundo orden para tareas que se benefician de precondicionamiento de curvatura. Mayor costo computacional por paso pero potencialmente mejor convergencia.


                  **Referencias:** `adamw` (paper: arxiv:1711.05101); `sgd_momentum` (paper:

                  https://doi.org/10.1016/0041-5553(64)90137-5); `adafactor` (paper: arxiv:1804.04235); `galore_adamw`

                  (paper: arxiv:2403.03507); `prodigy` (paper: arxiv:2306.06101); `lion` (paper: arxiv:2302.06675);

                  `sophia` (paper: arxiv:2305.14342); `muon` (paper: arxiv:2505.23737) (paper:

                  https://openreview.net/forum?id=yRtgZ1K8hO); `turbo_muon` (paper: arxiv:2512.04632); `af_muon`

                  (paper: arxiv:2610.01395); `ada_muon` (paper: arxiv:2507.11005); `radam` (paper: arxiv:1908.03265);

                  `adan` (paper: arxiv:2208.06677); `adopt` (paper: arxiv:2411.02853); `ademamix` (paper:

                  arxiv:2409.03137); `mars_adamw` (paper: arxiv:2411.10438); `cautious_adamw` (paper:

                  arxiv:2411.16085); `lamb` (paper: arxiv:1904.00962); `schedulefree_adamw` (paper: arxiv:2405.15682);

                  `shampoo` (paper: arxiv:1802.09568); `soap` (paper: arxiv:2409.11321); `anon` (paper:

                  arxiv:2605.02317); `apollo`/`apollo_mini`/`q_apollo` (paper: arxiv:2412.05270); `dion3` (paper:

                  arxiv:2608.11612); `eve` (paper: arxiv:2609.35614); `ea4llm` (paper: arxiv:2510.10603);

                  `root` (paper: arxiv:2511.20626); `muon2` (paper: arxiv:2604.09967); `adam_pm` (paper:

                  arxiv:2610.24598); `nor_muon` (paper: arxiv:2510.05491); `conda` (paper: arxiv:2509.24218);

                  `tuon` (paper: arxiv:2610.35130); `namo`/`namo_d` (paper: arxiv:2602.17080); `sgd`/`rmsprop` (paper: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf)'
                examples:
                - adamw
                enum:
                - ada_muon
                - adafactor
                - adam_pm
                - adamw
