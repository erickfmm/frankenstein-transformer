            title_es: Conmutador PE por Mixer
            description: 'Per-mixer boolean flags to enable/disable the model-wide positional encoding

              for specific mixers. Keys are `<mixer>_use_pe` (e.g. `standard_use_pe`)

              and are injected from the mixer registry; the defaults come from each

              mixer''s `needs_pos_encoder` spec flag. Defaults: True for attention mixers,

              False for recurrent/decay mixers (retnet, mamba, ode, gla, deltanet,

              gated_deltanet, gated_deltanet2, hgrn2, fox, fpa, kda, mtla, falcon*) and

              for `lsa` (Native-LSA trains without positional encoding). Override to

              force PE on/off per mixer. `ssog` is a positional-field mixer; it defaults

              to True and the flag is documented for completeness.'
