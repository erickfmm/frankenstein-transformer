              optimizer_kwargs:
                type: object
                title: Optimizer Kwargs
                title_es: Parámetros del Optimizador
                description: 'Optimizer-specific hyperparameters passed to the optimizer constructor. Each optimizer supports different parameters. Common parameters: lr (learning rate, overridden by learning_rate field), momentum (for SGD/muon/turbo_muon/af_muon/ada_muon/dion3/root/nor_muon/tuon), betas (for namo/namo_d: the (mu1, mu2) momenta of the norm-based adaptive scaling, default [0.95, 0.99]), nesterov (for muon/turbo_muon/af_muon/root), ns_steps (Nesterov-spectral steps for muon/turbo_muon/af_muon/ada_muon/dion3/root/muon2/nor_muon/tuon/namo/namo_d), ns_eps (Nesterov-spectral epsilon for muon/turbo_muon/af_muon/ada_muon/dion3/root/muon2/nor_muon/tuon/namo/namo_d), factored (Adafactor-style factored second moment for muon2), fraction (row-selection fraction for dion3), normuon (row-wise second-moment flavor for dion3), quantile (dynamic soft-threshold percentile for root), softthresh (soft-threshold outlier suppression toggle for root), ada_newton (per-shape Newton-Schulz coefficients
                  toggle for root), vector_lr/tied_cap/tied_scale/rho_hidden/rho_output/chunk_rows/bisection_steps/max_bracket_steps (for af_muon), cautious_clip (for cautious_adamw), rho/update_k (for sophia), d_coef (for prodigy), rank/update_proj_gap (for galore_adamw), beta2_decay/clip_threshold/eps1/eps2 (for adafactor), group_size/pool_dim (for adam_pm: second-moment pooling group size and row/col direction), update_proj_gap/scale/correct_bias (for conda: subspace refresh period T, update scale factor, bias-correction toggle). For tuon, refresh_interval/rms_eps/transform/stack select the DecorQ basis refresh period, the stack-RMS epsilon, the layer transform (decorq|dct|haar|dft) and the stacking mode (full|pairs); the shared per-group betas/eps configure only its AdamW fallback and wd stays decoupled. For ada_muon the shared per-group eps is the variance-normalization epsilon (default 1e-8). For nor_muon the shared per-group betas[1] is the neuron-wise second-moment decay and the
                  shared eps its row-normalization epsilon (defaults 0.95 / 1e-8). For conda the paper''s betas are (0.9, 0.99) and the shared per-group eps is the projected-denominator epsilon. For namo the global betas are (mu1, mu2) and the shared per-group eps is the adaptive-stepsize denominator epsilon, while the shared per-group betas/eps configure only the AdamW fallback and the shared wd is decoupled and scaled by alpha_t. For namo_d the same momenta feed per-column second moments, clamp (default 0.1) bounds the diagonal stepsizes, the shared eps and wd behave as in namo (wd is right-multiplied by the diagonal), and the shared betas/eps configure the AdamW fallback. Parameters are passed as key-value pairs. **References:** (paper: arxiv:1711.05101)'
                description_es: 'Hiperparámetros específicos del optimizador que se pasan al constructor del optimizador. Cada optimizador soporta parámetros distintos. Parámetros comunes: `lr` (tasa de aprendizaje, sobrescrita por el campo `learning_rate`), `momentum` (para `sgd_momentum`/`muon`/`turbo_muon`/`af_muon`/`ada_muon`/`dion3`/`root`/`nor_muon`/`tuon`), `betas` (para `namo`/`namo_d`: los momenta (mu1, mu2) del escalado adaptativo basado en normas, por defecto [0.95, 0.99]), `nesterov` (para `muon`/`turbo_muon`/`af_muon`/`root`), `ns_steps` (pasos espectrales de Nesterov para `muon`/`turbo_muon`/`af_muon`/`ada_muon`/`dion3`/`root`/`muon2`/`nor_muon`/`tuon`/`namo`/`namo_d`), `ns_eps` (epsilon espectral de Nesterov para `muon`/`turbo_muon`/`af_muon`/`ada_muon`/`dion3`/`root`/`muon2`/`nor_muon`/`tuon`/`namo`/`namo_d`), `factored` (segundo momento factorizado estilo Adafactor para `muon2`), `fraction` (fracción de filas seleccionadas para `dion3`), `normuon` (variante con segundo momento
                  por fila para `dion3`), `quantile` (percentil del umbral dinámico de soft-threshold para `root`), `softthresh` (interruptor de supresión de atípicos por soft-threshold para `root`), `ada_newton` (interruptor de coeficientes Newton-Schulz por forma para `root`), `vector_lr`/`tied_cap`/`tied_scale`/`rho_hidden`/`rho_output`/`chunk_rows`/`bisection_steps`/`max_bracket_steps` (para `af_muon`), `cautious_clip` (para `cautious_adamw`), `rho`/`update_k` (para `sophia`), `d_coef` (para `prodigy`), `rank`/`update_proj_gap` (para `galore_adamw`), `beta2_decay`/`clip_threshold`/`eps1`/`eps2` (para `adafactor`), `group_size`/`pool_dim` (para `adam_pm`: tamaño de grupo y dirección fila/columna del pooling del segundo momento), `update_proj_gap`/`scale`/`correct_bias` (para `conda`: periodo de refresco del subespacio T, factor de escala de la actualización, interruptor de corrección de sesgo). Para `tuon`, `refresh_interval`/`rms_eps`/`transform`/`stack` seleccionan el periodo de refresco
                  de la base DecorQ, el épsilon del RMS de la pila, la transformada de capas (`decorq|dct|haar|dft`) y el modo de apilamiento (`full|pairs`); los `betas`/`eps` por grupo compartidos configuran solo su respaldo AdamW y `wd` permanece desacoplado. Para `ada_muon`, el `eps` por grupo compartido es el épsilon de normalización por varianza (por defecto 1e-8). Para `nor_muon`, el `betas[1]` por grupo compartido es el decaimiento del segundo momento por neurona y el `eps` compartido su épsilon de normalización por fila (por defecto 0.95 / 1e-8). Para `conda`, los betas del paper son (0.9, 0.99) y el `eps` por grupo compartido es el épsilon del denominador proyectado. Para `namo`, los `betas` globales son (mu1, mu2) y el `eps` por grupo compartido es el épsilon del denominador del paso adaptativo, mientras que los `betas`/`eps` por grupo compartidos configuran solo el respaldo AdamW y el `wd` compartido es desacoplado y escalado por alpha_t. Para `namo_d`, los mismos momenta alimentan
                  segundos momentos por columna, `clamp` (por defecto 0.1) acota los pasos diagonales, y el `eps`/`wd` compartidos se comportan como en `namo` (el `wd` se multiplica por la derecha por la diagonal) y los `betas`/`eps` compartidos configuran el respaldo AdamW. Los parámetros se pasan como pares clave-valor. **Referencias:** (paper: arxiv:1711.05101)'
                additionalProperties: true
                minProperties: 0
                examples:
                - momentum: 0.95
                  nesterov: true
                  ns_steps: 4
                  ns_eps: 1.0e-07
          wandb_project:
            type: string
            title: Weights & Biases Project Name
            title_es: Nombre del Proyecto de Weights & Biases
            description: 'Custom project name for Weights & Biases telemetry tracking. When specified, training metrics and artifacts are logged to this W&B project. Useful for organizing experiments, comparing runs, and sharing results. If not specified, W&B logging may use a default project name or be disabled depending on environment configuration. Example: ''sbert-spanish-finetuning'' for Spanish SBERT experiments.'
            description_es: 'Nombre de proyecto personalizado para el seguimiento de telemetría en Weights & Biases. Cuando se especifica, las métricas y artefactos de entrenamiento se registran en este proyecto de W&B. Es útil para organizar experimentos, comparar ejecuciones y compartir resultados. Si no se especifica, el registro en W&B puede usar un nombre de proyecto por defecto o deshabilitarse según la configuración del entorno. Ejemplo: `sbert-spanish-finetuning` para experimentos de fine-tuning SBERT en español.'
            examples:
            - sbert-spanish-finetuning
            - mrbert-es-sbert-continual
      asr:
        type: object
        title: ASR Training Override
        title_es: Anulación de Entrenamiento ASR
        description: 'Optional ASR training overrides for `training.task: asr`. These values are

          applied on top of the model-side `audio:` block before the model is built,

          so they select the head that the trainer will use.


          `loss` overrides `audio.asr_loss`: `ctc` builds the Connectionist Temporal

          Classification projection, `transducer` builds the RNN-Transducer prediction

          and joint networks (paper: arxiv:1211.3711). The value must match the head the

          checkpoint was trained with; leaving it unset keeps `audio.asr_loss`

          (`ctc` by default).


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Anulaciones opcionales de entrenamiento ASR para `training.task: asr`. Estos

          valores se aplican sobre el bloque `audio:` del modelo antes de construir el

          modelo, por lo que seleccionan la cabeza que usará el entrenador.


          `loss` anula `audio.asr_loss`: `ctc` construye la proyección de

          Connectionist Temporal Classification, `transducer` construye las redes de

          predicción y conjunta del RNN-Transducer (paper: arxiv:1211.3711). El valor debe

          coincidir con la cabeza con la que se entrenó el checkpoint; si se omite se

          conserva `audio.asr_loss` (`ctc` por defecto).


          **Referencias:** (paper: arxiv:2005.08100)'
        additionalProperties: false
        properties:
          loss:
            type: string
            title: ASR Loss
            title_es: Pérdida ASR
            description: 'ASR objective. `ctc` = Connectionist Temporal Classification over the

              encoder frames. `transducer` = RNN-Transducer with an LSTM prediction

              network and a joint network. Overrides `audio.asr_loss`; it must match

              the head that is built.


              **References:** (paper: https://doi.org/10.1145/1143844.1143891) (paper: arxiv:1211.3711)'
            description_es: 'Objetivo ASR. `ctc` = Connectionist Temporal Classification sobre las

              tramas del encoder. `transducer` = RNN-Transducer con una red de

              predicción LSTM y una red conjunta. Anula `audio.asr_loss`; debe coincidir

              con la cabeza que se construye.


              **Referencias:** (paper: https://doi.org/10.1145/1143844.1143891) (paper: arxiv:1211.3711)'
            enum:
            - ctc
            - transducer
            examples:
            - ctc
            - transducer
      classification:
        type: object
        title: Image Classification Task Configuration
        title_es: Configuración de Tarea Classification
        description: 'Task-specific configuration for `training.task: classification` (image

          classification ). The model predicts a multiclass Y

          objective via a classification head (Linear or MLP) applied to the pooled

          image representation ([CLS] token or GAP).


          General training fields (batch_size, num_epochs, optimizer, scheduler,

          gradient clipping, checkpointing, etc.) are read from the top-level

          `training:` block — the same fields used by `mlm` and `causal_lm` tasks.

          This sub-block only carries classification-specific knobs.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Configuración específica de tarea para `training.task: classification`

          (clasificación de imágenes).


          Los campos generales de entrenamiento (batch_size, num_epochs, optimizer,

          scheduler, gradient clipping, checkpointing, etc.) se leen del bloque

          top-level `training:` — los mismos campos usados por `mlm` y `causal_lm`.

          Este sub-bloque solo contiene parámetros específicos de clasificación.


          **Referencias:** (paper: arxiv:2010.11929)'
        additionalProperties: false
        properties:
          label_smoothing:
            type: number
            minimum: 0
            maximum: 1
            title: Label Smoothing
            title_es: Suavizado de Etiquetas
            description: Label smoothing factor for the classification cross-entropy loss. 0.0 disables smoothing (hard labels); 0.1 is a common default for image classification. Applied only to the classification head loss.
            description_es: Factor de suavizado de etiquetas para la pérdida de cross-entropy de clasificación. 0.0 deshabilita el suavizado (etiquetas duras); 0.1 es un valor por defecto común para clasificación de imágenes. Se aplica solo a la pérdida de la cabeza de clasificación.
            default: 0
      segmentation:
        type: object
        title: Image Segmentation Task Configuration
        title_es: Configuración de Tarea Segmentation
        description: 'Task-specific configuration for `training.task: segmentation` (image

          segmentation). Supports per-pixel linear head (`seg_head_type: pixel`)

          for 1D grayscale or multicolor non-overlapping segmentation, or EoMT

          query-based head (`seg_head_type: eomt` ) with Hungarian

          matching, BCE+Dice+CE loss, and mask annealing.


          General training fields (batch_size, num_epochs, optimizer, scheduler,

          gradient clipping, checkpointing, etc.) are read from the top-level

          `training:` block — the same fields used by `mlm` and `causal_lm` tasks.

          This sub-block only carries segmentation-specific loss/annealing knobs.


          **References:** (paper: arxiv:2503.19108)'
        description_es: 'Configuración específica de tarea para `training.task: segmentation`

          (segmentación de imágenes).


          Los campos generales de entrenamiento (batch_size, num_epochs, optimizer,

          scheduler, gradient clipping, checkpointing, etc.) se leen del bloque

          top-level `training:` — los mismos campos usados por `mlm` y `causal_lm`.

          Este sub-bloque solo contiene parámetros específicos de pérdida/annealing

          de segmentación.


          **Referencias:** (paper: arxiv:2503.19108)'
        additionalProperties: false
        properties:
          seg_loss_bce_weight:
            type: number
            minimum: 0
            title: BCE Loss Weight
            title_es: Peso de Pérdida BCE
            description: 'Weight for binary cross-entropy mask loss (EoMT). Paper default: 5.0. **References:** (paper: arxiv:2503.19108)'
            description_es: 'Peso para la pérdida BCE de máscara (EoMT). **Referencias:** (paper: arxiv:2503.19108)'
            default: 5
          seg_loss_dice_weight:
            type: number
            minimum: 0
            title: Dice Loss Weight
            title_es: Peso de Pérdida Dice
            description: 'Weight for Dice mask loss (EoMT). Paper default: 5.0. **References:** (paper: arxiv:2503.19108)'
            description_es: 'Peso para la pérdida Dice de máscara (EoMT). **Referencias:** (paper: arxiv:2503.19108)'
            default: 5
          seg_loss_ce_weight:
            type: number
            minimum: 0
            title: CE Loss Weight
            title_es: Peso de Pérdida CE
            description: 'Weight for cross-entropy class loss (EoMT). Paper default: 2.0. **References:** (paper: arxiv:2503.19108)'
            description_es: 'Peso para la pérdida CE de clase (EoMT). **Referencias:** (paper: arxiv:2503.19108)'
            default: 2
          mask_annealing_factor:
            type: number
            exclusiveMinimum: 0
            title: Mask Annealing Factor
            title_es: Factor de Recocido de Máscara
            description: 'Polynomial decay factor for mask annealing (EoMT). Paper default: 0.9. **References:** (paper: arxiv:2503.19108)'
            description_es: 'Factor de decaimiento polinomial para recocido de máscara (EoMT). **Referencias:** (paper: arxiv:2503.19108)'
            default: 0.9
