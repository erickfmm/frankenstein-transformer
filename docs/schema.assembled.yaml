$schema: https://json-schema.org/draft/2020-12/schema
$id: training-config.schema.json
title: Training Config Schema
title_es: Esquema de Configuración de Entrenamiento
type: object
additionalProperties: false
required:
- training
properties:
  base_model:
    type: string
    title: Base Model
    title_es: Modelo Base
    description: 'HuggingFace model identifier or local path for continual pretraining or SBERT fine-tuning.

      When specified, an existing pre-trained model is used instead of building from scratch. This enables

      transfer learning from models like ModernBERT, BERT, RoBERTa, etc. The model architecture is loaded

      automatically from the provided path/id. When `base_model` is set, `model_class` and `model` are not

      required (the architecture is inferred from the checkpoint).


      **Impact:** Using a base model drastically accelerates convergence and reduces data requirements.

      The model inherits the vocabulary and tokenizer from the original checkpoint.


      **References:** (paper: arxiv:1910.03771)

      '
    description_es: 'Identificador de modelo de HuggingFace o ruta local para preentrenamiento continuo o fine-tuning SBERT.

      Cuando se especifica, se usa un modelo preentrenado existente en lugar de construir uno desde cero. Esto

      permite el aprendizaje por transferencia desde modelos como ModernBERT, BERT, RoBERTa, etc. La arquitectura

      del modelo se carga automáticamente desde la ruta/id proporcionada. Cuando `base_model` está configurado,

      `model_class` y `model` no son obligatorios (la arquitectura se infiere del checkpoint).


      **Impacto:** Usar un modelo base acelera drásticamente la convergencia y reduce los datos necesarios.

      El modelo hereda el vocabulario y tokenizador del checkpoint original.


      **Referencias:** (paper: arxiv:1910.03771)

      '
    examples:
    - answerdotai/ModernBERT-base
    - /path/to/local/model
  tokenizer:
    type: object
    title: Tokenizer Settings
    title_es: Configuración del Tokenizador
    description: "Configuration for the tokenizer used by NLP training tasks (`mlm`, `causal_lm`,\n`text_classification`). Available to BOTH the `base_model` path (continual\npretraining / fine-tuning) and the custom from-scratch model path. Controls\nhow raw text is tokenized into input IDs consumable by the model.\n\nTwo modes are selected via `source`:\n\n- `hf_repo` (default): load a pretrained tokenizer from a HuggingFace repo id\n  or local path via `AutoTokenizer.from_pretrained()`. Requires `name_or_path`.\n- `train_from_dataset`: train a NEW tokenizer from the dataset text using the\n  `tokenizers` library (algorithm selected in the `training` sub-object). The\n  resulting vocabulary size is injected into `model.dims.vocab_size` before\n  model construction, so the embedding matrix always matches the tokenizer.\n\nWhen `base_model` is used with the `mlm` task the tokenizer is required\n(either mode). For custom models the legacy SentencePiece path remains as a\nfallback when the\
      \ whole `tokenizer` block is omitted.\n\n**Impact:** An incorrect tokenizer (one that doesn't match the base model) produces meaningless\nembeddings and unrecoverable loss. Always verify that `name_or_path` matches the base model.\n\n**References:** (paper: arxiv:1910.03771)\n"
    description_es: "Configuración del tokenizador usado por las tareas de entrenamiento NLP (`mlm`,\n`causal_lm`, `text_classification`). Disponible tanto para la ruta `base_model`\n(preentrenamiento continuo / ajuste fino) como para la ruta de modelo personalizado\ndesde cero. Controla cómo el texto crudo se convierte en IDs de entrada consumibles\npor el modelo.\n\nDos modos se seleccionan mediante `source`:\n\n- `hf_repo` (por defecto): carga un tokenizador preentrenado desde un id de repo\n  de HuggingFace o ruta local vía `AutoTokenizer.from_pretrained()`. Requiere `name_or_path`.\n- `train_from_dataset`: entrena un tokenizador NUEVO desde el texto del dataset\n  con la biblioteca `tokenizers` (algoritmo seleccionado en el sub-objeto `training`).\n  El tamaño de vocabulario resultante se inyecta en `model.dims.vocab_size` antes de\n  construir el modelo, de modo que la matriz de embedding siempre coincide con el tokenizador.\n\nCuando se usa `base_model` con la tarea `mlm` el tokenizador\
      \ es obligatorio\n(en cualquiera de los dos modos). Para modelos personalizados, la ruta legacy de\nSentencePiece permanece como fallback cuando el bloque `tokenizer` se omite por completo.\n\n**Impacto:** Un tokenizador incorrecto (que no coincida con el del modelo base) produce embeddings\nsin sentido y pérdida irrecuperable. Siempre verificar que `name_or_path` coincida con el modelo base.\n\n**Referencias:** (paper: arxiv:1910.03771)\n"
    additionalProperties: false
    properties:
      source:
        type: string
        enum:
        - hf_repo
        - train_from_dataset
        title: Tokenizer Source
        title_es: Fuente del Tokenizador
        description: "Tokenizer source mode:\n\n- `hf_repo` (default): load a pretrained tokenizer from `name_or_path`\n  (HuggingFace repo id or local path).\n- `train_from_dataset`: train a NEW tokenizer from the dataset text\n  (see the `training` sub-object). The trained vocabulary size is\n  injected into `model.dims.vocab_size` before model construction.\n\nWhen `train_from_dataset` is selected, `name_or_path` must be omitted.\n\n**References:** (paper: arxiv:1910.03771)\n"
        description_es: "Modo de fuente del tokenizador:\n\n- `hf_repo` (por defecto): carga un tokenizador preentrenado desde `name_or_path`\n  (id de repo de HuggingFace o ruta local).\n- `train_from_dataset`: entrena un tokenizador NUEVO desde el texto del dataset\n  (ver el sub-objeto `training`). El tamaño de vocabulario entrenado se inyecta\n  en `model.dims.vocab_size` antes de construir el modelo.\n\nCuando se selecciona `train_from_dataset`, `name_or_path` debe omitirse.\n\n**Referencias:** (paper: arxiv:1910.03771)\n"
        examples:
        - hf_repo
        default: hf_repo
      training:
        type: object
        title: Tokenizer Training
        title_es: Entrenamiento del Tokenizador
        description: 'Sub-object configuring tokenizer training from a dataset. Required when

          `source: train_from_dataset`; ignored otherwise. Uses the HuggingFace

          `tokenizers` library trainers (BPE, WordPiece, WordLevel, Unigram).


          **References:** (paper: arxiv:1910.03771)

          '
        description_es: 'Sub-objeto que configura el entrenamiento del tokenizador desde un dataset.

          Obligatorio cuando `source: train_from_dataset`; ignorado en otro caso.

          Usa los trainers de la biblioteca `tokenizers` de HuggingFace

          (BPE, WordPiece, WordLevel, Unigram).


          **Referencias:** (paper: arxiv:1910.03771)

          '
        additionalProperties: false
        properties:
          algorithm:
            type: string
            enum:
            - bpe
            - wordpiece
            - wordlevel
            - unigram
            title: Tokenizer Algorithm
            title_es: Algoritmo del Tokenizador
            description: "Tokenizer training algorithm:\n\n- `bpe` (default): Byte Pair Encoding (GPT-2 style). Recommended general choice.\n- `wordpiece`: WordPiece (original BERT style). Good for MLM with\n  `[CLS]/[SEP]/[MASK]` special tokens.\n- `wordlevel`: simple word-level tokenization (small vocabularies).\n- `unigram`: subword language model (SentencePiece-style); `vocab_size`\n  is optional (prunes automatically).\n\n**References:** (paper: arxiv:1910.03771)\n"
            description_es: "Algoritmo de entrenamiento del tokenizador:\n\n- `bpe` (por defecto): Byte Pair Encoding (estilo GPT-2). Elección general recomendada.\n- `wordpiece`: WordPiece (estilo BERT original). Bueno para MLM con tokens\n  especiales `[CLS]/[SEP]/[MASK]`.\n- `wordlevel`: tokenización a nivel de palabra (vocabularios pequeños).\n- `unigram`: sub-palabras estilo SentencePiece; `vocab_size` es opcional\n  (poda automáticamente).\n\n**Referencias:** (paper: arxiv:1910.03771)\n"
            examples:
            - bpe
            default: bpe
          vocab_size:
            type: integer
            title: Tokenizer Vocab Size
            title_es: Tamaño de Vocabulario
            description: 'Target vocabulary size. Required for `bpe`, `wordpiece` and `wordlevel`;

              optional for `unigram` (which prunes automatically). The trained tokenizer''s

              actual vocabulary size (`len(tokenizer)`) is injected into

              `model.dims.vocab_size` so the embedding matrix matches.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Tamaño de vocabulario objetivo. Obligatorio para `bpe`, `wordpiece` y

              `wordlevel`; opcional para `unigram` (que poda automáticamente). El tamaño

              real (`len(tokenizer)`) se inyecta en `model.dims.vocab_size` para que la

              matriz de embedding coincida.


              **Referencias:** (paper: arxiv:1910.03771)

              '
            minimum: 1
            examples:
            - 8000
          min_frequency:
            type: integer
            title: Min Frequency
            title_es: Frecuencia Mínima
            description: 'Minimum frequency (count) for a token/subword to be included in the vocabulary.

              Higher values produce smaller, cleaner vocabularies.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Frecuencia mínima (conteo) para que un token/sub-palabra entre al vocabulario.

              Valores altos producen vocabularios más pequeños y limpios.


              **Referencias:** (paper: arxiv:1910.03771)

              '
            minimum: 1
            default: 2
          special_tokens:
            type: array
            items:
              description: 'A special token string (e.g. `[MASK]`, `[SEP]`, `[CLS]`). For MLM training the BERT token set is expected.

                **References:** (paper: arxiv:1810.04805)'
              description_es: 'Una cadena de token especial (p. ej. `[MASK]`, `[SEP]`, `[CLS]`). Para entrenamiento MLM se espera el conjunto de tokens de BERT.

                **Referencias:** (paper: arxiv:1810.04805)'
              type: string
            title: Special Tokens
            title_es: Tokens Especiales
            description: 'Special tokens registered in the trained tokenizer. For MLM training with a

              custom model, include `[MASK]` (BERT-style masking). Defaults to the standard

              BERT set when omitted.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Tokens especiales registrados en el tokenizador entrenado. Para entrenamiento

              MLM con modelo personalizado, incluir `[MASK]` (enmascarado estilo BERT).

              Por defecto se usa el conjunto estándar BERT.


              **Referencias:** (paper: arxiv:1910.03771)

              '
            default:
            - '[PAD]'
            - '[UNK]'
            - '[CLS]'
            - '[SEP]'
            - '[MASK]'
          save_dir:
            type: string
            title: Save Directory
            title_es: Directorio de Guardado
            description: 'Directory where the trained tokenizer is persisted via `save_pretrained()`.

              The checkpoint loader automatically reloads from the checkpoint''s

              `tokenizer/` subdirectory, so this is mainly useful to reuse the tokenizer

              for inference or to inspect the vocabulary.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Directorio donde se persiste el tokenizador entrenado vía `save_pretrained()`.

              El cargador de checkpoints recarga automáticamente desde el subdirectorio

              `tokenizer/`, así que esto es útil para reutilizar el tokenizador en inferencia

              o inspeccionar el vocabulario.


              **Referencias:** (paper: arxiv:1910.03771)

              '
          lowercase:
            type: boolean
            title: Lowercase
            title_es: Minúsculas
            description: 'Lowercase all text before training (BERT-uncased style). Recommended when

              the corpus is mixed-case and vocabulary efficiency matters.


              **References:** (paper: arxiv:1810.04805)

              '
            description_es: 'Convertir todo el texto a minúsculas antes de entrenar (estilo BERT-uncased).

              Recomendado cuando el corpus mezcla mayúsculas y se busca eficiencia de vocabulario.


              **Referencias:** (paper: arxiv:1810.04805)

              '
            default: false
          strip_accents:
            type: boolean
            title: Strip Accents
            title_es: Quitar Acentos
            description: 'Strip diacritical accents (e.g. `á -> a`) before training. Common for

              multilingual or accented corpora to reduce vocabulary size.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Quitar signos diacríticos (p.ej. `á -> a`) antes de entrenar. Común para

              corpus multilingües o acentuados para reducir el vocabulario.


              **Referencias:** (paper: arxiv:1910.03771)

              '
            default: false
          pre_tokenizer:
            type: string
            enum:
            - whitespace
            - bytelevel
            - bert
            title: Pre-Tokenizer
            title_es: Pre-Tokenizador
            description: "Pre-tokenization strategy:\n\n- `whitespace` (default): split on whitespace and punctuation (GPT-2 style).\n- `bytelevel`: byte-level BPE splitting (GPT-2 exact); enables byte fallback.\n- `bert`: BERT-style pre-tokenizer (whitespace + punctuation splitting,\n  pairs with `lowercase: true` for classic uncased BERT behavior).\n\n**References:** (paper: arxiv:1910.03771)\n"
            description_es: "Estrategia de pre-tokenización:\n\n- `whitespace` (por defecto): divide por espacios y puntuación (estilo GPT-2).\n- `bytelevel`: división byte-level BPE (GPT-2 exacto); habilita byte fallback.\n- `bert`: pre-tokenizador estilo BERT (espacios + puntuación; emparejar con\n  `lowercase: true` para el comportamiento BERT-uncased).\n\n**Referencias:** (paper: arxiv:1910.03771)\n"
            default: whitespace
          max_token_length:
            type: integer
            title: Max Token Length
            title_es: Longitud Máxima de Token
            description: 'Optional cap on individual token length in characters (0 = no limit).

              Protects against degenerate very-long tokens on noisy corpora.


              **References:** (paper: arxiv:1910.03771)

              '
            description_es: 'Límite opcional de longitud de token en caracteres (0 = sin límite).

              Protege contra tokens degenerados muy largos en corpora ruidosos.


              **Referencias:** (paper: arxiv:1910.03771)

              '
            minimum: 0
            default: 0
      name_or_path:
        type: string
        title: Tokenizer Path
        title_es: Ruta del Tokenizador
        description: 'HuggingFace tokenizer identifier or local path passed to `AutoTokenizer.from_pretrained()`.

          Required when `source: hf_repo` (the default). Must match the tokenizer used to

          train the `base_model`. The tokenizer determines the vocabulary

          and tokenization strategy used during training.


          **Impact:** Si no coincide con el modelo base, los IDs de tokens no corresponderán a las

          embeddings correctas, resultando en un modelo inutilizable.


          **References:** (paper: arxiv:1910.03771)

          '
        description_es: 'Identificador de tokenizador de HuggingFace o ruta local pasado a `AutoTokenizer.from_pretrained()`.

          Obligatorio cuando `source: hf_repo` (el valor por defecto). Debe coincidir con el

          tokenizador usado para entrenar `base_model`. El tokenizador determina el

          vocabulario y la estrategia de tokenización durante el entrenamiento.


          **Impacto:** Si no coincide con el modelo base, los IDs de tokens no corresponderán a las

          embeddings correctas, resultando en un modelo inutilizable.


          **Referencias:** (paper: arxiv:1910.03771)

          '
        examples:
        - answerdotai/ModernBERT-base
      use_fast:
        type: boolean
        title: Use Fast Tokenizer
        title_es: Usar Tokenizador Rápido
        description: 'Enable Rust-based fast tokenizer implementation for significantly faster tokenization

          (5-10x vs Python). Recommended for training. Some custom tokenizers may not support it.


          **Impact:** `true` reduce el tiempo de preprocesamiento drásticamente. Usar `false` solo

          si el tokenizador no soporta la versión rápida o si hay problemas de compatibilidad.


          **References:** (paper: arxiv:1910.03771)

          '
        description_es: 'Habilita la implementación rápida del tokenizador basada en Rust para una tokenización

          significativamente más rápida (5-10x vs Python). Recomendado para entrenamiento. Algunos

          tokenizadores personalizados pueden no soportarlo.


          **Impacto:** `true` reduce el tiempo de preprocesamiento drásticamente. Usar `false` solo

          si el tokenizador no soporta la versión rápida o si hay problemas de compatibilidad.


          **Referencias:** (paper: arxiv:1910.03771)

          '
        examples:
        - true
      trust_remote_code:
        type: boolean
        title: Trust Remote Code
        title_es: Confiar en Código Remoto
        description: 'Allow execution of custom code from the model/tokenizer repository. Required for some

          models with custom tokenization logic (e.g., T5, FLAN-T5). **Security risk for untrusted sources.**


          **Impact:** `false` es seguro pero puede causar errores con modelos que requieren código custom.

          Solo activar con modelos de fuentes verificadas (HuggingFace oficial, repos propios).


          **References:** (paper: arxiv:1910.03771)

          '
        description_es: 'Permite la ejecución de código personalizado desde el repositorio del modelo/tokenizador.

          Necesario para algunos modelos con lógica de tokenización personalizada (ej. T5, FLAN-T5).

          **Riesgo de seguridad para fuentes no confiables.**


          **Impacto:** `false` es seguro pero puede causar errores con modelos que requieren código custom.

          Solo activar con modelos de fuentes verificadas (HuggingFace oficial, repos propios).


          **Referencias:** (paper: arxiv:1910.03771)

          '
        examples:
        - false
  model_class:
    type: string
    title: Model Class
    title_es: Clase de Modelo
    description: 'Model architecture variant to instantiate. Determines which model implementation class is used.

      - `frankenstein_text_encoder`: mixed-architecture text encoder with various attention mechanisms (standard, sigmoid, retentive, state-space, sparse, and gated mixers), MoE (Mixture of Experts), and advanced features. Optimized for bidirectional encoder-style training with masked language modeling (MLM).

      - `frankenstein_text_decoder`: autoregressive causal text decoder for LLM-style next-token generation. **Automatically forces `mode: decoder`** at runtime. Enables causal masking for text generation tasks.

      - `frankenstein_vit`: Vision Transformer (paper: arxiv:2010.11929). Splits images into fixed-size patches, linearly embeds each patch, adds positional embeddings, and processes the resulting sequence through the mixed-attention HybridLayer stack. Supports three tasks: `patch_prediction` (masked patch prediction / autosupervised pre-training), `classification` (image classification), and `segmentation` (per-pixel or EoMT-style image segmentation (paper: arxiv:2503.19108)). **Requires the `image:` top-level block** for patch/image/task-specific configuration and the `vision_dataset:` block for data loading. Automatically forces `mode: encoder` at runtime.

      - `frankenstein_audio`: Conformer-ready audio/signal encoder (paper: arxiv:2005.08100). Replaces the token embedding with a waveform frontend (log-mel filterbanks, log-power spectrogram or raw multichannel 1-D signals) followed by convolutional subsampling, then processes the frames through the mixed-attention HybridLayer stack. Supports `asr` (CTC projection or RNN-Transducer (paper: arxiv:1211.3711)) and `audio_classification` heads; `feature: raw` also covers generic multichannel signals such as EEG, EMG and accelerometer traces for classification. **Requires the `audio:` top-level block** for frontend/head configuration and the `audio_dataset:` block for data loading. Automatically forces `mode: encoder` at runtime.


      **Examples explained:**

      - `frankenstein_text_encoder`: Use when you need a full-featured text encoder with mixed attention mechanisms, MoE, and advanced normalization. Best for MLM pre-training with large datasets where architectural flexibility matters. Supports all mixer types in `layer_pattern`.

      - `frankenstein_text_decoder`: Use for autoregressive text generation tasks (GPT-style). The system forces `mode=decoder` automatically. Supports causal attention where each token only attends to previous tokens.

      - `frankenstein_audio`: Use for speech recognition or audio/sensor classification. Pair `layer_pattern: [conformer]` with `audio.feature: logmel` for the paper''s recipe, or `audio.feature: raw` to classify multichannel 1-D signals directly.


      **References:** (paper: arxiv:1810.04805) (paper: arxiv:1706.03762) (paper: arxiv:2010.11929)

      (paper: arxiv:2503.19108) (paper: arxiv:2005.08100)'
    description_es: 'Variante de arquitectura del modelo a instanciar. Determina qué clase de implementación se usa.

      - `frankenstein_text_encoder`: encoder de texto de arquitectura mixta con varios mecanismos de atención (estándar, sigmoide, retentiva, espacio de estados, dispersa y con compuertas), MoE (Mixture of Experts) y características avanzadas. Optimizado para entrenamiento bidireccional estilo encoder con masked language modeling (MLM).

      - `frankenstein_text_decoder`: decoder de texto causal autorregresivo para generación de siguiente token estilo LLM. **Fuerza automáticamente `mode: decoder`** en tiempo de ejecución. Habilita enmascaramiento causal para tareas de generación de texto.

      - `frankenstein_vit`: Vision Transformer (paper: arxiv:2010.11929). Divide imágenes en parches de tamaño fijo, embebe cada parche linealmente, añade embeddings posicionales y procesa la secuencia resultante a través del stack de HybridLayers con atención mixta. Soporta tres tareas: `patch_prediction` (predicción de parches enmascarados / preentrenamiento autosupervisado), `classification` (clasificación de imágenes), y `segmentation` (segmentación por-pixel o estilo EoMT (paper: arxiv:2503.19108)). **Requiere el bloque top-level `image:`** para configuración de parches/imagen/tarea y el bloque `vision_dataset:` para carga de datos. Fuerza automáticamente `mode: encoder` en tiempo de ejecución.

      - `frankenstein_audio`: encoder de audio/señales listo para Conformer (paper: arxiv:2005.08100). Reemplaza el embedding de tokens por un frontend de forma de onda (filtros log-mel, espectrograma de potencia logarítmica o señales 1-D multicanal crudas) seguido de submuestreo convolucional, y luego procesa las tramas a través del stack de HybridLayers con atención mixta. Soporta cabezas `asr` (proyección CTC o RNN-Transducer (paper: arxiv:1211.3711)) y `audio_classification`; `feature: raw` también cubre señales multicanal genéricas como EEG, EMG y trazas de acelerómetro para clasificación. **Requiere el bloque top-level `audio:`** para configuración del frontend/cabeza y el bloque `audio_dataset:` para carga de datos. Fuerza automáticamente `mode: encoder` en tiempo de ejecución.


      **Ejemplos explicados:**

      - `frankenstein_text_encoder`: Usar cuando se necesita un encoder de texto completo con mecanismos de atención mixtos, MoE y normalización avanzada. Ideal para preentrenamiento MLM con datasets grandes donde importa la flexibilidad arquitectónica. Soporta todos los tipos de mixer en `layer_pattern`.

      - `frankenstein_text_decoder`: Usar para tareas de generación de texto autorregresivas (tipo GPT). El sistema fuerza `mode=decoder` automáticamente. Soporta atención causal donde cada token solo atiende a tokens previos.

      - `frankenstein_audio`: Usar para reconocimiento de habla o clasificación de audio/señales. Combina `layer_pattern: [conformer]` con `audio.feature: logmel` para la receta del paper, o `audio.feature: raw` para clasificar señales 1-D multicanal directamente.


      **Referencias:** (paper: arxiv:1810.04805) (paper: arxiv:1706.03762) (paper: arxiv:2010.11929)

      (paper: arxiv:2503.19108) (paper: arxiv:2005.08100)'
    enum:
    - frankenstein_text_encoder
    - frankenstein_text_decoder
    - frankenstein_vit
    - frankenstein_audio
    examples:
    - frankenstein_text_encoder
    - frankenstein_text_decoder
    - frankenstein_vit
    - frankenstein_audio
  model:
    type: object
    description: 'FrankensteinModelConfig model parameters. All architectural hyperparameters that define the model''s

      structure, capacity, and behavior. Required when building a model from scratch (i.e., when

      `base_model` is not set). Organized into hierarchical sub-objects: `dims` (core dimensions

      and layer pattern), `norm` (normalization), `embedding` (factorized embeddings and conv),

      `attention` (per-mixer configuration), `moe`, `bitnet`, `mixture_of_depths`, `ssmax`,

      `numerics` (fixed softmax / cross-entropy), `ffn` (feed-forward), and

      `classification_head` — plus `mhc` and `residuals`.


      **Examples explained:**

      - Typical BERT-base style: `dims.hidden_size=768, dims.num_layers=12, dims.num_heads=12, ffn.hidden_size=3072` — ~110M params, good starting point for MLM pre-training.

      - Memory-efficient: `embedding.factorized.enabled=true, embedding.factorized.dim=128, moe.enabled=false` — reduces embedding params ~4.5× for large vocabularies.

      - Experimental hybrid: `dims.layer_pattern: [retnet, titan, mamba, standard, ode]` — mixes recurrent, attention, state-space, and continuous-depth layers for diverse representation learning.


      **References:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805)'
    description_es: 'Parámetros FrankensteinModelConfig del modelo. Todos los hiperparámetros arquitectónicos que definen

      la estructura, capacidad y comportamiento del modelo. Obligatorio al construir un modelo desde

      cero (cuando `base_model` no está configurado). Organizado en sub-objetos jerárquicos: `dims`

      (dimensiones núcleo y patrón de capas), `norm` (normalización), `embedding` (embeddings

      factorizados y conv), `attention` (configuración por mixer), `moe`, `bitnet`,

      `mixture_of_depths`, `ssmax`, `numerics` (softmax / cross-entropy corregidos), `ffn`

      (feed-forward) y `classification_head` — además de `mhc` y `residuals`.


      **Ejemplos explicados:**

      - Estilo BERT-base típico: `dims.hidden_size=768, dims.num_layers=12, dims.num_heads=12, ffn.hidden_size=3072` — ~110M params, buen punto de partida para preentrenamiento MLM.

      - Eficiente en memoria: `embedding.factorized.enabled=true, embedding.factorized.dim=128, moe.enabled=false` — reduce params de embedding ~4.5× para vocabularios grandes.

      - Híbrido experimental: `dims.layer_pattern: [retnet, titan, mamba, standard, ode]` — mezcla capas recurrentes, de atención, de espacio de estados y de profundidad continua para aprendizaje de representaciones diverso.


      **Referencias:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805)'
    additionalProperties: false
    required:
    - dims
    properties:
      dims:
        type: object
        additionalProperties: false
        properties:
          vocab_size:
            type: integer
            minimum: 0
            title: Vocabulary Size
            title_es: Tamaño de Vocabulario
            description: 'Number of unique tokens in the model''s vocabulary. Must match the tokenizer''s vocab size.

              Typical values: 30k–100k. Larger vocabularies improve language coverage but increase embedding

              parameters (`vocab_size × hidden_size`).


              **Examples explained:**

              - `vocab_size=30000`: Common for English-only models (BERT). Smaller vocab = fewer embedding params, faster lookup. May struggle with rare words or multilingual text.

              - `vocab_size=50000`: Multilingual BERT-style. Good coverage for 100+ languages with shared subword units. ~38M embedding params with hidden_size=768.

              - `vocab_size=100000`: Very large vocab for code or highly multilingual models. ~77M embedding params — strongly consider `embedding.factorized.enabled=true` to reduce this cost.

              - With `embedding.factorized.enabled=true` and `embedding.factorized.dim=128`: vocab_size=50k, hidden=768 → embedding params drop from 38.4M to ~8.4M (4.5× reduction). Quality impact is typically negligible for vocabs > 10k.

              - If using `base_model`: vocab_size must exactly match the pretrained model''s vocabulary. Mismatch causes token ID corruption and unrecoverable training failure.


              **References:** (paper: arxiv:1810.04805)'
            description_es: 'Número de tokens únicos en el vocabulario del modelo. Debe coincidir con el tamaño del

              vocabulario del tokenizador. Valores típicos: 30k–100k. Vocabularios más grandes mejoran la

              cobertura lingüística pero aumentan los parámetros de embedding (`vocab_size × hidden_size`).


              **Ejemplos explicados:**

              - `vocab_size=30000`: Común para modelos solo en inglés (BERT). Vocab más pequeño = menos params de embedding, inferencia más rápida. Puede tener problemas con palabras raras o texto multilingüe.

              - `vocab_size=50000`: Estilo BERT multilingüe. Buena cobertura para 100+ idiomas con unidades sub-palabra compartidas. ~38M params de embedding con hidden_size=768.

              - `vocab_size=100000`: Vocabulario muy grande para código o modelos altamente multilingües. ~77M params de embedding — considerar seriamente `embedding.factorized.enabled=true` para reducir este costo.

              - Con `embedding.factorized.enabled=true` y `embedding.factorized.dim=128`: vocab_size=50k, hidden=768 → params de embedding bajan de 38.4M a ~8.4M (reducción 4.5×). El impacto en calidad es típicamente insignificante para vocabularios > 10k.

              - Si se usa `base_model`: vocab_size debe coincidir exactamente con el vocabulario del modelo preentrenado. Una discrepancia causa corrupción de IDs de token y falla de entrenamiento irrecuperable.


              **Referencias:** (paper: arxiv:1810.04805)'
            default: 50000
            examples:
            - 50000
          hidden_size:
            type: integer
            minimum: 1
            title: Hidden Dimension
            title_es: Dimensión Oculta
            description: 'Dimension of the model''s hidden representations. Key size parameter affecting capacity

              and memory. Typical: 512 (small), 768 (BERT-base), 1024 (BERT-large), 2048+ (large models).

              **Must be divisible by `num_heads`, unless a mixer declares its own

              `attention.<mixer>.head_dim`** (e.g. `kda`/`mla`/`gmla`, which can expand

              the head geometry beyond `hidden_size`).


              **Examples explained:**

              - `hidden_size=768` with `num_heads=12` → 64 dimensions per head. Standard BERT-base configuration, good balance of capacity and memory (~110M total params with 12 layers).

              - `hidden_size=512` with `num_heads=8` → 64 dimensions per head. Compact model for resource-constrained environments or fast prototyping (~40M params).

              - `hidden_size=1024` with `num_heads=16` → 64 dimensions per head. BERT-large scale, higher capacity for complex tasks (~340M params).

              - `hidden_size=2048` with `num_heads=32` → 64 dimensions per head. Large model scale, requires significant GPU memory. Consider factorized embeddings and MoE to manage parameter count.

              - Golden rule: per-head dimension should be ≥ 64. Values below 48 degrade attention quality. Use `hidden_size / num_heads >= 64` as a design constraint.


              **References:** (paper: arxiv:1706.03762)'
            description_es: 'Dimensión de las representaciones ocultas del modelo. Parámetro clave de tamaño que afecta

              capacidad y memoria. Típico: 512 (pequeño), 768 (BERT-base), 1024 (BERT-large), 2048+

              (modelos grandes). **Debe ser divisible por `num_heads`, salvo que un

              mixer declare su propio `attention.<mixer>.head_dim`** (p. ej.

              `kda`/`mla`/`gmla`, que pueden expandir la geometría de cabezas más allá

              de `hidden_size`).


              **Ejemplos explicados:**

              - `hidden_size=768` con `num_heads=12` → 64 dimensiones por cabeza. Configuración BERT-base estándar, buen balance de capacidad y memoria (~110M params totales con 12 capas).

              - `hidden_size=512` con `num_heads=8` → 64 dimensiones por cabeza. Modelo compacto para entornos con recursos limitados o prototipado rápido (~40M params).

              - `hidden_size=1024` con `num_heads=16` → 64 dimensiones por cabeza. Escala BERT-large, mayor capacidad para tareas complejas (~340M params).

              - `hidden_size=2048` con `num_heads=32` → 64 dimensiones por cabeza. Escala de modelo grande, requiere memoria GPU significativa. Considerar embeddings factorizados y MoE para manejar el conteo de parámetros.

              - Regla de oro: dimensión por cabeza debe ser ≥ 64. Valores por debajo de 48 degradan calidad de atención. Usar `hidden_size / num_heads >= 64` como restricción de diseño.


              **Referencias:** (paper: arxiv:1706.03762)'
            default: 2048
            examples:
            - 768
          num_layers:
            type: integer
            minimum: 1
            title: Number of Layers
            title_es: Número de Capas
            description: 'Number of physical transformer layers in the model stack. Typical: 6 (small), 12 (BERT-base), 24 (BERT-large).

              More layers increase depth and capacity for hierarchical representations but make training harder (gradient flow).


              **Examples explained:**

              - `num_layers=6` with `num_loops=1`: 6 physical layers. Compact model, fast training. Good for small datasets (<10M tokens) or rapid experimentation.

              - `num_layers=6` with `num_loops=2`: 6 physical, 12 logical layers. Same parameter count as 6 layers but 2× compute depth. Each layer in `layer_pattern` runs twice. Useful when you want more sequential computation without adding parameters.

              - `num_layers=12` with `num_loops=1`: Standard BERT-base depth. 12 distinct layers each with their own weights. Good balance for most tasks.

              - `num_layers=24` with `num_loops=1`: BERT-large depth. Requires careful training (Pre-LN, gradient clipping, warmup). Use for large datasets and complex tasks.

              - Relationship with `num_loops`: Logical depth = `num_layers × num_loops`. Use loops to increase effective depth without parameter explosion. Loops share weights across iterations, trading capacity for compute.


              **References:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805)'
            description_es: 'Número de capas físicas del transformer. Típico: 6 (pequeño), 12 (BERT-base), 24 (BERT-large).

              Más capas aumentan la profundidad y capacidad para representaciones jerárquicas pero dificultan el entrenamiento (flujo de gradientes).


              **Ejemplos explicados:**

              - `num_layers=6` con `num_loops=1`: 6 capas físicas. Modelo compacto, entrenamiento rápido. Bueno para datasets pequeños (<10M tokens) o experimentación rápida.

              - `num_layers=6` con `num_loops=2`: 6 capas físicas, 12 capas lógicas. Mismos parámetros que 6 capas pero 2× profundidad de cómputo. Cada capa en `layer_pattern` se ejecuta dos veces. Útil cuando se quiere más cómputo secuencial sin agregar parámetros.

              - `num_layers=12` con `num_loops=1`: Profundidad BERT-base estándar. 12 capas distintas cada una con sus propios pesos. Buen balance para la mayoría de tareas.

              - `num_layers=24` con `num_loops=1`: Profundidad BERT-large. Requiere entrenamiento cuidadoso (Pre-LN, gradient clipping, warmup). Usar para datasets grandes y tareas complejas.

              - Relación con `num_loops`: Profundidad lógica = `num_layers × num_loops`. Usar loops para aumentar profundidad efectiva sin explosión de parámetros. Los loops comparten pesos entre iteraciones, intercambiando capacidad por cómputo.


              **Referencias:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805)'
            default: 12
            examples:
            - 12
          num_loops:
            type: integer
            minimum: 1
            title: Logical Loops
            title_es: Bucles Lógicos
            description: 'Number of times to loop through the `layer_pattern` during a single forward pass. When >1,

              creates logical layers without increasing parameters. `num_loops=2` with `num_layers=6` behaves

              like 12 layers but with 6-layer parameters. Increases training time linearly.


              **Impact:** Increases compute cost without increasing parameter memory. Ideal for compensating

              models with few physical layers. Doesn''t improve representation capacity as much as additional physical layers

              (weights are shared across loop iterations by position).


              **References:** (paper: arxiv:2311.12424)

              '
            description_es: 'Número de veces que se recorre `layer_pattern` en una pasada hacia adelante. Cuando >1,

              crea capas lógicas sin aumentar parámetros. `num_loops=2` con `num_layers=6` se comporta como

              12 capas pero con parámetros de 6. Aumenta el tiempo de entrenamiento linealmente.


              **Impacto:** Aumenta el costo de cómputo sin aumentar memoria de parámetros. Ideal para compensar

              modelos con pocas capas físicas. No mejora la capacidad de representación tanto como capas

              físicas adicionales (los pesos se comparten entre iteraciones de bucle por posición).


              **Referencias:** (paper: arxiv:2311.12424)

              '
            default: 2
            examples:
            - 1
            - 2
          num_heads:
            type: integer
            minimum: 1
            title: Attention Heads
            title_es: Cabezas de Atención
            description: 'Number of parallel attention heads. Must divide `hidden_size` evenly. Typical: 8 (small),

              12 (BERT-base), 16 (BERT-large), 32 (large). Each head learns different attention patterns.


              **Impact:** Per-head dimension = `hidden_size / num_heads`. Values <64 per head can degrade

              quality. Too many heads with small dimensions fragment the representation. Rule of thumb:

              keep per-head dimension between 64 and 128. With `hidden_size=768`, `num_heads=12` gives 64/head.


              **References:** (paper: arxiv:1706.03762)

              '
            description_es: 'Número de cabezas de atención paralelas. Debe dividir `hidden_size` exactamente. Típico:

              8 (pequeño), 12 (BERT-base), 16 (BERT-large), 32 (grande). Cada cabeza aprende patrones de atención distintos.


              **Impacto:** Dimensión por cabeza = `hidden_size / num_heads`. Valores <64 por cabeza pueden

              degradar la calidad. Demasiadas cabezas con dimensiones pequeñas fragmentan la representación.

              Regla general: mantener la dimensión por cabeza entre 64 y 128. Con `hidden_size=768`,

              `num_heads=12` da 64/cabeza.


              **Referencias:** (paper: arxiv:1706.03762)

              '
            default: 16
            examples:
            - 12
          num_kv_heads:
            type: integer
            minimum: 1
            title: Key-Value Heads (GQA)
            title_es: Cabezas Clave-Valor (GQA)
            description: 'Number of key-value heads for Grouped-Query Attention (``gqa``).

              Must divide ``num_heads`` evenly. Values range from 1 (equivalent to

              multi-query attention) to ``num_heads`` (equivalent to multi-head

              attention). The paper suggests 8 as a favorable middle ground for

              typical model sizes.


              **References:** (paper: arxiv:2305.13245)

              '
            description_es: 'Número de cabezas clave-valor para Grouped-Query Attention

              (``gqa``). Debe dividir ``num_heads`` exactamente. Los valores

              van de 1 (equivalente a multi-query attention) a ``num_heads``

              (equivalente a multi-head attention). El paper sugiere 8 como un

              punto medio favorable para tamaños de modelo típicos.

              También lo consumen los mixers GQA-based (`msa`, `sparda`) y

              `attention.ccgqa.num_kv_heads` para CCGQA.


              **Referencias:** (paper: arxiv:2305.13245)

              '
            default: 1
            examples:
            - 1
            - 8
          dropout:
            type: number
            minimum: 0
            maximum: 1
            title: Dropout Probability
            title_es: Probabilidad de Dropout
            description: 'Global dropout rate applied throughout the model (attention, FFN, embeddings). Typical:

              0.1 (BERT), 0.3 (small datasets). Higher = more regularization, lower = less. Tune based on

              overfitting: increase if validation loss >> train loss.


              **Examples explained:**

              - `0.1`: BERT standard. Good default for mid-size models and datasets (>1M samples). Provides moderate regularization without slowing convergence too much.

              - `0.05`: Light regularization. For very large datasets (>100M tokens) or large models where overfitting is less of a concern. Faster convergence.

              - `0.2–0.3`: Strong regularization. For small datasets (<10M tokens) where overfitting is likely. Slows training but improves generalization.

              - `0.0`: No dropout. Only for debugging or when using other regularization (weight decay, data augmentation). Models typically overfit without it.

              - Overfitting diagnosis: If train loss keeps decreasing while validation loss plateaus or increases, raise dropout by 0.05–0.1. If both losses are flat (underfitting), lower dropout.'
            description_es: 'Tasa global de dropout aplicada en todo el modelo (atención, FFN, embeddings). Típico:

              0.1 (BERT), 0.3 (datasets pequeños). Mayor = más regularización, menor = menos. Ajustar según

              sobreajuste: aumentar si pérdida de validación >> pérdida de entrenamiento.


              **Ejemplos explicados:**

              - `0.1`: Estándar BERT. Buen valor por defecto para modelos de tamaño medio y datasets (>1M muestras). Proporciona regularización moderada sin ralentizar demasiado la convergencia.

              - `0.05`: Regularización ligera. Para datasets muy grandes (>100M tokens) o modelos grandes donde el sobreajuste preocupa menos. Convergencia más rápida.

              - `0.2–0.3`: Regularización fuerte. Para datasets pequeños (<10M tokens) donde el sobreajuste es probable. Ralentiza el entrenamiento pero mejora la generalización.

              - `0.0`: Sin dropout. Solo para debugging o cuando se usan otros regularizadores (weight decay, data augmentation). Los modelos típicamente sobreajustan sin él.

              - Diagnóstico de sobreajuste: Si la pérdida de entrenamiento sigue bajando mientras la de validación se estanca o sube, aumentar dropout en 0.05–0.1. Si ambas pérdidas están planas (subajuste), bajar dropout.'
            default: 0.1
            examples:
            - 0.1
          layer_pattern:
            type: array
            title: Layer Pattern
            title_es: Patrón de Capas
            description: 'Ordered sequence of layer types stacked in the model. Each element defines one

              physical layer. Pattern length must equal `num_layers`. Available types:


              | Type | Description | Training | Inference |

              |------|-------------|----------|-----------|

              | `standard` | Classic multi-head self-attention (like BERT) (paper: arxiv:1706.03762) | ✅ | ✅ |

              | `sigmoid` | Sigmoid-gated attention (paper: arxiv:2409.04431) | ✅ | ✅ |

              | `ca` | Continuum Attention — exact normalized integration of exp(score) over piecewise-linear key/value trajectories (paper: arxiv:2610.20586) | ✅ | ✅ |

              | `xsa` | Exclusive Self Attention — post-SDPA orthogonalization against the self value vector (paper: arxiv:2603.09078) | ✅ | ✅ |

              | `gated_softmax` | Gated softmax attention with post-SDPA sigmoid (paper: arxiv:2505.06708) | ✅ | ✅ |

              | `titan` | Titan attention with positional encoding (`hope`/`rope`) (paper: arxiv:2501.00663) | ✅ | ✅ |

              | `retnet` | Retention Network (RNN+transformer hybrid) (paper: arxiv:2307.08621) | ✅ | ✅ |

              | `mamba` | Selective state-space model (SSM) (paper: arxiv:2312.00752) | ✅ | ✅ |

              | `ode` | Continuous-depth ODE layer (uses `attention.ode.solver`/`attention.ode.steps`) (paper: arxiv:1906.02762) (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692) | ✅ | ✅ |

              | `gla` | Gated Linear Attention with multiplicative decay (paper: arxiv:2312.06635) | ✅ | ✅ |

              | `deltanet` / `gated_deltanet` | DeltaNet with corrective delta rule (paper: arxiv:2406.06484) (paper: arxiv:2412.06464) | ✅ | ✅ |

              | `gated_deltanet2` | Gated DeltaNet-2 with decoupled channel-wise erase/write gates (paper: arxiv:2605.22791) | ✅ | ✅ |

              | `hgrn2` | HGRN2 with hierarchical forget gates (paper: arxiv:2404.07904) | ✅ | ✅ |

              | `fox` | Forgetting Transformer (FoX) with forget bias in logits (paper: arxiv:2503.02130) | ✅ | ✅ |

              | `nsa` | Native Sparse Attention (three-branch) (paper: arxiv:2502.11089) | ✅ | ✅ |

              | `engram` | N-gram conditional memory lookup (paper: arxiv:2601.07372) | ✅ | ✅ |

              | `gqa` | Grouped-Query Attention — configurable KV heads (paper: arxiv:2305.13245) | ✅ | ✅ |

              | `longformer` | Longformer: sliding windows + global tokens (paper: arxiv:2004.05150) | ✅ | ✅ |

              | `swa` | Sliding-window attention with attention sinks — SWA(w, s) (paper: arxiv:2608.28444) | ✅ | ✅ |

              | `bigbird` | BigBird: local + random + global attention (paper: arxiv:2007.14062) | ✅ | ✅ |

              | `sparse_transformer` | Sparse Transformer: factorized patterns (paper: arxiv:1904.10509) | ✅ | ✅ |

              | `sparsek` | SparseK: differentiable top-k KV selection (paper: arxiv:2406.16747) | ✅ | ✅ |

              | `sparge` ⚠️ | SpargeAttn — two-stage block pruning; **trains as dense attention**, sparse filter at inference (paper: arxiv:2502.18137) | ✅ (dense) | ✅ (sparse) |

              | `fasa` ⚠️ | FASA — frequency-aware token selection; **trains as dense attention**, sparse selection at inference (paper: arxiv:2602.03152) | ✅ (dense) | ✅ (sparse) |

              | `msa` | MiniMax Sparse Attention — block-sparse on GQA (paper: arxiv:2606.13392) | ✅ | ✅ |

              | `sparda` | SparDA — decoupled sparse attention with a Forecast projection (paper: arxiv:2606.04511) | ✅ | ✅ |

              | `kda` | Kimi Delta Attention — channel-wise decay + scalar write gate (paper: arxiv:2510.26692) | ✅ | ✅ |

              | `falcon1` | Falcon-1 — scalar NLMS regression (delta-rule) fast-weight update, read-after-write prefix-aligned (paper: arxiv:2608.27763) | ✅ | ✅ |

              | `falcon2` | Falcon-2 — per-column NLMS regression fast-weight update (paper: arxiv:2608.27763) | ✅ | ✅ |

              | `falcon3` | Falcon-3 — sliding-window minibatch regression fast-weight update (paper: arxiv:2608.27763) | ✅ | ✅ |

              | `falcon1a` | Falcon-1A — scalar inner-product (additive) fast-weight update (paper: arxiv:2608.27763) | ✅ | ✅ |

              | `falcon2a` | Falcon-2A — per-column inner-product fast-weight update (paper: arxiv:2608.27763) | ✅ | ✅ |

              | `falcon3a` | Falcon-3A — sliding-window inner-product fast-weight update, best length extrapolation (paper: arxiv:2608.27763) | ✅ | ✅ |

              | `mla` | Multi-Head Latent Attention + RoPE (paper: arxiv:2506.09342) | ✅ | ✅ |

              | `gqla` | Group-Query Latent Attention — two decoding paths (paper: arxiv:2605.15250) | ✅ | ✅ |

              | `mlra` | Multi-Head Low-Rank Attention — partitionable latent (paper: arxiv:2603.02188) | ✅ | ✅ |

              | `tucker` | Tucker Attention — generalised low-rank factorisation (paper: arxiv:2603.30033) | ✅ | ✅ |

              | `iha` | Interleaved Head Attention — cross-head pseudo-heads (paper: arxiv:2602.21371) | ✅ | ✅ |

              | `gta` | Grouped-head laTenT Attention — shared map + latent values (paper: arxiv:2506.17286) | ✅ | ✅ |

              | `mtla` | Multi-head Temporal Latent Attention — temporal KV merge (paper: arxiv:2505.13544) | ✅ | ✅ |

              | `cca` | Compressed Convolutional Attention — latent-space attention + convs (paper: arxiv:2510.04476) | ✅ | ✅ |

              | `ccgqa` | Compressed Convolutional Grouped Query Attention — CCA + GQA in latent (paper: arxiv:2510.04476) | ✅ | ✅ |

              | `gma` | Gaussian Mixture Attention — probabilistic latent routing, O(NK) linear-time (paper: arxiv:2606.18283) | ✅ | ✅ |

              | `ssog` | SSOG — separable Gaussian field over relative position, near-linear O(R·N·√N); content steers, never scores (Pisoni 2026) (paper: https://www.pisoni.ai/posts/ssog/) | ✅ | ✅ |

              | `conformer` | Conformer — macaron FFN₁ + MHSA + convolution module (paper: arxiv:2005.08100) | ✅ | ✅ |

              | `memory` | Memory Attention — value projection replaced by layer-specific token-ID memory, V = K + Norm(E[s]) (paper: arxiv:2609.28399) | ✅ | ✅ |

              | `lsa` | Latent Sparse Attention — semantic Ward clustering of keys + top-k long-range selection; natively trainable, no extra parameters, no PE (paper: arxiv:2610.42147) | ✅ | ✅ |

              | `fastconformer` | Fast Conformer limited-context attention — local window + head-pinned global token(s), optional separate global projections (paper: arxiv:2305.05084) | ✅ | ✅ |

              | `fpa` | First Passage Attention — softmax + first-passage (range-min) forget bias β·min(0, φ̄ₜₛ − ψₛ); contains FoX as δ≤0 special case (paper: arxiv:2610.22714) | ✅ | ✅ |


              **Examples explained:**

              - `[standard]` repeated 12 times: Classic BERT-like encoder. Simplest configuration, serves as a reliable baseline. All layers use full quadratic attention.

              - `[retnet, titan, retnet, mamba, titan, ode]` with `num_layers=6`: Mixed architecture combining recurrent retention (efficient long-range), Titan attention with positional encoding (precise local attention), Mamba SSM (linear-time sequence modeling), and ODE continuous depth. Each position gets a different type of computation, enabling diverse representations.

              - `[standard, standard, longformer]` with `num_layers=3`: Hybrid dense + sparse. Start with 2 dense attention layers for fine-grained interactions, then use Longformer for efficient long-sequence processing. Good for documents > 512 tokens.

              - Mixing recurrent (retnet, mamba) with attention (standard, titan): Recurrent layers provide memory and long-range context at O(1) inference cost, while attention layers provide high-precision local interactions. This is the recommended pattern for models that need both efficiency and quality.

              - ⚠️ `sparge` and `fasa` apply their sparse heuristic **only in evaluation/inference**. While training, `HybridLayer` substitutes standard dense attention over the same projections (`q/k/v/out`), so they can be trained from scratch; the trained weights are exactly the ones the sparse path reads at eval time.


              | `gmla` | Gated MLA — DeepSeek-style latent attention with low-rank queries, NoPE/rope split and a full-rank output gate (paper: arxiv:2607.24653) |

              '
            description_es: 'Secuencia ordenada de tipos de capa apilados en el modelo. Cada elemento define una

              capa física. La longitud del patrón debe igualar `num_layers`. Tipos disponibles:


              | Tipo | Descripción | Entrenamiento | Inferencia |

              |------|-------------|---------------|------------|

              | `standard` | Atención multi-cabeza clásica (tipo BERT) (paper: arxiv:1706.03762) | ✅ | ✅ |

              | `sigmoid` | Atención con compuerta sigmoide (paper: arxiv:2409.04431) | ✅ | ✅ |

              | `ca` | Atención Continua — integración normalizada exacta de exp(puntaje) sobre trayectorias clave/valor lineales por tramos (paper: arxiv:2610.20586) | ✅ | ✅ |

              | `xsa` | Atención Exclusiva — ortogonalización post-SDPA frente al vector de valor propio (paper: arxiv:2603.09078) | ✅ | ✅ |

              | `gated_softmax` | Atención softmax con compuerta post-SDPA (paper: arxiv:2505.06708) | ✅ | ✅ |

