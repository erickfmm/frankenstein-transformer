      classification_head:
        type: object
        additionalProperties: false
        title: NLP Classification Head
        title_es: Cabeza de Clasificación NLP
        description: 'Optional sequence-level classification head on the NLP encoder (DashAI

          integration). When enabled with `num_labels` set,

          ``FrankensteinEncoder.forward`` returns ``(B, num_labels)`` class logits

          instead of ``(B, S, vocab_size)`` MLM logits. The head is a full-precision

          ``nn.Linear`` (NOT BitNet-quantized). Disabled by default so the MLM CLI path

          is unchanged. This mirrors the ViT `image:` head knobs structurally.


          **References:** (paper: arxiv:1810.04805)'
        description_es: "Cabeza de clasificación opcional a nivel de secuencia en el encoder NLP\n(integración DashAI). Cuando se habilita con `num_labels`, \n``FrankensteinEncoder.forward`` devuelve logits de clase ``(B, num_labels)``\nen lugar de logits MLM ``(B, S, vocab_size)``. La cabeza es un ``nn.Linear``\nde precisión completa (NO cuantizado con BitNet). Deshabilitada por defecto\npara dejar el camino MLM de CLI sin cambios. Refleja estructuralmente los\nparámetros de cabeza del bloque ViT `image:`.\n\n**Referencias:** (paper: arxiv:1810.04805)"
        properties:
          enabled:
            type: boolean
            title: Enable Classification Head
            title_es: Habilitar Cabeza de Clasificación
            description: 'Enable the sequence-level classification head on the encoder.


              **References:** (paper: arxiv:1810.04805)'
            description_es: 'Habilita la cabeza de clasificación a nivel de secuencia en el encoder.


              **Referencias:** (paper: arxiv:1810.04805)'
            default: false
            examples:
            - false
            - true
          num_labels:
            type:
            - integer
            - 'null'
            minimum: 1
            title: Number of Classes (NLP)
            title_es: Número de Clases (NLP)
            description: 'Number of target classes. Required when `enabled: true`; ignored

              otherwise. `null` means unset.


              **References:** (paper: arxiv:1810.04805)'
            description_es: 'Número de clases objetivo. Obligatorio cuando `enabled: true`; ignorado

              en caso contrario. `null` significa sin definir.


              **Referencias:** (paper: arxiv:1810.04805)'
            default: null
            examples:
            - 2
            - null
          pooling_mode:
            type: string
            enum:
            - cls
            - gap
            title: Encoder Pooling Mode
            title_es: Modo de Pooling del Encoder
            description: 'Pooling for the classification head: ``cls`` reads the first token output;

              ``gap`` averages over all tokens. Mirrors the ViT `image.pooling_mode`.


              **References:** (paper: arxiv:1810.04805)'
            description_es: 'Pooling para la cabeza de clasificación: ``cls`` lee la salida del primer

              token; ``gap`` promedia sobre todos los tokens. Refleja el

              `image.pooling_mode` del ViT.


              **Referencias:** (paper: arxiv:1810.04805)'
            default: cls
            examples:
            - cls
            - gap
      mhc:
        type: object
        additionalProperties: false
        title: Manifold-Constrained Hyper-Connections (mHC)
        title_es: Hyper-Connexiones Restringidas por Variedad (mHC)
        description: "Configuration for Manifold-Constrained Hyper-Connections (mHC,\n(paper: arxiv:2512.24880)). mHC expands the residual stream width by a factor\n`expansion_rate` (the residual stream becomes `n × hidden_size`) and\nconstrains the stream-mixing matrix `H[res]` to the Birkhoff polytope\n(the set of doubly stochastic matrices) via the Sinkhorn-Knopp\nprojection. This restores the identity-mapping property lost by\nunconstrained Hyper-Connections, stabilising training at scale.\n\n**Examples explained:**\n- `enabled: true` with the paper default `expansion_rate: 4`: an\n  n=4 stream residual, matching DeepSeek's experimental setup. Increases\n  activation memory ~4× (mitigate with `checkpoint: true`).\n- `enabled: true` with `expansion_rate: 2`: a lighter variant with less\n  memory/compute overhead while still benefiting from the constrained\n  residual mixing.\n- `expansion_rate: 1` degenerates to the exact identity mapping.\n\n⚠️ mHC is incompatible with `use_mixture_of_depths`\
          \ (MoD token routing\noperates on a single C-dimensional stream, conflicting with the n-stream\nresidual).\n\n**Hyperloop mode** (`hyperloop: true` (paper: arxiv:2604.21254)): instead of the\nper-sublayer wiring above, hyper-connections fire once per loop iteration\nover a middle-cycle partitioned stack (begin → looped middle → end), with\nper-loop parameters, copy/average stream expansion, and a diagonal-sigmoid\n`H^res` by default. See the `hyperloop` property below. Hyperloop requires\n`enabled: true` and `dims.num_loops >= 2`; it lifts the MoD incompatibility\n(middle-block layers run the standard C-dim path) but is incompatible with\nAttnRes residuals (`residuals.type: full_attn|block_attn`).\n\n**References:** (paper: arxiv:2512.24880)"
        description_es: "Configuración para Hyper-Connexiones Restringidas por Variedad (mHC,\n(paper: arxiv:2512.24880)). mHC expande el ancho del flujo residual por un factor\n`expansion_rate` (el flujo residual pasa a ser `n × hidden_size`) y\nrestringe la matriz de mezcla de flujo `H[res]` al politopo de Birkhoff\n(el conjunto de matrices doblemente estocásticas) mediante la proyección\nSinkhorn-Knopp. Esto restaura la propiedad de mapeo de identidad que\npierden las Hyper-Connexions sin restricción, estabilizando el\nentrenamiento a escala.\n\n**Ejemplos explicados:**\n- `enabled: true` con el valor por defecto del paper `expansion_rate: 4`:\n  un flujo residual de n=4, coincidiendo con la configuración experimental\n  de DeepSeek. Aumenta la memoria de activaciones ~4× (mitigar con\n  `checkpoint: true`).\n- `enabled: true` con `expansion_rate: 2`: una variante más ligera con\n  menos sobrecarga de memoria/cómputo y aun así el beneficio de la mezcla\n  residual restringida.\n- `expansion_rate:\
          \ 1` degenera al mapeo de identidad exacto.\n\n⚠️ mHC es incompatible con `use_mixture_of_depths` (el enrutamiento MoD de\ntokens opera sobre un flujo C-dimensional único, en conflicto con el flujo\nresidual de n streams).\n\n**Modo Hyperloop** (`hyperloop: true` (paper: arxiv:2604.21254)): en lugar del\ncableado por subcapa anterior, las hiperconexiones se aplican una vez por\niteración de bucle sobre una pila particionada en ciclo medio\n(inicio → intermedio en bucle → final), con parámetros por bucle, expansión\ndel flujo por copia y colapso por promedio, y `H^res` diagonal-sigmoide por\ndefecto. Ver la propiedad `hyperloop` más abajo. Hyperloop requiere\n`enabled: true` y `dims.num_loops >= 2`; levanta la incompatibilidad con MoD\n(las capas del bloque intermedio usan el camino C-dimensional estándar) pero\nes incompatible con residuales AttnRes\n(`residuals.type: full_attn|block_attn`).\n\n**Combinación con AttnRes:** cuando `model.residuals.type` es `full_attn` o\n`block_attn`,\
          \ el campo `model.residuals.mhc_stream_mode` controla si la\natención de profundidad se aplica por stream o de forma conjunta.\n\n**Checkpointing:** `checkpoint` (mHC) y `model.residuals.gradient_checkpoint`\nson independientes; habilitar ambos maximiza el ahorro de memoria cuando se\ncombinan mHC y AttnRes.\n\n**Referencias:** (paper: arxiv:2512.24880)"
        properties:
          enabled:
            type: boolean
            title: Enable mHC
            title_es: Habilitar mHC
            description: 'When true, replaces the standard residual connection with the

              manifold-constrained n-stream residual. Defaults to false (standard

              residual connection).


              **References:** (paper: arxiv:2512.24880)

              '
            description_es: 'Cuando es true, reemplaza la conexión residual estándar por el flujo

              residual de n streams restringido por variedad. Por defecto es false

              (conexión residual estándar).


              **Referencias:** (paper: arxiv:2512.24880)

              '
            default: false
            examples:
            - true
            - false
          expansion_rate:
            type: integer
            minimum: 1
            title: Expansion Rate (n)
            title_es: Tasa de Expansión (n)
            description: 'Factor by which the residual stream width is expanded. The residual

              stream becomes `n × hidden_size` while layer internals stay at

              `hidden_size`. `1` recovers the identity mapping. The paper uses `4`.


              **References:** (paper: arxiv:2512.24880)

              '
            description_es: 'Factor por el que se expande el ancho del flujo residual. El flujo

              residual pasa a ser `n × hidden_size` mientras los internos de la capa

              permanecen en `hidden_size`. `1` recupera el mapeo de identidad. El

              paper usa `4`.


              **Referencias:** (paper: arxiv:2512.24880)

              '
            default: 4
            examples:
            - 2
            - 4
          sinkhorn_iters:
            type: integer
            minimum: 1
            title: Sinkhorn-Knopp Iterations
            title_es: Iteraciones Sinkhorn-Knopp
            description: 'Number of row/column normalisation rounds in the Sinkhorn-Knopp

              projection that constrains `H[res]` to be doubly stochastic. More

              iterations give a more accurate projection at higher cost. The paper

              uses `20`.


              **References:** (paper: arxiv:2512.24880)

              '
            description_es: 'Número de rondas de normalización fila/columna en la proyección

              Sinkhorn-Knopp que restringe `H[res]` a ser doblemente estocástica.

              Más iteraciones dan una proyección más precisa a mayor costo. El paper

              usa `20`.


              **Referencias:** (paper: arxiv:2512.24880)

              '
            default: 20
            examples:
            - 20
          gating_init:
            type: number
            exclusiveMinimum: 0
            title: Gating Factor Init
            title_es: Inicialización del Factor de Compuerta
            description: 'Initial value of the learnable gating scalars `α` applied to the mHC

              coefficient computations. Small values stabilise early training. The

              paper uses `0.01`.


              **References:** (paper: arxiv:2512.24880)

              '
            description_es: 'Valor inicial de los escalares de compuerta aprendibles `α` aplicados

              a los cálculos de coeficientes mHC. Valores pequeños estabilizan el

              entrenamiento temprano. El paper usa `0.01`.


              **Referencias:** (paper: arxiv:2512.24880)

              '
            default: 0.01
            examples:
            - 0.01
          checkpoint:
            type: boolean
            title: Gradient Checkpointing
            title_es: Gradient Checkpointing
            description: 'When true, uses gradient checkpointing on the mHC layer blocks to trade

              compute for memory, mitigating the ~`n`× activation-memory increase of

              the n-stream residual.

              '
            description_es: 'Cuando es true, usa gradient checkpointing en los bloques de capa mHC

              para intercambiar cómputo por memoria, mitigando el aumento ~`n`× de

              memoria de activaciones del flujo residual de n streams.

              '
            default: false
            examples:
            - false
            - true
          full_prec_under_bitnet:
            type: boolean
            title: Full Precision Under BitNet
            title_es: Precisión Completa Bajo BitNet
            description: 'When true (default), the mHC coefficient projection `φ_l` is kept as a

              full-precision `nn.Linear` even when `use_bitnet` is true, avoiding

              ternary-quantisation noise on the small mHC coefficients. When false

              (and `use_bitnet` is true), `φ_l` uses `BitLinear`.


              **References:** (paper: arxiv:2310.11453)

              '
            description_es: 'Cuando es true (por defecto), la proyección de coeficientes mHC `φ_l`

              se mantiene como `nn.Linear` de precisión completa incluso cuando

              `use_bitnet` es true, evitando ruido de cuantización ternaria en los

              pequeños coeficientes mHC. Cuando es false (y `use_bitnet` es true),

              `φ_l` usa `BitLinear`.


              **Referencias:** (paper: arxiv:2310.11453)

              '
            default: true
            examples:
            - true
            - false
          hyperloop:
            type: boolean
            title: Hyperloop Transformer (loop-level hyper-connections)
            title_es: Transformer Hyperloop (hiperconexiones a nivel de bucle)
            description: "Enable the **Hyperloop Transformer** architecture (Zeitoun,\nTorroba-Hennigen & Kim (paper: arxiv:2604.21254)). Instead of applying mHC\nhyper-connections after every attention/FFN sub-layer, the layer stack\nis partitioned middle-cycle into a **begin block** (runs once), a\n**looped middle block** wrapped in loop-level hyper-connections, and an\n**end block** (runs once):\n\n`x → begin → copy×n → { read(H^pre) → middle → +e_l → update(H^res, H^post) } × num_loops → avg → end → head`\n\nKey properties (all measured in the paper):\n- Loop-level hyper-connections with **per-loop** parameters\n  `{W_l, b_l, α_l, e_l}` relax strict weight sharing across loops —\n  this is what recovers depth-matched quality with ~50% fewer\n  parameters.\n- The stream is created by **copying** (`expansion_rate` copies) and\n  collapsed by **averaging**, replacing mHC's learned in/out\n  projections.\n- `H^res` uses a **diagonal sigmoid** parameterization by default (the\n  paper's best\
              \ ablation: fewer parameters than Sinkhorn AND better\n  perplexity). See `hyperloop_res_parameterization`.\n- Only fires once per loop, so overhead is minimal (~5% throughput vs\n  mHC's ~33% slowdown in plain PyTorch).\n- Post-training INT4 (GPTQ) perplexity degrades less than plain looped\n  models.\n- **Requires** `enabled: true` and `dims.num_loops >= 2` (paper uses\n  3). Incompatible with `residuals.type: full_attn|block_attn`\n  (AttnRes assumes a per-logical-layer n-stream residual). Unlike\n  per-layer mHC, **Mixture-of-Depths stays compatible** (middle-block\n  layers run the standard C-dim path).\n\nParameter budget: per loop `≈ 3n²C + 3n + 3 + C` (diagonal) — for the\npaper's 136M model (C=1024, n=4, 3 loops) this is ~150K extra\nparameters over the plain looped Transformer.\n\n**References:** (paper: arxiv:2604.21254)"
            description_es: "Habilita la arquitectura **Hyperloop Transformer** (Zeitoun,\nTorroba-Hennigen & Kim (paper: arxiv:2604.21254)). En lugar de aplicar las\nhiperconexiones mHC tras cada subcapa attention/FFN, la pila de capas\nse particiona en ciclo medio: un **bloque inicial** (se ejecuta una\nvez), un **bloque intermedio en bucle** envuelto en hiperconexiones a\nnivel de bucle y un **bloque final** (se ejecuta una vez).\n\nPropiedades clave (todas medidas en el paper):\n- Hiperconexiones a nivel de bucle con parámetros **por bucle**\n  `{W_l, b_l, α_l, e_l}` que relajan la compartición estricta de pesos\n  entre bucles — esto recupera calidad equivalente a profundidad\n  completa con ~50% menos parámetros.\n- El stream se crea **copiando** (`expansion_rate` copias) y se colapsa\n  **promediando**, reemplazando las proyecciones aprendidas de mHC.\n- `H^res` usa una parametrización **sigmoide diagonal** por defecto\n  (la mejor ablación del paper). Ver `hyperloop_res_parameterization`.\n\
              - Se aplica una vez por bucle, así que la sobrecarga es mínima.\n- **Requiere** `enabled: true` y `dims.num_loops >= 2` (el paper usa\n  3). Incompatible con `residuals.type: full_attn|block_attn`. A\n  diferencia de mHC por capa, **Mixture-of-Depths sigue siendo\n  compatible**.\n\n**Referencias:** (paper: arxiv:2604.21254)"
            default: false
            examples:
            - true
            - false
          hyperloop_begin_layers:
            type: integer
            minimum: 0
            title: Hyperloop Begin Block Layers
            title_es: Capas del Bloque Inicial Hyperloop
            description: 'Number of physical layers at the start of the stack that run exactly

              once before the looped middle block (the "begin block" / prelude). The

              paper allocates ~25% of parameters to the begin block, 50% to the

              middle, 25% to the end (e.g. `2L → 4L(×3) → 2L` at 16 unrolled layers).


              Only meaningful when `hyperloop` is true. `0` (default) loops the whole

              stack with no begin/end split.


              Must satisfy `hyperloop_begin_layers + hyperloop_end_layers <

              dims.num_layers`.


              **References:** (paper: arxiv:2604.21254)

              '
            description_es: 'Número de capas físicas al inicio de la pila que se ejecutan una sola

              vez antes del bloque intermedio en bucle (el "bloque inicial"). El

              paper asigna ~25% de los parámetros al bloque inicial, 50% al

              intermedio y 25% al final (p. ej. `2L → 4L(×3) → 2L` a 16 capas

              desenrolladas).


              Solo es significativo cuando `hyperloop` es true. `0` (por defecto)

              recorre la pila completa sin partición begin/end.


              Debe satisfacer `hyperloop_begin_layers + hyperloop_end_layers <

              dims.num_layers`.


              **Referencias:** (paper: arxiv:2604.21254)

              '
            default: 0
            examples:
            - 0
            - 2
            - 3
          hyperloop_end_layers:
            type: integer
            minimum: 0
            title: Hyperloop End Block Layers
            title_es: Capas del Bloque Final Hyperloop
            description: 'Number of physical layers at the end of the stack that run exactly once

              after the looped middle block (the "end block" / coda). The paper

              allocates ~25% of parameters to it. Only meaningful when `hyperloop` is

              true; `0` (default) loops the whole stack.


              Must satisfy `hyperloop_begin_layers + hyperloop_end_layers <

              dims.num_layers`.


              **References:** (paper: arxiv:2604.21254)

              '
            description_es: 'Número de capas físicas al final de la pila que se ejecutan una sola

              vez tras el bloque intermedio en bucle (el "bloque final"). El paper le

              asigna ~25% de los parámetros. Solo es significativo cuando `hyperloop`

              es true; `0` (por defecto) recorre la pila completa.


              Debe satisfacer `hyperloop_begin_layers + hyperloop_end_layers <

              dims.num_layers`.


              **Referencias:** (paper: arxiv:2604.21254)

              '
            default: 0
            examples:
            - 0
            - 2
            - 3
          hyperloop_res_parameterization:
            type: string
            title: H^res Parameterization
            title_es: Parametrización de H^res
            description: "Parameterization of the transition matrix `H^res` that mixes the\nparallel residual streams between loop iterations (paper §3, ablation\nTable 6). Only meaningful when `hyperloop` is true.\n\n- `\"diagonal\"` (default, paper's choice): `H^res = diag(σ(α·W·z+b))` —\n  a data-dependent per-stream gate. Cheapest (W_res is `n×nC` instead\n  of `n²×nC`) **and** the paper's best perplexity (14.40).\n- `\"sinkhorn\"`: full mHC-style `sinkhorn(W·z+b)` doubly stochastic\n  matrix (14.59 in the paper's ablation). Available for ablation\n  parity with `mhc.enabled` without `hyperloop`.\n- `\"identity\"`: `H^res = I` — no mixing parameters at all. The\n  paper's simplest ablation (14.61).\n\n**References:** (paper: arxiv:2604.21254)\n"
            description_es: "Parametrización de la matriz de transición `H^res` que mezcla los\nstreams residuales paralelos entre iteraciones de bucle (paper §3,\nablación Tabla 6). Solo es significativa cuando `hyperloop` es true.\n\n- `\"diagonal\"` (por defecto, elección del paper):\n  `H^res = diag(σ(α·W·z+b))` — compuerta por stream dependiente de los\n  datos. La más barata **y** la de mejor perplejidad (14.40).\n- `\"sinkhorn\"`: matriz doblemente estocástica completa estilo mHC\n  (14.59 en la ablación). Disponible para paridad de ablación con\n  `mhc.enabled` sin `hyperloop`.\n- `\"identity\"`: `H^res = I` — sin parámetros de mezcla. La ablación\n  más simple del paper (14.61).\n\n**Referencias:** (paper: arxiv:2604.21254)\n"
            enum:
            - diagonal
            - sinkhorn
            - identity
            default: diagonal
            examples:
            - diagonal
            - sinkhorn
            - identity
      residuals:
        type: object
        additionalProperties: false
        title: Residual Connections (AttnRes / standard)
        title_es: Conexiones Residuales (AttnRes / estándar)
        description: "Configuration for the residual-connection strategy used between\nconsecutive layers. Implements the four variants discussed in the\nAttention Residuals paper (paper: arxiv:2603.15031) plus the classical\nstandard residual.\n\n**Mathematical framing.** Let ``h_l ∈ R^d`` denote the hidden state\nentering layer ``l``, and ``f_l(h_l)`` the output of the layer's\nmixer + FFN. The residual updates ``h_l → h_{l+1}`` according to\nthe chosen strategy:\n\n1. ``\"standard\"`` (default): ``h_{l+1} = h_l + f_l(h_l)`` — fixed\n   unit-weight sum. Backwards-compatible with all pre-AttnRes\n   checkpoints. Stateless, no extra parameters.\n\n2. ``\"none\"`` (experimental): ``h_{l+1} = f_l(h_l)`` — drops the\n   skip connection entirely. Useful as an ablation probe but\n   unstable for deep stacks. Stateless, no extra parameters.\n\n3. ``\"full_attn\"`` (Full AttnRes, paper §3.1):\n   ``h_{l+1} = Σ_{i=0}^{l} α_{i→l} · v_i`` where ``v_0 = h_1``\n   (token embedding) and ``v_{i≥1} = f_i(h_i)``.\
          \ The attention\n   weights are ``α_{i→l} = softmax_i(w_l^T · RMSNorm(v_i))`` with\n   a learned per-layer pseudo-query ``w_l ∈ R^d``. Adds\n   ``num_layers · hidden_size`` parameters (one ``w_l`` per layer).\n\n4. ``\"block_attn\"`` (Block AttnRes, paper §3.2): partitions the\n   ``L`` logical layers into ``N`` blocks. Within a block, layer\n   outputs accumulate as a standard partial sum. Across blocks,\n   attention is applied over the ``N`` block representations + the\n   running partial sum. ``N`` interpolates between Full AttnRes\n   (``N = L``) and standard residuals (``N = 1``); the paper's\n   empirical sweet spot is ``N ≈ 8``.\n\n**Integration with mHC (Manifold-Constrained Hyper-Connections).**\nAttnRes variants can be combined with mHC. The ``mhc_stream_mode``\nfield selects whether attention is applied per stream\n(``\"independent\"``, ``n`` parallel attentions) or jointly over the\nflattened ``nC`` projection (``\"joint\"``).\n\n**Mixture-of-Depths (MoD) compatibility.**\
          \ MoD operates on token\nrouting within a layer and is orthogonal to the residual choice.\nAttnRes variants can be combined with MoD; only the tokens selected\nby MoD contribute to the layer-output buffer / partial sum.\n\n**Reference:** Sun et al., \"Attention Residuals\" (paper: arxiv:2603.15031).\nThe standard residual is from He et al. (2015), \"Deep Residual\nLearning for Image Recognition\" (paper: arxiv:1512.03385).\n\n**References:** (paper: arxiv:1512.03385) (paper:\nhttps://proceedings.neurips.cc/paper_files/paper/2015/hash/a58f4765a99bf77336cf034926677066-Abstract.html)\n(paper: arxiv:2603.15031)"
        description_es: "Configuración de la estrategia de conexión residual entre capas\nconsecutivas. Implementa las cuatro variantes discutidas en el\npaper de Attention Residuals (paper: arxiv:2603.15031) más la conexión\nresidual estándar clásica.\n\n**Planteamiento matemático.** Sea ``h_l ∈ R^d`` el estado oculto\nque entra en la capa ``l`` y ``f_l(h_l)`` la salida del mixer +\nFFN de la capa. El residual actualiza ``h_l → h_{l+1}`` según la\nestrategia elegida:\n\n1. ``\"standard\"`` (por defecto): ``h_{l+1} = h_l + f_l(h_l)`` —\n   suma de peso unitario fijo. Compatible con todos los\n   checkpoints pre-AttnRes. Sin estado, sin parámetros extra.\n\n2. ``\"none\"`` (experimental): ``h_{l+1} = f_l(h_l)`` — elimina la\n   conexión skip por completo. Útil como sonda de ablación pero\n   inestable para arquitecturas profundas. Sin estado, sin\n   parámetros extra.\n\n3. ``\"full_attn\"`` (Full AttnRes, paper §3.1):\n   ``h_{l+1} = Σ_{i=0}^{l} α_{i→l} · v_i`` donde ``v_0 = h_1``\n   (embedding\
          \ de tokens) y ``v_{i≥1} = f_i(h_i)``. Los pesos de\n   atención son ``α_{i→l} = softmax_i(w_l^T · RMSNorm(v_i))`` con\n   un pseudo-query aprendido por capa ``w_l ∈ R^d``. Añade\n   ``num_layers · hidden_size`` parámetros (un ``w_l`` por capa).\n\n4. ``\"block_attn\"`` (Block AttnRes, paper §3.2): particiona las\n   ``L`` capas lógicas en ``N`` bloques. Dentro de un bloque, las\n   salidas de capa se acumulan como suma parcial estándar. A\n   través de los bloques, se aplica atención sobre las ``N``\n   representaciones de bloque + la suma parcial en curso. ``N``\n   interpola entre Full AttnRes (``N = L``) y residuales estándar\n   (``N = 1``); el sweet spot empírico del paper es ``N ≈ 8``.\n\n**Integración con mHC (Manifold-Constrained Hyper-Connections).**\nLas variantes AttnRes pueden combinarse con mHC. El campo\n``mhc_stream_mode`` selecciona si la atención se aplica por stream\n(``\"independent\"``, ``n`` atenciones en paralelo) o conjuntamente\nsobre la proyección aplanada\
          \ ``nC`` (``\"joint\"``).\n\n**Compatibilidad con Mixture-of-Depths (MoD).** MoD opera sobre\nenrutamiento de tokens dentro de una capa y es ortogonal a la\nelección residual. Las variantes AttnRes pueden combinarse con MoD;\nsolo los tokens seleccionados por MoD contribuyen al buffer de\nsalidas / suma parcial de capa.\n\n**Referencia:** Sun et al., \"Attention Residuals\" (paper: arxiv:2603.15031).\nEl residual estándar proviene de He et al. (2015), \"Deep Residual\nLearning for Image Recognition\" (paper: arxiv:1512.03385).\n\n**Referencias:** (paper: arxiv:1512.03385) (paper:\nhttps://proceedings.neurips.cc/paper_files/paper/2015/hash/a58f4765a99bf77336cf034926677066-Abstract.html)\n(paper: arxiv:2603.15031)"
        properties:
          type:
            type: string
            title: Residual Type
            title_es: Tipo de Residual
            description: 'Selects the residual-connection strategy applied between

              consecutive transformer layers. See the module-level description

              for the mathematical formulation of each option.


              **Impact:** The default `standard` is the original Transformer

              residual and is the safest choice. `full_attn` and `block_attn`

              add depth-wise softmax attention and yield better quality at the

              cost of additional memory/compute (one learned query vector per

              layer + a buffer of layer outputs). `none` is experimental and

              should only be used as an ablation probe.


              **References:** (paper: arxiv:1512.03385) (paper: arxiv:2603.15031)

              '
            description_es: 'Selecciona la estrategia de conexión residual aplicada entre

              capas transformer consecutivas. Ver la descripción del módulo

              para la formulación matemática de cada opción.


              **Impacto:** El `standard` por defecto es el residual Transformer

              original y es la opción más segura. `full_attn` y `block_attn`

              añaden atención softmax sobre la profundidad y producen mejor

              calidad a costa de memoria/cómputo extra (un vector de query

              aprendido por capa + un buffer de salidas de capa). `none` es

              experimental y debe usarse solo como sonda de ablación.


              **Referencias:** (paper: arxiv:1512.03385) (paper: arxiv:2603.15031)

              '
            enum:
            - block_attn
            - full_attn
            - none
            - standard
            default: standard
            examples:
            - standard
            - full_attn
            - block_attn
          full_attn:
            type: object
            additionalProperties: false
            title: Full Attention Residuals
            title_es: Residuales de Atención Completa
            description: 'Hyper-parameters for the `full_attn` residual type. Ignored for

              all other `type` values.


              **References:** (paper: arxiv:2603.15031)

              '
            description_es: 'Hiperparámetros para el tipo de residual `full_attn`. Se ignoran

              para todos los demás valores de `type`.


              **Referencias:** (paper: arxiv:2603.15031)

              '
            properties:
              init_query_zero:
                type: boolean
                title: Zero-Init Query Vectors
                title_es: Inicialización a Cero de los Vectores de Query
                description: 'If `true`, initialise every per-layer query vector ``w_l``

                  to zero. The paper (§5) shows this is critical: at init the

                  softmax is uniform so AttnRes degenerates to an equal-weight

                  average of all previous outputs, matching the standard

                  residual and avoiding training volatility. If `false`, the

                  queries are random-initialised (rarely useful).


                  **References:** (paper: arxiv:2603.15031)

                  '
                description_es: 'Si es `true`, inicializa cada vector de query por capa

                  ``w_l`` a cero. El paper (§5) muestra que esto es crítico:

                  al inicio, el softmax es uniforme, por lo que AttnRes

                  degenera a un promedio equiponderado de todas las salidas

                  previas, igualando el residual estándar y evitando

                  volatilidad de entrenamiento. Si es `false`, los queries se

                  inicializan aleatoriamente (rara vez útil).


                  **Referencias:** (paper: arxiv:2603.15031)

                  '
                default: true
                examples:
                - true
              use_rmsnorm_keys:
                type: boolean
                title: RMSNorm on Keys
                title_es: RMSNorm en las Keys
                description: 'If `true` (paper §3.1 default), apply RMSNorm to the source

                  vectors ``v_i`` before the dot product with ``w_l``. This

                  prevents layers with naturally large magnitudes from

                  dominating the softmax. Ablations in §5.3 show a measurable

                  degradation without RMSNorm.


                  **References:** (paper: arxiv:2603.15031) (paper: arxiv:1910.07467)

                  '
                description_es: 'Si es `true` (paper §3.1 por defecto), aplica RMSNorm a los

                  vectores fuente ``v_i`` antes del producto punto con ``w_l``.

                  Esto evita que capas con magnitudes naturalmente grandes

                  dominen el softmax. Las ablaciones en §5.3 muestran una

                  degradación medible sin RMSNorm.


                  **Referencias:** (paper: arxiv:2603.15031) (paper: arxiv:1910.07467)

                  '
                default: true
                examples:
                - true
          block_attn:
            type: object
            additionalProperties: false
            title: Block Attention Residuals
            title_es: Residuales de Atención por Bloques
            description: 'Hyper-parameters for the `block_attn` residual type. Ignored for

              all other `type` values.


              **References:** (paper: arxiv:2603.15031)

              '
            description_es: 'Hiperparámetros para el tipo de residual `block_attn`. Se

              ignoran para todos los demás valores de `type`.


              **Referencias:** (paper: arxiv:2603.15031)

              '
            properties:
              num_blocks:
                type: integer
                title: Number of Block Representations (N)
                title_es: Número de Representaciones de Bloque (N)
                description: "Number of block representations ``N`` stored across the\nforward pass. The trade-off is:\n\n- ``N = L`` (one block per layer): reduces to Full AttnRes.\n  Maximum cross-layer history, maximum memory.\n- ``N ≈ 8`` (paper sweet spot): recovers most of Full\n  AttnRes's gain at constant memory ``O(Nd)`` per token.\n- ``N = 1``: standard residual with the embedding isolated\n  as ``b_0``.\n\nSmaller ``N`` reduces memory and inter-block communication\ncost (paper §4) at a modest quality cost. Larger ``N`` is\nmore expressive but more expensive.\n\nMust satisfy ``N ≤ num_layers × num_loops`` (the total\nlogical depth).\n\n**References:** (paper: arxiv:2603.15031)\n"
                description_es: "Número de representaciones de bloque ``N`` almacenadas\ndurante el forward. El trade-off es:\n\n- ``N = L`` (un bloque por capa): reduce a Full AttnRes.\n  Máximo historial cross-layer, máxima memoria.\n- ``N ≈ 8`` (sweet spot del paper): recupera la mayor parte\n  de la ganancia de Full AttnRes con memoria constante\n  ``O(Nd)`` por token.\n- ``N = 1``: residual estándar con el embedding aislado\n  como ``b_0``.\n\nMenor ``N`` reduce memoria y costo de comunicación inter-\nbloque (paper §4) a un costo modesto de calidad. Mayor\n``N`` es más expresivo pero más caro.\n\nDebe satisfacer ``N ≤ num_layers × num_loops`` (la\nprofundidad lógica total).\n\n**Referencias:** (paper: arxiv:2603.15031)\n"
                minimum: 1
                default: 8
                examples:
                - 8
              init_query_zero:
                type: boolean
                title: Zero-Init Query Vectors
                title_es: Inicialización a Cero de los Vectores de Query
                description: 'If `true` (paper default), initialise every per-layer query

                  ``w_l`` to zero so the initial attention is uniform. Same

                  rationale as in `full_attn.init_query_zero`.


                  **References:** (paper: arxiv:2603.15031)

                  '
                description_es: 'Si es `true` (paper por defecto), inicializa cada query por

                  capa ``w_l`` a cero, de modo que la atención inicial sea

                  uniforme. Misma justificación que en

                  `full_attn.init_query_zero`.


                  **Referencias:** (paper: arxiv:2603.15031)

                  '
                default: true
                examples:
                - true
              use_rmsnorm_keys:
                type: boolean
                title: RMSNorm on Keys
                title_es: RMSNorm en las Keys
                description: 'If `true` (paper default), apply RMSNorm to the source block

                  representations before the dot product. Especially

                  important for Block AttnRes because block sums grow with

                  block depth — without RMSNorm, later blocks dominate the

                  softmax.


                  **References:** (paper: arxiv:2603.15031) (paper: arxiv:1910.07467)

                  '
                description_es: 'Si es `true` (paper por defecto), aplica RMSNorm a las

                  representaciones de bloque fuente antes del producto punto.

                  Especialmente importante para Block AttnRes porque las sumas

                  de bloque crecen con la profundidad del bloque — sin

                  RMSNorm, los bloques posteriores dominan el softmax.


                  **Referencias:** (paper: arxiv:2603.15031) (paper: arxiv:1910.07467)

                  '
                default: true
                examples:
                - true
          mhc_stream_mode:
            type: string
            title: AttnRes × mHC Stream Mode
            title_es: Modo de Stream AttnRes × mHC
            description: "How the depth-wise attention interacts with mHC's ``n``-stream\nresidual. Only relevant when both `residuals.type` is\n`full_attn` or `block_attn` AND `model.mhc.enabled` is `true`.\nSee also: `model.mhc.checkpoint` / `residuals.gradient_checkpoint`\n(independent memory-saving switches).\n\n- `\"independent\"`: apply depth-wise attention **per stream**.\n  Each of the ``n`` streams maintains its own attention weights\n  over the previous layer outputs. Matches the paper's framing\n  where each stream is a parallel \"view\" of the residual.\n  Parameter count: ``n × num_layers × hidden_size`` query\n  vectors (the AttnRes module broadcasts over streams).\n\n- `\"joint\"`: apply a single depth-wise attention over the\n  flattened ``n × hidden_size`` projection of each source.\n  Treats all streams as one fat residual. More expressive but\n  also more parameter-hungry and slower to train.\n\n**References:** (paper: arxiv:2603.15031) (paper: arxiv:2512.24880)\n"
            description_es: "Cómo interactúa la atención sobre la profundidad con el\nresidual de ``n`` streams de mHC. Solo relevante cuando\n`residuals.type` es `full_attn` o `block_attn` Y\n`model.mhc.enabled` es `true`.\n\n- `\"independent\"`: aplica atención sobre la profundidad **por\n  stream**. Cada uno de los ``n`` streams mantiene sus\n  propios pesos de atención sobre las salidas de capa\n  previas. Coincide con el encuadre del paper donde cada\n  stream es una \"vista\" paralela del residual. Número de\n  parámetros: ``n × num_layers × hidden_size`` vectores de\n  query (el módulo AttnRes hace broadcast sobre los streams).\n\n- `\"joint\"`: aplica una única atención sobre la proyección\n  aplanada ``n × hidden_size`` de cada fuente. Trata todos\n  los streams como un único residual grueso. Más expresivo\n  pero también más hambriento de parámetros y más lento de\n  entrenar.\n\n**Referencias:** (paper: arxiv:2603.15031) (paper: arxiv:2512.24880)\n"
            enum:
            - independent
            - joint
            default: independent
            examples:
            - independent
          gradient_checkpoint:
            type: boolean
            title: Gradient Checkpointing
            title_es: Gradient Checkpointing
            description: 'If `true`, wrap the AttnRes attention computation in

              `torch.utils.checkpoint.checkpoint` to trade memory for one

              extra forward pass during backpropagation. Useful for very

              deep models where storing all layer outputs (Full AttnRes) or

              the full per-block history (Block AttnRes) is too expensive.


              No effect when `residuals.type` is `standard` or `none`.

              Independent from `model.mhc.checkpoint`; enable both when combining mHC

              with AttnRes.

              '
            description_es: 'Si es `true`, envuelve el cómputo de atención de AttnRes en

              `torch.utils.checkpoint.checkpoint` para intercambiar memoria

              por un forward pass extra durante la retropropagación. Útil

              para modelos muy profundos donde almacenar todas las salidas

              de capa (Full AttnRes) o el historial completo por bloque

              (Block AttnRes) es demasiado caro.


              Sin efecto cuando `residuals.type` es `standard` o `none`.

              Independiente de `model.mhc.checkpoint`; habilitar ambos al combinar mHC

              con AttnRes.

              '
            default: false
            examples:
            - false
  training:
    type: object
    title: Training Configuration
    title_es: Configuración de Entrenamiento
    description: 'Training hyperparameters and runtime configuration. Includes task-specific settings

      (MLM/SBERT/Causal-LM), data loading, optimization, checkpointing, logging, and hardware management.

      Controls the entire training pipeline from data ingestion to model saving.

      Keys that are not fields of ``TrainingConfig`` (e.g. ``batch_size``, ``num_epochs``, ``max_length``, data-loading/cache keys, and the vision task sub-blocks) are collected into the runtime dictionary consumed by ``main.py`` / ``engine.py``; ``TrainingConfig`` owns optimizer, scheduler, stability, checkpointing and telemetry fields. **References:** (paper: arxiv:1810.04805)'
    description_es: 'Hiperparámetros de entrenamiento y configuración de ejecución. Incluye configuraciones

      específicas de tarea (MLM/SBERT/Causal-LM), carga de datos, optimización, checkpointing, logging y gestión

      de hardware. Controla todo el pipeline de entrenamiento desde ingesta de datos hasta guardado del modelo.

      Las claves que no son campos de ``TrainingConfig`` (p. ej. ``batch_size``, ``num_epochs``, ``max_length``, claves de carga/caché de datos y los sub-bloques de tareas de visión) se recopilan en el diccionario de runtime consumido por ``main.py`` / ``engine.py``; ``TrainingConfig`` posee los campos de optimizador, scheduler, estabilidad, checkpointing y telemetría. **Referencias:** (paper: arxiv:1810.04805)'
    additionalProperties: false
    required:
    - task
    properties:
      task:
        type: string
        title: Training Task
        title_es: Tarea de Entrenamiento
        description: "Training task type.\n- `mlm`: Masked Language Modeling — tokens are masked and predicted (BERT-style pre-training).\n  Requires `training.optimizer` configuration.\n- `sbert`: Sentence-BERT fine-tuning — contrastive learning on sentence pairs/triplets for\n  semantic embeddings. Requires `training.sbert` subsection.\n- `causal_lm`: Causal Language Modeling — autoregressive next-token prediction (GPT-style pre-training).\n  Each token predicts the following token; cross-entropy loss is computed over all shifted positions\n  (no masking). Requires `model_class: frankenstein_text_decoder` and `training.optimizer` configuration.\n- `text_classification`: Supervised sequence-level classification on tokenized text.\n  Uses the encoder's classification head (Strategy A); batches carry\n  `input_ids`, `attention_mask` and integer class `labels`. Requires `training.optimizer` configuration.\n- `asr`: Automatic speech recognition on raw audio (Conformer (paper: arxiv:2005.08100)).\n\
          \  Batches carry `waveform`, `labels` (character token ids), `input_lengths` and `target_lengths`;\n  the loss is CTC (`audio.asr_loss: ctc`) or RNN-Transducer (`audio.asr_loss: transducer`,\n  (paper: arxiv:1211.3711)). Requires `model_class: frankenstein_audio`, the `audio:` and\n  `audio_dataset:` blocks, and `training.optimizer` configuration.\n- `audio_classification`: Supervised audio/signal classification (audio events, EEG, EMG, ...).\n  Uses the audio classification head over a pooled representation (`audio.pooling_mode`);\n  batches carry `waveform` and integer class `labels`. Requires `model_class: frankenstein_audio`,\n  the `audio:` and `audio_dataset:` blocks, and `training.optimizer` configuration.\n\n**Impact:** Defines the training objective. `mlm` is for language understanding;\n`sbert` is for semantic similarity and retrieval; `causal_lm` is for autoregressive text generation;\n`text_classification` is for labelled text classification; `asr` is for speech transcription;\n\
          `audio_classification` is for audio/sensor tagging. **References:** `mlm` (paper: arxiv:1810.04805); `sbert` (paper: arxiv:1908.10084); `causal_lm` (paper: arxiv:1706.03762); `text_classification` (paper: arxiv:1810.04805); `asr` (paper: arxiv:2005.08100) (paper: https://doi.org/10.1145/1143844.1143891) (paper: arxiv:1211.3711); `audio_classification` (paper: arxiv:2005.08100); `patch_prediction` (paper: arxiv:2111.06377); `classification` (paper: arxiv:2010.11929); `segmentation` (paper: arxiv:2503.19108)"
        description_es: "Tipo de tarea de entrenamiento.\n- `mlm`: Masked Language Modeling — los tokens se enmascaran y predicen (preentrenamiento estilo BERT).\n  Requiere configuración `training.optimizer`.\n- `sbert`: Sentence-BERT fine-tuning — aprendizaje contrastivo en pares/tripletes para\n  embeddings semánticos. Requiere subsección `training.sbert`.\n- `causal_lm`: Causal Language Modeling — predicción autorregresiva de siguiente token (preentrenamiento estilo GPT).\n  Cada token predice el siguiente; la pérdida de cross-entropy se calcula sobre todas las posiciones desplazadas\n  (sin enmascaramiento). Requiere `model_class: frankenstein_text_decoder` y configuración `training.optimizer`.\n- `text_classification`: Clasificación supervisada a nivel de secuencia sobre texto tokenizado.\n  Usa la cabeza de clasificación del encoder (Estrategia A); los batches llevan `input_ids`,\n  `attention_mask` y `labels` enteros. Requiere configuración `training.optimizer`.\n- `asr`: Reconocimiento\
          \ automático del habla sobre audio crudo (Conformer (paper: arxiv:2005.08100)).\n  Los batches llevan `waveform`, `labels` (ids de caracteres), `input_lengths` y `target_lengths`;\n  la pérdida es CTC (`audio.asr_loss: ctc`) o RNN-Transducer (`audio.asr_loss: transducer`,\n  (paper: arxiv:1211.3711)). Requiere `model_class: frankenstein_audio`, los bloques `audio:` y\n  `audio_dataset:`, y configuración `training.optimizer`.\n- `audio_classification`: Clasificación supervisada de audio/señales (eventos de audio, EEG, EMG, ...).\n  Usa la cabeza de clasificación de audio sobre una representación agrupada (`audio.pooling_mode`);\n  los batches llevan `waveform` y `labels` enteros. Requiere `model_class: frankenstein_audio`,\n  los bloques `audio:` y `audio_dataset:`, y configuración `training.optimizer`.\n\n**Impacto:** Define el objetivo de entrenamiento. `mlm` es para comprensión de lenguaje;\n`sbert` es para similitud semántica; `causal_lm` es para generación de texto autorregresiva;\n\
          `text_classification` es para clasificación de texto etiquetado; `asr` es para transcripción de habla;\n`audio_classification` es para etiquetado de audio/sensores. **Referencias:** `mlm` (paper: arxiv:1810.04805); `sbert` (paper: arxiv:1908.10084); `causal_lm` (paper: arxiv:1706.03762); `text_classification` (paper: arxiv:1810.04805); `asr` (paper: arxiv:2005.08100) (paper: https://doi.org/10.1145/1143844.1143891) (paper: arxiv:1211.3711); `audio_classification` (paper: arxiv:2005.08100); `patch_prediction` (paper: arxiv:2111.06377); `classification` (paper: arxiv:2010.11929); `segmentation` (paper: arxiv:2503.19108)"
        enum:
        - mlm
        - sbert
        - causal_lm
        - patch_prediction
        - classification
        - segmentation
        - text_classification
        - asr
        - audio_classification
        examples:
        - mlm
      supervisor:
        type: string
        default: auto
        title: Training Supervisor Mode
        title_es: Modo Supervisor de Entrenamiento
        description: 'Runtime control for the GPU-temperature supervisor subprocess.

          - `auto`: spawn the CPU-side supervisor subprocess when running on CUDA with `gpu_temp_guard_enabled=true` (legacy CLI behavior).

          - `off`: run training in-process in the current process (no child subprocess spawned). The GPU thermal guard still operates as an in-process polling loop where supported. Required when driving training from an embedding host (e.g. a DashAI Huey worker) that already manages its own process lifecycle.


          **Impact:** `off` avoids nested supervisor/child subprocesses conflicting with an external job-queue lifecycle; `auto` preserves the standalone CLI behavior.'
        description_es: 'Control en runtime del subproceso supervisor de temperatura GPU.

          - `auto`: genera el subproceso supervisor de CPU cuando se entrena en CUDA con `gpu_temp_guard_enabled=true` (comportamiento CLI heredado).

          - `off`: entrena en-proceso en el proceso actual (sin generar subproceso hijo). El guard térmico GPU sigue operando como un bucle de polling en-proceso donde se soporte. Necesario al orquestar el entrenamiento desde un host embebido (p. ej. un worker Huey de DashAI) que ya gestiona su propio ciclo de vida de proceso.


          **Impacto:** `off` evita que subprocesos supervisor/hijo anidados entren en conflicto con un ciclo de vida de cola de trabajos externo; `auto` preserva el comportamiento CLI independiente.'
        enum:
        - auto
        - false
        examples:
        - auto
      seed:
        type: integer
        default: 42
        minimum: 0
        title: Reproducibility Seed
        title_es: Semilla de Reproducibilidad
        description: 'Seed for the whole training run. It initializes the Python, NumPy, PyTorch and CUDA random generators, model weight initialization, every DataLoader shuffle generator and worker, the held-out test-split permutation (`test_percentage`) and the SBERT dataset shuffle. CUDA runs also enable deterministic cuDNN (`cudnn.deterministic=true`, `cudnn.benchmark=false`), which can cost some throughput but makes repeated runs on the same hardware and software stack reproducible.


          **Impact:** The same configuration, seed and data produce the same weight initialization, batch order and held-out split. Change it to explore a different random trajectory; keep it fixed to reproduce or debug a run.

          '
        description_es: 'Semilla de toda la ejecución de entrenamiento. Inicializa los generadores aleatorios de Python, NumPy, PyTorch y CUDA, la inicialización de pesos del modelo, el generador y los workers de mezcla de cada DataLoader, la permutación del conjunto de test reservado (`test_percentage`) y la mezcla del dataset de SBERT. Las ejecuciones en CUDA activan además cuDNN determinista (`cudnn.deterministic=true`, `cudnn.benchmark=false`), lo que puede costar algo de rendimiento pero hace reproducibles las ejecuciones repetidas con el mismo hardware y software.


          **Impacto:** La misma configuración, semilla y datos producen la misma inicialización de pesos, orden de lotes y partición reservada. Cámbiala para explorar una trayectoria aleatoria distinta; mantenla fija para reproducir o depurar una ejecución.

          '
        examples:
        - 42
      num_epochs:
        type: integer
        title: Training Epochs
        title_es: Épocas de Entrenamiento
        description: 'Complete passes through the training dataset (MLM only). Typical: 1–3 (large datasets, billions of tokens), 5–10 (medium, millions), 10–20+ (small). Monitor validation loss. For SBERT, use `sbert.num_epochs` instead.


          **Impact:** More epochs = better learning but risk of overfitting. Early stopping recommended.

          '
        description_es: 'Pasadas completas por el dataset de entrenamiento (solo MLM). Típico: 1–3 (datasets grandes, miles de millones de tokens), 5–10 (medios, millones), 10–20+ (pequeños). Monitorear pérdida de validación. Para SBERT, usar `sbert.num_epochs`.


          **Impacto:** Más épocas = mejor aprendizaje pero riesgo de sobreajuste. Early stopping recomendado.

          '
        examples:
        - 5
      batch_size:
        type: integer
        title: Training Batch Size
        title_es: Tamaño de Lote de Entrenamiento
        description: 'Examples per optimizer step (before gradient accumulation). Depends on GPU memory:

          2–8 (8GB), 8–32 (16GB), 32–64 (40GB+). Effective batch = `batch_size × gradient_accumulation_steps`.

          Larger batches = more stable gradients, may need higher LR (linear scaling rule).


          **Examples explained:**

          - `batch_size=4, gradient_accumulation_steps=4`: Effective batch = 16. Good for 8–16GB GPUs with BERT-base (768 hidden). Each step processes 4 samples, accumulates over 4 micro-batches, then updates. LR should follow linear scaling from a reference batch size.

          - `batch_size=8, gradient_accumulation_steps=8`: Effective batch = 64. Common for larger GPUs (24GB+). More stable gradients, better for training stability. Increase LR proportionally.

          - `batch_size=1, gradient_accumulation_steps=32`: Effective batch = 32. For extremely memory-constrained scenarios. Single sample per micro-batch, many accumulation steps. Training is slower per epoch but uses minimal GPU memory.

          - LR scaling rule: If you double the effective batch size, double the learning rate approximately. Start with a reference (e.g., batch=32, lr=1e-4) and scale linearly.'
        description_es: 'Ejemplos por paso del optimizador (antes de acumulación de gradientes). Depende de memoria GPU:

          2–8 (8GB), 8–32 (16GB), 32–64 (40GB+). Lote efectivo = `batch_size × gradient_accumulation_steps`.

          Lotes más grandes = gradientes más estables, pueden necesitar LR más alto (regla de escalado lineal).


          **Ejemplos explicados:**

          - `batch_size=4, gradient_accumulation_steps=4`: Lote efectivo = 16. Bueno para GPUs de 8–16GB con BERT-base (768 hidden). Cada paso procesa 4 muestras, acumula sobre 4 micro-lotes, luego actualiza. LR debe seguir escalado lineal desde un tamaño de lote de referencia.

          - `batch_size=8, gradient_accumulation_steps=8`: Lote efectivo = 64. Común para GPUs más grandes (24GB+). Gradientes más estables, mejor para estabilidad de entrenamiento. Aumentar LR proporcionalmente.

          - `batch_size=1, gradient_accumulation_steps=32`: Lote efectivo = 32. Para escenarios extremadamente limitados en memoria. Una sola muestra por micro-lote, muchos pasos de acumulación. Entrenamiento más lento por época pero usa memoria GPU mínima.

          - Regla de escalado de LR: Si duplicas el tamaño de lote efectivo, duplica aproximadamente el learning rate. Empezar con una referencia (ej., batch=32, lr=1e-4) y escalar linealmente.'
        examples:
        - 4
      dataloader_workers:
        type: integer
        default: 2
        title: Dataloader Workers
        title_es: Workers de Carga de Datos
        description: 'Parallel worker processes for data loading/preprocessing. Typical: 0 (main process), 2–4 (small), 8–16 (large). More workers reduce I/O bottlenecks. Limited by CPU cores.


          **Impact:** Increase until CPU is maxed out. Too many workers cause CPU contention.

          '
        description_es: 'Procesos worker paralelos para carga y preprocesamiento de datos. Típico: 0 (proceso principal), 2–4 (pequeño), 8–16 (grande). Más workers reducen cuellos de botella I/O. Limitado por núcleos de CPU.


          **Impacto:** Aumentar hasta que CPU llegue al límite. Demasiados workers causan contención de CPU.

          '
        examples:
        - 2
      max_length:
        type: integer
        default: 512
        title: Max Sequence Length
        title_es: Longitud Máxima de Secuencia
        description: 'Maximum token sequence length. 128 (short), 256 (moderate), 512 (BERT standard), 1024+ (long docs).

          Memory cost: O(seq_len²) for standard attention. For sequences > 512, use sparse attention layers

          (`longformer`, `bigbird`, `sparsek`, `nsa`) in `layer_pattern`.


          **Examples explained:**

          - `max_length=128`: Short sequences. Fast training, low memory. Good for sentence-level tasks (classification, NER). Not suitable for document understanding.

          - `max_length=512`: BERT standard. Good balance for most NLP tasks. Covers most paragraphs and medium-length documents. ~110M params model uses ~2GB for attention with batch_size=4.

          - `max_length=1024`: Long documents. Use with sparse attention layers to manage memory. Without sparse attention, memory quadruples vs. 512. Good for QA over long contexts.

          - `max_length=2048+`: Very long contexts. Requires sparse attention (Longformer, BigBird) or recurrent/SSM layers (retnet, mamba) to keep memory manageable. Training is significantly slower. Consider `join_temp_data_context_window` for proper sequence construction. **References:** (paper: arxiv:1810.04805)'
        description_es: 'Longitud máxima de secuencia de tokens. 128 (corto), 256 (moderado), 512 (estándar BERT), 1024+ (documentos largos).

          Costo de memoria: O(seq_len²) para atención estándar. Para secuencias > 512, usar capas de atención dispersa

          (`longformer`, `bigbird`, `sparsek`, `nsa`) en `layer_pattern`.


          **Ejemplos explicados:**

          - `max_length=128`: Secuencias cortas. Entrenamiento rápido, baja memoria. Bueno para tareas a nivel de oración (clasificación, NER). No apto para comprensión de documentos.

          - `max_length=512`: Estándar BERT. Buen balance para la mayoría de tareas NLP. Cubre la mayoría de párrafos y documentos de longitud media. Modelo ~110M params usa ~2GB para atención con batch_size=4.

          - `max_length=1024`: Documentos largos. Usar con capas de atención dispersa para manejar memoria. Sin atención dispersa, la memoria se cuadruplica vs. 512. Bueno para QA sobre contextos largos.

          - `max_length=2048+`: Contextos muy largos. Requiere atención dispersa (Longformer, BigBird) o capas recurrentes/SSM (retnet, mamba) para mantener memoria manejable. Entrenamiento significativamente más lento. Considerar `join_temp_data_context_window` para construcción adecuada de secuencias. **Referencias:** (paper: arxiv:1810.04805)'
        examples:
        - 512
      mlm_probability:
        type: number
        default: 0.15
        title: MLM Masking Probability
        title_es: Probabilidad de Enmascaramiento MLM
        description: 'Fraction of tokens masked for MLM prediction. Standard: 0.15 (15%). Breakdown of masked tokens:

          80% → [MASK] token, 10% → random token, 10% → unchanged.


          **Examples explained:**

          - `0.15`: Standard BERT masking. 15% of tokens are selected for masking. Of those: 80% replaced with [MASK], 10% with random token, 10% kept unchanged. This forces the model to learn bidirectional representations.

          - `0.20`: More aggressive masking. Forces stronger representation learning but risks degrading downstream performance if too many tokens are corrupted. Useful for very large datasets where the model needs stronger pre-training signal.

          - `0.10`: Lighter masking. Less pre-training signal per batch but preserves more original context. Can be useful for smaller models or fine-tuning stages.

          - `0.30+`: Very aggressive. Generally not recommended — degrades quality as too many tokens are corrupted. The model struggles to learn meaningful representations. **References:** (paper: arxiv:1810.04805)'
        description_es: 'Fracción de tokens enmascarados para predicción MLM. Estándar: 0.15 (15%). Desglose de tokens enmascarados:

          80% → token [MASK], 10% → token aleatorio, 10% → sin cambio.


          **Ejemplos explicados:**

          - `0.15`: Enmascaramiento BERT estándar. 15% de tokens se seleccionan para enmascaramiento. De esos: 80% reemplazados con [MASK], 10% con token aleatorio, 10% se mantienen sin cambio. Esto fuerza al modelo a aprender representaciones bidireccionales.

          - `0.20`: Enmascaramiento más agresivo. Fuerza aprendizaje de representaciones más fuerte pero arriesga degradar rendimiento downstream si demasiados tokens están corruptos. Útil para datasets muy grandes donde el modelo necesita señal de preentrenamiento más fuerte.

          - `0.10`: Enmascaramiento más ligero. Menos señal de preentrenamiento por lote pero preserva más contexto original. Puede ser útil para modelos más pequeños o etapas de fine-tuning.

          - `0.30+`: Muy agresivo. Generalmente no recomendado — degrada calidad porque demasiados tokens están corruptos. El modelo tiene dificultad para aprender representaciones significativas. **Referencias:** (paper: arxiv:1810.04805)'
        examples:
        - 0.15
      max_samples:
        type: integer
        default: 20000000
        title: Max Training Samples
        title_es: Máximo de Muestras de Entrenamiento
        description: 'Total samples before stopping, independent of epochs. Limits training on large datasets.

          Set very high (e.g., 100,000,000) to effectively disable. Stops at `min(num_epochs × dataset_size, max_samples)`.


          **Impact:** Useful for controlled experiments or progressive training without clear epoch limits.

          '
        description_es: 'Total de muestras antes de detenerse, independiente de épocas. Limita entrenamiento en datasets grandes.

          Valor muy alto (ej., 100,000,000) para deshabilitar. Para en `min(num_epochs × dataset_size, max_samples)`.


          **Impacto:** Útil para experimentos controlados o entrenamiento progresivo sin límites de época claros.

          '
        examples:
        - 20000000
      test_percentage:
        type: number
        default: 0
        minimum: 0
        maximum: 100
        title: Held-Out Test Percentage
        title_es: Porcentaje de Test Reservado
        description: 'Percentage of the task dataset held out from training and used for the end-of-training evaluation (``0`` disables the split).

          The partition is deterministic (seeded by `training.seed`): the same configuration always reserves the same examples, whatever the DataLoader shuffle order. Training sees only the complementary part; after the last epoch the final weights are evaluated on the held-out part with the task objective and the result is written to ``test_metrics.json`` next to the CSV log (fields: ``task``, ``metric``, ``test_percentage``, ``num_train_samples``, ``num_test_samples``, ``test_loss``, ``test_accuracy``, ``test_macro_f1``, ``test_balanced_accuracy``, ``test_weighted_f1``, ``stratified``, ``primary_metric``, ``per_class``, ``confusion_matrix``, ``num_batches``). Classification tasks are stratified by default (see `training.test_stratify`), and the exact indices are written to ``test_split.json``.

          Applies to ``mlm``, ``causal_lm``, ``text_classification``, the three vision tasks, ``asr`` and ``audio_classification``. For ``asr`` the reported value is the character error rate (lower is better), labelled ``metric: cer``. SBERT manages its own validation split (``training.sbert.max_eval_samples``) and is not affected.

          Typical: 10–20. **Impact:** a held-out split costs training examples but gives an unbiased accuracy estimate without a separate evaluation run.

          '
        description_es: 'Porcentaje del dataset de la tarea reservado fuera del entrenamiento y usado para la evaluación al finalizar (``0`` desactiva la partición).

          La partición es determinista (sembrada por `training.seed`): la misma configuración siempre reserva los mismos ejemplos, sea cual sea el orden de mezcla del DataLoader. El entrenamiento ve solo la parte complementaria; tras la última época se evalúan los pesos finales sobre la parte reservada con el objetivo de la tarea y el resultado se escribe en ``test_metrics.json`` junto al log CSV (campos: ``task``, ``metric``, ``test_percentage``, ``num_train_samples``, ``num_test_samples``, ``test_loss``, ``test_accuracy``, ``test_macro_f1``, ``test_balanced_accuracy``, ``test_weighted_f1``, ``stratified``, ``primary_metric``, ``per_class``, ``confusion_matrix``, ``num_batches``). Las tareas de clasificación se estratifican por defecto (ver `training.test_stratify`) y los índices exactos se escriben en ``test_split.json``.

          Aplica a ``mlm``, ``causal_lm``, ``text_classification``, las tres tareas de visión, ``asr`` y ``audio_classification``. Para ``asr`` el valor reportado es la tasa de error de caracteres (menor es mejor), etiquetada ``metric: cer``. SBERT gestiona su propia partición de validación (``training.sbert.max_eval_samples``) y no se ve afectado.

          Típico: 10–20. **Impacto:** reservar un conjunto de test cuesta ejemplos de entrenamiento pero ofrece una estimación de precisión insesgada sin una ejecución de evaluación separada.

          '
        examples:
        - 20
      test_stratify:
        type: boolean
        default: true
        title: Stratified Held-Out Split
        title_es: Partición Reservada Estratificada
        description: 'Stratify the held-out split by class label for the classification tasks (``classification``, ``text_classification`` and ``audio_classification``). Each class keeps approximately the same share in the train and test partitions, and every class with at least two examples receives at least one test example when the requested test size allows it. This keeps rare classes from being swallowed by either side, which matters for small, imbalanced datasets where plain accuracy is misleading.

          The split stays deterministic (seeded by `training.seed`) and the exact indices are written to ``test_split.json``. Tasks without class labels (``mlm``, ``causal_lm``, ``asr``, ``segmentation``, ``patch_prediction``) and datasets that expose no label metadata (e.g. streaming sources) ignore this flag and use the seeded random split.

          **Impact:** has no cost beyond reading the labels once; disable it only to reproduce an older non-stratified run.'
        description_es: 'Estratifica la partición reservada por etiqueta de clase en las tareas de clasificación (``classification``, ``text_classification`` y ``audio_classification``). Cada clase mantiene aproximadamente la misma proporción en las particiones de entrenamiento y test, y toda clase con al menos dos ejemplos recibe al menos un ejemplo de test cuando el tamaño de test solicitado lo permite. Así las clases raras no desaparecen de ningún lado, algo importante en datasets pequeños y desbalanceados donde la exactitud simple engaña.

          La partición sigue siendo determinista (sembrada por `training.seed`) y los índices exactos se escriben en ``test_split.json``. Las tareas sin etiquetas de clase (``mlm``, ``causal_lm``, ``asr``, ``segmentation``, ``patch_prediction``) y los datasets sin metadatos de etiqueta (p. ej. fuentes en streaming) ignoran esta opción y usan la partición aleatoria sembrada.

          **Impacto:** no tiene coste salvo leer las etiquetas una vez; desactívala solo para reproducir una ejecución antigua no estratificada.'
        examples:
        - true
      dataset_batch_size:
        type: integer
        default: 25000
        title: Dataset Streaming Batch Size
        title_es: Tamaño de Lote de Streaming
        description: 'Internal batch size for streaming dataset. Typical: 10,000–50,000. Larger = less I/O, more memory.

          Independent of training `batch_size`. Tune based on storage speed.


          **Impact:** Should be a multiple of the training `batch_size` for efficiency.

          '
        description_es: 'Tamaño de lote interno para dataset de streaming. Típico: 10,000–50,000. Mayor = menos I/O, más memoria.

          Independiente del `batch_size` de entrenamiento. Ajustar según velocidad de almacenamiento.


          **Impacto:** Debe ser múltiplo del `batch_size` de entrenamiento para eficiencia.

          '
        examples:
        - 25000
      num_workers:
        type: integer
        default: 8
        title: Dataset Streaming Workers
        title_es: Workers de Streaming de Datos
        description: 'Parallel workers for dataset streaming pipeline. Typical: 4–16. More workers = less data loading latency,

          more CPU/memory. Monitor CPU utilization; reduce if bottlenecked.


          **Impact:** Adjust based on available CPU cores. 0 = single-threaded loading.

          '
        description_es: 'Workers paralelos para pipeline de streaming de datos. Típico: 4–16. Más workers = menos latencia de carga,

          más CPU/memoria. Monitorear utilización de CPU; reducir si hay cuello de botella.


          **Impacto:** Ajustar según núcleos de CPU disponibles. 0 = carga single-threaded.

          '
        examples:
        - 8
      cache_dir:
        type: string
        default: ./temp_data/v2_dataset_cache
        title: Dataset Cache Dir
        title_es: Directorio de Caché de Datos
        description: 'Directory for caching processed datasets to avoid recomputation. SSD preferred. Example: `./temp_data/v2_dataset_cache`.

          Clear cache to force re-processing on schema changes.


          **Impact:** Speeds up subsequent runs. Requires sufficient disk space.

          '
        description_es: 'Directorio para cachear datasets procesados y evitar recómputo. SSD preferido. Ejemplo: `./temp_data/v2_dataset_cache`.

          Limpiar caché para forzar reprocesamiento ante cambios de esquema.


          **Impacto:** Acelera ejecuciones subsecuentes. Requiere suficiente espacio en disco.

          '
        examples:
        - ./temp_data/v2_dataset_cache
      local_parquet_dir:
        type: string
        title: Local Parquet Dir
        title_es: Directorio de Parquet Local
        description: 'Path to local parquet files for offline streaming. Overrides remote fetching. Requires `stream_local_parquet=true`.


          **Impact:** Faster training without network dependency.

          '
        description_es: 'Ruta a archivos parquet locales para streaming offline. Anula descarga remota. Requiere `stream_local_parquet=true`.


          **Impacto:** Entrenamiento más rápido sin dependencia de red.

          '
        examples:
        - /path/to/parquet
      prefer_local_cache:
        type: boolean
        default: true
        title: Prefer Local Cache
        title_es: Preferir Caché Local
        description: 'Check local cache first before remote download. Speeds up repeated runs. Cache miss falls back to remote.


          **Impact:** Recommended for development and debugging to avoid repeated downloads.

          '
        description_es: 'Verificar caché local primero antes de descarga remota. Acelera ejecuciones repetidas. Fallback a remoto si no hay caché.


          **Impacto:** Recomendado para desarrollo y debugging para evitar descargas repetidas.

          '
        examples:
        - true
      stream_local_parquet:
        type: boolean
        default: true
        title: Stream Local Parquet
        title_es: Hacer Streaming de Parquet Local
        description: 'Stream from local parquet when `local_parquet_dir` is set. `false` may use remote even if local exists.


          **Impact:** `true` = local only (error if missing). Useful for consistent offline training.

          '
        description_es: 'Hacer streaming desde parquet local cuando `local_parquet_dir` está configurado. `false` puede usar remoto aunque exista local.


          **Impacto:** `true` = solo local (error si falta). Útil para entrenamiento offline consistente.

          '
        examples:
        - true
      join_temp_data_context_window:
        type: integer
        default: 0
        title: Join Temp Data Context Window
        title_es: Ventana de Contexto de Datos Temporales
        description: 'If >0, joins cached token chunks into sequences of this length. Example: 2000 for 2k-token sequences.

          0 = disabled. Must be ≥ `max_length`.


          **Impact:** Useful when the cache contains short segments but longer sequences are needed.

          '
        description_es: 'Si >0, une fragmentos de tokens en caché en secuencias de esta longitud. Ejemplo: 2000 para secuencias de 2k tokens.

          0 = deshabilitado. Debe ser ≥ `max_length`.


          **Impacto:** Útil cuando la caché contiene segmentos cortos pero necesitas secuencias más largas.

          '
        examples:
        - 0
        - 2000
        - 8192
      join_temp_data_min_remainder_tokens:
        type: integer
        default: 128
        title: Min Remainder Tokens
        title_es: Tokens Mínimos Restantes
        description: 'Minimum content tokens in last partial joined window to keep it. Typical: 64–256. Only when `join_temp_data_context_window > 0`.


          **Impact:** Higher = less noise, possible data waste. Lower = more data, includes very short sequences.

          '
        description_es: 'Tokens mínimos en la última ventana parcial unida para conservarla. Típico: 64–256. Solo cuando `join_temp_data_context_window > 0`.


          **Impacto:** Mayor = menos ruido, posible desperdicio de datos. Menor = más datos, incluye secuencias muy cortas.

          '
        examples:
        - 128
      use_amp:
        type: boolean
        default: false
        title: Use AMP
        title_es: Usar Precisión Mixta Automática
        description: 'Enable FP16 mixed precision. ~50% less memory, faster on GPUs with Tensor Cores (V100, A100, RTX 20/30/40). Auto gradient scaling prevents underflow.


          **Impact:** Highly recommended for modern GPUs. Monitor for NaN; disable if problems occur.

          '
        description_es: 'Habilita precisión mixta FP16. ~50% menos memoria, más rápido en GPUs con Tensor Cores. Escalado automático de gradientes previene underflow.


          **Impacto:** Altamente recomendado para GPUs modernas. Monitorear NaN; deshabilitar si hay problemas.

          '
        examples:
        - false
      gradient_accumulation_steps:
        type: integer
        default: 4
        title: Gradient Accumulation Steps
        title_es: Pasos de Acumulación de Gradientes
        description: 'Accumulate gradients over N mini-batches before optimizer step. Effective batch = `batch_size × N`.

          Example: batch_size=4, accumulation=4 → effective batch=16. LR should scale with effective batch.


          **Impact:** Enables large effective batches without increasing GPU memory. Increases time per epoch.

          '
        description_es: 'Acumular gradientes sobre N mini-lotes antes del paso del optimizador. Lote efectivo = `batch_size × N`.

          Ejemplo: batch_size=4, accumulation=4 → lote efectivo=16. LR debe escalar con lote efectivo.


          **Impacto:** Permite lotes efectivos grandes sin aumentar memoria GPU. Aumenta el tiempo por época.

          '
        examples:
        - 4
      scheduler_total_steps:
        type: integer
        default: 10000
        title: Scheduler Total Steps
        title_es: Pasos Totales del Scheduler
        description: 'Total optimizer steps for LR schedule. Formula: `(num_epochs × dataset_size) / (batch_size × gradient_accumulation_steps)`.

          Too short: schedule ends early, constant LR; too long: never reaches final LR.


          **Impact:** Overestimate for dynamic duration. Warmup and decay are computed over this value. **References:** (paper: arxiv:2405.15682)'
        description_es: 'Pasos totales del optimizador para schedule de LR. Fórmula: `(num_epochs × dataset_size) / (batch_size × gradient_accumulation_steps)`.

          Muy corto: schedule termina temprano, LR constante; muy largo: nunca alcanza LR final.


          **Impacto:** Sobreestimar para duración dinámica. Warmup y decay se calculan sobre este valor. **Referencias:** (paper: arxiv:2405.15682)'
        examples:
        - 10000
      scheduler_warmup_ratio:
        type: number
        default: 0.1
        title: Scheduler Warmup Ratio
        title_es: Ratio de Calentamiento del Scheduler
        description: 'Fraction of `scheduler_total_steps` for LR warmup. Typical: 0.05–0.1. Larger models need more warmup (0.1), smaller less (0.05).


          **Impact:** Too much warmup = wasted time with suboptimal LR. Too little = unstable early training. **References:** (paper: arxiv:1908.03265)'
        description_es: 'Fracción de `scheduler_total_steps` para calentamiento de LR. Típico: 0.05–0.1. Modelos grandes necesitan más warmup (0.1), pequeños menos (0.05).


          **Impacto:** Demasiado warmup = tiempo perdido con LR subóptimo. Muy poco = entrenamiento temprano inestable. **Referencias:** (paper: arxiv:1908.03265)'
        examples:
        - 0.1
      scheduler_type:
        type: string
        default: cosine
        title: LR Scheduler
        title_es: Scheduler de LR
        description: 'LR decay strategy.

          - `cosine`: smooth cosine decay to near-zero — **recommended for pre-training**.

          - `constant`: maintains initial LR throughout training — rarely ideal.

          - `linear_warmup_then_constant`: warms up, then holds constant — good for fine-tuning.


          **Examples explained:**

          - `cosine` with `scheduler_total_steps=10000, scheduler_warmup_ratio=0.1`: LR starts at 0, warms up linearly for 1000 steps (10%), then decays following a cosine curve to near-zero over the remaining 9000 steps. Best for training from scratch or pre-training. The smooth decay helps the model converge to a good minimum.

          - `linear_warmup_then_constant` with `scheduler_total_steps=10000, scheduler_warmup_ratio=0.1`: LR warms up for 1000 steps, then stays constant for the remaining 9000 steps. Good for fine-tuning a pretrained model where you don''t want large LR decay that could disrupt learned representations.

          - `constant`: LR stays at initial value. Simplest option but rarely optimal — no warmup means early steps can be unstable, and no decay can lead to bouncing around the minimum. **References:** (paper: arxiv:2405.15682)'
        description_es: 'Estrategia de decaimiento de LR.

          - `cosine`: decaimiento coseno suave a casi cero — **recomendado para preentrenamiento**.

          - `constant`: mantiene LR inicial durante todo el entrenamiento — raramente ideal.

          - `linear_warmup_then_constant`: calienta y luego mantiene constante — bueno para fine-tuning.


          **Ejemplos explicados:**

          - `cosine` con `scheduler_total_steps=10000, scheduler_warmup_ratio=0.1`: LR empieza en 0, calienta linealmente por 1000 pasos (10%), luego decae siguiendo una curva coseno a casi cero en los 9000 pasos restantes. Mejor para entrenamiento desde cero o preentrenamiento. El decaimiento suave ayuda al modelo a converger a un buen mínimo.

          - `linear_warmup_then_constant` con `scheduler_total_steps=10000, scheduler_warmup_ratio=0.1`: LR calienta por 1000 pasos, luego se mantiene constante por los 9000 pasos restantes. Bueno para fine-tuning de un modelo preentrenado donde no se quiere un gran decaimiento de LR que pueda perturbar las representaciones aprendidas.

          - `constant`: LR se mantiene en el valor inicial. La opción más simple pero raramente óptima — sin warmup los pasos tempranos pueden ser inestables, y sin decaimiento se puede oscilar alrededor del mínimo. **Referencias:** (paper: arxiv:2405.15682)'
        enum:
        - cosine
        - constant
        - linear_warmup_then_constant
        examples:
        - cosine
      grad_clip_max_norm:
        type: number
        default: 5.0
        title: Gradient Clipping Max Norm
        title_es: Norma Máxima de Recorte de Gradientes
        description: 'Max allowed gradient norm. Gradients exceeding this are scaled down. Typical: 1.0–10.0.

          Set 0 to disable. If consistently hitting threshold → increase; if training diverges → decrease.


          **Impact:** Prevents exploding gradients. Monitor norms in logs to adjust. **References:** (paper: arxiv:1905.11881)'
        description_es: 'Norma máxima de gradiente permitida. Gradientes que excedan esto se escalan hacia abajo.

          Típico: 1.0–10.0. 0 para deshabilitar. Si se alcanza constantemente → aumentar; si diverge → disminuir.


          **Impacto:** Previene gradientes explosivos. Monitorear normas en logs para ajustar. **Referencias:** (paper: arxiv:1905.11881)'
        examples:
        - 5.0
      inf_post_clip_threshold:
        type: number
        default: 100.0
        title: Inf Post-Clip Threshold
        title_es: Umbral Inf Post-Recorte
        description: 'If any gradient norm exceeds this after clipping, flag it. Typical: 50–200. Must be > `grad_clip_max_norm`. Logging only.


          **Impact:** Helps identify training problems without stopping.

          '
        description_es: 'Si alguna norma de gradiente excede esto después del recorte, marcarla. Típico: 50–200. Debe ser > `grad_clip_max_norm`. Solo logging.


          **Impacto:** Ayuda a identificar problemas de entrenamiento sin detenerlo.

          '
        examples:
        - 100.0
      max_nan_retries:
        type: integer
        default: 3
        title: Max NaN Retries
        title_es: Reintentos Máximos por NaN
        description: 'Max retries on NaN/Inf gradients before stopping. Typical: 3–10. Skips corrupted batches.

          If NaNs persist, investigate data quality, LR, or numerical stability.


          **Impact:** Too low = stops on transient problems. Too high = wastes time on systematic issues.

          '
        description_es: 'Reintentos máximos ante gradientes NaN/Inf antes de detenerse. Típico: 3–10. Omite lotes corruptos.

          Si NaNs persisten, investigar calidad de datos, LR o estabilidad numérica.


          **Impacto:** Muy bajo = se detiene en problemas transitorios. Muy alto = pierde tiempo en problemas sistemáticos.

          '
        examples:
        - 3
      checkpoint_every_n_steps:
        type: integer
        default: 500
        title: Checkpoint Frequency
        title_es: Frecuencia de Checkpoints
        description: 'Save rolling checkpoint every N steps. Typical: 500–5000. More often = less data loss on crash, more disk I/O.


          **Impact:** Balance with disk speed. For long training runs (weeks) use shorter intervals.

          '
        description_es: 'Guardar checkpoint rodante cada N pasos. Típico: 500–5000. Más frecuente = menos pérdida de datos en crash, más I/O.


          **Impacto:** Balancear con velocidad de disco. Para entrenamientos largos (semanas) usar intervalos más cortos.

          '
        examples:
        - 500
      max_rolling_checkpoints:
        type: integer
        default: 3
        title: Max Rolling Checkpoints
        title_es: Máximo de Checkpoints Rodantes
        description: 'Max rolling checkpoints kept. Oldest deleted when exceeded. Typical: 2–5. Disk ≈ `checkpoint_size × max_rolling_checkpoints`.


          **Impact:** 1 = only the latest. Rolling checkpoints ≠ best checkpoints (not auto-deleted).

          '
        description_es: 'Máximo de checkpoints rodantes conservados. El más antiguo se elimina al exceder. Típico: 2–5. Espacio ≈ `checkpoint_size × max_rolling_checkpoints`.


          **Impacto:** 1 = solo el último. Checkpoints rodantes ≠ mejores checkpoints (no se eliminan automáticamente).

          '
        examples:
        - 3
      num_best_checkpoints:
        type: integer
        default: 2
        title: Best Checkpoints
        title_es: Mejores Checkpoints
        description: 'Number of best checkpoints kept permanently (by validation loss). Typical: 1–3. Not auto-deleted.


          **Impact:** Useful for ensembling or selecting among models with similar performance.

          '
        description_es: 'Número de mejores checkpoints conservados permanentemente (por pérdida de validación). Típico: 1–3. No se eliminan automáticamente.


          **Impacto:** Útil para ensamblado o selección entre modelos con rendimiento similar.

          '
        examples:
        - 2
      nan_check_interval:
        type: integer
        default: 10
        title: NaN Check Interval
        title_es: Intervalo de Verificación de NaN
        description: 'Steps between NaN/Inf checks. Typical: 10–100. Critical for mixed precision. Combined with `max_nan_retries` for recovery.


          **Impact:** More frequent = faster detection, small overhead.

          '
        description_es: 'Pasos entre verificaciones de NaN/Inf. Típico: 10–100. Crítico para precisión mixta. Combinado con `max_nan_retries` para recuperación.


          **Impacto:** Más frecuente = detección más rápida, pequeño overhead.

          '
        examples:
        - 10
      log_gradient_stats:
        type: boolean
        default: true
        title: Log Gradient Stats
        title_es: Registrar Estadísticas de Gradientes
        description: 'Log per-layer gradient norms, min/max. `true` for debugging/tuning, `false` for production. Combined with `enable_block_grad_norms`.


          **Impact:** Helps identify dead/exploding gradients in specific layers.

          '
        description_es: 'Registrar normas de gradiente por capa, min/max. `true` para debugging/ajuste, `false` para producción. Combinado con `enable_block_grad_norms`.


          **Impacto:** Ayuda a identificar gradientes muertos/explotando en capas específicas.

          '
        examples:
        - true
      gradient_log_interval:
        type: integer
        default: 100
        title: Gradient Log Interval
        title_es: Intervalo de Log de Gradientes
        description: 'Steps between gradient stat logs (when `log_gradient_stats=true`). Typical: 10–100. Reduce once training is stable.

          '
        description_es: 'Pasos entre logs de estadísticas de gradiente (cuando `log_gradient_stats=true`). Típico: 10–100. Reducir una vez estable.

          '
        examples:
        - 10
      csv_log_path:
        type: string
        default: training_metrics.csv
        title: CSV Metrics Log Path
        title_es: Ruta de Log de Métricas CSV
        description: 'File path for step-level training metrics in CSV format. Includes loss, LR, gradient norms, GPU metrics, telemetry.


          **Impact:** Grows with long training runs. Compatible with `csv_rotate_on_schema_change`.

          '
        description_es: 'Ruta de archivo para métricas de entrenamiento por paso en formato CSV. Incluye loss, LR, normas de gradiente, métricas GPU, telemetría.


          **Impacto:** Crece con entrenamientos largos. Compatible con `csv_rotate_on_schema_change`.

          '
        examples:
        - training_metrics.csv
      csv_rotate_on_schema_change:
        type: boolean
        default: true
        title: CSV Rotate on Schema Change
        title_es: Rotar CSV al Cambiar Esquema
        description: 'Rotate CSV file (backup + new) when schema changes. Prevents corruption from column mismatches.

          '
        description_es: 'Rotar archivo CSV (respaldo + nuevo) cuando el esquema cambia. Previene corrupción por desajuste de columnas.

          '
        examples:
        - true
      gpu_metrics_backend:
        type: string
        default: nvml
        title: GPU Metrics Backend
        title_es: Backend de Métricas GPU
        description: 'GPU telemetry backend. `nvml` = NVIDIA metrics (temp, memory, utilization). `none` = disabled. Required for `gpu_temp_guard_enabled`.

          '
        description_es: 'Backend de telemetría GPU. `nvml` = métricas NVIDIA (temp, memoria, utilización). `none` = deshabilitado. Requerido para `gpu_temp_guard_enabled`.

          '
        enum:
        - nvml
        - none
        examples:
        - nvml
      nvml_device_index:
        type: integer
        default: 0
        title: NVML Device Index
        title_es: Índice de Dispositivo NVML
        description: 'GPU index to monitor (0 = first GPU). Must match training device. Single GPU: always 0.

          '
        description_es: 'Índice de GPU a monitorear (0 = primera GPU). Debe coincidir con el dispositivo de entrenamiento. GPU única: siempre 0.

          '
        examples:
        - 0
      enable_block_grad_norms:
        type: boolean
        default: true
        title: Per-Block Gradient Norms
        title_es: Normas de Gradiente por Bloque
        description: 'Log L2 gradient norms for every parameter block — embeddings, pos, attention, ffn, norm, head, mhc, router, residual and other — to the CSV metrics log, and to Weights & Biases as `grad_norm/<block>` when `wandb_project` is set. Blocks match the website parameter estimator breakdown. `true` for debugging, `false` for production.


          **Impact:** Detailed insight into gradient flow through model components.

          '
        description_es: 'Registrar normas L2 de gradiente para cada bloque de parámetros — embeddings, pos, atención, ffn, norm, head, mhc, router, residual y other — en el log CSV, y en Weights & Biases como `grad_norm/<bloque>` cuando `wandb_project` está definido. Los bloques coinciden con el desglose del estimador de parámetros del sitio web. `true` para debugging, `false` para producción.


          **Impacto:** Insight detallado del flujo de gradientes a través de componentes del modelo.

          '
        examples:
        - true
      system_metrics_enabled:
        type: boolean
        default: true
        title: Host CPU/RAM Telemetry
        title_es: Telemetría CPU/RAM del Host
        description: 'Log host CPU and RAM usage on every logged step, on CPU and CUDA runs alike. Each row records the training process (`cpu_percent`, `cpu_cores`, `cpu_threads`, `cpu_rss_mb`, `cpu_rss_peak_mb`, `cpu_thread_hot_pct`) and the whole machine (`sys_cpu_percent`, `sys_ram_used_pct`, `sys_ram_used_gb`, `sys_ram_avail_gb`, `sys_swap_used_pct`, `sys_load_1m`). Use it to size `--workers` and to catch a worker that is about to be OOM-killed.


          **Impact:** ~0.1 ms per logged step (psutil); no effect on the training math.

          '
        description_es: 'Registrar el uso de CPU y RAM del host en cada paso registrado, tanto en CPU como en CUDA. Cada fila guarda el proceso de entrenamiento (`cpu_percent`, `cpu_cores`, `cpu_threads`, `cpu_rss_mb`, `cpu_rss_peak_mb`, `cpu_thread_hot_pct`) y la máquina completa (`sys_cpu_percent`, `sys_ram_used_pct`, `sys_ram_used_gb`, `sys_ram_avail_gb`, `sys_swap_used_pct`, `sys_load_1m`). Sirve para dimensionar `--workers` y para detectar un worker a punto de ser matado por OOM.


          **Impacto:** ~0.1 ms por paso registrado (psutil); no afecta la matemática del entrenamiento.

          '
        examples:
        - true
      system_metrics_thread_breakdown:
        type: boolean
        default: true
        title: Per-Thread CPU Breakdown
        title_es: Desglose de CPU por Hilo
        description: 'Also record `cpu_thread_hot_pct`, the utilisation of the busiest single thread, read from `/proc/self/task/<tid>/stat`. It shows whether the OpenMP/BLAS thread pool (`OMP_NUM_THREADS`) is actually being used or one thread is doing all the work. Linux only; ignored elsewhere.


          **Impact:** One read per thread per logged step; negligible for the tiny e2e models.

          '
        description_es: 'Registrar además `cpu_thread_hot_pct`, la utilización del hilo más ocupado, leída de `/proc/self/task/<tid>/stat`. Muestra si el pool OpenMP/BLAS (`OMP_NUM_THREADS`) se está usando de verdad o si un solo hilo hace todo el trabajo. Solo Linux; se ignora en otras plataformas.


          **Impacto:** Una lectura por hilo y por paso registrado; despreciable para los modelos pequeños del e2e.

          '
        examples:
        - true
      wandb_project:
        type:
        - string
        - 'null'
        default: null
        title: Weights & Biases Project
        title_es: Proyecto de Weights & Biases
        description: 'Weights & Biases project name. When set, step metrics and per-block gradient norms (`grad_norm/<block>`, only with `enable_block_grad_norms=true`) are logged to W&B. Requires the optional `wandb` extra (`pip install -e ".[wandb]"`); unset or `null` disables W&B logging.


          **Impact:** Remote experiment tracking; no effect on training when unset.

          '
        description_es: 'Nombre del proyecto de Weights & Biases. Cuando se define, las métricas por paso y las normas de gradiente por bloque (`grad_norm/<bloque>`, solo con `enable_block_grad_norms=true`) se registran en W&B. Requiere el extra opcional `wandb` (`pip install -e ".[wandb]"`); sin definir o `null` desactiva el registro en W&B.


          **Impacto:** Seguimiento remoto de experimentos; sin efecto en el entrenamiento cuando no se define.

          '
        examples:
        - my-experiment
      wandb_mode:
        type: string
        enum:
        - online
        - offline
        - disabled
        default: online
        title: Weights & Biases Mode
        title_es: Modo de Weights & Biases
        description: 'W&B run mode: `online` streams to the W&B service, `offline` writes a local run directory, `disabled` turns logging off while still requiring the package. Only used when `wandb_project` is set.


          **Impact:** Allows offline/air-gapped experiment tracking.

          '
        description_es: 'Modo de ejecución de W&B: `online` transmite al servicio de W&B, `offline` escribe un directorio local de la ejecución, `disabled` desactiva el registro aunque el paquete siga siendo necesario. Solo se usa cuando `wandb_project` está definido.


          **Impacto:** Permite seguimiento de experimentos sin conexión.

          '
        examples:
        - online
      telemetry_log_interval:
        type: integer
        default: 1
        title: Telemetry Log Interval
        title_es: Intervalo de Log de Telemetría
        description: 'Steps between heavy telemetry logs (GPU metrics, per-block gradient norms). Typical: 1–10. Set 1 for max visibility.

          '
        description_es: 'Pasos entre logs de telemetría pesada (métricas GPU, normas de gradiente por bloque). Típico: 1–10. 1 para máxima visibilidad.

          '
        examples:
        - 1
      gpu_temp_guard_enabled:
        type: boolean
        default: true
        title: GPU Temp Guard
        title_es: Guardia de Temperatura GPU
        description: 'Enable the CPU-side GPU temperature supervisor (CUDA only). When the GPU reaches `gpu_temp_pause_threshold_c` the supervisor checkpoints the training subprocess, kills it to free VRAM, waits for cooldown, and re-launches it resuming from the latest rolling checkpoint. Requires `gpu_metrics_backend=nvml`.


          **Impact:** Critical to prevent overheating under sustained loads. `true` for safety.

          '
        description_es: 'Habilita el supervisor de temperatura GPU en CPU (solo CUDA). Cuando la GPU alcanza `gpu_temp_pause_threshold_c` el supervisor hace checkpoint del subproceso de entrenamiento, lo mata para liberar VRAM, espera el enfriamiento y lo re-lanza reanudando desde el último checkpoint rodante. Requiere `gpu_metrics_backend=nvml`.


          **Impacto:** Crítico para prevenir sobrecalentamiento en cargas sostenidas. `true` para seguridad.

          '
        examples:
        - true
      switch_on_thermal:
        type: boolean
        default: false
        title: Switch on Thermal
        title_es: Cambiar en Evento Térmico
        description: 'When `gpu_temp_critical_threshold_c` is reached: `true` = the supervisor checkpoints the GPU child, kills it, and re-launches it on CPU (training continues on CPU instead of aborting). `false` = the supervisor kills the child and aborts training permanently (hardware is unsafe).


          **Impact:** `true` keeps training progressing at CPU speed after a critical thermal event. `false` stops training immediately on critical temp.

          '
        description_es: 'Cuando se alcanza `gpu_temp_critical_threshold_c`: `true` = el supervisor hace checkpoint del hijo en GPU, lo mata y lo re-lanza en CPU (el entrenamiento continúa en CPU en lugar de abortar). `false` = el supervisor mata al hijo y aborta el entrenamiento permanentemente (hardware inseguro).


          **Impacto:** `true` mantiene el entrenamiento a velocidad de CPU tras un evento térmico crítico. `false` detiene el entrenamiento inmediatamente al alcanzar la temperatura crítica.

          '
        examples:
        - false
        - true
      gpu_temp_pause_threshold_c:
        type: number
        default: 90.0
        title: GPU Pause Temp
        title_es: Temp de Pausa GPU (°C)
        description: 'Temp (°C) to pause training. Typical: 85–95. Set below GPU Tjmax (usually 100–110°C). Must be > `gpu_temp_resume_threshold_c`.

          '
        description_es: 'Temp (°C) para pausar entrenamiento. Típico: 85–95. Debajo del Tjmax de la GPU (usualmente 100–110°C). Debe ser > `gpu_temp_resume_threshold_c`.

          '
        examples:
        - 90.0
      gpu_temp_resume_threshold_c:
        type: number
        default: 80.0
        title: GPU Resume Temp
        title_es: Temp de Reanudación GPU (°C)
        description: 'Temp (°C) to resume training after pause. Typical: 70–85. Must be < `gpu_temp_pause_threshold_c` by ≥5–10°C (hysteresis).

          '
        description_es: 'Temp (°C) para reanudar entrenamiento tras pausa. Típico: 70–85. Debe ser < `gpu_temp_pause_threshold_c` por ≥5–10°C (histéresis).

          '
        examples:
        - 80.0
      gpu_temp_critical_threshold_c:
        type:
        - number
        - 'null'
        default: null
        title: GPU Critical Temp
        title_es: Temp Crítica GPU (°C)
        description: 'Permanent-abort (or CPU-switch) threshold in Celsius. Behaviour depends on `switch_on_thermal`: `true` = re-launch the training child on CPU (continues training); `false` = kill the child and abort training permanently. Null = disabled (no critical action, pause-only). Must be > `gpu_temp_pause_threshold_c`.

          '
        description_es: 'Umbral en Celsius de aborto permanente (o cambio a CPU). El comportamiento depende de `switch_on_thermal`: `true` = re-lanza el hijo en CPU (continúa entrenando); `false` = mata al hijo y aborta permanentemente. Null = deshabilitado (solo pausa). Debe ser > `gpu_temp_pause_threshold_c`.

          '
        examples:
        - 95.0
      gpu_temp_poll_interval_seconds:
        type: number
        default: 30.0
        title: GPU Temp Poll Interval
        title_es: Intervalo de Sondeo de Temp GPU (s)
        description: 'Seconds between temperature polls while the GPU child is running and during cooldown wait. Typical: 10–60. Shorter = faster reaction but more overhead.

          '
        description_es: 'Segundos entre verificaciones de temp mientras el hijo en GPU corre y durante la espera de enfriamiento. Típico: 10–60. Más corto = reacción más rápida pero más overhead.

          '
        examples:
        - 30.0
      gpu_temp_checkpoint_grace_seconds:
        type: number
        default: 30.0
        title: GPU Temp Checkpoint Grace
        title_es: Gracia de Checkpoint Térmico (s)
        description: 'Seconds the supervisor waits after sending SIGUSR1 to the training child for it to flush a rolling checkpoint before SIGKILL. Typical: 15–60. Must be > 0.

          '
        description_es: 'Segundos que el supervisor espera tras enviar SIGUSR1 al hijo de entrenamiento para que vacíe un checkpoint rodante antes de SIGKILL. Típico: 15–60. Debe ser > 0.

          '
        examples:
        - 30.0
      resume_from_checkpoint:
        type:
        - string
        - 'null'
        default: null
        title: Resume From Checkpoint
        title_es: Reanudar Desde Checkpoint
        description: 'Resume training from a checkpoint. `auto` = pick the latest rolling checkpoint in the checkpoints directory; an absolute/relative path = load that specific checkpoint. Null = start from scratch.

          '
        description_es: 'Reanuda el entrenamiento desde un checkpoint. `auto` = usa el último checkpoint rodante en el directorio de checkpoints; una ruta absoluta/relativa = carga ese checkpoint específico. Null = empieza desde cero.

          '
        examples:
        - auto
      use_galore:
        type: boolean
        deprecated: true
        default: false
        title: Enable GaLore
        title_es: Habilitar GaLore
        description: 'Gradient Low-Rank Projection for memory-efficient training of large models (>1B params).

          Projects optimizer states to low-rank subspace. Requires `galore_rank`, `galore_update_interval`, `galore_scale`, `galore_max_dim`.


          **Impact:** Reduces optimizer memory from O(P×2) to O(P×rank). Computational overhead from projection.

          **Deprecated:** prefer `training.optimizer.optimizer_class: galore_adamw`, which composes with the per-parameter-group system and uses `optimizer.parameters["galore_adamw-rank"]`/`-update_proj_gap`. These trainer-side flags remain for backward compatibility. **References:** (paper: arxiv:2403.03507)'
        description_es: 'Proyección de Gradientes de Bajo Rango para entrenamiento eficiente de modelos grandes (>1B params).

          Proyecta estados del optimizador a subespacio de bajo rango. Requiere `galore_rank`, `galore_update_interval`, `galore_scale`, `galore_max_dim`.


          **Impacto:** Reduce memoria del optimizador de O(P×2) a O(P×rank). Overhead computacional por proyección.

          **Obsoleto:** preferir `training.optimizer.optimizer_class: galore_adamw`, que se compone con el sistema de grupos de parámetros y usa `optimizer.parameters["galore_adamw-rank"]`/`-update_proj_gap`. Estas banderas del trainer se mantienen por compatibilidad. **Referencias:** (paper: arxiv:2403.03507)'
        examples:
        - false
      galore_rank:
        type: integer
        default: 64
        title: GaLore Rank
        title_es: Rango de GaLore
        description: 'Low-rank projection dimension. Typical: 16–128. Memory savings ≈ `1 − (rank / param_dim)`. Start with `hidden_size/12`. **References:** (paper: arxiv:2403.03507)'
        description_es: 'Dimensión de proyección de bajo rango. Típico: 16–128. Ahorro ≈ `1 − (rank / param_dim)`. Empezar con `hidden_size/12`. **Referencias:** (paper: arxiv:2403.03507)'
        examples:
        - 64
      galore_update_interval:
        type: integer
        default: 1
        title: GaLore Update Interval
        title_es: Intervalo de Actualización GaLore
        description: 'Steps between projection matrix recomputation. Typical: 1–10. 1 = every step (accurate, slower), 10 = every 10 steps (faster).


          **Impact:** Balance between optimization accuracy and speed. **References:** (paper: arxiv:2403.03507)'
        description_es: 'Pasos entre recómputo de matriz de proyección. Típico: 1–10. 1 = cada paso (preciso, lento), 10 = cada 10 pasos (rápido).


          **Impacto:** Balance entre precisión de optimización y velocidad. **Referencias:** (paper: arxiv:2403.03507)'
        examples:
        - 1
      galore_scale:
        type: number
        default: 1.0
        title: GaLore Gradient Scale
        title_es: Escala de Gradiente GaLore
        description: 'Scaling factor for projected gradients. Typical: 1.0. Scale down if unstable, scale up if too slow. **References:** (paper: arxiv:2403.03507)'
        description_es: 'Factor de escala para gradientes proyectados. Típico: 1.0. Reducir si inestable, aumentar si muy lento. **Referencias:** (paper: arxiv:2403.03507)'
        examples:
        - 1.0
      galore_max_dim:
        type: integer
        default: 4096
        title: GaLore Max Tensor Dim
        title_es: Dim Máxima de Tensor GaLore
        description: 'Max tensor dimension for GaLore projection. Smaller tensors use standard optimizer. Typical: 4096 or `hidden_size`.


          **Impact:** Avoids overhead on small tensors where projection isn''t worth it. **References:** (paper: arxiv:2403.03507)'
        description_es: 'Dimensión máxima de tensor para proyección GaLore. Tensores más pequeños usan optimizador estándar. Típico: 4096 o `hidden_size`.


          **Impacto:** Evita overhead en tensores pequeños donde la proyección no vale la pena. **Referencias:** (paper: arxiv:2403.03507)'
        examples:
        - 4096
      hf_output_dir:
        type: string
        title: HF Output Dir
        title_es: Directorio de Salida HuggingFace
        description: 'Directory for saving final model via `save_pretrained()` when `base_model` is set. HuggingFace format: `config.json`, `pytorch_model.bin`, tokenizer.


          **Impact:** Only applies with `base_model`. For models from scratch, checkpoints are saved differently. **References:** (paper: arxiv:1910.03771)'
        description_es: 'Directorio para guardar modelo final con `save_pretrained()` cuando `base_model` está configurado. Formato HuggingFace: `config.json`, `pytorch_model.bin`, tokenizador.


          **Impacto:** Solo aplica con `base_model`. Para modelos desde cero, los checkpoints se guardan diferente. **Referencias:** (paper: arxiv:1910.03771)'
        examples:
        - checkpoints/hf_final
      optimizer:
        type: object
        title: Optimizer Configuration
        title_es: Configuración del Optimizador
        description: 'Optimizer type and hyperparameters with per-parameter-group settings. Parameters are prefixed

          with the optimizer class name (e.g., `adamw-lr_embeddings`). Supports fine-grained control over

          different parameter types.


          **Impact:** The choice of optimizer significantly affects training dynamics

          and final quality. `adamw` is the most proven and recommended option for most cases.


          **References:** (paper: arxiv:1412.6980) (paper: arxiv:1711.05101)

          '
        description_es: 'Tipo de optimizador e hiperparámetros con configuraciones por grupo de parámetros.

          Los parámetros usan prefijo del optimizador (ej., `adamw-lr_embeddings`). Permite control

          detallado sobre diferentes tipos de parámetros.


          **Impacto:** La elección del optimizador afecta significativamente la dinámica de entrenamiento

          y la calidad final. `adamw` es la opción más probada y recomendada para la mayoría de casos.


          **Referencias:** (paper: arxiv:1412.6980) (paper: arxiv:1711.05101)

          '
        additionalProperties: false
        required:
        - optimizer_class
        properties:
          optimizer_class:
            type: string
            title: Optimizer Class
            title_es: Clase de Optimizador
            description: 'Optimizer algorithm. Summary by use case:


              | Optimizer | Use Case | Notes |

              |-----------|----------|-------|

              | `adamw` | General purpose **(recommended)** | Decoupled weight decay, stable |

              | `adam_pm` | Memory-constrained training | Pooled second moment: group size `s` shrinks the V-state to 1/s, Adam hyperparameters transfer (paper: arxiv:2610.24598) |

              | `sgd` | Pure SGD baseline | Mini-batch update, no momentum, zero optimizer state (source: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

              | `sgd_momentum` | Baselines, classic tasks | Simple, less adaptive |

              | `rmsprop` | Classical adaptive baseline | Divides the gradient by a running average of its recent squared magnitude; one state buffer, no bias correction (source: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

              | `adafactor` | Large models, low memory | Memory-efficient factored moments |

              | `galore_adamw` | Memory-constrained large models | Gradient low-rank projection |

              | `prodigy` | Minimal LR tuning | Adaptive, auto-LR |

              | `lion` | Memory-efficient | Sign-based updates, reduced state |

              | `sophia` | Robust training | Hessian-aware with diagonal preconditioning |

              | `muon` | Stable training | Newton-Schulz orthogonalization for hidden matrices; AdamW fallback for embeddings, pos, heads and non-matrix params |

              | `turbo_muon` | Faster muon | AOL-preconditioned orthogonalization for hidden matrices; AdamW fallback for embeddings, pos, heads and non-matrix params |

              | `af_muon` | AdamW-free tied-vocab models | Spectral matrices + capped-row LMO table + RMS vectors |

              | `ada_muon` | Adaptive orthogonal updates | Element-wise second moment on orthogonalized directions + sign stabilization + RMS-aligned scaling (paper: arxiv:2507.11005) |

              | `radam` | Adaptive warmup | Rectified Adam, automatic warmup |

              | `adan` | Nesterov-accelerated | Adaptive with Nesterov, 3 buffers |

              | `adopt` | Momentum-based | Decoupled gradient/variance, optimal convergence |

              | `ademamix` | Dual-EMA mixing | Combines fast/slow momentum for data efficiency |

              | `mars_adamw` | Variance reduction | Recursive momentum correction (SVRG-style) |

              | `cautious_adamw` | Gradient masking | Masks conflicted gradient dimensions |

              | `lamb` | Large batch training | LARS-style layer-wise adaptive |

              | `schedulefree_adamw` | No LR schedule needed | Eliminates scheduler tuning |

              | `shampoo` | Second-order | Kronecker-factored preconditioners |

              | `soap` | Second-order + Adam | Adam in Shampoo eigenbasis |

              | `anon` | Tunable adaptivity | gamma parameter (paper: arxiv:2605.02317) |

              | `apollo` | Low-rank scaling | Projected gradient scaling (SGD-like memory) |

              | `apollo_mini` | Rank-1 APOLLO | Tensor-wise scaled, extreme memory savings |

              | `q_apollo` | Quantized APOLLO | Quantized optimizer states |

              | `dion3` | Faster orthogonal updates | Fractional Gram-Newton-Schulz Muon with error feedback (paper: arxiv:2608.11612) |

              | `eve` | Fast proxy training, search loops | Population-of-4 differential evolution with targeted Adam fallback; monotone best-so-far; needs its own LR search (paper: arxiv:2609.35614) |

              | `ea4llm` | Gradient-free training, memory-constrained regimes | Zeroth-order evolution strategies on the token-level log-likelihood fitness; Gaussian perturbations with z-score/rank shaping; no optimizer state, N forward evaluations per step (paper: arxiv:2510.10603) |

              | `root` | Robust orthogonal updates | Dimension-calibrated Newton-Schulz coefficients + soft-threshold outlier suppression on the momentum; AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2511.20626) |

              | `muon2` | Adaptive orthogonal updates | Adam-style second-moment preconditioning of the momentum before Newton-Schulz; 40% fewer NS iterations; optional factored moments (Muon²-F); AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2604.09967) |

              | `nor_muon` | Balanced neuron updates | Neuron-wise (row) second-moment normalization after Newton-Schulz; Muon memory + m scalars; Adam-RMS-aligned update (paper: arxiv:2510.05491) |

              | `conda` | Spectral + coordinate-wise adaptive pretraining | Adam update inside the SVD subspace of the first moment; second moment of *projected* gradients (column-wise adaptive); lazy SVD every `update_proj_gap` steps; AdamW fallback for non-matrix params (paper: arxiv:2509.24218) |

              | `tuon` | Cross-layer orthogonal updates | Tensor-aware Muon: stacks same-shape hidden matrices per group, mixes them with a unitary layer transform (DecorQ from the layer Gram matrix, refreshed every `refresh_interval` steps), polarizes each slice with Newton-Schulz, inverts the transform and rescales the stack to RMS 1/√max(m,n); K=1 reduces to `muon`; AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2610.35130) |

              | `namo` | Noise-adaptive orthogonal updates | Norm-based Adam-type adaptive stepsize α_t on Muon''s orthogonalized momentum: a scalar second-moment EMA of the squared Frobenius gradient norm rescales the whole orthogonal update (zero extra memory); AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2602.17080) |

              | `namo_d` | Noise-adaptive orthogonal updates (diagonal) | Diagonal extension of `namo`: a neuron-wise (column) second-moment EMA gives clamped per-column stepsizes that right-multiply the orthogonalized momentum (one extra ℝⁿ vector per matrix); AdamW fallback for embeddings, pos, heads and non-matrix params (paper: arxiv:2602.17080) |


              **Examples explained:**

              - `adamw`: Start here. Most reliable for transformer training. Works well with default hyperparameters (lr=2e-4, betas=[0.9,0.95], wd=0.01). Best general-purpose choice.

              - `sgd_momentum`: Use for baselines or when you need maximum simplicity and reproducibility. Usually needs higher LR (1e-2 to 1e-1) and careful momentum tuning.

              - `galore_adamw` or `apollo`: Use when training >1B param models with limited GPU memory. Reduces optimizer memory by projecting to low-rank subspace. Slight quality tradeoff for significant memory savings.

              - `prodigy`: Use when you don''t want to tune learning rate. Automatically adapts step size. Good for quick experiments or when hyperparameter search is impractical.

              - `schedulefree_adamw`: Use when you want to eliminate LR scheduler tuning. The optimizer handles scheduling internally. Simplifies training pipeline.


              **References:** `adamw` (paper: arxiv:1711.05101); `sgd_momentum` (paper:

              https://doi.org/10.1016/0041-5553(64)90137-5); `adafactor` (paper: arxiv:1804.04235); `galore_adamw`

              (paper: arxiv:2403.03507); `prodigy` (paper: arxiv:2306.06101); `lion` (paper: arxiv:2302.06675);

              `sophia` (paper: arxiv:2305.14342); `muon` (paper: arxiv:2505.23737) (paper:

              https://openreview.net/forum?id=yRtgZ1K8hO); `turbo_muon` (paper: arxiv:2512.04632); `af_muon`

              (paper: arxiv:2610.01395); `ada_muon` (paper: arxiv:2507.11005); `radam` (paper: arxiv:1908.03265);

              `adan` (paper: arxiv:2208.06677); `adopt` (paper: arxiv:2411.02853); `ademamix` (paper:

              arxiv:2409.03137); `mars_adamw` (paper: arxiv:2411.10438); `cautious_adamw` (paper:

              arxiv:2411.16085); `lamb` (paper: arxiv:1904.00962); `schedulefree_adamw` (paper: arxiv:2405.15682);

              `shampoo` (paper: arxiv:1802.09568); `soap` (paper: arxiv:2409.11321); `anon` (paper:

              arxiv:2605.02317); `apollo`/`apollo_mini`/`q_apollo` (paper: arxiv:2412.05270); `dion3` (paper:

              arxiv:2608.11612); `eve` (paper: arxiv:2609.35614); `ea4llm` (paper: arxiv:2510.10603);

              `root` (paper: arxiv:2511.20626); `muon2` (paper: arxiv:2604.09967); `adam_pm` (paper:

              arxiv:2610.24598); `nor_muon` (paper: arxiv:2510.05491); `conda` (paper: arxiv:2509.24218);

              `tuon` (paper: arxiv:2610.35130); `namo`/`namo_d` (paper: arxiv:2602.17080); `sgd`/`rmsprop` (paper: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf)'
            description_es: 'Algoritmo optimizador. Resumen por caso de uso:


              | Optimizador | Caso de Uso | Notas |

              |-------------|-------------|-------|

              | `adamw` | Propósito general **(recomendado)** | Weight decay desacoplado, estable |

              | `adam_pm` | Entrenamiento con memoria limitada | Segundo momento agrupado: el tamaño de grupo `s` reduce el estado V a 1/s, los hiperparámetros de Adam se transfieren (paper: arxiv:2610.24598) |

              | `sgd` | Línea base SGD pura | Actualización por mini-lotes, sin momentum, sin estado del optimizador (fuente: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

              | `sgd_momentum` | Líneas base, tareas clásicas | Simple, menos adaptativo |

              | `rmsprop` | Línea base adaptativa clásica | Divide el gradiente por un promedio móvil de su magnitud cuadrada reciente; un búfer de estado, sin corrección de sesgo (fuente: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf) |

              | `adafactor` | Modelos grandes, baja memoria | Eficiente en memoria |

              | `galore_adamw` | Modelos grandes con memoria limitada | Proyección de gradiente de bajo rango |

              | `prodigy` | Mínimo ajuste de LR | Adaptativo, LR automático |

              | `lion` | Eficiencia de memoria | Actualizaciones basadas en signo |

              | `sophia` | Entrenamiento robusto | Consciente del Hessiano |

              | `muon` | Entrenamiento estable | Ortogonalización Newton-Schulz para matrices ocultas; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales |

              | `turbo_muon` | Muon acelerado | Ortogonalización precondicionada con AOL para matrices ocultas; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales |

              | `af_muon` | Modelos con vocabulario atado sin AdamW | Matrices espectrales + LMO por fila con tope + vectores RMS |

              | `ada_muon` | Actualizaciones ortogonales adaptativas | Segundo momento por elemento sobre direcciones ortogonalizadas + estabilización por signo + escalado alineado por RMS (paper: arxiv:2507.11005) |

              | `radam` | Warmup adaptativo | Rectified Adam |

              | `adan` | Acelerado con Nesterov | Adaptativo con Nesterov |

              | `adopt` | Basado en momentum | Momentum adaptativo con convergencia óptima |

              | `ademamix` | Mezcla de momentos | Combina EMAs de corto y largo plazo |

              | `mars_adamw` | Regularizado con MARS | Reducción de varianza |

              | `cautious_adamw` | Enmascaramiento de gradientes | Enmascara gradientes conflictivos |

              | `lamb` | Entrenamiento con lotes grandes | Escalado por capa estilo LARS |

              | `schedulefree_adamw` | Sin scheduler de LR | Elimina ajuste de scheduler |

              | `shampoo` | Segundo orden | Gradientes precondicionados |

              | `soap` | Optimización dispersa | Segundo orden eficiente en memoria |

              | `anon` | Adaptividad ajustable | Parámetro gamma (paper: arxiv:2605.02317) |

              | `apollo` | Escalado de bajo rango | Escalado de gradiente proyectado |

              | `apollo_mini` | APOLLO rango-1 | Proyección mínima tensorial |

              | `q_apollo` | APOLLO cuantizado | Estados cuantizados |

              | `dion3` | Ortogonalización acelerada | Muon fraccional con Gram-Newton-Schulz y retroalimentación de error (paper: arxiv:2608.11612) |

              | `eve` | Entrenamiento proxy rápido, bucles de búsqueda | Evolución diferencial con población de 4 y respaldo Adam dirigido; mejor-observado monótono; requiere su propia búsqueda de LR (paper: arxiv:2609.35614) |

              | `ea4llm` | Entrenamiento sin gradientes, regímenes con memoria limitada | Estrategias evolutivas de orden cero sobre la aptitud de log-verosimilitud por token; perturbaciones gaussianas con z-score/shaping por rangos; sin estado del optimizador, N evaluaciones forward por paso (paper: arxiv:2510.10603) |

              | `root` | Ortogonalización robusta | Coeficientes Newton-Schulz calibrados por dimensión + supresión de atípicos por soft-threshold sobre el momentum; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2511.20626) |

              | `muon2` | Ortogonalización adaptativa | Precondicionamiento del momentum con segundo momento estilo Adam antes de Newton-Schulz; 40% menos iteraciones NS; momentos factorizados opcionales (Muon²-F); respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2604.09967) |

              | `nor_muon` | Actualizaciones por neurona equilibradas | Normalización por segundo momento de fila (neurona) tras Newton-Schulz; memoria de Muon + m escalares; actualización alineada al RMS de Adam (paper: arxiv:2510.05491) |

              | `conda` | Preentrenamiento espectral + adaptativo por coordenada | Actualización de Adam dentro del subespacio SVD del primer momento; segundo momento de gradientes *proyectadas* (adaptativo por columna); SVD perezoso cada `update_proj_gap` pasos; respaldo AdamW para parámetros no matriciales (paper: arxiv:2509.24218) |

              | `tuon` | Actualizaciones ortogonales entre capas | Muon consciente de tensores: apila matrices ocultas de la misma forma por grupo, las mezcla con una transformación unitaria de capas (DecorQ desde la matriz de Gram de capas, refrescada cada `refresh_interval` pasos), polariza cada slice con Newton-Schulz, invierte la transformación y reescala la pila a RMS 1/√max(m,n); K=1 reduce a `muon`; respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2610.35130) |

              | `namo` | Actualizaciones ortogonales adaptativas al ruido | Paso adaptativo estilo Adam basado en normas sobre el momentum ortogonalizado de Muon: una EMA escalar del segundo momento de la norma de Frobenius al cuadrado del gradiente reescala toda la actualización ortogonal (sin memoria extra); respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2602.17080) |

              | `namo_d` | Actualizaciones ortogonales adaptativas al ruido (diagonal) | Extensión diagonal de `namo`: una EMA por neurona (columna) del segundo momento produce pasos por columna acotados que multiplican por la derecha el momentum ortogonalizado (un vector ℝⁿ extra por matriz); respaldo AdamW para embeddings, pos, heads y parámetros no matriciales (paper: arxiv:2602.17080) |

              **Ejemplos explicados:**

              - `adamw`: Empezar aquí. El más confiable para entrenamiento de transformers. Funciona bien con hiperparámetros por defecto (lr=2e-4, betas=[0.9,0.95], wd=0.01). Mejor opción de propósito general.

              - `sgd_momentum`: Usar para líneas base o cuando se necesita máxima simplicidad y reproducibilidad. Generalmente requiere LR más alto (1e-2 a 1e-1) y ajuste cuidadoso de momentum.

              - `galore_adamw` o `apollo`: Usar al entrenar modelos >1B params con memoria GPU limitada. Reduce memoria del optimizador proyectando a subespacio de bajo rango. Ligero compromiso de calidad para ahorro significativo de memoria.

              - `prodigy`: Usar cuando no se quiere ajustar el learning rate. Adapta automáticamente el tamaño de paso. Bueno para experimentos rápidos o cuando la búsqueda de hiperparámetros es impráctica.

              - `schedulefree_adamw`: Usar cuando se quiere eliminar el ajuste de scheduler de LR. El optimizador maneja el scheduling internamente. Simplifica el pipeline de entrenamiento.

              - `lamb`: Usar para entrenamiento con lotes muy grandes (efectivos > 1024). Escala adaptativamente por capa para mantener estabilidad.

              - `shampoo` o `soap`: Usar cuando se necesita optimización de segundo orden para tareas que se benefician de precondicionamiento de curvatura. Mayor costo computacional por paso pero potencialmente mejor convergencia.


              **Referencias:** `adamw` (paper: arxiv:1711.05101); `sgd_momentum` (paper:

              https://doi.org/10.1016/0041-5553(64)90137-5); `adafactor` (paper: arxiv:1804.04235); `galore_adamw`

              (paper: arxiv:2403.03507); `prodigy` (paper: arxiv:2306.06101); `lion` (paper: arxiv:2302.06675);

              `sophia` (paper: arxiv:2305.14342); `muon` (paper: arxiv:2505.23737) (paper:

              https://openreview.net/forum?id=yRtgZ1K8hO); `turbo_muon` (paper: arxiv:2512.04632); `af_muon`

              (paper: arxiv:2610.01395); `ada_muon` (paper: arxiv:2507.11005); `radam` (paper: arxiv:1908.03265);

              `adan` (paper: arxiv:2208.06677); `adopt` (paper: arxiv:2411.02853); `ademamix` (paper:

              arxiv:2409.03137); `mars_adamw` (paper: arxiv:2411.10438); `cautious_adamw` (paper:

              arxiv:2411.16085); `lamb` (paper: arxiv:1904.00962); `schedulefree_adamw` (paper: arxiv:2405.15682);

              `shampoo` (paper: arxiv:1802.09568); `soap` (paper: arxiv:2409.11321); `anon` (paper:

              arxiv:2605.02317); `apollo`/`apollo_mini`/`q_apollo` (paper: arxiv:2412.05270); `dion3` (paper:

              arxiv:2608.11612); `eve` (paper: arxiv:2609.35614); `ea4llm` (paper: arxiv:2510.10603);

              `root` (paper: arxiv:2511.20626); `muon2` (paper: arxiv:2604.09967); `adam_pm` (paper:

              arxiv:2610.24598); `nor_muon` (paper: arxiv:2510.05491); `conda` (paper: arxiv:2509.24218);

              `tuon` (paper: arxiv:2610.35130); `namo`/`namo_d` (paper: arxiv:2602.17080); `sgd`/`rmsprop` (paper: https://www.cs.toronto.edu/~tijmen/csc321/slides/lecture_slides_lec6.pdf)'
