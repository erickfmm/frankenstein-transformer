  image:
    type: object
    title: Vision Image Configuration
    title_es: Configuración de Imagen de Visión
    description: 'Vision-specific configuration for the `frankenstein_vit` model class (paper: arxiv:2010.11929).

      Defines image dimensions, patch parameters, positional encoding, masking strategy for

      autosupervised patch prediction, classification pooling, and segmentation head type.


      Required when `model_class: frankenstein_vit`.


      **References:** (paper: arxiv:2010.11929)'
    description_es: 'Configuración específica de visión para el modelo `frankenstein_vit` (paper: arxiv:2010.11929).

      Define dimensiones de imagen, parámetros de parche, codificación posicional, estrategia

      de enmascaramiento para predicción autosupervisada de parches, pooling de clasificación,

      y tipo de cabeza de segmentación.


      Obligatorio cuando `model_class: frankenstein_vit`.


      **Referencias:** (paper: arxiv:2010.11929)'
    additionalProperties: false
    properties:
      image_size:
        type: object
        title: Image Size
        title_es: Tamaño de Imagen
        description: 'Target image dimensions (height, width) before patch embedding.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Dimensiones objetivo de la imagen (alto, ancho) antes del patch embedding.


          **Referencias:** (paper: arxiv:2010.11929)'
        additionalProperties: false
        properties:
          height:
            type: integer
            minimum: 1
            title: Image Height
            title_es: Alto de Imagen
            description: 'Image height in pixels before patch embedding (ViT recipes: 224 or 384).

              **References:** (paper: arxiv:2010.11929)'
            description_es: 'Alto de la imagen en píxeles antes del patch embedding (recetas ViT: 224 o 384).

              **Referencias:** (paper: arxiv:2010.11929)'
          width:
            type: integer
            minimum: 1
            title: Image Width
            title_es: Ancho de Imagen
            description: 'Image width in pixels before patch embedding (ViT recipes: 224 or 384).

              **References:** (paper: arxiv:2010.11929)'
            description_es: 'Ancho de la imagen en píxeles antes del patch embedding (recetas ViT: 224 o 384).

              **Referencias:** (paper: arxiv:2010.11929)'
        required:
        - height
        - width
      patch_size:
        type: integer
        minimum: 1
        title: Patch Size
        title_es: Tamaño de Parche
        description: 'Size of each square image patch. The image is split into non-overlapping

          `patch_size`×`patch_size` patches. `image_height` and `image_width` must

          each be divisible by `patch_size`. The number of patches is

          `(image_height / patch_size) * (image_width / patch_size)`.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Tamaño de cada parche cuadrado de imagen. La imagen se divide en parches

          no solapados de `patch_size`×`patch_size`. `image_height` e `image_width`

          deben ser divisibles por `patch_size`.


          **Referencias:** (paper: arxiv:2010.11929)'
        default: 16
        examples:
        - 16
        - 32
      in_channels:
        type: integer
        minimum: 1
        title: Input Channels
        title_es: Canales de Entrada
        description: 'Number of image channels (3 for RGB, 1 for grayscale).


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Número de canales de imagen (3 para RGB, 1 para escala de grises).


          **Referencias:** (paper: arxiv:2010.11929)'
        default: 3
      to_grayscale:
        type: boolean
        title: Convert to Grayscale
        title_es: Convertir a Escala de Grises
        description: If true, convert multi-channel images to single-channel grayscale before patching.
        description_es: Si es verdadero, convierte imágenes multicanal a escala de grises antes del parcheo.
        default: false
      pos_embedding_type:
        type: string
        title: Positional Embedding Type
        title_es: Tipo de Embedding Posicional
        description: 'Positional encoding for the ViT. `learned_1d` adds a learnable

          `nn.Parameter` of shape `(1, N+cls, D)` after patch embedding

          (faithful to the ViT paper ); it is a **deprecated**

          alias for `learned_absolute` and will be removed in a future release.

          `none` disables the absolute positional embedding

          and relies on the existing RoPE/HoPE rotary positional encodings applied

          inside the attention mixers (treats patches as a sequence). The unified

          model-level enum values (`learned_absolute`, `sinusoidal_absolute`,

          `sinusoidal_rotary`, `pape`, `pape_efficient`, `pape_ri`, `rope`, `hope`,

          `nope`, `alibi`) are also accepted and align with `model.positional_encoding`.


          **Precedence:** this field controls the *patch-embedding* PE (absolute,

          added before the layer stack). `model.positional_encoding` independently

          controls the PE applied inside each attention mixer. Setting `none` here

          leaves the mixer PE untouched; it does not disable `model.positional_encoding`.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Codificación posicional para el ViT. `learned_1d` añade un

          `nn.Parameter` aprendible de forma `(1, N+cls, D)` después del patch

          embedding (fiel al paper ViT); es un alias **obsoleto** de

          `learned_absolute` y se eliminará en una versión futura. `none` desactiva

          el embedding posicional absoluto y confía en las codificaciones

          rotacionales RoPE/HoPE existentes. Los valores unificados a nivel de

          modelo (`learned_absolute`, `sinusoidal_absolute`,

          `sinusoidal_rotary`, `pape`, `pape_efficient`, `pape_ri`, `rope`, `hope`,

          `nope`, `alibi`) también se aceptan y se alinean con `model.positional_encoding`.


          **Precedencia:** este campo controla la PE del *patch embedding*

          (absoluta, añadida antes de la pila de capas). `model.positional_encoding`

          controla de forma independiente la PE aplicada dentro de cada mixer.

          Poner `none` aquí no desactiva `model.positional_encoding`.


          **Referencias:** (paper: arxiv:2010.11929)'
        enum:
        - learned_1d
        - none
        - learned_absolute
        - sinusoidal_absolute
        - sinusoidal_rotary
        - pape
        - pape_efficient
        - pape_ri
        - rope
        - hope
        - nope
        - alibi
        default: learned_1d
      cls_token:
        type: boolean
        title: CLS Token
        title_es: Token CLS
        description: 'If true, prepend a learnable [CLS] token to the patch embeddings (ViT

          paper default). The output at position 0 is used as the image

          representation for classification (when `pooling_mode: cls`).


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Si es verdadero, antepone un token [CLS] aprendible a los embeddings de

          parche (predeterminado del paper ViT). La salida en posición 0 se usa

          como representación de imagen para clasificación.


          **Referencias:** (paper: arxiv:2010.11929)'
        default: true
      pooling_mode:
        type: string
        title: Pooling Mode
        title_es: Modo de Pooling
        description: 'Pooling strategy for classification. `cls` reads the [CLS] token output

          at position 0. `gap` (Global Average Pooling) averages over all patch

          tokens. Both work well; GAP may need a different learning rate.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Estrategia de pooling para clasificación. `cls` lee la salida del token

          [CLS] en posición 0. `gap` (Global Average Pooling) promedia sobre todos

          los tokens de parche.


          **Referencias:** (paper: arxiv:2010.11929)'
        enum:
        - cls
        - gap
        default: cls
      mask_ratio:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        title: Mask Ratio
        title_es: Ratio de Máscara
        description: 'Fraction of patches to corrupt during `task: patch_prediction`. The

          ViT paper (App. B.1.2) uses 50% (0.5). Each corrupted patch is replaced

          following `mask_token_strategy`.


          **References:** (paper: arxiv:2111.06377)'
        description_es: 'Fracción de parches a corromper durante `task: patch_prediction`. El

          paper ViT usa 50% (0.5).


          **Referencias:** (paper: arxiv:2111.06377)'
        default: 0.5
      mask_token_strategy:
        type: string
        title: Mask Token Strategy
        title_es: Estrategia de Token de Máscara
        description: 'Strategy for corrupting masked patches. `bert` = 80% mask-token / 10%

          random other patch / 10% keep (BERT recipe, ViT paper default).

          `mask_only` = 100% mask token. `random_only` = 100% random patch.


          **References:** (paper: arxiv:1810.04805) (paper: arxiv:2111.06377)'
        description_es: 'Estrategia para corromper parches enmascarados. `bert` = 80% token de

          máscara / 10% parche aleatorio / 10% mantener.


          **Referencias:** (paper: arxiv:1810.04805) (paper: arxiv:2111.06377)'
        enum:
        - bert
        - mask_only
        - random_only
        default: bert
      prediction_target:
        type: string
        title: Prediction Target
        title_es: Objetivo de Predicción
        description: 'Reconstruction target for `task: patch_prediction`. `mean_color_3bit`

          (512-way CE, ViT paper best) predicts the 3-bit mean color of each

          corrupted patch. `downsampled_3bit` predicts a 4×4 downsampled 3-bit

          patch (16 predictions of 512 colors). `full_patch_l2` reconstructs raw

          patch pixels via MSE (MAE-style ).


          **References:** (paper: arxiv:2111.06377)'
        description_es: 'Objetivo de reconstrucción para `task: patch_prediction`.


          **Referencias:** (paper: arxiv:2111.06377)'
        enum:
        - mean_color_3bit
        - downsampled_3bit
        - full_patch_l2
        default: mean_color_3bit
      seg_head_type:
        type: string
        title: Segmentation Head Type
        title_es: Tipo de Cabeza de Segmentación
        description: 'Segmentation head architecture for `task: segmentation`. `pixel` uses

          a per-pixel linear head that reshapes patch tokens back to H×W and

          upsamples — directly supports 1D grayscale and multicolor

          non-overlapping segmentation. `eomt` uses the Encoder-only Mask

          Transformer with learnable queries, Hungarian

          matching, and mask annealing.


          **References:** (paper: arxiv:2503.19108)'
        description_es: 'Arquitectura de cabeza de segmentación para `task: segmentation`.


          **Referencias:** (paper: arxiv:2503.19108)'
        enum:
        - pixel
        - eomt
        default: pixel
      num_classes:
        type: integer
        minimum: 1
        title: Number of Classes
        title_es: Número de Clases
        description: 'Number of classes for image classification (`task: classification`). Required for that task — no implicit ImageNet default is applied by the schema. **References:** (paper: arxiv:2010.11929)'
        description_es: 'Número de clases para clasificación de imágenes. Obligatorio para esa tarea — el esquema no aplica un valor por defecto implícito de ImageNet.


          **Referencias:** (paper: arxiv:2010.11929)'
        examples:
        - 1000
        - 10
      num_seg_classes:
        type: integer
        minimum: 1
        title: Number of Segmentation Classes
        title_es: Número de Clases de Segmentación
        description: 'Number of segmentation classes including background

          (`task: segmentation`, `seg_head_type: pixel`). For 1D grayscale

          segmentation, set to 2 (background + foreground). For multicolor

          non-overlapping segmentation, set to the number of object classes + 1.


          **References:** (paper: arxiv:2503.19108)'
        description_es: 'Número de clases de segmentación incluyendo fondo.


          **Referencias:** (paper: arxiv:2503.19108)'
        default: 21
      seg_num_queries:
        type: integer
        minimum: 1
        title: Segmentation Queries
        title_es: Consultas de Segmentación
        description: 'Number of learnable object queries for EoMT segmentation

          (`seg_head_type: eomt`). Paper default: 100 (semantic), 200

          (panoptic/instance).


          **References:** (paper: arxiv:2503.19108)'
        description_es: 'Número de consultas de objeto aprendibles para segmentación EoMT.


          **Referencias:** (paper: arxiv:2503.19108)'
        default: 100
      seg_l2_blocks:
        type: integer
        minimum: 1
        title: Segmentation L2 Blocks
        title_es: Bloques L2 de Segmentación
        description: 'Number of L₂ ViT blocks that process patches + queries jointly in EoMT

          segmentation. The remaining blocks (L₁) process patches only. Paper

          values: ViT-S/B=3, ViT-L=4, ViT-g=5.


          **References:** (paper: arxiv:2503.19108)'
        description_es: 'Número de bloques L₂ del ViT que procesan parches + consultas.


          **Referencias:** (paper: arxiv:2503.19108)'
        default: 3
      seg_mask_annealing:
        type: boolean
        title: Segmentation Mask Annealing
        title_es: Recocido de Máscara de Segmentación
        description: 'If true, apply mask annealing during EoMT training:

          the probability of masked query-to-patch attention decays polynomially

          (factor 0.9) to 0 by end of training, so inference uses plain ViT with

          zero masking overhead.


          **References:** (paper: arxiv:2503.19108)'
        description_es: 'Si es verdadero, aplica recocido de máscara durante el entrenamiento EoMT.


          **Referencias:** (paper: arxiv:2503.19108)'
        default: true
  vision_dataset:
    type: object
    title: Vision Dataset Configuration
    title_es: Configuración de Dataset de Visión
    description: 'Vision dataset configuration for image-based tasks (`patch_prediction`,

      `classification`, `segmentation`). Specifies the data source (HuggingFace

      dataset or local directory), column mappings, image rescaling, normalization,

      and augmentations.


      Required when `model_class: frankenstein_vit`. For text/NLP tasks use

      `text_dataset` instead.


      **References:** (paper: arxiv:2010.11929) (paper: arxiv:2111.06377)'
    description_es: 'Configuración de dataset de visión para tareas de imagen (`patch_prediction`,

      `classification`, `segmentation`). Especifica la fuente de datos, mapeo de

      columnas, reescalado de imagen, normalización y aumentaciones.


      Obligatorio cuando `model_class: frankenstein_vit`. Para tareas de texto/NLP

      usa `text_dataset` en su lugar.


      **Referencias:** (paper: arxiv:2010.11929) (paper: arxiv:2111.06377)'
    additionalProperties: false
    properties:
      dataset_name:
        type: string
        title: Dataset Name
        title_es: Nombre de Dataset
        description: HuggingFace dataset identifier (e.g. `cifar10`, `imagenet-1k`).
        description_es: Identificador de dataset de HuggingFace.
      dataset_dir:
        type: string
        title: Dataset Directory
        title_es: Directorio de Dataset
        description: 'Local directory path containing images. For classification, expects

          per-class subfolders or a labels CSV. For segmentation, expects images

          + segmentation maps.'
        description_es: Ruta local del directorio que contiene las imágenes.
      image_column:
        type: string
        title: Image Column
        title_es: Columna de Imagen
        description: Column name for images in a HuggingFace dataset.
        description_es: Nombre de columna para imágenes en un dataset de HuggingFace.
        default: image
      label_column:
        type: string
        title: Label Column
        title_es: Columna de Etiqueta
        description: Column name for classification labels in a HuggingFace dataset.
        description_es: Nombre de columna para etiquetas de clasificación.
        default: label
      segmentation_column:
        type: string
        title: Segmentation Column
        title_es: Columna de Segmentación
        description: Column name for segmentation maps in a HuggingFace dataset.
        description_es: Nombre de columna para mapas de segmentación.
        default: segmentation_map
      rescale:
        type: object
        title: Rescale
        title_es: Reescalado
        description: 'Fallback target (height, width) when the top-level `image.image_size`

          block is absent. For ViT configs `image.image_size` is required and takes

          precedence; keep this only for dataset-only consumers.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Objetivo de respaldo (alto, ancho) cuando el bloque top-level

          `image.image_size` está ausente. Para configs ViT `image.image_size` es

          obligatorio y tiene precedencia; mantener esto solo para consumidores

          basados únicamente en el dataset.


          **Referencias:** (paper: arxiv:2010.11929)'
        additionalProperties: false
        properties:
          height:
            type: integer
            minimum: 1
            title: Rescale Height
            title_es: Alto de Reescalado
            description: Fallback height in pixels when the top-level `image.image_size` is not set.
            description_es: Alto de respaldo en píxeles cuando no se fija `image.image_size`.
          width:
            type: integer
            minimum: 1
            title: Rescale Width
            title_es: Ancho de Reescalado
            description: Fallback width in pixels when the top-level `image.image_size` is not set.
            description_es: Ancho de respaldo en píxeles cuando no se fija `image.image_size`.
        required:
        - height
        - width
      normalize:
        type: object
        title: Normalize
        title_es: Normalización
        description: 'Per-channel mean and std for normalization. Applied after rescaling.

          If omitted, no normalization is applied.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Media y desviación estándar por canal para normalización.


          **Referencias:** (paper: arxiv:2010.11929)'
        additionalProperties: false
        properties:
          mean:
            type: array
            items:
              description: Mean value for one channel.
              description_es: Valor de media para un canal.
              type: number
            title: Mean
            title_es: Media
            description: 'Per-channel means applied after rescaling (ImageNet default: `[0.485, 0.456, 0.406]`).'
            description_es: 'Medias por canal aplicadas tras el reescalado (por defecto ImageNet: `[0.485, 0.456, 0.406]`).'
          std:
            type: array
            items:
              description: Standard deviation for one channel.
              description_es: Desviación estándar para un canal.
              type: number
            title: Std
            title_es: Desviación Estándar
            description: 'Per-channel standard deviations applied after rescaling (ImageNet default: `[0.229, 0.224, 0.225]`).'
            description_es: 'Desviaciones estándar por canal aplicadas tras el reescalado (por defecto ImageNet: `[0.229, 0.224, 0.225]`).'
      augmentations:
        type: object
        title: Augmentations
        title_es: Aumentaciones
        description: 'Data augmentation options applied during training.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Opciones de aumentación de datos aplicadas durante el entrenamiento.


          **Referencias:** (paper: arxiv:2010.11929)'
        additionalProperties: false
        properties:
          random_crop:
            type: boolean
            title: Random Crop
            title_es: Recorte Aleatorio
            description: Random crop augmentation applied during training.
            description_es: Aumentación de recorte aleatorio aplicada durante el entrenamiento.
            default: false
          horizontal_flip:
            type: boolean
            title: Horizontal Flip
            title_es: Volteo Horizontal
            description: Random horizontal flip applied during training.
            description_es: Volteo horizontal aleatorio aplicado durante el entrenamiento.
            default: true
          color_jitter:
            type: boolean
            title: Color Jitter
            title_es: Variación de Color
            description: Random brightness/contrast/saturation jitter applied during training.
            description_es: Variación aleatoria de brillo/contraste/saturación aplicada durante el entrenamiento.
            default: false
          mixup_alpha:
            type: number
            minimum: 0
            title: Mixup Alpha
            title_es: Alpha de Mixup
            description: Mixup interpolation strength; `0` disables mixup.
            description_es: Fuerza de interpolación Mixup; `0` desactiva mixup.
            default: 0
  audio:
    type: object
    title: Audio Configuration
    title_es: Configuración de Audio
    description: 'Audio-specific configuration for the `frankenstein_audio` model class

      (Conformer (paper: arxiv:2005.08100)). Defines the waveform frontend (`logmel`,

      `spectrogram` or raw 1-D signals), the sample rate and frame geometry, the

      convolutional subsampling stack, the classification pooling strategy and

      the ASR head (CTC or RNN-Transducer (paper: arxiv:1211.3711)).


      Required when `model_class: frankenstein_audio`.


      `feature: logmel` computes 80-channel log-mel filterbanks with a 25 ms

      window and a 10 ms stride (the Conformer recipe). `feature: spectrogram`

      uses the log-power STFT instead. `feature: raw` bypasses the mel/STFT

      frontend entirely and feeds generic multichannel 1-D signals through the

      same conv subsampling, supporting biomedical and sensor time series (EEG,

      EMG, accelerometer, ...) for classification; set `in_channels` to the

      number of signal channels.


      **References:** (paper: arxiv:2005.08100)'
    description_es: 'Configuración específica de audio para el modelo `frankenstein_audio`

      (Conformer (paper: arxiv:2005.08100)). Define el frontend de forma de onda

      (`logmel`, `spectrogram` o señales 1-D crudas), la tasa de muestreo y la

      geometría de tramas, la pila de submuestreo convolucional, la estrategia de

      pooling de clasificación y la cabeza ASR (CTC o RNN-Transducer,

      (paper: arxiv:1211.3711)).


      Obligatorio cuando `model_class: frankenstein_audio`.


      `feature: logmel` calcula filtros log-mel de 80 canales con ventana de

      25 ms y salto de 10 ms (la receta de Conformer). `feature: spectrogram` usa

      en su lugar el STFT de potencia logarítmica. `feature: raw` omite el

      frontend mel/STFT y alimenta señales 1-D multicanal genéricas a través del

      mismo submuestreo convolucional, soportando series temporales biomédicas y

      de sensores (EEG, EMG, acelerómetro, ...) para clasificación; ajusta

      `in_channels` al número de canales de la señal.


      **Referencias:** (paper: arxiv:2005.08100)'
    additionalProperties: false
    properties:
      sample_rate:
        type: integer
        minimum: 1
        title: Sample Rate
        title_es: Tasa de Muestreo
        description: 'Audio sample rate in Hz used by the mel/STFT frontend. The Conformer

          recipe uses 16 kHz.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Tasa de muestreo de audio en Hz usada por el frontend mel/STFT. La

          receta de Conformer usa 16 kHz.


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 16000
        examples:
        - 8000
        - 16000
        - 22050
      n_mels:
        type: integer
        minimum: 1
        title: Mel Channels
        title_es: Canales Mel
        description: 'Number of mel filterbank channels (`feature: logmel`). The Conformer

          paper uses 80.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Número de canales del banco de filtros mel (`feature: logmel`). El

          paper de Conformer usa 80.


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 80
        examples:
        - 40
        - 80
        - 128
      window_ms:
        type: number
        exclusiveMinimum: 0
        title: Window (ms)
        title_es: Ventana (ms)
        description: 'Analysis window length in milliseconds for the short-time Fourier

          transform. The Conformer paper uses 25 ms.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Longitud de la ventana de análisis en milisegundos para la transformada

          de Fourier de corto tiempo. El paper de Conformer usa 25 ms.


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 25.0
        examples:
        - 20.0
        - 25.0
        - 32.0
      stride_ms:
        type: number
        exclusiveMinimum: 0
        title: Stride (ms)
        title_es: Salto (ms)
        description: 'Frame stride in milliseconds (hop length). The Conformer paper uses

          10 ms, which the two stride-2 convolutions reduce to 40 ms frames.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Salto entre tramas en milisegundos (hop length). El paper de Conformer

          usa 10 ms, que las dos convoluciones de stride 2 reducen a tramas de

          40 ms.


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 10.0
        examples:
        - 10.0
        - 12.5
        - 20.0
      n_fft:
        type: integer
        minimum: 1
        title: FFT Size
        title_es: Tamaño de FFT
        description: 'FFT size of the short-time Fourier transform. Must be at least the

          window length in samples (`window_ms * sample_rate / 1000`). The

          Conformer recipe uses 400 for a 25 ms window at 16 kHz.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Tamaño de la FFT de la transformada de Fourier de corto tiempo. Debe

          ser al menos la longitud de la ventana en muestras

          (`window_ms * sample_rate / 1000`). La receta de Conformer usa 400 para

          una ventana de 25 ms a 16 kHz.


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 400
        examples:
        - 256
        - 400
        - 512
      feature:
        type: string
        title: Input Feature
        title_es: Característica de Entrada
        description: 'Frontend feature type. `logmel` = 80-channel log-mel filterbanks (the

          Conformer recipe). `spectrogram` = log-power STFT frames. `raw` =

          generic multichannel 1-D signals (EEG, EMG, accelerometer, ...) fed

          directly to the convolutional subsampling; use it for biomedical and

          sensor time series classification.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Tipo de característica del frontend. `logmel` = filtros log-mel de 80

          canales (la receta de Conformer). `spectrogram` = tramas STFT de

          potencia logarítmica. `raw` = señales 1-D multicanal genéricas (EEG,

          EMG, acelerómetro, ...) alimentadas directamente al submuestreo

          convolucional; úsalo para clasificación de series temporales biomédicas

          y de sensores.


          **Referencias:** (paper: arxiv:2005.08100)'
        enum:
        - logmel
        - spectrogram
        - raw
        default: logmel
        examples:
        - logmel
        - spectrogram
        - raw
      in_channels:
        type: integer
        minimum: 1
        title: Input Channels
        title_es: Canales de Entrada
        description: 'Number of input channels for `feature: raw` (1 for a mono waveform,

          N for N-channel physiological or sensor signals). Ignored by the

          `logmel`/`spectrogram` frontends, which mix the input to mono.


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Número de canales de entrada para `feature: raw` (1 para una forma de

          onda mono, N para señales fisiológicas o de sensores de N canales).

          Ignorado por los frontends `logmel`/`spectrogram`, que mezclan la

          entrada a mono.


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 1
        examples:
        - 1
        - 4
        - 19
      conv_channels:
        type: integer
        minimum: 1
        title: Convolution Channels
        title_es: Canales de Convolución
        description: 'Number of channels of the convolutional subsampling stack

          (two stride-2 convolutions, kernel 3, padding 1). The stack reduces the

          frame rate by 4× (10 ms → 40 ms for the Conformer recipe).


          **References:** (paper: arxiv:2005.08100)'
        description_es: 'Número de canales de la pila de submuestreo convolucional (dos

          convoluciones de stride 2, kernel 3, padding 1). La pila reduce la tasa

          de tramas en 4× (10 ms → 40 ms para la receta de Conformer).


          **Referencias:** (paper: arxiv:2005.08100)'
        default: 32
        examples:
        - 16
        - 32
        - 64
      num_classes:
        type: integer
        minimum: 1
        title: Number of Classes
        title_es: Número de Clases
        description: 'Number of classes for audio classification (`task:

          audio_classification`). No implicit task default is applied by the

          schema beyond the documented `2`.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Número de clases para clasificación de audio (`task:

          audio_classification`). El esquema no aplica más valor por defecto que

          el `2` documentado.


          **Referencias:** (paper: arxiv:2010.11929)'
        default: 2
        examples:
        - 2
        - 10
        - 35
      pooling_mode:
        type: string
        title: Pooling Mode
        title_es: Modo de Pooling
        description: 'Pooling strategy for audio classification. `gap` (Global Average

          Pooling) averages the encoder frames; `cls` prepends a learnable [CLS]

          token and reads its output. The token is only added for the pooled

          classification path, so ASR frame alignment is unaffected.


          **References:** (paper: arxiv:2010.11929)'
        description_es: 'Estrategia de pooling para clasificación de audio. `gap` (Global

          Average Pooling) promedia las tramas del encoder; `cls` antepone un

          token [CLS] aprendible y lee su salida. El token solo se añade en la ruta

          de clasificación con pooling, por lo que la alineación de tramas ASR no

          se ve afectada.


          **Referencias:** (paper: arxiv:2010.11929)'
        enum:
        - gap
        - cls
        default: gap
      asr_loss:
        type: string
        title: ASR Loss
        title_es: Pérdida ASR
        description: 'Automatic speech recognition head. `ctc` = Connectionist Temporal

          Classification projection over the encoder frames. `transducer` =

          RNN-Transducer (paper: arxiv:1211.3711) with an LSTM prediction network and a

          joint network returning per-frame/per-label logits.


          **References:** (paper: https://doi.org/10.1145/1143844.1143891) (paper: arxiv:1211.3711)'
        description_es: 'Cabeza de reconocimiento automático del habla. `ctc` = proyección de

          Connectionist Temporal Classification sobre las tramas del encoder.

          `transducer` = RNN-Transducer (paper: arxiv:1211.3711) con una red de

          predicción LSTM y una red conjunta que devuelve logits por

          trama/etiqueta.


          **Referencias:** (paper: https://doi.org/10.1145/1143844.1143891) (paper: arxiv:1211.3711)'
        enum:
        - ctc
        - transducer
        default: ctc
        examples:
        - ctc
        - transducer
      asr_decoder_dim:
        type: integer
        minimum: 1
        title: ASR Decoder Dimension
        title_es: Dimensión del Decoder ASR
        description: 'Hidden size of the RNN-Transducer prediction network (`asr_loss:

          transducer`). The Conformer paper uses 320 (S), 640 (M/L).


          **References:** (paper: arxiv:1211.3711)'
        description_es: 'Tamaño oculto de la red de predicción del RNN-Transducer (`asr_loss:

          transducer`). El paper de Conformer usa 320 (S) y 640 (M/L).


          **Referencias:** (paper: arxiv:1211.3711)'
        default: 320
        examples:
        - 320
        - 640
      asr_decoder_layers:
        type: integer
        minimum: 1
        title: ASR Decoder Layers
        title_es: Capas del Decoder ASR
        description: 'Number of LSTM layers in the RNN-Transducer prediction network.


          **References:** (paper: arxiv:1211.3711)'
        description_es: 'Número de capas LSTM de la red de predicción del RNN-Transducer.


          **Referencias:** (paper: arxiv:1211.3711)'
        default: 1
        examples:
        - 1
        - 2
      asr_decoder_dropout:
        type: number
        minimum: 0
        exclusiveMaximum: 1
        title: ASR Decoder Dropout
        title_es: Dropout del Decoder ASR
        description: 'Dropout applied inside the RNN-Transducer prediction network (only

          active when `asr_decoder_layers > 1`, as required by `nn.LSTM`).


          **References:** (paper: arxiv:1211.3711)'
        description_es: 'Dropout aplicado dentro de la red de predicción del RNN-Transducer

          (solo activo cuando `asr_decoder_layers > 1`, como exige `nn.LSTM`).


          **Referencias:** (paper: arxiv:1211.3711)'
        default: 0.1
        examples:
        - 0.0
        - 0.1
        - 0.2
      spec_augment:
        type: object
        title: SpecAugment
        title_es: SpecAugment
        description: 'SpecAugment time/frequency masking (paper: arxiv:1904.08779) applied inside the

          audio frontend after the log-mel/spectrogram computation, only while the

          model is in training mode (`model.train()`), so evaluation and inference

          see unmasked features. The Conformer recipe uses a frequency mask width

          `F = 27`, `m_T = 10` time masks and a maximum time-mask ratio

          `p_S = 0.05`.


          **References:** (paper: arxiv:1904.08779)'
        description_es: 'Enmascaramiento de tiempo/frecuencia SpecAugment (paper: arxiv:1904.08779)

          aplicado dentro del frontend de audio tras calcular el log-mel /

          espectrograma, solo mientras el modelo está en modo entrenamiento

          (`model.train()`), por lo que la evaluación e inferencia ven

          características sin enmascarar. La receta de Conformer usa un ancho de

          máscara de frecuencia `F = 27`, `m_T = 10` máscaras de tiempo y una

          proporción máxima de máscara de tiempo `p_S = 0.05`.


          **Referencias:** (paper: arxiv:1904.08779)'
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Enabled
            title_es: Habilitado
            description: 'Enable SpecAugment masking during training.


              **References:** (paper: arxiv:1904.08779)'
            description_es: 'Habilita el enmascaramiento SpecAugment durante el entrenamiento.


              **Referencias:** (paper: arxiv:1904.08779)'
            default: false
          freq_mask_width:
            type: integer
            minimum: 1
            title: Frequency Mask Width
            title_es: Ancho de Máscara de Frecuencia
            description: 'Maximum width `F` of each frequency mask (paper value 27).


              **References:** (paper: arxiv:1904.08779)'
            description_es: 'Ancho máximo `F` de cada máscara de frecuencia (valor del paper 27).


              **Referencias:** (paper: arxiv:1904.08779)'
            default: 27
            examples:
            - 13
            - 27
          time_masks:
            type: integer
            minimum: 1
            title: Time Masks
            title_es: Máscaras de Tiempo
            description: 'Number `m_T` of time masks (paper value 10).


              **References:** (paper: arxiv:1904.08779)'
            description_es: 'Número `m_T` de máscaras de tiempo (valor del paper 10).


              **Referencias:** (paper: arxiv:1904.08779)'
            default: 10
            examples:
            - 2
            - 10
          time_mask_ratio:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            title: Time Mask Ratio
            title_es: Proporción de Máscara de Tiempo
            description: 'Maximum time-mask width as a fraction `p_S` of the frame count

              (paper value 0.05).


              **References:** (paper: arxiv:1904.08779)'
            description_es: 'Ancho máximo de la máscara de tiempo como fracción `p_S` del número

              de tramas (valor del paper 0.05).


              **Referencias:** (paper: arxiv:1904.08779)'
            default: 0.05
            examples:
            - 0.05
            - 0.1
  audio_dataset:
    type: object
    title: Audio Dataset Configuration
    title_es: Configuración de Dataset de Audio
    description: 'Audio dataset configuration for speech and audio-signal tasks. Specifies

      the data source (HuggingFace dataset or local directory), the waveform /

      transcript / label column mappings, duration clipping and resampling.

      SpecAugment augmentation lives in the model frontend (`audio.spec_augment`)

      so it follows `model.train()` / `model.eval()`.


      Required when `model_class: frankenstein_audio` is trained on a task that

      consumes data. For text/NLP use `text_dataset`; for images use

      `vision_dataset`.


      **References:** (paper: arxiv:1910.03771)'
    description_es: 'Configuración de dataset de audio para tareas de habla y señales de audio.

      Especifica la fuente de datos (dataset de HuggingFace o directorio local),

      el mapeo de columnas de forma de onda / transcripción / etiqueta, el

      recorte por duración y el remuestreo. La aumentación SpecAugment vive en el

      frontend del modelo (`audio.spec_augment`) para seguir a

      `model.train()` / `model.eval()`.


      Obligatorio cuando `model_class: frankenstein_audio` se entrena en una

      tarea que consume datos. Para texto/NLP usa `text_dataset`; para imágenes

      usa `vision_dataset`.


      **Referencias:** (paper: arxiv:1910.03771)'
    additionalProperties: false
    properties:
      dataset_name:
        type: string
        default: ''
        title: Dataset Name
        title_es: Nombre de Dataset
        description: 'HuggingFace dataset identifier (e.g.

          `astroza/chilean-jokes-festival-de-vina`). Leave it empty to use a

          synthetic dummy dataset for smoke tests.'
        description_es: 'Identificador de dataset de HuggingFace (p. ej.

          `astroza/chilean-jokes-festival-de-vina`). Déjalo vacío para usar un

          dataset sintético de prueba.'
      dataset_dir:
        type: string
        default: ''
        title: Dataset Directory
        title_es: Directorio de Dataset
        description: 'Local directory containing audio files plus transcripts or labels.

          Alternative to `dataset_name`.'
        description_es: 'Directorio local que contiene archivos de audio junto con

          transcripciones o etiquetas. Alternativa a `dataset_name`.'
      split:
        type: string
        title: Split
        title_es: Partición
        description: Dataset split to load (HuggingFace split name, e.g. `train`).
        description_es: Partición del dataset a cargar (nombre de split de HuggingFace, p. ej. `train`).
        default: train
        examples:
        - train
        - validation
        - test
      audio_column:
        type: string
        title: Audio Column
        title_es: Columna de Audio
        description: 'Column name holding the waveform in a HuggingFace dataset. Values may

          be decoded audio objects, file paths or already-sampled arrays.'
        description_es: 'Nombre de la columna que contiene la forma de onda en un dataset de

          HuggingFace. Los valores pueden ser objetos de audio decodificados, rutas

          de archivo o arreglos ya muestreados.'
        default: audio
        examples:
        - audio
        - waveform
        - signal
      text_column:
        type: string
        title: Text Column
        title_es: Columna de Texto
        description: 'Column name holding the transcript for ASR tasks (`task: asr`). The

          character/word tokenizer and the target ids are built from this column.'
        description_es: 'Nombre de la columna que contiene la transcripción para tareas ASR

          (`task: asr`). El tokenizador de caracteres/palabras y los ids objetivo

          se construyen a partir de esta columna.'
        default: text
        examples:
        - text
        - sentence
        - transcription
      label_column:
        type: string
        default: ''
        title: Label Column
        title_es: Columna de Etiqueta
        description: 'Column name holding the integer class label for audio classification

          (`task: audio_classification`). Unused by ASR tasks.'
        description_es: 'Nombre de la columna que contiene la etiqueta de clase entera para

          clasificación de audio (`task: audio_classification`). No se usa en

          tareas ASR.'
      max_duration_sec:
        type: number
        exclusiveMinimum: 0
        title: Maximum Duration (s)
        title_es: Duración Máxima (s)
        description: 'Clip (and pad) every waveform to at most this many seconds. The

          Conformer recipe uses full utterances; 30 s covers the example dataset.'
        description_es: 'Recorta (y rellena) cada forma de onda a como máximo esta cantidad de

          segundos. La receta de Conformer usa enunciados completos; 30 s cubre el

          dataset de ejemplo.'
        default: 30.0
        examples:
        - 10.0
        - 30.0
        - 60.0
      resample:
        type: boolean
        title: Resample
        title_es: Remuestrear
        description: 'If true, resample every waveform to the model''s

          `audio.sample_rate` before the frontend.'
        description_es: 'Si es verdadero, remuestrea cada forma de onda a la

          `audio.sample_rate` del modelo antes del frontend.'
        default: true
  text_dataset:
    type: object
    title: Text Dataset Configuration
    title_es: Configuración de Dataset de Texto
    description: 'Text dataset configuration for NLP tasks (`mlm`, `causal_lm`,

      `text_classification`). Specifies the data source (HuggingFace dataset id,

      local directory with parquet/json files, or a local tokenizer-cached copy),

      the split, and the column mappings. When present, the engine builds the

      training DataLoader from this spec instead of the legacy fixed RedPajama

      streaming corpus — used by embedding hosts (e.g. DashAI) when the run

      dataset is not the data source.


      **References:** (paper: arxiv:1910.03771)'
    description_es: 'Configuración de dataset de texto para tareas NLP (`mlm`, `causal_lm`,

      `text_classification`). Especifica la fuente de datos (id de dataset de

      HuggingFace, directorio local con parquet/json, o copia en caché del

      tokenizador), el split y el mapeo de columnas. Cuando está presente, el

      engine construye el DataLoader de entrenamiento a partir de esta

      especificación en lugar del corpus fijo legacy de RedPajama — usado por

      hosts de embedding (p.ej. DashAI) cuando el dataset del run no es la fuente.


      **Referencias:** (paper: arxiv:1910.03771)'
    additionalProperties: false
    properties:
      dataset_name:
        type: string
        title: Dataset Name
        title_es: Nombre de Dataset
        description: 'HuggingFace dataset identifier (e.g. `wikitext`, `erickfmm/red_pajama_es_hq_35`).

          Ignored when `data_dir` is set.'
        description_es: 'Identificador de dataset de HuggingFace (p.ej. `wikitext`,

          `erickfmm/red_pajama_es_hq_35`). Se ignora si `data_dir` está definido.'
      split:
        type: string
        title: Split
        title_es: Split
        description: Dataset split to load (e.g. `train`, `train[:90%]`).
        description_es: Split del dataset a cargar (p.ej. `train`, `train[:90%]`).
        default: train
      text_column:
        type: string
        title: Text Column
        title_es: Columna de Texto
        description: Column name holding the raw text.
        description_es: Nombre de la columna que contiene el texto crudo.
        default: text
      label_column:
        type: string
        title: Label Column
        title_es: Columna de Etiqueta
        description: 'Column name holding the class labels. Required (with `use_labels: true`)

          for `task: text_classification`; ignored for `mlm`/`causal_lm`.'
        description_es: 'Nombre de la columna que contiene las clases. Requerida (con

          `use_labels: true`) para `task: text_classification`; ignorada para

          `mlm`/`causal_lm`.'
      data_dir:
        type: string
        title: Data Directory
        title_es: Directorio de Datos
        description: 'Local directory with `*.parquet` or `*.json(l)` files. Takes precedence

          over `dataset_name`.'
        description_es: 'Directorio local con archivos `*.parquet` o `*.json`. Tiene prioridad

          sobre `dataset_name`.'
      streaming:
        type: boolean
        title: Streaming
        title_es: Streaming
        description: 'Stream the HuggingFace dataset instead of downloading it fully

          (recommended for large corpora; only affects `dataset_name` mode).'
        description_es: 'Transmite el dataset de HuggingFace en streaming en lugar de

          descargarlo por completo (recomendado para datasets grandes; solo

          afecta al modo `dataset_name`).'
        default: false
      use_labels:
        type: boolean
        title: Use Labels
        title_es: Usar Etiquetas
        description: 'Read `label_column` as integer class targets (supervised

          text classification). Mutually exclusive with the MLM/CLM objectives.'
        description_es: 'Lee `label_column` como clases enteras (clasificación de texto

          supervisada). Mutuamente excluyente con los objetivos MLM/CLM.'
        default: false
      max_samples:
        type: integer
        title: Max Samples
        title_es: Máximo de Muestras
        description: Optional cap on the number of samples loaded from the source.
        description_es: Límite opcional de muestras cargadas de la fuente.
        minimum: 1
  inference:
    type: object
    title: Inference-time configuration (generation and KV cache)
    title_es: Configuración de inferencia (generación y caché KV)
    description: 'Runtime inference configuration: autoregressive generation sampling parameters and the opt-in KV cache (quantization, compression and per-mixer overrides). This block is runtime configuration — it never affects training and is deliberately NOT part of the flat FrankensteinModelConfig. Precedence: CLI flags override YAML values, which override schema defaults. **References:** (paper: arxiv:2309.06180)'
    description_es: 'Configuración de runtime para inferencia: parámetros de muestreo de generación autorregresiva y la caché KV opcional (cuantización, compresión y anulaciones por mezclador). Este bloque es configuración de ejecución: nunca afecta al entrenamiento y deliberadamente NO forma parte del FrankensteinModelConfig plano. Precedencia: las banderas CLI sobrescriben los valores YAML, que a su vez sobrescriben los valores por defecto del esquema. **Referencias:** (paper: arxiv:2309.06180)'
    additionalProperties: false
    properties:
      generation:
        type: object
        title: Generation parameters
        title_es: Parámetros de generación
        description: Sampling parameters for autoregressive generation (`FrankensteinDecoder.generate` / CLI `infer --task causal_lm`).
        description_es: Parámetros de muestreo para la generación autorregresiva (`FrankensteinDecoder.generate` / CLI `infer --task causal_lm`).
        additionalProperties: false
        properties:
          max_new_tokens:
            type: integer
            minimum: 1
            default: 64
            title: Maximum new tokens
            title_es: Máximo de tokens nuevos
            description: Maximum number of tokens to generate after the prompt.
            description_es: Número máximo de tokens a generar después del prompt.
          temperature:
            type: number
            minimum: 0
            default: 1.0
            title: Sampling temperature
            title_es: Temperatura de muestreo
            description: Softmax temperature; lower values make output more deterministic.
            description_es: Temperatura softmax; valores más bajos hacen la salida más determinista.
          top_k:
            type: integer
            minimum: 0
            default: 50
            title: Top-k filtering
            title_es: Filtrado top-k
            description: Keep only the k highest-probability tokens for sampling; 0 disables top-k filtering.
            description_es: Conserva solo los k tokens de mayor probabilidad para el muestreo; 0 desactiva el filtrado top-k.
          top_p:
            type: number
            minimum: 0
            maximum: 1
            default: 1.0
            title: Nucleus (top-p) filtering
            title_es: Filtrado nucleus (top-p)
            description: Keep the smallest set of tokens whose cumulative probability exceeds top_p; 1.0 disables nucleus filtering.
            description_es: Conserva el menor conjunto de tokens cuya probabilidad acumulada excede top_p; 1.0 desactiva el filtrado nucleus.
          greedy:
            type: boolean
            default: false
            title: Greedy decoding
            title_es: Decodificación codiciosa
            description: When true, always take the argmax token (overrides sampling).
            description_es: Si es verdadero, siempre toma el token argmax (anula el muestreo).
      kv_cache:
        type: object
        title: KV cache
        title_es: Caché KV
        description: 'Opt-in KV-cache management for incremental decoding (arXiv:2412.19442 survey). Disabled by default; when disabled, generation runs the legacy full-recompute loop bit-identically. Unsupported mixers (per the declarative CACHE_SPECS registry) silently fall back to the uncached path — inference never fails because of the cache. **References:** (paper: arxiv:2309.06180)'
        description_es: 'Gestión opcional de la caché KV para decodificación incremental (encuesta arXiv:2412.19442). Desactivada por defecto; al desactivarla, la generación ejecuta el bucle de recomputación completa legado de forma bit-idéntica. Los mezcladores no compatibles (según el registro declarativo CACHE_SPECS) retroceden silenciosamente a la ruta sin caché: la inferencia nunca falla por la caché. **Referencias:** (paper: arxiv:2309.06180)'
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: false
            title: Enable KV cache
            title_es: Activar caché KV
            description: 'Opt-in switch for incremental decoding (default false —

              legacy behavior is bit-identical).


              **References:** (paper: arxiv:2309.06180)'
            description_es: 'Interruptor opcional para la decodificación incremental

              (por defecto falso — el comportamiento legado es bit-idéntico).


              **Referencias:** (paper: arxiv:2309.06180)'
          quantization:
            type: object
            title: KV quantization
            title_es: Cuantización KV
            description: 'Write-time quantization codec applied to cached tensors

              (KIVI (paper: arxiv:2402.02750), KVQuant (paper: arxiv:2401.18079)).


              **References:** (paper: arxiv:2402.02750) (paper: arxiv:2401.18079)'
            description_es: 'Códec de cuantización aplicado en escritura a los tensores

              en caché (KIVI (paper: arxiv:2402.02750), KVQuant (paper: arxiv:2401.18079)).


              **Referencias:** (paper: arxiv:2402.02750) (paper: arxiv:2401.18079)'
            additionalProperties: false
            properties:
              method:
                type: string
                enum:
                - none
                - int8
                - int4_kivi
                default: none
                title: Quantization method
                title_es: Método de cuantización
                description: 'Codec applied at slot write/read time.

                  - `none`: full-precision passthrough (baseline).

                  - `int8`: symmetric int8 with asymmetric axes — K per-channel, V per-token (KIVI).

                  - `int4_kivi`: group-wise int4 with a protected full-precision window + pinned sinks (KIVI + StreamingLLM).


                  Future interface-ready plugins (not in v1): int2_kivi, palu_lowrank, commvq, qjl_sketch, block_gtq. **References:** (paper: arxiv:2402.02750) (paper: arxiv:2401.18079)'
                description_es: 'Códec aplicado al escribir/leer los slots.

                  - `none`: paso de precisión completa (línea base).

                  - `int8`: int8 simétrico con ejes asimétricos — K por canal, V por token (KIVI).

                  - `int4_kivi`: int4 por grupos con ventana de precisión completa protegida + sinks fijados (KIVI + StreamingLLM).


                  Plugins futuros (no en v1): int2_kivi, palu_lowrank, commvq, qjl_sketch, block_gtq. **Referencias:** (paper: arxiv:2402.02750) (paper: arxiv:2401.18079)'
              k_bits:
                type: integer
                enum:
                - 2
                - 4
                - 8
                default: 4
                title: Key bits
                title_es: Bits de las claves
                description: 'Bit width for key streams (int4_kivi only; int8 fixes 8).


                  **References:** (paper: arxiv:2402.02750)'
                description_es: 'Ancho de bits para los streams de claves (solo int4_kivi;

                  int8 fija 8).


                  **Referencias:** (paper: arxiv:2402.02750)'
              v_bits:
                type: integer
                enum:
                - 2
                - 4
                - 8
                default: 4
                title: Value bits
                title_es: Bits de los valores
                description: 'Bit width for value streams (int4_kivi only; int8 fixes 8).


                  **References:** (paper: arxiv:2402.02750)'
                description_es: 'Ancho de bits para los streams de valores (solo

                  int4_kivi; int8 fija 8).


                  **Referencias:** (paper: arxiv:2402.02750)'
              group_size:
                type: integer
                minimum: 16
                default: 64
                title: Quantization group size
                title_es: Tamaño de grupo de cuantización
                description: 'Tokens per quantization group along the sequence

                  (int4_kivi only).


                  **References:** (paper: arxiv:2402.02750)'
                description_es: 'Tokens por grupo de cuantización a lo largo de la

                  secuencia (solo int4_kivi).


                  **Referencias:** (paper: arxiv:2402.02750)'
              protected_window:
                type: integer
                minimum: 0
                default: 32
                title: Protected full-precision window
                title_es: Ventana protegida de precisión completa
                description: 'Most recent tokens kept in full precision and never

                  quantized (int4_kivi only; KVQuant/KVSink outlier protection).


                  **References:** (paper: arxiv:2402.02750) (paper: arxiv:2401.18079)'
                description_es: 'Los tokens más recientes se mantienen en precisión

                  completa y nunca se cuantizan (solo int4_kivi; protección de

                  atípicos KVQuant/KVSink).


                  **Referencias:** (paper: arxiv:2402.02750) (paper: arxiv:2401.18079)'
          compression:
            type: object
            title: KV compression / eviction
            title_es: Compresión / expulsión KV
            description: 'Read-time eviction policy operating on the cache across

              decode steps (StreamingLLM (paper: arxiv:2309.17453), H2O (paper: arxiv:2306.14048)).


              **References:** (paper: arxiv:2309.17453) (paper: arxiv:2306.14048)'
            description_es: 'Política de expulsión en lectura que opera sobre la caché

              durante los pasos de decodificación (StreamingLLM (paper: arxiv:2309.17453),

              H2O (paper: arxiv:2306.14048)).


              **Referencias:** (paper: arxiv:2309.17453) (paper: arxiv:2306.14048)'
            additionalProperties: false
            properties:
              method:
                type: string
                enum:
                - none
                - window_sinks
                default: none
                title: Compression method
                title_es: Método de compresión
                description: 'Eviction policy across decode steps.

                  - `none`: keep everything.

                  - `window_sinks`: pin the first num_sinks positions and keep only the last `window` positions (StreamingLLM attention sinks).


                  Future enum-ready policies (not in v1): h2o, snapkv_prefill, pyramid, sparsek. **References:** (paper: arxiv:2309.17453) (paper: arxiv:2306.14048)'
                description_es: 'Política de expulsión durante los pasos de decodificación.

                  - `none`: conservar todo.

                  - `window_sinks`: fija las primeras num_sinks posiciones y conserva solo las últimas `window` posiciones (attention sinks de StreamingLLM).


                  Políticas futuras (no en v1): h2o, snapkv_prefill, pyramid, sparsek. **Referencias:** (paper: arxiv:2309.17453) (paper: arxiv:2306.14048)'
              num_sinks:
                type: integer
                minimum: 0
                default: 4
                title: Number of attention sinks
                title_es: Número de attention sinks
                description: 'Leading positions pinned forever (never evicted; kept

                  full precision under int4_kivi). Removing sinks collapses

                  performance catastrophically.


                  **References:** (paper: arxiv:2309.17453)'
                description_es: 'Posiciones iniciales fijadas para siempre (nunca

                  expulsadas; en precisión completa bajo int4_kivi). Eliminar los

                  sinks colapsa el rendimiento.


                  **Referencias:** (paper: arxiv:2309.17453)'
              window:
                type: integer
                minimum: 1
                default: 512
                title: Sliding window size
                title_es: Tamaño de la ventana deslizante
                description: 'Number of most-recent positions retained (window_sinks).


                  **References:** (paper: arxiv:2309.17453) (paper: arxiv:2310.06825)'
                description_es: 'Número de posiciones más recientes conservadas

                  (window_sinks).


                  **Referencias:** (paper: arxiv:2309.17453) (paper: arxiv:2310.06825)'
              budget:
                type:
                - integer
                - 'null'
                default: null
                title: Token budget per layer
                title_es: Presupuesto de tokens por capa
                description: 'Scalar token budget per layer; null = unlimited. When

                  set (window_sinks), overrides `window`.


                  **References:** (paper: arxiv:2306.14048)'
                description_es: 'Presupuesto escalar de tokens por capa; null =

                  ilimitado. Si se establece (window_sinks), sobrescribe `window`.


                  **Referencias:** (paper: arxiv:2306.14048)'
              per_layer_budgets:
                type: array
                items:
                  description: 'Token budget for one layer (index i = logical layer i % len); PyramidKV-style depth allocation assigns larger budgets to lower layers.

                    **References:** (paper: arxiv:2406.02069)'
                  description_es: 'Presupuesto de tokens para una capa (índice i = capa lógica i % len); la asignación por profundidad estilo PyramidKV da mayores presupuestos a las capas bajas.

                    **Referencias:** (paper: arxiv:2406.02069)'
                  type: integer
                  minimum: 1
                default: []
                title: Per-layer budgets
                title_es: Presupuestos por capa
                description: 'Per-layer budget vector (index i = logical layer i %

                  len); overrides the scalar budget when non-empty (PyramidKV-style

                  depth allocation (paper: arxiv:2406.02069)).


                  **References:** (paper: arxiv:2406.02069)'
                description_es: 'Vector de presupuestos por capa (índice i = capa

                  lógica i % len); sobrescribe el presupuesto escalar cuando no está

                  vacío (asignación de profundidad estilo PyramidKV,

                  (paper: arxiv:2406.02069)).


                  **Referencias:** (paper: arxiv:2406.02069)'
          per_mixer:
            type: array
            title: Per-mixer overrides
            title_es: Anulaciones por mezclador
            description: 'Enable/disable caching per mixer key (must be a

              layer_pattern enum value). Disabled mixers run the legacy uncached

              path (D5).


              **References:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
            description_es: 'Activar/desactivar la caché por clave de mezclador (debe

              ser un valor del enum layer_pattern). Los mezcladores desactivados

              ejecutan la ruta legado sin caché (D5).


              **Referencias:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
            items:
              type: object
              additionalProperties: false
              description: 'One per-mixer cache override entry (mixer key plus enabled flag).

                **References:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
              description_es: 'Una entrada de anulación de caché por mezclador (clave de mixer más bandera enabled).

                **Referencias:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
              properties:
                mixer:
                  type: string
                  title: Mixer key
                  title_es: Clave del mezclador
                  description: 'Layer-pattern enum value this override applies to.


                    **References:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
                  description_es: 'Valor del enum layer_pattern al que aplica esta

                    anulación.


                    **Referencias:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
                enabled:
                  type: boolean
                  default: true
                  title: Caching enabled
                  title_es: Caché activada
                  description: 'Whether this mixer uses the cache (false = legacy

                    uncached path for that mixer).


                    **References:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
                  description_es: 'Si este mezclador usa la caché (falso = ruta legado

                    sin caché para ese mezclador).


                    **Referencias:** (paper: arxiv:2402.19427) (paper: arxiv:2403.19887)'
              required:
              - mixer
  plugins:
    type: array
    items:
      type: string
    title: Plugins
    title_es: Plugins
    description: Local plugin modules to import before schema validation. Each entry is an importable module path or a `module:object` reference whose module registers component specs through `src.plugins.api`. Installed plugins are discovered automatically through the `frankenstein.plugins` entry-point group.
    description_es: Módulos de plugin locales a importar antes de la validación del esquema. Cada entrada es una ruta de módulo importable o una referencia `modulo:objeto` cuyo módulo registra componentes vía `src.plugins.api`. Los plugins instalados se descubren automáticamente mediante el grupo de entry-points `frankenstein.plugins`.
    default: []
    examples:
    - - ./plugins/my_mixer.py
