              **Ejemplos explicados:**

              - `[standard]` repetido 12 veces: Encoder clásico tipo BERT. Configuración más simple, sirve como línea base confiable. Todas las capas usan atención cuadrática completa.

              - `[retnet, titan, retnet, mamba, titan, ode]` con `num_layers=6`: Arquitectura mixta que combina retención recurrente (largo alcance eficiente), atención Titan con codificación posicional (atención local precisa), Mamba SSM (modelado de secuencias en tiempo lineal) y ODE de profundidad continua. Cada posición recibe un tipo diferente de cómputo, permitiendo representaciones diversas.

              - `[standard, standard, longformer]` con `num_layers=3`: Híbrido denso + disperso. Empieza con 2 capas de atención densa para interacciones detalladas, luego usa Longformer para procesamiento eficiente de secuencias largas. Bueno para documentos > 512 tokens.

              - Mezcla de recurrente (retnet, mamba) con atención (standard, titan): Las capas recurrentes proporcionan memoria y contexto de largo alcance a costo O(1) en inferencia, mientras que las capas de atención proporcionan interacciones locales de alta precisión. Este es el patrón recomendado para modelos que necesitan tanto eficiencia como calidad.

              - ⚠️ `sparge` y `fasa` aplican su heurística dispersa **solo en evaluación/inferencia**. Durante el entrenamiento `HybridLayer` sustituye atención estándar densa sobre las mismas proyecciones (`q/k/v/out`), por lo que pueden entrenarse desde cero; los pesos entrenados son exactamente los que usa la ruta dispersa al evaluar.


              | `gmla` | Gated MLA — DeepSeek-style latent attention with low-rank queries, NoPE/rope split and a full-rank output gate (paper: arxiv:2607.24653) |

              '
