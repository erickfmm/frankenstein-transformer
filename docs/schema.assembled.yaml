          mode:
            type: string
            title: Transformer Mode
            title_es: Modo Transformer
            description: 'Controls attention masking. `encoder` = bidirectional attention. `decoder` = causal masking

              for autoregressive next-token prediction. When `model_class=frankenstein_text_decoder`, runtime forces `decoder`.


              **Impact:** `encoder` allows each token to attend to all others (BERT-style). `decoder` only

              allows attending to previous tokens (GPT-style). Changing modes fundamentally changes the task.


              **References:** (paper: arxiv:1706.03762)

              '
            description_es: 'Controla el enmascaramiento de atención. `encoder` = atención bidireccional. `decoder` = máscara

              causal para predicción autorregresiva de siguiente token. Con `model_class=frankenstein_text_decoder`,

              se fuerza `decoder` en ejecución.


              **Impacto:** `encoder` permite que cada token atienda a todos los demás (tipo BERT). `decoder` solo

              permite atender a tokens anteriores (tipo GPT). Cambiar de modo cambia fundamentalmente la tarea.


              **Referencias:** (paper: arxiv:1706.03762)

              '
            enum:
            - encoder
            - decoder
            default: encoder
            examples:
            - encoder
            - decoder
      norm:
        type: object
        additionalProperties: false
        properties:
          type:
            type: string
            title: Normalization Type
            title_es: Tipo de Normalización
            description: 'Normalization strategy used throughout the model.

              - `layer_norm`: Standard Layer Normalization — subtracts mean, divides by std. Stable, widely used. **Recommended.**

              - `dynamic_tanh`: Dynamic tanh normalization (DyT) — replaces explicit normalization with a learned bounded map: `tanh(α·x)`. Normalization-free, experimental.

              - `derf`: Dynamic erf normalization — extends DyT with erf function: `erf(α·x + s)`. Normalization-free, experimental, may improve over DyT.

              - `rms_norm`: Root Mean Square Layer Normalization — rescales by RMS magnitude only, without mean subtraction. Computationally simpler than LayerNorm; widely used in Llama, GPT-NeoX, and T5. Has a learnable per-dimension scale `g` (no bias). (paper: arxiv:1910.07467)

              - `prms_norm`: Partial RMSNorm — estimates the RMS statistic from only the first `p`% of hidden dimensions (controlled by `norm.partial_ratio`, default 6.25%). Same re-scaling invariance as `rms_norm` with reduced computation. (paper: arxiv:1910.07467, §5)

              - `flash_norm`: FlashNorm — weightless RMSNorm. Drops the learnable per-dimension scale `g` (it is meant to be folded into the subsequent linear layer''s weights via Prop. 1 of the paper). Composes with partial-RMS via `norm.flashnorm_partial_ratio` (default 0.0 = full RMS). (paper: arxiv:2407.09577)


              **Examples explained:**

              - `layer_norm`: Safest choice. Used in BERT, GPT, and most transformer architectures. Well-understood behavior, no tuning needed. Start here for new models.

              - `dynamic_tanh`: Experimental alternative. Removes per-token statistics computation. May converge faster in some settings but requires the model to learn α (initialized near 1.0). Useful for exploring normalization-free architectures.

              - `derf`: Most experimental option. Reported to outperform DyT in some benchmarks. Has learnable scale α and shift s. Use only if exploring cutting-edge normalization research and willing to tune additional parameters.

              - `rms_norm`: Efficient choice for large models. Drops mean-centering (7%–64% faster than LayerNorm per the paper). Standard in Llama-family models. Use when normalization overhead matters and mean re-centering is not needed.

              - `prms_norm`: Most efficient RMS variant. Uses only the first `norm.partial_ratio` fraction of dims for RMS estimation. The paper reports competitive results with as little as 6.25%. Best for extreme throughput; may show gradient instability with very small ratios.

              - `flash_norm`: Weightless RMSNorm. Equivalent to `rms_norm` with `g=1`; the per-dim scale is dropped entirely (Prop. 1 of the paper folds it into the next linear layer at load time). Use when reducing parameter count / preparing for fused norm+matmul kernels; the model can absorb the scale via downstream projection weights during training.


              **References:** (paper: arxiv:1607.06450) (paper: arxiv:2503.10622) (paper: arxiv:2512.10938)

              (paper: arxiv:1910.07467) (paper: arxiv:2407.09577)'
            description_es: 'Estrategia de normalización usada en todo el modelo.

              - `layer_norm`: Layer Normalization estándar — resta la media, divide por la desviación estándar. Estable, ampliamente usada. **Recomendada.**

              - `dynamic_tanh`: Normalización tanh dinámica (DyT) — reemplaza la normalización explícita con un mapa acotado aprendido: `tanh(α·x)`. Libre de normalización, experimental.

              - `derf`: Normalización erf dinámica — extiende DyT con función erf: `erf(α·x + s)`. Libre de normalización, experimental, puede mejorar sobre DyT.

              - `rms_norm`: Root Mean Square Layer Normalization — reescala por la magnitud RMS únicamente, sin resta de media. Computacionalmente más simple que LayerNorm; ampliamente usada en Llama, GPT-NeoX y T5. Tiene una escala `g` aprendible por dimensión (sin bias). (paper: arxiv:1910.07467)

              - `prms_norm`: Partial RMSNorm — estima la estadística RMS de solo el primer `p`% de dimensiones ocultas (controlado por `norm.partial_ratio`, por defecto 6.25%). Misma invariancia de re-escalamiento que `rms_norm` con menor cómputo. (paper: arxiv:1910.07467, §5)

              - `flash_norm`: FlashNorm — RMSNorm sin pesos. Elimina la escala `g` aprendible por dimensión (se pliega en los pesos de la capa lineal subsecuente vía Prop. 1 del paper). Se compone con RMS parcial vía `norm.flashnorm_partial_ratio` (por defecto 0.0 = RMS completo). (paper: arxiv:2407.09577)


              **Ejemplos explicados:**

              - `layer_norm`: Opción más segura. Usada en BERT, GPT y la mayoría de arquitecturas transformer. Comportamiento bien comprendido, no requiere ajuste. Empezar aquí para nuevos modelos.

              - `dynamic_tanh`: Alternativa experimental. Elimina el cómputo de estadísticas por token. Puede converger más rápido en algunos contextos pero requiere que el modelo aprenda α (inicializado cerca de 1.0). Útil para explorar arquitecturas libres de normalización.

              - `derf`: Opción más experimental. Reportado como superior a DyT en algunos benchmarks. Tiene escala α y desplazamiento s aprendibles. Usar solo si se exploran investigaciones de normalización de vanguardia y se está dispuesto a ajustar parámetros adicionales.

              - `rms_norm`: Opción eficiente para modelos grandes. Elimina la centralización de media (7%–64% más rápido que LayerNorm según el paper). Estándar en modelos tipo Llama. Usar cuando la sobrecarga de normalización importa y no se necesita re-centrar la media.

              - `prms_norm`: Variante RMS más eficiente. Usa solo la fracción `norm.partial_ratio` de dimensiones para la estimación RMS. El paper reporta resultados competitivos con tan solo 6.25%. Mejor para rendimiento extremo; puede mostrar inestabilidad de gradiente con razones muy pequeñas.

              - `flash_norm`: RMSNorm sin pesos. Equivalente a `rms_norm` con `g=1`; la escala por dimensión se elimina por completo (Prop. 1 del paper la pliega en la siguiente capa lineal al cargar el modelo). Usar cuando se busca reducir el conteo de parámetros o preparar la vía para kernels fusionados norm+matmul; el modelo puede absorber la escala vía los pesos de la proyección subsecuente durante el entrenamiento.


              **Referencias:** (paper: arxiv:1607.06450) (paper: arxiv:2503.10622) (paper: arxiv:2512.10938)

              (paper: arxiv:1910.07467) (paper: arxiv:2407.09577)'
            enum:
            - derf
            - dynamic_tanh
            - flash_norm
            - layer_norm
            - prms_norm
            - rms_norm
            default: dynamic_tanh
            examples:
            - layer_norm
            - dynamic_tanh
          partial_ratio:
            type: number
            title: pRMSNorm Partial Ratio
            title_es: Razón Parcial pRMSNorm
            description: 'Fraction of hidden dimensions used for RMS estimation when

              `norm.type=prms_norm`. The RMS is computed over the first

              `ceil(hidden_size * norm.partial_ratio)` elements.


              The paper (paper: arxiv:1910.07467) reports competitive results with as little

              as 6.25%. Must be in (0, 1]. Ignored when `norm.type` is not `prms_norm`.


              **Impact:** Smaller values = faster RMS computation but a noisier (biased)

              estimate, which can cause gradient instability at very small ratios.

              Values approaching 1.0 converge to standard `rms_norm`. The paper''s

              recommended default is 6.25% (0.0625).


              **References:** (paper: arxiv:1910.07467)'
            description_es: 'Fracción de dimensiones ocultas usadas para la estimación RMS cuando

              `norm.type=prms_norm`. El RMS se calcula sobre los primeros

              `ceil(hidden_size * norm.partial_ratio)` elementos.


              El paper (paper: arxiv:1910.07467) reporta resultados competitivos con tan solo

              6.25%. Debe estar en (0, 1]. Se ignora cuando `norm.type` no es `prms_norm`.


              **Impacto:** Valores más pequeños = cómputo de RMS más rápido pero una

              estimación más ruidosa (sesgada), lo que puede causar inestabilidad de

              gradiente con razones muy pequeñas. Valores cercanos a 1.0 convergen al

              `rms_norm` estándar. El valor por defecto recomendado por el paper es

              6.25% (0.0625).


              **Referencias:** (paper: arxiv:1910.07467)'
            exclusiveMinimum: 0
            maximum: 1
            default: 0.0625
            examples:
            - 0.0625
          flashnorm_partial_ratio:
            type: number
            title: FlashNorm Partial Ratio
            title_es: Razón Parcial FlashNorm
            description: 'Fraction of hidden dimensions used for RMS estimation when

              `norm.type=flash_norm`. When greater than 0, FlashNorm computes

              the RMS over the first `ceil(hidden_size * norm.flashnorm_partial_ratio)`

              elements (composing the pRMSNorm trick with Prop. 1 of FlashNorm).


              `0.0` (default) means use the full RMS — standard FlashNorm. Values

              in `(0, 1]` activate the partial variant. Must be in `[0, 1]`.

              Ignored when `norm.type` is not `flash_norm`.


              **Impact:** Same trade-off as `partial_ratio` for pRMSNorm — smaller

              values are faster but a noisier (biased) RMS estimate. The paper

              (paper: arxiv:2407.09577) composes naturally with (paper: arxiv:1910.07467) §5 here.


              **References:** (paper: arxiv:2407.09577) (paper: arxiv:1910.07467)'
            description_es: 'Fracción de dimensiones ocultas usadas para la estimación RMS cuando

              `norm.type=flash_norm`. Cuando es mayor que 0, FlashNorm calcula el

              RMS sobre los primeros `ceil(hidden_size * norm.flashnorm_partial_ratio)`

              elementos (componiendo el truco pRMSNorm con la Prop. 1 de FlashNorm).


              `0.0` (por defecto) significa usar el RMS completo — FlashNorm

              estándar. Valores en `(0, 1]` activan la variante parcial. Debe estar

              en `[0, 1]`. Se ignora cuando `norm.type` no es `flash_norm`.


              **Impacto:** Misma compensación que `partial_ratio` para pRMSNorm —

              valores más pequeños son más rápidos pero producen una estimación RMS

              más ruidosa (sesgada). El paper (paper: arxiv:2407.09577) se compone

              naturalmente con (paper: arxiv:1910.07467) §5 aquí.


              **Referencias:** (paper: arxiv:2407.09577) (paper: arxiv:1910.07467)'
            minimum: 0
            maximum: 1
            default: 0.0
            examples:
            - 0.0
          eps:
            type: number
            title: Normalization Epsilon
            title_es: Epsilon de Normalización
            description: 'Numerical stabilizer added under the RMS/variance reduction of the block

              normalization (`layer_norm`, `rms_norm`, `prms_norm`). Must be `> 0`.

              Ignored by normalization-free variants (`dynamic_tanh`, `derf`,

              `flash_norm`, which has no learnable scale). Kimi K3 uses `1e-5`

              (HF `rms_norm_eps`).


              **References:** (paper: arxiv:2607.24653) (paper: arxiv:1910.07467)'
            description_es: 'Estabilizador numérico sumado bajo la reducción RMS/varianza de la

              normalización de bloque (`layer_norm`, `rms_norm`, `prms_norm`). Debe ser

              `> 0`. Se ignora en las variantes libres de normalización

              (`dynamic_tanh`, `derf`, `flash_norm`, que no tiene escala aprendible).

              Kimi K3 usa `1e-5` (HF `rms_norm_eps`).


              **Referencias:** (paper: arxiv:2607.24653) (paper: arxiv:1910.07467)'
            exclusiveMinimum: 0
            default: 1.0e-06
            examples:
            - 1.0e-05
          qk_norm:
            type: object
            title: Query–Key Normalization & Logit Control
            title_es: Normalización Query–Key y Control de Logits
            description: "Query–key (QK) attention-logit stabilization. Uncontrolled growth of the\npre-softmax scores `QKᵀ/√d` is a well-known source of training instability\n(logit blow-up, attention entropy collapse, loss spikes). This block\nselects one of five mechanisms, all of which bound the logit scale but act\nat different points:\n\n- `rms_norm`: forward-time per-head QK RMSNorm — normalizes each query and\n  key head along its feature dimension before the dot product, with a\n  learnable per-dimension scale shared across heads. This is the standard\n  QK-norm of Henry et al. (paper: arxiv:2010.04245) and the exact\n  formulation analyzed for MLA by Han et al. (paper: arxiv:2606.16310).\n  **Recommended** when every mixer in `dims.layer_pattern` materializes\n  explicit per-head Q/K (see `norm.qk_norm` support below).\n- `layer_norm`: forward-time per-head QK LayerNorm (Henry et al.\n  (paper: arxiv:2010.04245), the “SAN” variant): mean-centers and\n  rescales each head, with\
              \ learnable gain and bias. Slightly heavier than\n  `rms_norm`; useful when mean drift matters.\n- `l2_norm`: forward-time weightless L2 normalization of each head\n  (`q/‖q‖`, `k/‖k‖`). The lowest-parameter variant (no learnable scale),\n  as in Henry et al. (paper: arxiv:2010.04245).\n- `qk_clip`: Kimi K2's QK-Clip (paper: arxiv:2507.20534, §2.1 and\n  Algorithm 1). After every optimizer step, the query and key projection\n  weights are rescaled per attention head by\n  `γ_h = min(1, τ/S_max^h)`, where `S_max^h` is the maximum pre-softmax\n  logit of head `h` observed in the step: content Q/K weights by\n  `γ_h^α`/`γ_h^(1−α)` (`α = norm.qk_norm.clip_alpha`, default 0.5 ⇒\n  `√γ_h` each). It is a post-hoc weight intervention that leaves the\n  forward/backward pass untouched and self-deactivates once every head is\n  below `τ`. The QK-Clip alternative to QK-norm for architectures such as\n  MLA that do not cache full keys.\n- `quack`: QuacK (paper: arxiv:2511.21377) — parameter-dependent\n\
              \  learning rates for the query/key weights instead of a forward or weight\n  intervention. The Frobenius norms `‖W_Q‖`, `‖W_K‖` are recorded at\n  initialization and, before every step,\n  `lr(W_Q) = τ·η·‖W_K‖_init/‖W_K‖` and\n  `lr(W_K) = τ·η·‖W_Q‖_init/‖W_Q‖` (`τ = norm.qk_norm.quack_tau`). This\n  bounds the *change* in logits per step and is ≈10% cheaper than QK-norm\n  because it removes two RMS reductions per block.\n\n**Supported mixers.** The forward methods and QuacK require explicit\nper-head Q/K projections; QK-Clip additionally requires per-head\ndot-product logits. Supported mixers: `standard`, `sigmoid`,\n`gqa`, `mla`, `swa`, `longformer`, `bigbird`,\n`sparse_transformer`, `gta`, `iha`, `mtla`,\n`gma`, `nsa`, `sparsek`, `msa`, `sparda`,\n`conformer`, `fox`, `gated_softmax`, `titan`,\n`gqla`, `mlra`, `memory`. `gma` supports every method except\n`qk_clip` (it routes through Gaussian mixture responsibilities instead\nof a QK dot product). Enabling this block while\
              \ `dims.layer_pattern`\ncontains any other mixer is rejected at load time; for `qk_clip` the\npattern must also exclude `gma`.\n\n**Examples explained:**\n- `rms_norm` on a standard-attention stack: the common ViT-22B/Gemma-style\n  recipe; cheapest effective stabilizer when keys are materialized.\n- `qk_clip` with `clip_tau: 100` on an `mla` decoder: reproduces the\n  Kimi K2 / MuonClip recipe, the reference stabilization used at\n  trillion-parameter scale with MLA.\n- `quack` with `quack_tau: 1.0`: enables higher base learning rates\n  without a normalization op in the attention block; a drop-in,\n  optimizer-agnostic alternative.\n\n**References:** (paper: arxiv:2010.04245) (paper: arxiv:2606.16310)\n(paper: arxiv:2507.20534) (paper: arxiv:2511.21377)"
            description_es: "Estabilización de los logits de atención query–key (QK). El crecimiento\ndescontrolado de las puntuaciones pre-softmax `QKᵀ/√d` es una fuente\nconocida de inestabilidad de entrenamiento (explosión de logits, colapso\nde la entropía de atención, picos de pérdida). Este bloque selecciona uno\nde cinco mecanismos; todos acotan la escala de los logits pero actúan en\npuntos distintos:\n\n- `rms_norm`: QK RMSNorm por cabeza en el forward — normaliza cada cabeza\n  de query y key a lo largo de su dimensión de características antes del\n  producto punto, con una escala aprendible por dimensión compartida entre\n  cabezas. Es la QK-norm estándar de Henry et al.\n  (paper: arxiv:2010.04245) y la formulación exacta analizada para MLA\n  por Han et al. (paper: arxiv:2606.16310). **Recomendada** cuando cada\n  mixer de `dims.layer_pattern` materializa Q/K explícitos por cabeza\n  (ver soporte de `norm.qk_norm` abajo).\n- `layer_norm`: QK LayerNorm por cabeza en el forward\
              \ (Henry et al.\n  (paper: arxiv:2010.04245), variante “SAN”): centra la media y reescala\n  cada cabeza, con ganancia y sesgo aprendibles. Algo más costosa que\n  `rms_norm`; útil cuando importa la deriva de la media.\n- `l2_norm`: normalización L2 sin pesos de cada cabeza en el forward\n  (`q/‖q‖`, `k/‖k‖`). La variante con menos parámetros (sin escala\n  aprendible), como en Henry et al. (paper: arxiv:2010.04245).\n- `qk_clip`: QK-Clip de Kimi K2 (paper: arxiv:2507.20534, §2.1 y\n  Algoritmo 1). Tras cada paso del optimizador, los pesos de proyección\n  de query y key se reescalan por cabeza de atención con\n  `γ_h = min(1, τ/S_max^h)`, donde `S_max^h` es el logit pre-softmax\n  máximo de la cabeza `h` observado en el paso: los pesos de contenido\n  Q/K por `γ_h^α`/`γ_h^(1−α)` (`α = norm.qk_norm.clip_alpha`, por defecto\n  0.5 ⇒ `√γ_h` en cada uno). Es una intervención posterior sobre los\n  pesos que no altera el forward/backward y se autodesactiva cuando todas\n  las cabezas\
              \ quedan por debajo de `τ`. La alternativa a QK-norm para\n  arquitecturas como MLA que no cachean las keys completas.\n- `quack`: QuacK (paper: arxiv:2511.21377) — learning rates dependientes\n  del parámetro para los pesos de query/key en lugar de una intervención\n  en el forward o en los pesos. Las normas de Frobenius `‖W_Q‖`, `‖W_K‖`\n  se registran en la inicialización y, antes de cada paso,\n  `lr(W_Q) = τ·η·‖W_K‖_init/‖W_K‖` y\n  `lr(W_K) = τ·η·‖W_Q‖_init/‖W_Q‖` (`τ = norm.qk_norm.quack_tau`). Acota\n  el *cambio* de logits por paso y es ≈10% más barato que QK-norm porque\n  elimina dos reducciones RMS por bloque.\n\n**Mixers soportados.** Los métodos de forward y QuacK requieren\nproyecciones Q/K explícitas por cabeza; QK-Clip requiere además logits de\nproducto punto por cabeza. Mixers soportados: `standard`,\n`sigmoid`, `gqa`, `mla`, `swa`, `longformer`,\n`bigbird`, `sparse_transformer`, `gta`, `iha`,\n`mtla`, `gma`, `nsa`, `sparsek`, `msa`,\n`sparda`, `conformer`,\
              \ `fox`, `gated_softmax`,\n`titan`, `gqla`, `mlra`, `memory`. `gma` soporta todos los\nmétodos excepto `qk_clip` (enruta mediante responsabilidades de mezcla\nGaussiana en lugar de un producto punto QK). Activar este bloque con\ncualquier otro mixer en `dims.layer_pattern` se rechaza al cargar la\nconfiguración; para `qk_clip` el patrón tampoco puede incluir\n`gma`.\n\n**Ejemplos explicados:**\n- `rms_norm` en una pila de atención estándar: la receta habitual estilo\n  ViT-22B/Gemma; el estabilizador efectivo más barato cuando las keys se\n  materializan.\n- `qk_clip` con `clip_tau: 100` en un decoder `mla`: reproduce la\n  receta Kimi K2 / MuonClip, la estabilización de referencia usada a\n  escala de billones de parámetros con MLA.\n- `quack` con `quack_tau: 1.0`: permite learning rates base más altos sin\n  una operación de normalización en el bloque de atención; una alternativa\n  directa e independiente del optimizador.\n\n**Referencias:** (paper: arxiv:2010.04245) (paper:\
              \ arxiv:2606.16310)\n(paper: arxiv:2507.20534) (paper: arxiv:2511.21377)"
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                title: Enable QK Normalization / Logit Control
                title_es: Activar Normalización QK / Control de Logits
                description: 'Master switch for query–key attention-logit stabilization. When

                  `false` (default) every mixer runs its unmodified attention path and

                  `norm.qk_norm.*` has no effect. When `true`, `method` selects the

                  mechanism and every mixer in `dims.layer_pattern` must be one of the

                  supported mixers listed above (validated at load time).'
                description_es: 'Interruptor maestro de la estabilización de logits query–key. Con

                  `false` (por defecto) cada mixer ejecuta su ruta de atención sin

                  modificar y `norm.qk_norm.*` no tiene efecto. Con `true`, `method`

                  selecciona el mecanismo y cada mixer de `dims.layer_pattern` debe ser

                  uno de los mixers soportados listados arriba (validado al cargar).'
                default: false
                examples:
                - true
              method:
                type: string
                title: QK Stabilization Method
                title_es: Método de Estabilización QK
                description: "Selects the QK stabilization mechanism (see the block description for\nthe full comparison):\n\n- `rms_norm` (default): per-head QK RMSNorm applied to queries and\n  keys before the dot product (paper: arxiv:2010.04245,\n  paper: arxiv:2606.16310).\n- `layer_norm`: per-head QK LayerNorm with learnable gain and bias\n  (paper: arxiv:2010.04245).\n- `l2_norm`: weightless per-head L2 normalization\n  (paper: arxiv:2010.04245).\n- `qk_clip`: post-optimizer-step per-head weight rescaling with\n  threshold `norm.qk_norm.clip_tau` (paper: arxiv:2507.20534).\n- `quack`: per-parameter query/key learning rates with relative rate\n  `norm.qk_norm.quack_tau` (paper: arxiv:2511.21377).\n\n`rms_norm`, `layer_norm` and `l2_norm` add a forward-time module (and\nparameters only for the first two); `qk_clip` and `quack` add no\nparameters and act during training steps."
                description_es: "Selecciona el mecanismo de estabilización QK (ver la descripción del\nbloque para la comparación completa):\n\n- `rms_norm` (por defecto): QK RMSNorm por cabeza aplicada a queries\n  y keys antes del producto punto (paper: arxiv:2010.04245,\n  paper: arxiv:2606.16310).\n- `layer_norm`: QK LayerNorm por cabeza con ganancia y sesgo\n  aprendibles (paper: arxiv:2010.04245).\n- `l2_norm`: normalización L2 por cabeza sin pesos\n  (paper: arxiv:2010.04245).\n- `qk_clip`: reescalado de pesos por cabeza tras el paso del\n  optimizador con umbral `norm.qk_norm.clip_tau`\n  (paper: arxiv:2507.20534).\n- `quack`: learning rates por parámetro para query/key con tasa\n  relativa `norm.qk_norm.quack_tau` (paper: arxiv:2511.21377).\n\n`rms_norm`, `layer_norm` y `l2_norm` añaden un módulo en el forward\n(y parámetros solo los dos primeros); `qk_clip` y `quack` no añaden\nparámetros y actúan durante los pasos de entrenamiento."
                enum:
                - rms_norm
                - layer_norm
                - l2_norm
                - qk_clip
                - quack
                default: rms_norm
                examples:
                - rms_norm
                - qk_clip
              clip_tau:
                type: number
                title: QK-Clip Threshold (τ)
                title_es: Umbral de QK-Clip (τ)
                description: 'Maximum allowed per-head pre-softmax logit when

                  `method=qk_clip`. Every step, each head is rescaled by

                  `γ_h = min(1, τ/S_max^h)`; heads already below `τ` are untouched, so

                  the mechanism self-deactivates once stabilization is no longer

                  needed. The Kimi K2 report uses `τ = 100` (paper: arxiv:2507.20534);

                  smaller values (e.g. 30) clip more aggressively. Must be `> 0`.

                  Ignored when `method` is not `qk_clip`.'
                description_es: 'Logit pre-softmax máximo permitido por cabeza cuando

                  `method=qk_clip`. En cada paso, cada cabeza se reescala con

                  `γ_h = min(1, τ/S_max^h)`; las cabezas ya por debajo de `τ` no se

                  tocan, por lo que el mecanismo se autodesactiva cuando la

                  estabilización deja de ser necesaria. El informe de Kimi K2 usa

                  `τ = 100` (paper: arxiv:2507.20534); valores menores (p. ej. 30)

                  recortan más agresivamente. Debe ser `> 0`. Se ignora cuando `method`

                  no es `qk_clip`.'
                exclusiveMinimum: 0
                default: 100.0
                examples:
                - 100.0
                - 30.0
              clip_alpha:
                type: number
                title: QK-Clip Balancing Exponent (α)
                title_es: Exponente de Balance de QK-Clip (α)
                description: 'Splits the per-head rescaling between queries and keys when

                  `method=qk_clip`: `W_Q ← γ_h^α W_Q` and `W_K ← γ_h^(1−α) W_K`.

                  `0.5` (default) applies `√γ_h` to each, the balanced choice used by

                  Kimi K2; `0` clips only keys and `1` only queries. Must be in

                  `[0, 1]`. Ignored when `method` is not `qk_clip`.'
                description_es: 'Reparte el reescalado por cabeza entre queries y keys cuando

                  `method=qk_clip`: `W_Q ← γ_h^α W_Q` y `W_K ← γ_h^(1−α) W_K`.

                  `0.5` (por defecto) aplica `√γ_h` a cada uno, la elección balanceada

                  usada por Kimi K2; `0` recorta solo las keys y `1` solo las queries.

                  Debe estar en `[0, 1]`. Se ignora cuando `method` no es `qk_clip`.'
                minimum: 0
                maximum: 1
                default: 0.5
                examples:
                - 0.5
              quack_tau:
                type: number
                title: QuacK Relative Learning Rate (τ)
                title_es: Learning Rate Relativa de QuacK (τ)
                description: 'Initial relative learning rate for query/key weights when

                  `method=quack` (paper: arxiv:2511.21377). Each step uses

                  `lr(W_Q) = τ·η·‖W_K‖_init/‖W_K‖` and

                  `lr(W_K) = τ·η·‖W_Q‖_init/‖W_Q‖`, where `η` is the scheduler''s base

                  learning rate for the attention group and the norms are Frobenius.

                  The paper sweeps `τ ∈ {1e-2, 1e-1, 1, 10}`; `1.0` (default) keeps the

                  base learning rate at initialization and only down-weights the side

                  whose counterpart grows. Must be `> 0`. Ignored when `method` is not

                  `quack`.'
                description_es: 'Learning rate relativa inicial para los pesos de query/key cuando

                  `method=quack` (paper: arxiv:2511.21377). Cada paso usa

                  `lr(W_Q) = τ·η·‖W_K‖_init/‖W_K‖` y

                  `lr(W_K) = τ·η·‖W_Q‖_init/‖W_Q‖`, donde `η` es el learning rate base

                  del scheduler para el grupo de atención y las normas son de

                  Frobenius. El paper barre `τ ∈ {1e-2, 1e-1, 1, 10}`; `1.0` (por

                  defecto) mantiene el learning rate base en la inicialización y solo

                  reduce el lado cuyo contraparte crece. Debe ser `> 0`. Se ignora

                  cuando `method` no es `quack`.'
                exclusiveMinimum: 0
                default: 1.0
                examples:
                - 1.0
                - 0.1
              eps:
                type: number
                title: QK-Norm Epsilon
                title_es: Epsilon de QK-Norm
                description: 'Numerical stabilizer added under the RMS/mean-square reduction (and

                  used as the L2 denominator floor) for the forward-time methods

                  (`rms_norm`, `layer_norm`, `l2_norm`). Must be `> 0`. Ignored for

                  `qk_clip` and `quack`.'
                description_es: 'Estabilizador numérico sumado bajo la reducción RMS/cuadrática media

                  (y usado como piso del denominador L2) para los métodos de forward

                  (`rms_norm`, `layer_norm`, `l2_norm`). Debe ser `> 0`. Se ignora para

                  `qk_clip` y `quack`.'
                exclusiveMinimum: 0
                default: 1.0e-06
                examples:
                - 1.0e-06
      embedding:
        type: object
        additionalProperties: false
        properties:
          factorized:
            type: object
            additionalProperties: false
            description: 'Factorized (low-rank) embedding configuration: enable flag and intermediate dimension. Splits the `vocab_size × hidden_size` matrix into two smaller matrices.

              **References:** (paper: arxiv:2004.02984) (paper: arxiv:2502.10001)'
            description_es: 'Configuración de embeddings factorizados (bajo rango): bandera de activación y dimensión intermedia. Divide la matriz `vocab_size × hidden_size` en dos matrices más pequeñas.

              **Referencias:** (paper: arxiv:2004.02984) (paper: arxiv:2502.10001)'
            properties:
              enabled:
                type: boolean
                title: Factorized Embeddings
                title_es: Embeddings Factorizados
                description: 'Enable embedding matrix factorization to reduce parameters. Instead of full

                  `(vocab_size × hidden_size)`, uses two smaller matrices. Reduces from O(V×H) to O(V×R + R×H)

                  where R = `embedding.factorized.dim`. **Recommended when `vocab_size × hidden_size > 100M`.**


                  **Examples explained:**

                  - `false`: Standard embedding. vocab_size=50000, hidden_size=768 → 38.4M embedding params. Simple, no quality tradeoff. Best when embedding params are a small fraction of total model size.

                  - `true` with `embedding.factorized.dim=128`: vocab_size=50000, hidden_size=768 → (50000×128) + (128×768) = ~6.5M params. 5.9× reduction. Quality impact is usually negligible for large vocabularies (>10k tokens).

                  - `true` with `embedding.factorized.dim=64`: More aggressive compression. ~3.3M params but may start to lose fine-grained token distinctions. Best for models where total parameter budget is tight.

                  - `true` with `embedding.factorized.dim=256`: Conservative compression. ~13.1M params. If model quality is the priority but some savings are desired. Close to full embedding quality.

                  - Decision rule: If `vocab_size × hidden_size` exceeds 20% of your parameter budget, consider factorized embeddings. Use `embedding.factorized.dim ≈ sqrt(vocab_size)` or `hidden_size/6` as starting point.


                  **References:** (paper: arxiv:2004.02984) (paper: arxiv:2502.10001)'
                description_es: 'Habilita factorización de matriz de embedding para reducir parámetros. En lugar de

                  `(vocab_size × hidden_size)` completo, usa dos matrices más pequeñas. Reduce de O(V×H) a

                  O(V×R + R×H) donde R = `embedding.factorized.dim`. **Recomendado cuando `vocab_size × hidden_size > 100M`.**


                  **Ejemplos explicados:**

                  - `false`: Embedding estándar. vocab_size=50000, hidden_size=768 → 38.4M params de embedding. Simple, sin compromiso de calidad. Mejor cuando los params de embedding son una fracción pequeña del tamaño total del modelo.

                  - `true` con `embedding.factorized.dim=128`: vocab_size=50000, hidden_size=768 → (50000×128) + (128×768) = ~6.5M params. Reducción 5.9×. El impacto en calidad suele ser insignificante para vocabularios grandes (>10k tokens).

                  - `true` con `embedding.factorized.dim=64`: Compresión más agresiva. ~3.3M params pero puede empezar a perder distinciones finas entre tokens. Mejor para modelos donde el presupuesto total de parámetros es ajustado.

                  - `true` con `embedding.factorized.dim=256`: Compresión conservadora. ~13.1M params. Si la calidad del modelo es prioridad pero se desean algunos ahorros. Cercano a la calidad de embedding completo.

                  - Regla de decisión: Si `vocab_size × hidden_size` excede el 20% de tu presupuesto de parámetros, considerar embeddings factorizados. Usar `embedding.factorized.dim ≈ sqrt(vocab_size)` o `hidden_size/6` como punto de partida.


                  **Referencias:** (paper: arxiv:2004.02984) (paper: arxiv:2502.10001)'
                default: false
                examples:
                - false
              dim:
                type: integer
                minimum: 1
                title: Factorized Embedding Dim
                title_es: Dim de Embedding Factorizado
                description: 'Intermediate dimension for factorized embeddings (only when `embedding.factorized.enabled=true`).

                  Typical: 64–256. Rule of thumb: `embedding.factorized.dim ≈ sqrt(vocab_size)` or `hidden_size/6`.


                  **Impact:** Lower = more compression but possible quality loss. <32 degrades quality;

                  >512 reduces compression benefits. For vocab=50k and hidden=768: try 128–224.


                  **References:** (paper: arxiv:2004.02984) (paper: arxiv:2502.10001)

                  '
                description_es: 'Dimensión intermedia para embeddings factorizados (solo cuando `embedding.factorized.enabled=true`).

                  Típico: 64–256. Regla general: `embedding.factorized.dim ≈ sqrt(vocab_size)` o `hidden_size/6`.


                  **Impacto:** Menor = más compresión pero posible pérdida de calidad. <32 degrada calidad;

                  >512 reduce los beneficios de compresión. Para vocab=50k y hidden=768: probar 128–224.


                  **Referencias:** (paper: arxiv:2004.02984) (paper: arxiv:2502.10001)

                  '
                default: 128
                examples:
                - 128
          dynamic:
            type: object
            additionalProperties: false
            description: 'Dynamic (EELBERT) token embeddings: replaces the trainable `vocab_size × hidden_size` lookup table with an on-the-fly n-gram pooling hash of the token strings. No embedding parameters are stored or trained.

              **References:** (paper: arxiv:2310.20144)'
            description_es: 'Embeddings de tokens dinámicos (EELBERT): reemplaza la tabla de búsqueda entrenable `vocab_size × hidden_size` por un hash de n-gramas calculado al vuelo sobre las cadenas de los tokens. No se almacenan ni entrenan parámetros de embedding.

              **Referencias:** (paper: arxiv:2310.20144)'
            properties:
              enabled:
                type: boolean
                title: Dynamic Embeddings
                title_es: Embeddings Dinámicos
                description: 'Replace the input embedding table with dynamic, hash-computed embeddings

                  (EELBERT). The `vocab_size × hidden_size` table disappears from the model,

                  checkpoint and export — that is where the compression comes from. Embeddings

                  are frozen (never trained) and the output head stays independent. Requires a

                  tokenizer: the training/deploy/inference pipelines inject its vocabulary and

                  the model hashes the token strings. Mutually exclusive with

                  `embedding.factorized.enabled`.


                  **Examples explained:**

                  - `false`: Standard trainable embedding table. Simple and fastest; the table dominates tiny models (BERT-tiny: ~90% of parameters).

                  - `true` with `embedding.dynamic.ngram_max=3`: n-gram pooling hash over 1/2/3-grams; morphologically similar words ("running"/"runner") land close. The paper reports minimal GLUE regression at a fraction of the size.

                  - `true` with `precompute: false`: computes embeddings per batch instead of memoising the table (lower RAM, slower steps).

                  - Decision rule: enable for tiny on-device models where `vocab_size × hidden_size` dominates the parameter budget.


                  **References:** (paper: arxiv:2310.20144)

                  '
                description_es: 'Reemplaza la tabla de embedding de entrada por embeddings dinámicos calculados

                  con hash (EELBERT). La tabla `vocab_size × hidden_size` desaparece del modelo,

                  del checkpoint y de la exportación — de ahí viene la compresión. Los embeddings

                  son congelados (nunca se entrenan) y la cabeza de salida queda independiente.

                  Requiere un tokenizador: los pipelines de entrenamiento/despliegue/inferencia

                  inyectan su vocabulario y el modelo hashea las cadenas de tokens. Es mutuamente

                  excluyente con `embedding.factorized.enabled`.


                  **Ejemplos explicados:**

                  - `false`: Tabla de embedding entrenable estándar. Simple y la más rápida; la tabla domina los modelos pequeños (BERT-tiny: ~90% de los parámetros).

                  - `true` con `embedding.dynamic.ngram_max=3`: hash de n-gramas 1/2/3; palabras morfológicamente similares ("running"/"runner") quedan cerca. El paper reporta una regresión mínima en GLUE con una fracción del tamaño.

                  - `true` con `precompute: false`: calcula embeddings por lote en vez de memoizar la tabla (menos RAM, pasos más lentos).

                  - Regla de decisión: activar para modelos pequeños de dispositivo donde `vocab_size × hidden_size` domina el presupuesto de parámetros.


                  **Referencias:** (paper: arxiv:2310.20144)

                  '
                default: false
                examples:
                - false
              ngram_max:
                type: integer
                minimum: 1
                title: Max N-gram Size
                title_es: Tamaño Máximo de N-grama
                description: 'Maximum n-gram size `N` for the pooling hash (only when

                  `embedding.dynamic.enabled=true`). Token strings are hashed over their

                  1..N character n-grams; each n-gram size gets its own share of the embedding

                  dimensions. The paper uses `N=3`.


                  **Impact:** Larger N captures longer morphological patterns but costs more

                  compute (`O(token_length × hidden_size)` per token). Must be `<= hidden_size`.


                  **References:** (paper: arxiv:2310.20144)

                  '
                description_es: 'Tamaño máximo de n-grama `N` para el hash de agrupación (solo cuando

                  `embedding.dynamic.enabled=true`). Las cadenas de tokens se hashean sobre sus

                  n-gramas de caracteres 1..N; cada tamaño de n-grama recibe su propia porción de

                  las dimensiones del embedding. El paper usa `N=3`.


                  **Impacto:** Un N mayor captura patrones morfológicos más largos pero cuesta más

                  cómputo (`O(longitud_token × hidden_size)` por token). Debe ser `<= hidden_size`.


                  **Referencias:** (paper: arxiv:2310.20144)

                  '
                default: 3
                examples:
                - 1
                - 2
                - 3
              bucket:
                type: integer
                minimum: 2
                title: Hash Bucket Size
                title_es: Tamaño del Bucket de Hash
                description: 'Hash bucket size `B` used by the rolling hash and the `[-1, 1]` folding step

                  (paper default `10^9 + 7`). Larger primes reduce collisions between distinct

                  n-grams.


                  **Impact:** Leave the default unless reproducing a specific hash variant;

                  changing B changes every embedding (they are a deterministic function of it).


                  **References:** (paper: arxiv:2310.20144)

                  '
                description_es: 'Tamaño del bucket de hash `B` usado por el rolling hash y el plegado a `[-1, 1]`

                  (por defecto en el paper: `10^9 + 7`). Primos más grandes reducen colisiones

                  entre n-gramas distintos.


                  **Impacto:** Mantener el valor por defecto salvo que se reproduzca una variante

                  específica; cambiar B cambia todos los embeddings (son función determinista de B).


                  **Referencias:** (paper: arxiv:2310.20144)

                  '
                default: 1000000007
                examples:
                - 1000000007
              seed:
                type: integer
                title: Hash Seed
                title_es: Semilla del Hash
                description: 'Random state used to generate the `hidden_size` hash seeds (only this integer is

                  stored). The same seed reproduces identical embeddings; different seeds give a

                  different (equally valid) hash family.


                  **Impact:** Keep it fixed across training and inference of a run. Changing it

                  invalidates any checkpoint trained with the previous seed.


                  **References:** (paper: arxiv:2310.20144)

                  '
                description_es: 'Estado aleatorio usado para generar las `hidden_size` semillas de hash (solo se

                  almacena este entero). La misma semilla reproduce embeddings idénticos; semillas

                  distintas dan una familia de hash distinta (igualmente válida).


                  **Impacto:** Mantenerla fija entre entrenamiento e inferencia de una ejecución.

                  Cambiarla invalida cualquier checkpoint entrenado con la semilla anterior.


                  **Referencias:** (paper: arxiv:2310.20144)

                  '
                default: 42
                examples:
                - 42
              precompute:
                type: boolean
                title: Precompute Table
                title_es: Precalcular Tabla
                description: 'Memoise the full `vocab_size × hidden_size` dynamic table once at model build.

                  The memoised table is a non-persistent buffer: it is never saved in checkpoints

                  nor exported, so model size stays identical to the on-the-fly computation. This

                  is pure caching of a deterministic function (the paper suggests caching frequent

                  n-grams, §5.5).


                  **Impact:** `true` makes training fast at the cost of `vocab_size × hidden_size × 4`

                  bytes of RAM; `false` recomputes the hash per batch (minimal RAM, slower steps,

                  useful for extreme low-memory targets).


                  **References:** (paper: arxiv:2310.20144)

                  '
                description_es: 'Memoiza la tabla dinámica completa `vocab_size × hidden_size` una vez al construir

                  el modelo. La tabla memoizada es un buffer no persistente: nunca se guarda en

                  checkpoints ni se exporta, así que el tamaño del modelo es idéntico al cálculo al

                  vuelo. Es caché puro de una función determinista (el paper sugiere cachear

                  n-gramas frecuentes, §5.5).


                  **Impacto:** `true` acelera el entrenamiento a costa de `vocab_size × hidden_size × 4`

                  bytes de RAM; `false` recalcula el hash por lote (RAM mínima, pasos más lentos,

                  útil para objetivos de memoria extrema).


                  **Referencias:** (paper: arxiv:2310.20144)

                  '
                default: true
                examples:
                - true
                - false
          conv:
            type: object
            additionalProperties: false
            description: 'Embedding 1-D convolution configuration: enable flag and kernel size. Captures local n-gram patterns before the first layer.

              **References:** (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692)'
            description_es: 'Configuración de la convolución 1-D sobre embeddings: bandera de activación y tamaño de kernel. Captura patrones n-gramas locales antes de la primera capa.

              **Referencias:** (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692)'
            properties:
              enabled:
                type: boolean
                title: Embedding Convolution
                title_es: Convolución de Embeddings
                description: 'Apply 1D convolution over token embeddings to capture local n-gram patterns

                  before the transformer. Experimental — may help with code or n-gram-heavy languages.


                  **Impact:** Adds `hidden_size × embedding.conv.kernel` parameters. Little gain for

                  languages where global context is more important than local patterns. Try with kernel=3.


                  **References:** (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692)

                  '
                description_es: 'Aplica convolución 1D sobre embeddings de tokens para capturar patrones locales

                  de n-gramas antes del transformer. Experimental — puede ayudar con código o idiomas

                  con fuerte estructura de n-gramas.


                  **Impacto:** Agrega `hidden_size × embedding.conv.kernel` parámetros. Poca ganancia para

                  idiomas donde el contexto global es más importante que los patrones locales. Probar con kernel=3.


                  **Referencias:** (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692)

                  '
                default: true
                examples:
                - false
                - true
              kernel:
                type: integer
                minimum: 1
                title: Embedding Conv Kernel
                title_es: Kernel de Conv de Embeddings
                description: 'Kernel size for embedding Conv1d when `embedding.conv.enabled=true`. Typical: 3 (trigram), 5, 7.

                  Larger = wider local context but more params (`kernel_size × hidden_size`).


                  **Impact:** Kernel=3 is the safe starting point. Values >15 negate the benefit of

                  the transformer''s global attention. Only applies if `embedding.conv.enabled=true`.


                  **References:** (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692)

                  '
                description_es: 'Tamaño de kernel para Conv1d de embeddings cuando `embedding.conv.enabled=true`. Típico: 3 (trigrama), 5, 7.

                  Mayor = contexto local más amplio pero más parámetros (`kernel_size × hidden_size`).


                  **Impacto:** Kernel=3 es el punto de partida seguro. Valores >15 anulan el beneficio de

                  la atención global del transformer. Solo aplica si `embedding.conv.enabled=true`.


                  **Referencias:** (paper: https://ojs.aaai.org/index.php/AAAI/article/view/17692)

                  '
                default: 3
                examples:
                - 3
          type:
            type: string
            title: Token Embedding Type
            title_es: Tipo de Embedding de Token
            description: Token-embedding variant. `standard` uses the full `vocab_size × hidden_size` lookup table; `factorized` splits it into two low-rank matrices (`embedding.factorized.*`); `dynamic` replaces it with a trainable-free hashed n-gram table (`embedding.dynamic.*`). The legacy `*.enabled` flags are folded into this value at load time when `type` is left at its default.
            description_es: Variante de embedding de token. `standard` usa la tabla completa `vocab_size × hidden_size`; `factorized` la divide en dos matrices de bajo rango (`embedding.factorized.*`); `dynamic` la reemplaza por una tabla de n-gramas hasheados sin entrenamiento (`embedding.dynamic.*`). Las banderas `*.enabled` heredadas se pliegan en este valor al cargar cuando `type` queda en su valor por defecto.
            enum:
            - dynamic
            - factorized
            - standard
            default: standard
            examples:
            - standard
      positional_encoding:
        type: string
        title: Positional Encoding
        title_es: Codificación Posicional
        description: 'Model-wide positional encoding method applied to attention mixers.

          Controls how position information is injected into the attention computation.

          - `rope`: Rotary Position Embedding (paper: arxiv:2104.09864). Rotates q/k vectors by position-dependent angles. Standard in Llama, GPT-3.5, Mistral.

          - `hope`: Higher-Order Position Encoding (paper: arxiv:2509.05218). Hyperbolic rotation with exponential damping. HoPE enforces monotonic attention decay with distance.

          - `nope`: No Position Encoding (paper: arxiv:2305.19466). Identity — lets the model learn position implicitly via causal masking. Works well for decoder-only models.

          - `alibi`: Attention with Linear Biases (paper: arxiv:2108.12409). Adds a distance-proportional negative bias to attention scores. Enables length extrapolation without retraining.

          - `bam`: Bayesian Attention Mechanism (paper: arxiv:2505.22842). Generalized-Gaussian relative-position bias added to attention scores; learnable per-head shape (β) and scale (α) parameters. Recovers ALiBi at β=1, Normal prior at β=2, heavy tails at 0<β<1, and long-range retrieval heads at β<0. Uniform-prior init (θ=0). Optional Scalable Softmax rescale via the top-level `use_ssmax` flag.

          - `pape`: Parabolic Position Encoding (paper: arxiv:2602.01418). Augments q/k with learnable parabola terms (distance + direction + semantics). Vision-centric, supports nD positions.

          - `pape_efficient`: Efficient PaPE (paper: arxiv:2602.01418). Same math as `pape` but with a pre-computed layout for faster eval. Pure-PyTorch (no Triton).

          - `pape_ri`: Rotation-Invariant PaPE (paper: arxiv:2602.01418). Distance-only parabola terms; rotation-invariant for 3D vision tasks (point clouds).

          - `sinusoidal_absolute`: Sinusoidal absolute PE (paper: arxiv:1706.03762). Fixed sin/cos added to token embeddings before the first layer.

          - `sinusoidal_rotary`: Sinusoidal rotary PE. Absolute-position sin/cos rotation applied to q/k (like RoPE but with absolute angles).

          - `learned_absolute`: Learnable absolute PE (paper: arxiv:2010.11929). nn.Parameter added to token embeddings. Standard in BERT and ViT.

          - `none`: No positional encoding. Explicitly disables PE.


          **Per-mixer control:** Each mixer has a `<mixer>_use_pe` flag (default True for attention mixers, False for recurrent/decay mixers like retnet, mamba, ode, gla, deltanet, hgrn2, fox, fpa, kda, mtla, falcon*, lsa). Set to False to opt a specific mixer out of the model-wide PE.


          **References:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805) (paper: arxiv:2104.09864)

          (paper: arxiv:2509.05218) (paper: arxiv:2305.19466) (paper: arxiv:2108.12409) (paper:

          arxiv:2505.22842) (paper: arxiv:2602.01418) (paper: arxiv:1906.08237)'
        description_es: 'Método de codificación posicional a nivel de modelo aplicado a los mezcladores de atención.

          Controla cómo se inyecta la información de posición en el cálculo de atención.

          - `rope`: Embedding Posicional Rotatorio (paper: arxiv:2104.09864). Rota vectores q/k por ángulos dependientes de posición. Estándar en Llama, GPT-3.5, Mistral.

          - `hope`: Codificación Posicional de Orden Superior (paper: arxiv:2509.05218). Rotación hiperbólica con amortiguación exponencial.

          - `nope`: Sin Codificación Posicional (paper: arxiv:2305.19466). Identidad — el modelo aprende posición implícitamente vía máscara causal.

          - `alibi`: Atención con Sesgos Lineales (paper: arxiv:2108.12409). Añade sesgo negativo proporcional a la distancia a las puntuaciones de atención.

          - `bam`: Mecanismo de Atención Bayesiana (paper: arxiv:2505.22842). Sesgo de posición relativa con Gaussiana Generalizada añadido a las puntuaciones de atención; parámetros de forma (β) y escala (α) aprendibles por cabeza. Recupera ALiBi en β=1, prior Normal en β=2, colas pesadas en 0<β<1, y cabezas de recuperación de largo alcance en β<0. Inicialización con prior Uniforme (θ=0). Scalable Softmax opcional vía la bandera `use_ssmax`.

          - `pape`: Codificación Posicional Parabólica (paper: arxiv:2602.01418). Augmenta q/k con términos parabólicos aprendibles. Céntrica en visión, soporta posiciones nD.

          - `pape_efficient`: PaPE Eficiente (paper: arxiv:2602.01418). Misma matemática que `pape` con layout pre-calculado para evaluación más rápida.

          - `pape_ri`: PaPE Invariante a Rotación (paper: arxiv:2602.01418). Términos de distancia únicamente; invariante a rotación para tareas de visión 3D.

          - `sinusoidal_absolute`: PE sinusoidal absoluta (paper: arxiv:1706.03762). sin/cos fijo añadido a embeddings de tokens.

          - `sinusoidal_rotary`: PE sinusoidal rotatoria. Rotación sin/cos de posición absoluta aplicada a q/k.

          - `learned_absolute`: PE absoluta aprendible (paper: arxiv:2010.11929). nn.Parameter añadido a embeddings. Estándar en BERT y ViT.

          - `none`: Sin codificación posicional. Desactiva PE explícitamente.


          **Referencias:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805) (paper: arxiv:2104.09864)

          (paper: arxiv:2509.05218) (paper: arxiv:2305.19466) (paper: arxiv:2108.12409) (paper:

          arxiv:2505.22842) (paper: arxiv:2602.01418) (paper: arxiv:1906.08237)'
        enum:
        - alibi
        - bam
        - hope
        - learned_absolute
        - nope
        - pape
        - pape_efficient
        - pape_ri
        - rope
        - sinusoidal_absolute
        - sinusoidal_rotary
        - none
        default: rope
        examples:
        - rope
        - hope
        - alibi
        - bam
        - pape
        - nope
      positional_encoding_parameters:
        type: object
        additionalProperties: false
        title: Positional Encoding Parameters
        title_es: Parámetros de Codificación Posicional
        description: 'Configuration parameters for each positional encoding method. Only the

          sub-object matching the selected `positional_encoding` is used; others are ignored.


          **References:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805) (paper: arxiv:2104.09864)

          (paper: arxiv:2509.05218) (paper: arxiv:2305.19466) (paper: arxiv:2108.12409) (paper:

          arxiv:2505.22842) (paper: arxiv:2602.01418) (paper: arxiv:1906.08237)'
        description_es: 'Parámetros de configuración para cada método de codificación posicional.

          Solo se usa el sub-objeto que coincide con el `positional_encoding` seleccionado.


          **Referencias:** (paper: arxiv:1706.03762) (paper: arxiv:1810.04805) (paper: arxiv:2104.09864)

          (paper: arxiv:2509.05218) (paper: arxiv:2305.19466) (paper: arxiv:2108.12409) (paper:

          arxiv:2505.22842) (paper: arxiv:2602.01418) (paper: arxiv:1906.08237)'
        properties:
          rope:
            type: object
            additionalProperties: false
            title: RoPE Parameters
            title_es: Parámetros RoPE
            description: 'Parameters for Rotary Position Embedding (RoPE): base frequency and position scaling.

              **References:** (paper: arxiv:2104.09864)'
            description_es: 'Parámetros para Rotary Position Embedding (RoPE): frecuencia base y escalado de posiciones.

              **Referencias:** (paper: arxiv:2104.09864)'
            properties:
              base:
                type: number
                minimum: 0
                title: RoPE Base
                title_es: Base RoPE
                description: 'Base frequency for RoPE. Standard: 10000 (Llama). Extended: 100000-1000000 for longer contexts. **References:** (paper: arxiv:2104.09864)'
                description_es: 'Frecuencia base para RoPE. Estándar: 10000. Extendido: 100000-1000000. **Referencias:** (paper: arxiv:2104.09864)'
                default: 10000.0
                examples:
                - 10000.0
              scaling:
                type: number
                minimum: 0
                title: RoPE Scaling
                title_es: Escalado RoPE
                description: 'Multiplier for RoPE position indices for context extrapolation. Typical: 1.0 (none), 2-8 (moderate), 16+ (aggressive). **References:** (paper: arxiv:2104.09864) (paper: arxiv:2305.19466)'
                description_es: 'Multiplicador para índices de posición RoPE. Típico: 1.0, 2-8, 16+. **Referencias:** (paper: arxiv:2104.09864) (paper: arxiv:2305.19466)'
                default: 1.0
                examples:
                - 1.0
          hope:
            type: object
            additionalProperties: false
            title: HoPE Parameters
            title_es: Parámetros HoPE
            description: 'Parameters for HoPE (Hyperbolic Rotary Positional Encoding): base frequency scale and damping coefficient.

              **References:** (paper: arxiv:2509.05218)'
            description_es: 'Parámetros para HoPE (Hyperbolic Rotary Positional Encoding): escala de frecuencia base y coeficiente de amortiguación.

              **Referencias:** (paper: arxiv:2509.05218)'
            properties:
              base:
                type: number
                minimum: 0
                title: HoPE Base
                title_es: Base HoPE
                description: 'Base frequency scale for HoPE. Typical: 10000 (standard), 100000 (long-range). **References:** (paper: arxiv:2509.05218)'
                description_es: 'Escala de frecuencia base para HoPE. Típico: 10000, 100000. **Referencias:** (paper: arxiv:2509.05218)'
                default: 10000.0
                examples:
                - 10000.0
              damping:
                type: number
                minimum: 0
                title: HoPE Damping
                title_es: Amortiguación HoPE
                description: 'Damping coefficient for HoPE attention decay. Typical: 0.01 (strong/local), 0.5 (mild/long-range). **References:** (paper: arxiv:2509.05218)'
                description_es: 'Coeficiente de amortiguación para HoPE. Típico: 0.01, 0.5. **Referencias:** (paper: arxiv:2509.05218)'
                default: 0.01
                examples:
                - 0.01
          alibi:
            type: object
            additionalProperties: false
            title: ALiBi Parameters
            title_es: Parámetros ALiBi
            description: 'ALiBi is parameter-free: slopes are derived from the head count. By

              default the model uses `dims.num_heads`; `num_heads` here overrides

              that derivation for ALiBi only.


              **References:** (paper: arxiv:2108.12409)'
            description_es: 'ALiBi es libre de parámetros: las pendientes se derivan del número de

              cabezas. Por defecto el modelo usa `dims.num_heads`; `num_heads` aquí

              sobrescribe esa derivación solo para ALiBi.


              **Referencias:** (paper: arxiv:2108.12409)'
            properties:
              num_heads:
                type:
                - integer
                - 'null'
                minimum: 1
                title: ALiBi Slope Heads
                title_es: Cabezas para Pendientes ALiBi
                description: 'Number of heads used to derive the ALiBi slopes. `null` (default)

                  means use `dims.num_heads`.


                  **References:** (paper: arxiv:2108.12409)'
                description_es: 'Número de cabezas usado para derivar las pendientes ALiBi. `null`

                  (por defecto) significa usar `dims.num_heads`.


                  **Referencias:** (paper: arxiv:2108.12409)'
                default: null
                examples:
                - null
                - 8
                - 16
          bam:
            type: object
            additionalProperties: false
            title: BAM Parameters
            title_es: Parámetros BAM
            description: 'Bayesian Attention Mechanism per-head learnable parameters. BAM adds a

              Generalized-Gaussian relative-position bias to attention scores. The per-head

              shape (β) and scale (α) parameters are trained; the location (µ) is fixed to

              0 by default but can be made learnable via `learn_mu`. Initialisation with

              `theta_init=0` yields the Uniform prior (zero bias at init), which the paper''s

              ablation H.1 found best. The `eps` floor guards the `|·|^β` exponentiation

              when β < 0 (long-range retrieval-head regime).


              **References:** (paper: arxiv:2505.22842)'
            description_es: 'Parámetros aprendibles por cabeza del Mecanismo de Atención Bayesiana. BAM

              añade un sesgo de posición relativa con Gaussiana Generalizada a las

              puntuaciones de atención. Los parámetros de forma (β) y escala (α) por cabeza

              se entrenan; la localización (µ) se fija a 0 por defecto pero puede hacerse

              aprendible con `learn_mu`. La inicialización con `theta_init=0` produce el

              prior Uniforme (sesgo cero en init), que la ablation H.1 del paper encontró

              óptima. El piso `eps` protege la exponenciación `|·|^β` cuando β < 0

              (régimen de cabezas de recuperación de largo alcance).


              **Referencias:** (paper: arxiv:2505.22842)'
            properties:
              learn_mu:
                type: boolean
                title: Learn Mu
                title_es: Aprender Mu
                description: 'If true, the location parameter θ_µ is learnable. Default false (µ=0) per the paper''s ablation H.1. **References:** (paper: arxiv:2505.22842)'
                description_es: 'Si verdadero, el parámetro de localización θ_µ es aprendible. Por defecto falso (µ=0) según ablation H.1 del paper. **Referencias:** (paper: arxiv:2505.22842)'
                default: false
                examples:
                - false
              theta_init:
                type: number
                title: Theta Init
                title_es: Init Theta
                description: 'Initial value for θ_α and θ_β. 0.0 = Uniform prior (paper''s best). 1.0 = Laplace/ALiBi-like prior. **References:** (paper: arxiv:2505.22842)'
                description_es: 'Valor inicial para θ_α y θ_β. 0.0 = prior Uniforme (óptimo del paper). 1.0 = prior Laplace/ALiBi. **Referencias:** (paper: arxiv:2505.22842)'
                default: 0.0
                examples:
                - 0.0
              mu_init:
                type: number
                title: Mu Init
                title_es: Init Mu
                description: 'Initial value for θ_µ. Typically 0.0 (no shift). Only used when learn_mu=true. **References:** (paper: arxiv:2505.22842)'
                description_es: 'Valor inicial para θ_µ. Típicamente 0.0 (sin desplazamiento). Solo se usa cuando learn_mu=true. **Referencias:** (paper: arxiv:2505.22842)'
                default: 0.0
                examples:
                - 0.0
              eps:
                type: number
                exclusiveMinimum: 0
                title: Epsilon
                title_es: Epsilon
                description: 'Numerical stability floor added to |·| before exponentiation when β < 0. Default 1e-5. **References:** (paper: arxiv:2505.22842)'
                description_es: 'Piso de estabilidad numérica añadido a |·| antes de la exponenciación cuando β < 0. Por defecto 1e-5. **Referencias:** (paper: arxiv:2505.22842)'
                default: 1.0e-05
                examples:
                - 1.0e-05
          pape:
            type: object
            additionalProperties: false
            title: PaPE Parameters
            title_es: Parámetros PaPE
            description: 'Parameters shared by pape, pape_efficient, and pape_ri.


              **References:** (paper: arxiv:2602.01418)'
            description_es: 'Parámetros compartidos por pape, pape_efficient y pape_ri.


              **Referencias:** (paper: arxiv:2602.01418)'
            properties:
              num_parabolas:
                type: integer
                minimum: 1
                title: Number of Parabolas
                title_es: Número de Parábolas
                description: 'Number of learnable parabola terms per head. Controls expressiveness of the distance/direction decomposition. Typical: 4-8. **References:** (paper: arxiv:2602.01418)'
                description_es: 'Número de términos parabólicos aprendibles por cabeza. Típico: 4-8. **Referencias:** (paper: arxiv:2602.01418)'
                default: 4
                examples:
                - 4
                - 8
              num_positions:
                type: integer
                minimum: 1
                title: Number of Position Dimensions
                title_es: Número de Dimensiones de Posición
                description: 'Dimensionality of position vectors. 1 for language (token index), 2 for vision (row/col), 3 for point clouds.


                  **References:** (paper: arxiv:2602.01418)'
                description_es: 'Dimensionalidad de los vectores de posición. 1 para lenguaje, 2 para visión, 3 para nubes de puntos.


                  **Referencias:** (paper: arxiv:2602.01418)'
                default: 1
                examples:
                - 1
                - 2
                - 3
              rotation_invariant:
                type: boolean
                title: Rotation Invariant
                title_es: Invariante a Rotación
                description: 'If true, use the rotation-invariant PaPE-RI formulation (distance-only parabola terms). Recommended for 3D vision tasks.


                  **References:** (paper: arxiv:2602.01418)'
                description_es: 'Si verdadero, usar formulación PaPE-RI invariante a rotación. Recomendado para visión 3D.


                  **Referencias:** (paper: arxiv:2602.01418)'
                default: false
                examples:
                - false
          sinusoidal:
            type: object
            additionalProperties: false
            title: Sinusoidal Parameters
            title_es: Parámetros Sinusoidal
