      attention:
        type: object
        description: 'Per-mixer configuration sub-objects. Each mixer with dedicated hyperparameters has

          its own sub-object here; mixers without config knobs (standard, sigmoid,

          gated_softmax, gla, deltanet, gated_deltanet,

          gated_deltanet2, hgrn2, fox, longformer, bigbird,

          sparse_transformer, sparsek, nsa, sparge, fasa,

          memory, mamba) do not need a sub-object. `gqa` reads `dims.num_kv_heads`.


          **References:** (paper: arxiv:1706.03762) (paper: arxiv:2307.08621) (paper: arxiv:2312.00752)

          (paper: arxiv:2501.00663)'
        description_es: 'Sub-objetos de configuración por mixer. Cada mixer con hiperparámetros dedicados tiene

          su propio sub-objeto aquí; los mixers sin parámetros de configuración (standard,

          sigmoid, gated_softmax, gla, deltanet, gated_deltanet,

          gated_deltanet2, hgrn2, fox, longformer, bigbird,

          sparse_transformer, sparsek, nsa, sparge, fasa,

          memory, mamba) no necesitan sub-objeto. `gqa` lee `dims.num_kv_heads`.


          **Referencias:** (paper: arxiv:1706.03762) (paper: arxiv:2307.08621) (paper: arxiv:2312.00752)

          (paper: arxiv:2501.00663)'
        additionalProperties: false
        properties:
          ca:
            type: object
            additionalProperties: false
            title: Continuum Attention
            title_es: Atención Continua
            description: 'Hyperparameters for `ca` (Continuum Attention (paper: arxiv:2610.20586)).

              Adjacent keys and values define a piecewise-linear memory trajectory;

              each query retrieves by normalized integration of exp(score) over its

              visible prefix, computed exactly through the exponential moments J0/J1

              (no quadrature). With `learned_gain: true` every head learns a positive

              score gain γ = exp(ρ) initialized at `gain_init` (the paper''s 101M

              flagship); with `learned_gain: false` the gain stays fixed at

              `gain_init` (CA-P uses γ = 1/0.30) and the mixer adds no parameters

              beyond the standard Q/K/V/O projections. Only applies when `ca`

              appears in `layer_pattern`.


              **References:** (paper: arxiv:2610.20586)'
            description_es: 'Hiperparámetros para `ca` (Atención Continua (paper: arxiv:2610.20586)).

              Las claves y valores adyacentes definen una trayectoria de memoria

              lineal por tramos; cada consulta recupera mediante la integración

              normalizada de exp(puntaje) sobre su prefijo visible, calculada de

              forma exacta con los momentos exponenciales J0/J1 (sin cuadratura).

              Con `learned_gain: true` cada cabeza aprende una ganancia de puntaje

              positiva γ = exp(ρ) inicializada en `gain_init` (el modelo insignia de

              101M del paper); con `learned_gain: false` la ganancia queda fija en

              `gain_init` (CA-P usa γ = 1/0.30) y el mixer no añade parámetros más

              allá de las proyecciones Q/K/V/O estándar. Solo aplica cuando `ca`

              está en `layer_pattern`.


              **Referencias:** (paper: arxiv:2610.20586)'
            properties:
              learned_gain:
                type: boolean
                title: Learned Score Gain
                title_es: Ganancia de Puntaje Aprendida
                description: 'Learn the per-head positive score gain γ = exp(ρ) of `ca`

                  (paper: arxiv:2610.20586, §2.7/§3.1). The paper''s 101M byte-level

                  decoder learns all 128 head gains initialized at γ = 1; the

                  small-model CA-H variant learns them initialized at γ = 1/0.30

                  (set `gain_init`). `false` keeps the gain fixed at `gain_init`,

                  which is the parameter-free CA-P configuration. Only applies when

                  `ca` is in `layer_pattern`.


                  **References:** (paper: arxiv:2610.20586)'
                description_es: 'Aprende la ganancia de puntaje positiva por cabeza γ = exp(ρ) de

                  `ca` (paper: arxiv:2610.20586, §2.7/§3.1). El decoder de bytes de

                  101M del paper aprende las 128 ganancias inicializadas en γ = 1;

                  la variante CA-H del modelo pequeño las aprende inicializadas en

                  γ = 1/0.30 (ajusta `gain_init`). `false` mantiene la ganancia fija

                  en `gain_init`, la configuración CA-P sin parámetros extra. Solo

                  aplica cuando `ca` está en `layer_pattern`.


                  **Referencias:** (paper: arxiv:2610.20586)'
                default: true
                examples:
                - true
                - false
              gain_init:
                type: number
                exclusiveMinimum: 0
                title: Initial / Fixed Score Gain
                title_es: Ganancia de Puntaje Inicial / Fija
                description: 'Initial (when learned) or fixed (when not) score gain γ = 1/τ of

                  `ca` (paper: arxiv:2610.20586). The paper uses γ = 1 for the 101M

                  model (effective τ = 1), γ = 1/0.30 ≈ 3.3333 for the fixed CA-P

                  and the CA-H small-model initialization. Larger γ sharpens the

                  relevance density (lower temperature τ). Must be positive. Only

                  applies when `ca` is in `layer_pattern`.


                  **References:** (paper: arxiv:2610.20586)'
                description_es: 'Ganancia de puntaje inicial (si se aprende) o fija (si no) γ = 1/τ

                  de `ca` (paper: arxiv:2610.20586). El paper usa γ = 1 para el

                  modelo de 101M (τ efectiva = 1), γ = 1/0.30 ≈ 3.3333 para la CA-P

                  fija y la inicialización CA-H del modelo pequeño. Un γ mayor

                  afila la densidad de relevancia (menor temperatura τ). Debe ser

                  positiva. Solo aplica cuando `ca` está en `layer_pattern`.


                  **Referencias:** (paper: arxiv:2610.20586)'
                default: 1.0
                examples:
                - 1.0
                - 3.3333
          cca:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `cca` (Compressed Convolutional Attention): latent rank, convolution stack and bias toggles. Only applies when `cca` appears in `layer_pattern`.

              **References:** (paper: arxiv:2510.04476)'
            description_es: 'Hiperparámetros para `cca` (Compressed Convolutional Attention): rango latente, pila de convoluciones y conmutadores de sesgo. Solo aplica cuando `cca` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2510.04476)'
            properties:
              latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: CCA Latent Rank
                title_es: Rango Latente CCA
                description: "Latent width ẽ for `cca` (Compressed Convolutional Attention,\n(paper: arxiv:2510.04476)). CCA down-projects q/k/v into this shared latent\nand performs attention entirely inside it (no up-projections),\nreducing parameters, KV-cache, AND FLOPs by the compression factor\nC = hidden_size / cca_latent_rank. Must be divisible by\n`num_heads` with an even per-head quotient (RoPE is applied directly\nin the latent). `null` defaults to `hidden_size // 4` rounded UP to\na multiple of `2 * num_heads` so the default is always buildable\n(e.g. hidden_size=96, num_heads=8 → 24 is invalid, resolves to 32).\n\n**Examples explained:**\n- `cca_latent_rank=128` with `hidden_size=512`: C=4 compression.\n  Latent head dim = 128/8 = 16 (with num_heads=8).\n- `cca_latent_rank=64` with `hidden_size=512`: C=8 compression.\n  More aggressive; ~8x fewer attention FLOPs and KV-cache.\n- `cca_latent_rank=null`: `hidden_size // 4` rounded up to a\n  multiple of `2 * num_heads`.\n\n**References:**\
                  \ (paper: arxiv:2510.04476)"
                description_es: 'Ancho latente ẽ para `cca` (Compressed Convolutional Attention,

                  (paper: arxiv:2510.04476)). CCA proyecta q/k/v a este latente compartido y

                  realiza la atención enteramente en él (sin up-proyecciones),

                  reduciendo parámetros, caché KV Y FLOPs por el factor de compresión

                  C = hidden_size / cca_latent_rank. Debe ser divisible por

                  `num_heads` con cociente por cabeza par (RoPE se aplica directamente

                  en el latente). `null` por defecto es `hidden_size // 4` redondeado

                  HACIA ARRIBA a un múltiplo de `2 * num_heads` para que el default

                  siempre sea construible (p.ej. hidden_size=96, num_heads=8 → 24 es

                  inválido, resuelve a 32).


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 128
              num_conv_layers:
                type: integer
                title: CCA Conv Layers
                title_es: Capas de Convolución CCA
                description: 'Number of convolution layers applied to the packed q/k tensor in

                  `cca` (0, 1, or 2). The paper''s ablation shows 2 layers (a

                  depth-wise causal sequence conv + a head-wise grouped channel conv)

                  is optimal. 0 disables convolutions entirely. Default: 2.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Número de capas de convolución aplicadas al tensor empaquetado q/k

                  en `cca` (0, 1 o 2). La ablacición del paper muestra que 2

                  capas (una convolución causal depth-wise de secuencia + una

                  convolución agrupada de canales por cabeza) es óptima. 0 desactiva

                  las convoluciones. Por defecto: 2.


                  **Referencias:** (paper: arxiv:2510.04476)'
                enum:
                - 0
                - 1
                - 2
                examples:
                - 2
              conv_kernel_seq:
                type: integer
                title: CCA Seq Conv Kernel
                title_es: Kernel Conv Secuencia CCA
                description: 'Kernel size `k_seq` of the depth-wise causal sequence convolution

                  in `cca`. Mixes information across positions within the

                  compressed latent. Only applies when `cca_num_conv_layers >= 1`.

                  Default: 4.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Tamaño de kernel `k_seq` de la convolución causal depth-wise de

                  secuencia en `cca`. Mezcla información entre posiciones dentro

                  del latente comprimido. Solo aplica cuando `cca_num_conv_layers >= 1`.

                  Por defecto: 4.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 4
              conv_kernel_ch:
                type: integer
                title: CCA Channel Conv Kernel
                title_es: Kernel Conv Canales CCA
                description: 'Kernel size `k_ch` of the head-wise grouped channel convolution in

                  `cca`. Mixes information across channels within each head.

                  Only applies when `cca_num_conv_layers >= 2`. Default: 3.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Tamaño de kernel `k_ch` de la convolución agrupada de canales por

                  cabeza en `cca`. Mezcla información entre canales dentro de

                  cada cabeza. Solo aplica cuando `cca_num_conv_layers >= 2`.

                  Por defecto: 3.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 3
              qk_mean:
                type: boolean
                title: CCA QK-Mean
                title_es: QK-Mean CCA
                description: 'Enable the q-k-mean bias in `cca`: adds the pre-convolution

                  mean of q and k to the post-convolution values, increasing

                  attention-diagonal sparsity when combined with QK-norm. Default:

                  True (recommended by the paper''s ablation).


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Habilita el sesgo q-k-mean en `cca`: añade la media

                  pre-convolución de q y k a los valores post-convolución,

                  aumentando la dispersión de la diagonal de atención cuando se

                  combina con QK-norm. Por defecto: True.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - true
              value_shift:
                type: boolean
                title: CCA Value-Shift
                title_es: Value-Shift CCA
                description: 'Enable value-shift in `cca`: each attention head receives half

                  its values from the current token and half from the *previous* token

                  (a token-shift inductive bias borrowed from RWKV), implemented via

                  two independent value projections. Requires `cca_latent_rank` even

                  (the split halves the latent width, not the heads). Default: True.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Habilita value-shift en `cca`: cada cabeza de atención recibe

                  la mitad de sus valores del token actual y la mitad del token

                  *anterior* (un sesgo inductivo de token-shift tomado de RWKV),

                  implementado con dos proyecciones de valor independientes. Requiere

                  `num_heads` par y `cca_latent_rank` par. Por defecto: True.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - true
          ccgqa:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `ccgqa` (Compressed Convolutional Grouped Query Attention): CCA convolutions applied inside a GQA-grouped latent. Only applies when `ccgqa` appears in `layer_pattern`.

              **References:** (paper: arxiv:2510.04476) (paper: arxiv:2305.13245)'
            description_es: 'Hiperparámetros para `ccgqa` (Compressed Convolutional Grouped Query Attention): convoluciones CCA dentro de un latente agrupado estilo GQA. Solo aplica cuando `ccgqa` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2510.04476) (paper: arxiv:2305.13245)'
            properties:
              query_latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: CCGQA Query Latent Rank
                title_es: Rango Latente de Query CCGQA
                description: 'Query latent width `E / C₁` for `ccgqa` (Compressed

                  Convolutional Grouped Query Attention (paper: arxiv:2510.04476)). CCGQA

                  decouples query and KV compression: queries are compressed by `C₁`

                  and keys/values by `C₂` (≥ `C₁`). `null` defaults to

                  `hidden_size // 2` (C₁=2). Must be divisible by `num_heads`.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Ancho latente de query `E / C₁` para `ccgqa` (Compressed

                  Convolutional Grouped Query Attention (paper: arxiv:2510.04476)). CCGQA

                  desacopla la compresión de query y KV: las consultas se comprimen

                  por `C₁` y las claves/valores por `C₂` (≥ `C₁`). `null` por

                  defecto es `hidden_size // 2` (C₁=2). Debe ser divisible por

                  `num_heads`.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 256
              kv_latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: CCGQA KV Latent Rank
                title_es: Rango Latente de KV CCGQA
                description: 'KV latent width `E / C₂` for `ccgqa`. The constraint

                  `ccgqa_query_latent_rank / num_heads == ccgqa_kv_latent_rank /

                  ccgqa_num_kv_heads` must hold (same per-head latent dim `d_h`).

                  `null` defaults to `hidden_size // 8` (C₂=8). Must be ≤

                  `ccgqa_query_latent_rank`.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Ancho latente de KV `E / C₂` para `ccgqa`. La restricción

                  `ccgqa_query_latent_rank / num_heads == ccgqa_kv_latent_rank /

                  ccgqa_num_kv_heads` debe cumplirse (misma dimensión latente por

                  cabeza `d_h`). `null` por defecto es `hidden_size // 8` (C₂=8).

                  Debe ser ≤ `ccgqa_query_latent_rank`.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 64
              num_kv_heads:
                type:
                - integer
                - 'null'
                default: null
                title: CCGQA KV Heads
                title_es: Cabezas KV CCGQA
                description: 'Number of KV (group) heads for `ccgqa`. Must divide

                  `num_heads`. The group size is `num_heads / ccgqa_num_kv_heads`,

                  which also equals `C₂ / C₁`. `null` defaults to `num_heads // 4`.


                  **References:** (paper: arxiv:2305.13245)'
                description_es: 'Número de cabezas KV (grupo) para `ccgqa`. Debe dividir

                  `num_heads`. El tamaño de grupo es `num_heads /

                  ccgqa_num_kv_heads`, que también iguala `C₂ / C₁`. `null` por

                  defecto es `num_heads // 4`.


                  **Referencias:** (paper: arxiv:2305.13245)'
                examples:
                - 2
              num_conv_layers:
                type: integer
                title: CCGQA Conv Layers
                title_es: Capas de Convolución CCGQA
                description: 'Number of convolution layers for `ccgqa` (0, 1, or 2). Same

                  semantics as `cca_num_conv_layers`. Default: 2.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Número de capas de convolución para `ccgqa` (0, 1 o 2).

                  Mismas semánticas que `cca_num_conv_layers`. Por defecto: 2.


                  **Referencias:** (paper: arxiv:2510.04476)'
                enum:
                - 0
                - 1
                - 2
                examples:
                - 2
              conv_kernel_seq:
                type: integer
                title: CCGQA Seq Conv Kernel
                title_es: Kernel Conv Secuencia CCGQA
                description: 'Kernel size of the depth-wise causal sequence convolution in

                  `ccgqa`. Default: 4.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Tamaño de kernel de la convolución causal depth-wise de secuencia

                  en `ccgqa`. Por defecto: 4.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 4
              conv_kernel_ch:
                type: integer
                title: CCGQA Channel Conv Kernel
                title_es: Kernel Conv Canales CCGQA
                description: 'Kernel size of the head-wise grouped channel convolution in

                  `ccgqa`. Default: 3.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Tamaño de kernel de la convolución agrupada de canales por cabeza

                  en `ccgqa`. Por defecto: 3.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - 3
              qk_mean:
                type: boolean
                title: CCGQA QK-Mean
                title_es: QK-Mean CCGQA
                description: 'Enable the q-k-mean bias with B_group/E_group for `ccgqa`.

                  Default: True.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Habilita el sesgo q-k-mean con B_group/E_group para `ccgqa`.

                  Por defecto: True.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - true
              value_shift:
                type: boolean
                title: CCGQA Value-Shift
                title_es: Value-Shift CCGQA
                description: 'Enable value-shift for `ccgqa`. Requires

                  `ccgqa_kv_latent_rank` even (the split halves the KV latent width,

                  not the KV heads). Default: True.


                  **References:** (paper: arxiv:2510.04476)'
                description_es: 'Habilita value-shift para `ccgqa`. Requiere

                  `ccgqa_num_kv_heads` par y `ccgqa_kv_latent_rank` par.

                  Por defecto: True.


                  **Referencias:** (paper: arxiv:2510.04476)'
                examples:
                - true
          conformer:
            type: object
            additionalProperties: false
            title: Conformer Attention
            title_es: Atención Conformer
            description: 'Hyperparameters for `conformer` (Conformer block (paper: arxiv:2005.08100)).

              The mixer owns the macaron FFN₁, multi-head self-attention and the

              convolution module with internal pre-norm residuals; the shared

              `HybridLayer` norm + FFN supplies FFN₂ and the outer residual. Only

              applies when `conformer` appears in `layer_pattern`.


              **References:** (paper: arxiv:2005.08100)'
            description_es: 'Hiperparámetros para `conformer` (bloque Conformer,

              (paper: arxiv:2005.08100)). El mixer contiene la FFN₁ macaron, la

              auto-atención multi-cabeza y el módulo de convolución con residuales

              pre-norm internos; la norm + FFN compartidas de `HybridLayer` aportan

              la FFN₂ y el residual externo. Solo aplica cuando `conformer`

              aparece en `layer_pattern`.


              **Referencias:** (paper: arxiv:2005.08100)'
            properties:
              kernel_size:
                type: integer
                minimum: 1
                title: Conformer Conv Kernel Size
                title_es: Tamaño de Kernel Convolucional Conformer
                description: 'Kernel size `k` of the depth-wise convolution in the `conformer`

                  convolution module (paper: arxiv:2005.08100, Sec. 2.2). The paper''s sweep

                  over {3, 7, 17, 32, 65} finds 32 best (Table 7). Odd values give

                  perfectly symmetric padding in encoder mode; in decoder mode the

                  padding is always causal (left-only), independent of parity. Must be

                  at least 1.


                  **References:** (paper: arxiv:2005.08100)'
                description_es: 'Tamaño de kernel `k` de la convolución depth-wise del módulo de

                  convolución de `conformer` (paper: arxiv:2005.08100, Sec. 2.2). El

                  barrido del paper sobre {3, 7, 17, 32, 65} encuentra 32 como el mejor

                  (Tabla 7). Valores impares dan padding perfectamente simétrico en

                  modo encoder; en modo decoder el padding es siempre causal (solo a

                  la izquierda), independientemente de la paridad. Debe ser al menos 1.


                  **Referencias:** (paper: arxiv:2005.08100)'
                default: 32
                examples:
                - 3
                - 7
                - 17
                - 32
                - 65
              macaron:
                type: boolean
                title: Conformer Macaron FFN
                title_es: FFN Macaron Conformer
                description: 'Enable the macaron half-step FFN₁ branch inside `conformer`

                  (paper: arxiv:1906.02762). When False the mixer reduces to MHSA +

                  convolution module. The paper''s ablation shows removing the

                  macaron FFN pair costs roughly 0.2/0.5 WER (Table 3). Default: True.


                  **References:** (paper: arxiv:2005.08100)'
                description_es: 'Habilita la rama FFN₁ macaron de medio paso dentro de

                  `conformer` (paper: arxiv:1906.02762). Con False el mixer se reduce a

                  MHSA + módulo de convolución. La ablación del paper muestra que

                  eliminar el par FFN macaron cuesta aproximadamente 0.2/0.5 WER

                  (Tabla 3). Por defecto: True.


                  **Referencias:** (paper: arxiv:2005.08100)'
                default: true
                examples:
                - true
              conv_norm:
                type: string
                enum:
                - batch
                - group
                - layer
                title: Conformer Conv Normalization
                title_es: Normalización Convolucional Conformer
                description: 'Normalization applied after the depth-wise convolution in

                  `conformer` (paper default: BatchNorm1d). `batch` uses

                  `nn.BatchNorm1d` with eps=1e-5 and momentum=0.1; `group` uses

                  `nn.GroupNorm` with at most 8 groups that divide `hidden_size`;

                  `layer` uses `nn.LayerNorm` over the feature axis. Default: `batch`.


                  **References:** (paper: arxiv:2005.08100)'
                description_es: 'Normalización aplicada tras la convolución depth-wise en

                  `conformer` (por defecto del paper: BatchNorm1d). `batch` usa

                  `nn.BatchNorm1d` con eps=1e-5 y momentum=0.1; `group` usa

                  `nn.GroupNorm` con como máximo 8 grupos que dividan `hidden_size`;

                  `layer` usa `nn.LayerNorm` sobre el eje de características. Por

                  defecto: `batch`.


                  **Referencias:** (paper: arxiv:2005.08100)'
                default: batch
                examples:
                - batch
                - group
                - layer
          engram:
            type: object
            additionalProperties: false
            description: 'Configuration of the Engram conditional-memory module: N-gram orders, hashing heads, per-head embedding width and the short conv over retrieved vectors. Only applies when `engram` appears in `layer_pattern`.

              **References:** (paper: arxiv:2601.07372)'
            description_es: 'Configuración del módulo de memoria condicional Engram: órdenes de N-gramas, cabezas de hashing, ancho de embedding por cabeza y la conv corta sobre los vectores recuperados. Solo aplica cuando `engram` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2601.07372)'
            properties:
              max_ngram_size:
                type: integer
                title: Engram Max N-gram Size
                title_es: Tamaño Máximo de N-grama Engram
                description: 'Highest N-gram order for the Engram conditional memory module (paper: arxiv:2601.07372).

                  Builds lookup tables for all N-gram sizes from 2 up to this value. 3 = bigrams + trigrams.

                  Only when `engram` appears in `layer_pattern`.


                  **Impact:** Higher values give richer context keys but increase the number of

                  embedding tables quadratically.


                  **References:** (paper: arxiv:2601.07372)

                  '
                description_es: 'Orden máximo de N-grama para el módulo de memoria condicional Engram (paper: arxiv:2601.07372).

                  Construye tablas de búsqueda para todos los tamaños de N-grama desde 2 hasta este valor.

                  3 = bigramas + trigramas. Solo cuando `engram` aparece en `layer_pattern`.


                  **Impacto:** Valores mayores dan claves de contexto más ricas pero aumentan el número de

                  embedding tables quadratically.


                  **Referencias:** (paper: arxiv:2601.07372)

                  '
                examples:
                - 3
              n_heads_per_ngram:
                type: integer
                title: Engram Hash Heads per N-gram
                title_es: Cabezas Hash Engram por N-grama
                description: 'Independent hash functions (heads) per N-gram order in the Engram module. Each head uses

                  a different prime modulus for statistically independent collisions. More heads = more retrieval

                  diversity, more embedding params. Only when `engram` in `layer_pattern`.


                  **Impact:** Typical: 4–8. Total Engram params grow with: (max_ngram-1) × n_heads × embed_dim.


                  **References:** (paper: arxiv:2601.07372)

                  '
                description_es: 'Funciones hash independientes (cabezas) por orden de N-grama en el módulo Engram. Cada

                  cabeza usa un módulo primo diferente para colisiones estadísticamente independientes. Más cabezas

                  = más diversidad de recuperación, más parámetros de embedding. Solo con `engram` en `layer_pattern`.


                  **Impacto:** Típico: 4–8. Total Engram params crecen con: (max_ngram-1) × n_heads × embed_dim.


                  **Referencias:** (paper: arxiv:2601.07372)

                  '
                examples:
                - 4
              embed_dim_per_head:
                type: integer
                title: Engram Embed Dim per Head
                title_es: Dim de Embedding Engram por Cabeza
                description: 'Dimensionality of each per-head N-gram embedding. Total Engram hidden size =

                  `(max_ngram_size-1) × n_heads_per_ngram × embed_dim_per_head`. Typical: 16–64 (small), 128+ (large).

                  Only when `engram` in `layer_pattern`.


                  **Impact:** Lower = memory savings. Higher = more expressivity. With max_ngram=3, heads=4, dim=32:

                  total = 2 × 4 × 32 = 256 channels.


                  **References:** (paper: arxiv:2601.07372)

                  '
                description_es: 'Dimensionalidad de cada embedding N-grama por cabeza. Tamaño total oculto de Engram =

                  `(max_ngram_size-1) × n_heads_per_ngram × embed_dim_per_head`. Típico: 16–64 (pequeño), 128+ (grande).

                  Solo con `engram` en `layer_pattern`.


                  **Impacto:** Menor = ahorro de memoria. Mayor = más expresividad. Con max_ngram=3, heads=4, dim=32:

                  total = 2 × 4 × 32 = 256 channels.


                  **Referencias:** (paper: arxiv:2601.07372)

                  '
                examples:
                - 32
              kernel_size:
                type: integer
                title: Engram ShortConv Kernel
                title_es: Kernel de ShortConv Engram
                description: 'Kernel width of causal depthwise conv on retrieved N-gram embeddings. Typical: 3–8.

                  Dilated by `max_ngram_size` → effective receptive field = `kernel_size × max_ngram_size` tokens.

                  Only when `engram` in `layer_pattern`.


                  **Impact:** Larger kernels capture wider local context in the embedding space.


                  **References:** (paper: arxiv:2601.07372)

                  '
                description_es: 'Ancho del kernel de convolución causal depthwise sobre embeddings N-grama recuperados.

                  Típico: 3–8. Dilatado por `max_ngram_size` → campo receptivo efectivo = `kernel_size × max_ngram_size` tokens.

                  Solo con `engram` en `layer_pattern`.


                  **Impacto:** Kernels más grandes capturan contexto local más amplio en el espacio de embedding.


                  **Referencias:** (paper: arxiv:2601.07372)

                  '
                examples:
                - 4
              seed:
                type: integer
                title: Engram Hash Seed
                title_es: Semilla de Hash Engram
                description: 'Random seed for generating odd multipliers for N-gram hashing in the Engram module.

                  Changing produces a different but equally valid hash mapping. Fixed value for reproducibility.

                  Only when `engram` in `layer_pattern`.


                  **Impact:** Affects which tokens collide in hash space. Use 42 for standard

                  reproducibility. Change if adverse collisions are suspected.


                  **References:** (paper: arxiv:2601.07372)

                  '
                description_es: 'Semilla aleatoria para generar multiplicadores impares para hashing de N-gramas en el

                  módulo Engram. Cambiarla produce un mapeo hash diferente pero igualmente válido. Valor fijo para

                  reproducibilidad. Solo con `engram` en `layer_pattern`.


                  **Impacto:** Afecta qué tokens colisionan en el espacio hash. Usar 42 para reproducibilidad

                  reproducibility. Change if adverse collisions are suspected.


                  **Referencias:** (paper: arxiv:2601.07372)

                  '
                examples:
                - 42
          falcon1:
            type: object
            additionalProperties: false
            title: Falcon Fast-Weight Attention
            title_es: Atención Fast-Weight Falcon
            description: "Shared configuration of the Falcon fast-weight attention family\n((paper: arxiv:2608.27763), \"Fast Weight Attention for Continual Learning\",\nZhang et al. 2026). The six mixers `falcon1`, `falcon2`,\n`falcon3` (squared-error regression family) and\n`falcon1a`, `falcon2a`, `falcon3a` (negative\ninner-product / additive family) treat the recurrent fast-weight\nstate transition as an online continual-learning rule under\nread-after-write autoregressive semantics: the local fast-memory\nexample revealed at step `t` is the prefix-aligned pair\n`(x_t, y_t) = (phi(k_{t-1}), v_t)`. Knobs are shared by all six\nvariants; `window` only applies to `falcon3`/`falcon3a`.\n\n**Examples explained:**\n- `beta_mode=ctx_eta, lambda_mode=ctx, qk_norm=rms_norm`: the\n  paper's Falcon-*.3 configuration (QK-RMSNorm + ctx_eta +\n  ctx_lambda). Best language-model perplexity (Falcon-1.3) and\n  best length extrapolation (Falcon-3A.3).\n- `chunk_size=null`: force the recurrent reference\
              \ scan instead of\n  the SSD-style chunk-parallel kernels.\n- `beta_mode=static, beta=1.0, lambda_mode=static, lambda=0.0`:\n  classical NLMS delta rule with orthogonal projection along the\n  write direction.\n\n**References:** (paper: arxiv:2608.27763)"
            description_es: "Configuración compartida de la familia de atención fast-weight\nFalcon ((paper: arxiv:2608.27763), \"Fast Weight Attention for Continual\nLearning\", Zhang et al. 2026). Los seis mixers `falcon1`,\n`falcon2`, `falcon3` (familia de regresión de error\ncuadrático) y `falcon1a`, `falcon2a`, `falcon3a`\n(familia de producto interno negativo / aditiva) tratan la\ntransición del estado fast-weight recurrente como una regla de\naprendizaje continuo en línea bajo semántica autorregresiva\nread-after-write: el ejemplo local revelado en el paso `t` es el\npar alineado al prefijo `(x_t, y_t) = (phi(k_{t-1}), v_t)`. Los\nparámetros son compartidos por las seis variantes; `window` solo\naplica a `falcon3`/`falcon3a`.\n\n**Ejemplos explicados:**\n- `beta_mode=ctx_eta, lambda_mode=ctx, qk_norm=rms_norm`: la\n  configuración Falcon-*.3 del paper (QK-RMSNorm + ctx_eta +\n  ctx_lambda). Mejor perplexity de LM (Falcon-1.3) y mejor\n  extrapolación de longitud (Falcon-3A.3).\n-\
              \ `chunk_size=null`: fuerza el escaneo recurrente de referencia en\n  lugar de los kernels chunk-parallel estilo SSD.\n- `beta_mode=static, beta=1.0, lambda_mode=static, lambda=0.0`:\n  regla delta NLMS clásica con proyección ortogonal en la\n  dirección de escritura.\n\n**Referencias:** (paper: arxiv:2608.27763)"
            properties: &id001
              chunk_size:
                type:
                - integer
                - 'null'
                title: Falcon Chunk Size
                title_es: Tamaño de Chunk Falcon
                description: 'Chunk size of the SSD-style chunk-parallel kernels (WY

                  triangular solves for the regression family, decay-mask

                  linear attention for the additive family, window-banded masks

                  and rank-B block substitution for the sliding variants).

                  `null` forces the recurrent reference scan (O(N) per-step

                  loop). Typical: 64 or 128. Default: 64.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Tamaño de chunk de los kernels chunk-parallel estilo SSD

                  (resoluciones triangulares WY para la familia de regresión,

                  atención lineal con máscara de decaimiento para la familia

                  aditiva, máscaras de banda de ventana y sustitución por

                  bloques de rango B para las variantes deslizantes).

                  `null` fuerza el escaneo recurrente de referencia (bucle

                  O(N) por paso). Típico: 64 o 128. Por defecto: 64.


                  **Referencias:** (paper: arxiv:2608.27763)'
                examples:
                - 64
                - 128
              qk_norm:
                type: string
                title: Falcon QK Norm
                title_es: Norm QK Falcon
                description: 'Query/key normalization. `rms_norm` (paper default,

                  QK-RMSNorm computed in fp32) keeps `||x_t||^2 ~= d`, which

                  stabilizes the NLMS denominator in mixed precision;

                  `l2_norm` is the DeltaNet-style QK-l2-norm ablation

                  (`||x_t|| = 1`). Default: rms_norm.


                  **References:** (paper: arxiv:2608.27763) (paper: arxiv:1910.07467)'
                description_es: 'Normalización de query/key. `rms_norm` (por defecto del

                  paper, QK-RMSNorm calculada en fp32) mantiene `||x_t||^2 ~=

                  d`, lo que estabiliza el denominador NLMS en precisión

                  mixta; `l2_norm` es la ablaación estilo DeltaNet

                  (`||x_t|| = 1`). Por defecto: rms_norm.


                  **Referencias:** (paper: arxiv:2608.27763) (paper: arxiv:1910.07467)'
                enum:
                - rms_norm
                - l2_norm
                examples:
                - rms_norm
              beta_mode:
                type: string
                title: Falcon Beta Mode
                title_es: Modo Beta Falcon
                description: 'Plasticity (step-size numerator) gate parameterization.

                  `static` uses the fixed scalar `beta`; `ctx_beta` emits the

                  bounded gain `beta_t = 2*sigmoid(proj)` in the descent-safe

                  interval (0, 2); `ctx_eta` emits an unbounded `softplus`

                  numerator directly (allows the sign-flip regime beta > 2,

                  useful for state tracking). The paper''s best configs use

                  ctx_eta. Default: ctx_eta.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Parametrización de la compuerta de plasticidad (numerador del

                  tamaño de paso). `static` usa el escalar fijo `beta`;

                  `ctx_beta` emite la ganancia acotada `beta_t = 2*sigmoid(proj)`

                  en el intervalo seguro de descenso (0, 2); `ctx_eta` emite un

                  numerador `softplus` sin cota directamente (permite el régimen

                  de inversión de signo beta > 2, útil para state tracking). Las

                  mejores configuraciones del paper usan ctx_eta. Por defecto:

                  ctx_eta.


                  **Referencias:** (paper: arxiv:2608.27763)'
                enum:
                - static
                - ctx_beta
                - ctx_eta
                examples:
                - ctx_eta
              lambda_mode:
                type: string
                title: Falcon Lambda Mode
                title_es: Modo Lambda Falcon
                description: 'Forgetting (ridge) gate parameterization. `static` uses the

                  fixed scalar `lambda` (must be >= 0); `ctx` emits a per-head

                  base ridge `lam_bar = softplus(proj)` that is scale-coupled

                  with the detached objective statistic (`lambda_t = lam_bar_t *

                  statistic_t`, Sec. 4.1 of the paper). The paper''s best configs

                  use ctx. Default: ctx.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Parametrización de la compuerta de olvido (ridge). `static`

                  usa el escalar fijo `lambda` (debe ser >= 0); `ctx` emite un

                  ridge base por cabeza `lam_bar = softplus(proj)` acoplado en

                  escala con la estadística objetivo separada del grafo

                  (`lambda_t = lam_bar_t * statistic_t`, Sec. 4.1 del paper).

                  Las mejores configuraciones del paper usan ctx. Por defecto:

                  ctx.


                  **Referencias:** (paper: arxiv:2608.27763)'
                enum:
                - static
                - ctx
                examples:
                - ctx
              beta:
                type: number
                title: Falcon Beta (static)
                title_es: Beta Falcon (estático)
                description: 'Static dimensionless NLMS gain used when `beta_mode=static`.

                  Must be in (0, 2); beta = 1 is an orthogonal projection along

                  the write direction. Ignored otherwise. Default: 1.0.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Ganancia NLMS adimensional estática usada cuando

                  `beta_mode=static`. Debe estar en (0, 2); beta = 1 es una

                  proyección ortogonal en la dirección de escritura. Se ignora

                  en otro caso. Por defecto: 1.0.


                  **Referencias:** (paper: arxiv:2608.27763)'
                exclusiveMinimum: 0
                exclusiveMaximum: 2
                examples:
                - 1.0
              lambda:
                type: number
                title: Falcon Lambda (static)
                title_es: Lambda Falcon (estático)
                description: 'Static ridge coefficient used when `lambda_mode=static`.

                  Must be >= 0; lambda = 0 is the purely additive ablation (no

                  forgetting). Ignored otherwise. Default: 0.0.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Coeficiente ridge estático usado cuando `lambda_mode=static`.

                  Debe ser >= 0; lambda = 0 es la ablaación puramente aditiva

                  (sin olvido). Se ignora en otro caso. Por defecto: 0.0.


                  **Referencias:** (paper: arxiv:2608.27763)'
                minimum: 0
                examples:
                - 0.0
              window:
                type: integer
                title: Falcon Sliding Window B
                title_es: Ventana Deslizante B Falcon
                description: 'Sliding-window size B of the bounded-rehearsal variants

                  `falcon3` / `falcon3a`: each prefix-aligned pair is

                  replayed in B consecutive window-averaged updates

                  (window-averaging keeps the update magnitude invariant to B).

                  Ignored by the non-windowed variants. Paper default: 4.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Tamaño de ventana deslizante B de las variantes de ensayo

                  acotado `falcon3` / `falcon3a`: cada par alineado al

                  prefijo se repite en B actualizaciones promediadas por

                  ventana consecutivas (el promediado mantiene la magnitud de

                  actualización invariante a B). Ignorada por las variantes no

                  deslizantes. Por defecto del paper: 4.


                  **Referencias:** (paper: arxiv:2608.27763)'
                minimum: 1
                examples:
                - 4
              short_conv:
                type: boolean
                title: Falcon Short Conv
                title_es: Convolución Corta Falcon
                description: 'Apply lightweight causal depth-wise short convolutions

                  (H3/SLConv-style) on the q/k/v projections. The paper notes

                  this component is orthogonal to the fast-memory update; it is

                  on by default and can be disabled for ablation. Default: true.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Aplica convoluciones cortas causales depth-wise ligeras

                  (estilo H3/SLConv) sobre las proyecciones q/k/v. El paper

                  señala que este componente es ortogonal a la actualización de

                  la memoria rápida; está activado por defecto y puede

                  deshabilitarse para ablación. Por defecto: true.


                  **Referencias:** (paper: arxiv:2608.27763)'
                examples:
                - true
              conv_kernel:
                type: integer
                title: Falcon Conv Kernel
                title_es: Kernel Conv Falcon
                description: 'Kernel size of the Falcon short convolutions. Only applies

                  when `short_conv=true`. Default: 4.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Tamaño de kernel de las convoluciones cortas Falcon. Solo

                  aplica cuando `short_conv=true`. Por defecto: 4.


                  **Referencias:** (paper: arxiv:2608.27763)'
                minimum: 1
                examples:
                - 4
              eps:
                type: number
                title: Falcon Epsilon
                title_es: Épsilon Falcon
                description: 'Numerical stabilizer in the normalized step-size denominator

                  `eta_t = beta_t / (statistic_t + lambda_t + eps)`. Any eps > 0

                  only decreases eta_t and therefore preserves descent. Must be

                  > 0. Default: 1e-6.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Estabilizador numérico en el denominador del tamaño de paso

                  normalizado `eta_t = beta_t / (statistic_t + lambda_t + eps)`.

                  Cualquier eps > 0 solo disminuye eta_t y por lo tanto

                  preserva el descenso. Debe ser > 0. Por defecto: 1e-6.


                  **Referencias:** (paper: arxiv:2608.27763)'
                exclusiveMinimum: 0
                examples:
                - 1.0e-06
              eps_gamma:
                type: number
                title: Falcon Decay Floor
                title_es: Piso de Decaimiento Falcon
                description: 'Positive-decay clamp floor: the per-step shrinkage obeys

                  `alpha_t = min(eta_t * lambda_t, 1 - eps_gamma)` so the carry

                  `gamma_t = 1 - alpha_t >= eps_gamma` stays strictly positive

                  (the numerically stable positive-decay renormalization of

                  Sec. 4.4). Must be in (0, 1). Default: 1e-4.


                  **References:** (paper: arxiv:2608.27763)'
                description_es: 'Piso del recorte de decaimiento positivo: la contracción por

                  paso obedece `alpha_t = min(eta_t * lambda_t, 1 - eps_gamma)`

                  de modo que el arrastre `gamma_t = 1 - alpha_t >= eps_gamma`

                  permanece estrictamente positivo (la renormalización de

                  decaimiento positivo numéricamente estable de la Sec. 4.4).

                  Debe estar en (0, 1). Por defecto: 1e-4.


                  **Referencias:** (paper: arxiv:2608.27763)'
                exclusiveMinimum: 0
                exclusiveMaximum: 1
                examples:
                - 0.0001
