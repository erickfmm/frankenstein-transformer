          task:
            const: mlm
  then:
    properties:
      training:
        required:
        - optimizer
- if:
    properties:
      training:
        properties:
          task:
            const: sbert
  then:
    properties:
      training:
        required:
        - sbert
- if:
    properties:
      training:
        properties:
          task:
            const: causal_lm
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_text_decoder
    required:
    - model_class
- if:
    properties:
      training:
        properties:
          task:
            const: text_classification
  then:
    properties:
      training:
        required:
        - optimizer
      model_class:
        const: frankenstein_text_encoder
    required:
    - model_class
    - model
- if:
    required:
    - base_model
  then:
    properties:
      training:
        required:
        - task
    allOf:
    - if:
        properties:
          training:
            properties:
              task:
                const: mlm
      then:
        properties:
          tokenizer:
            required:
            - name_or_path
