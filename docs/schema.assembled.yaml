            title: Falcon Fast-Weight Attention
            title_es: Atención Fast-Weight Falcon
            description: "Shared configuration of the Falcon fast-weight attention family\n((paper: arxiv:2608.27763), \"Fast Weight Attention for Continual Learning\",\nZhang et al. 2026). The six mixers `falcon1`, `falcon2`,\n`falcon3` (squared-error regression family) and\n`falcon1a`, `falcon2a`, `falcon3a` (negative\ninner-product / additive family) treat the recurrent fast-weight\nstate transition as an online continual-learning rule under\nread-after-write autoregressive semantics: the local fast-memory\nexample revealed at step `t` is the prefix-aligned pair\n`(x_t, y_t) = (phi(k_{t-1}), v_t)`. Knobs are shared by all six\nvariants; `window` only applies to `falcon3`/`falcon3a`.\n\n**Examples explained:**\n- `beta_mode=ctx_eta, lambda_mode=ctx, qk_norm=rms_norm`: the\n  paper's Falcon-*.3 configuration (QK-RMSNorm + ctx_eta +\n  ctx_lambda). Best language-model perplexity (Falcon-1.3) and\n  best length extrapolation (Falcon-3A.3).\n- `chunk_size=null`: force the recurrent reference\
              \ scan instead of\n  the SSD-style chunk-parallel kernels.\n- `beta_mode=static, beta=1.0, lambda_mode=static, lambda=0.0`:\n  classical NLMS delta rule with orthogonal projection along the\n  write direction.\n\n**References:** (paper: arxiv:2608.27763)"
            description_es: "Configuración compartida de la familia de atención fast-weight\nFalcon ((paper: arxiv:2608.27763), \"Fast Weight Attention for Continual\nLearning\", Zhang et al. 2026). Los seis mixers `falcon1`,\n`falcon2`, `falcon3` (familia de regresión de error\ncuadrático) y `falcon1a`, `falcon2a`, `falcon3a`\n(familia de producto interno negativo / aditiva) tratan la\ntransición del estado fast-weight recurrente como una regla de\naprendizaje continuo en línea bajo semántica autorregresiva\nread-after-write: el ejemplo local revelado en el paso `t` es el\npar alineado al prefijo `(x_t, y_t) = (phi(k_{t-1}), v_t)`. Los\nparámetros son compartidos por las seis variantes; `window` solo\naplica a `falcon3`/`falcon3a`.\n\n**Ejemplos explicados:**\n- `beta_mode=ctx_eta, lambda_mode=ctx, qk_norm=rms_norm`: la\n  configuración Falcon-*.3 del paper (QK-RMSNorm + ctx_eta +\n  ctx_lambda). Mejor perplexity de LM (Falcon-1.3) y mejor\n  extrapolación de longitud (Falcon-3A.3).\n-\
              \ `chunk_size=null`: fuerza el escaneo recurrente de referencia en\n  lugar de los kernels chunk-parallel estilo SSD.\n- `beta_mode=static, beta=1.0, lambda_mode=static, lambda=0.0`:\n  regla delta NLMS clásica con proyección ortogonal en la\n  dirección de escritura.\n\n**Referencias:** (paper: arxiv:2608.27763)"
            properties: *id001
          falcon3a:
            type: object
            additionalProperties: false
            title: Falcon Fast-Weight Attention
            title_es: Atención Fast-Weight Falcon
            description: "Shared configuration of the Falcon fast-weight attention family\n((paper: arxiv:2608.27763), \"Fast Weight Attention for Continual Learning\",\nZhang et al. 2026). The six mixers `falcon1`, `falcon2`,\n`falcon3` (squared-error regression family) and\n`falcon1a`, `falcon2a`, `falcon3a` (negative\ninner-product / additive family) treat the recurrent fast-weight\nstate transition as an online continual-learning rule under\nread-after-write autoregressive semantics: the local fast-memory\nexample revealed at step `t` is the prefix-aligned pair\n`(x_t, y_t) = (phi(k_{t-1}), v_t)`. Knobs are shared by all six\nvariants; `window` only applies to `falcon3`/`falcon3a`.\n\n**Examples explained:**\n- `beta_mode=ctx_eta, lambda_mode=ctx, qk_norm=rms_norm`: the\n  paper's Falcon-*.3 configuration (QK-RMSNorm + ctx_eta +\n  ctx_lambda). Best language-model perplexity (Falcon-1.3) and\n  best length extrapolation (Falcon-3A.3).\n- `chunk_size=null`: force the recurrent reference\
              \ scan instead of\n  the SSD-style chunk-parallel kernels.\n- `beta_mode=static, beta=1.0, lambda_mode=static, lambda=0.0`:\n  classical NLMS delta rule with orthogonal projection along the\n  write direction.\n\n**References:** (paper: arxiv:2608.27763)"
            description_es: "Configuración compartida de la familia de atención fast-weight\nFalcon ((paper: arxiv:2608.27763), \"Fast Weight Attention for Continual\nLearning\", Zhang et al. 2026). Los seis mixers `falcon1`,\n`falcon2`, `falcon3` (familia de regresión de error\ncuadrático) y `falcon1a`, `falcon2a`, `falcon3a`\n(familia de producto interno negativo / aditiva) tratan la\ntransición del estado fast-weight recurrente como una regla de\naprendizaje continuo en línea bajo semántica autorregresiva\nread-after-write: el ejemplo local revelado en el paso `t` es el\npar alineado al prefijo `(x_t, y_t) = (phi(k_{t-1}), v_t)`. Los\nparámetros son compartidos por las seis variantes; `window` solo\naplica a `falcon3`/`falcon3a`.\n\n**Ejemplos explicados:**\n- `beta_mode=ctx_eta, lambda_mode=ctx, qk_norm=rms_norm`: la\n  configuración Falcon-*.3 del paper (QK-RMSNorm + ctx_eta +\n  ctx_lambda). Mejor perplexity de LM (Falcon-1.3) y mejor\n  extrapolación de longitud (Falcon-3A.3).\n-\
              \ `chunk_size=null`: fuerza el escaneo recurrente de referencia en\n  lugar de los kernels chunk-parallel estilo SSD.\n- `beta_mode=static, beta=1.0, lambda_mode=static, lambda=0.0`:\n  regla delta NLMS clásica con proyección ortogonal en la\n  dirección de escritura.\n\n**Referencias:** (paper: arxiv:2608.27763)"
            properties: *id001
          fastconformer:
            type: object
            additionalProperties: false
            title: Fast Conformer Limited-Context Attention
            title_es: Atención de Contexto Limitado Fast Conformer
            description: 'Hyperparameters for `fastconformer` (Fast Conformer limited-context

              attention with a head-pinned global token (paper: arxiv:2305.05084)).

              Every query attends to a symmetric local window around it plus the first

              `global_tokens` positions of the sequence (spaced `global_tokens_spacing`

              apart), which attend to all positions and are attended by all positions.

              With `global_attn_separate: true` the global token uses its own

              query/key/value projections (+3*H^2 parameters, the paper''s §2.2

              Longformer-style variant); with `false` it shares the local projections

              (the paper''s §3.4 long-form model). In decoder mode the pattern is

              causal. Only applies when `fastconformer` appears in `layer_pattern`.


              **References:** (paper: arxiv:2305.05084) (paper: arxiv:2004.05150)'
            description_es: 'Hiperparámetros para `fastconformer` (atención de contexto limitado

              Fast Conformer con un token global anclado a la cabecera (paper:

              arxiv:2305.05084)). Cada consulta atiende a una ventana local simétrica a

              su alrededor más las primeras `global_tokens` posiciones de la secuencia

              (espaciadas `global_tokens_spacing`), que atienden a todas las posiciones

              y son atendidas por todas. Con `global_attn_separate: true` el token

              global usa sus propias proyecciones query/key/value (+3*H^2 parámetros,

              la variante §2.2 del paper, estilo Longformer); con `false` comparte las

              proyecciones locales (el modelo de forma larga §3.4 del paper). En modo

              decoder el patrón es causal. Solo aplica cuando `fastconformer`

              aparece en `layer_pattern`.


              **Referencias:** (paper: arxiv:2305.05084) (paper: arxiv:2004.05150)'
            properties:
              window_size:
                type: integer
                minimum: 2
                title: Fast Conformer Window Size
                title_es: Tamaño de Ventana Fast Conformer
                description: "Total local span `w` each query attends to in `fastconformer`\n(paper: arxiv:2305.05084); the per-side context is `window_size / 2`.\nThe paper's long-form model uses 128 steps on each side of a token\n(~10 seconds of audio after 8x subsampling), i.e. `window_size: 256`.\nLarger windows extend local context at linear cost in the attention\nbudget; smaller windows are faster but lose local context.\n\n**Examples explained:**\n- `window_size=256`: the paper's §3.4 setting (128 per side).\n- `window_size=64`: short-context variant; the global token carries\n  all long-range information.\n\n**References:** (paper: arxiv:2305.05084)"
                description_es: "Tramo local total `w` al que atiende cada consulta en\n`fastconformer` (paper: arxiv:2305.05084); el contexto por lado\nes `window_size / 2`. El modelo de forma larga del paper usa 128\npasos a cada lado del token (~10 segundos de audio tras el\nsubmuestreo 8x), es decir, `window_size: 256`. Ventanas mayores\nextienden el contexto local a costo lineal; ventanas menores son más\nrápidas pero pierden contexto local.\n\n**Ejemplos explicados:**\n- `window_size=256`: el ajuste §3.4 del paper (128 por lado).\n- `window_size=64`: variante de contexto corto; el token global\n  transporta toda la información de largo alcance.\n\n**Referencias:** (paper: arxiv:2305.05084)"
                default: 256
                examples:
                - 64
                - 256
              global_tokens:
                type: integer
                minimum: 0
                title: Fast Conformer Global Tokens
                title_es: Tokens Globales Fast Conformer
                description: 'Number `g` of leading global attention tokens in `fastconformer`

                  (paper: arxiv:2305.05084). Global tokens are the first `g` positions

                  of the input sequence (spaced `global_tokens_spacing` apart): they

                  attend to all positions and are attended by all positions. The paper

                  uses "a single global attention token" (`g = 1`), which improves

                  long-form WER (TED-LIUM 9.18 -> 7.5, Earnings-21 18.26 -> 11.85);

                  `g = 0` is the paper''s pure limited-context variant (Table 8 row 2).


                  **References:** (paper: arxiv:2305.05084)'
                description_es: 'Número `g` de tokens de atención globales iniciales en

                  `fastconformer` (paper: arxiv:2305.05084). Los tokens globales

                  son las primeras `g` posiciones de la secuencia de entrada

                  (espaciadas `global_tokens_spacing`): atienden a todas las

                  posiciones y son atendidos por todas. El paper usa "un único token de

                  atención global" (`g = 1`), que mejora el WER de forma larga

                  (TED-LIUM 9.18 -> 7.5, Earnings-21 18.26 -> 11.85); `g = 0` es la

                  variante de contexto limitado puro del paper (fila 2 de la Tabla 8).


                  **Referencias:** (paper: arxiv:2305.05084)'
                default: 1
                examples:
                - 0
                - 1
              global_tokens_spacing:
                type: integer
                minimum: 1
                title: Fast Conformer Global Token Spacing
                title_es: Espaciado de Tokens Globales Fast Conformer
                description: 'Stride `s` between the leading global attention tokens of

                  `fastconformer` (paper: arxiv:2305.05084): the global positions

                  are `{0, s, 2s, ..., (g-1)*s}`. The paper uses a single global token

                  (`g = 1`), where the spacing is irrelevant; `s > 1` spreads several

                  global tokens across the head of the sequence (the NeMo recipe''s

                  `global_tokens_spacing`).


                  **References:** (paper: arxiv:2305.05084)'
                description_es: 'Paso `s` entre los tokens de atención globales iniciales de

                  `fastconformer` (paper: arxiv:2305.05084): las posiciones

                  globales son `{0, s, 2s, ..., (g-1)*s}`. El paper usa un único token

                  global (`g = 1`), donde el espaciado es irrelevante; `s > 1` reparte

                  varios tokens globales por la cabecera de la secuencia (el

                  `global_tokens_spacing` de la receta NeMo).


                  **Referencias:** (paper: arxiv:2305.05084)'
                default: 1
                examples:
                - 1
              global_attn_separate:
                type: boolean
                title: Separate Global Projections
                title_es: Proyecciones Globales Separadas
                description: 'Whether the global attention tokens of `fastconformer` use a

                  separate set of query/key/value linear projections (paper:

                  arxiv:2305.05084 §2.2, the Longformer-style global attention design;

                  adds 3*H^2 parameters) or share the local projections (the paper''s

                  §3.4 long-form model, fine-tuned from a full-attention checkpoint;

                  the NeMo default). The default `false` keeps the mixer

                  parameter-neutral (4*H^2).


                  **References:** (paper: arxiv:2305.05084) (paper: arxiv:2004.05150)'
                description_es: 'Si los tokens de atención globales de `fastconformer` usan un

                  conjunto separado de proyecciones lineales query/key/value (paper:

                  arxiv:2305.05084 §2.2, el diseño de atención global estilo Longformer;

                  añade 3*H^2 parámetros) o comparten las proyecciones locales (el

                  modelo de forma larga §3.4 del paper, ajustado por fine-tuning desde

                  un checkpoint de atención completa; el valor por defecto de NeMo). El

                  valor por defecto `false` mantiene el mixer sin parámetros extra

                  (4*H^2).


                  **Referencias:** (paper: arxiv:2305.05084) (paper: arxiv:2004.05150)'
                default: false
                examples:
                - false
                - true
          fpa:
            type: object
            additionalProperties: false
            title: First Passage Attention
            title_es: Atención de Primer Paso
            description: 'Hyperparameters for `fpa` (First Passage Attention (paper: arxiv:2610.22714)).

              Each head computes a scalar field φ at every position and a scalar level

              ψ per key from a shared learned walk (a prefix sum of per-token

              increments), and lowers a key''s logit by the depth of the deepest dip of

              the field below the key''s level over the span after the key:

              `b_ts = β·min(0, min_{s<u≤t} φ_u − ψ_s)`. FoX is the special case of a

              walk that never rises (δ ≤ 0). The mixer adds one field projection

              (`3·H` scalars) and one learned strength `β` per head. Only applies when

              `fpa` appears in `layer_pattern`.


              **References:** (paper: arxiv:2610.22714)'
            description_es: 'Hiperparámetros para `fpa` (Atención de Primer Paso (paper: arxiv:2610.22714)).

              Cada cabeza calcula un campo escalar φ en cada posición y un nivel escalar

              ψ por clave a partir de una caminata aprendida compartida (suma prefija de

              incrementos por token), y reduce el logit de una clave según la

              profundidad de la caída más profunda del campo por debajo del nivel de la

              clave en el tramo posterior a ella:

              `b_ts = β·min(0, min_{s<u≤t} φ_u − ψ_s)`. FoX es el caso especial de una

              caminata que nunca sube (δ ≤ 0). El mixer añade una proyección de campo

              (`3·H` escalares) y una fuerza aprendida `β` por cabeza. Solo aplica

              cuando `fpa` está en `layer_pattern`.


              **Referencias:** (paper: arxiv:2610.22714)'
            properties:
              beta_init:
                type: number
                exclusiveMinimum: 0
                title: Initial First-Passage Strength
                title_es: Fuerza Inicial de Primer Paso
                description: 'Initial value of the learned per-head first-passage strength β of

                  `fpa` (paper: arxiv:2610.22714, §2 and Table 16: β = 1 at

                  initialisation). β always stays learnable; it is the multiplier of

                  the deepest-dip depth in the bias `b_ts = β·min(0, φ̄ₜₛ − ψₛ)`.

                  Larger β hardens the alive/dead separation (β → ∞ makes dead keys

                  exactly invisible). Must be positive. Only applies when `fpa` is in

                  `layer_pattern`.


                  **References:** (paper: arxiv:2610.22714)'
                description_es: 'Valor inicial de la fuerza de primer paso aprendida por cabeza β de

                  `fpa` (paper: arxiv:2610.22714, §2 y Tabla 16: β = 1 en la

                  inicialización). β siempre permanece aprendible; multiplica la

                  profundidad de la caída más profunda en el sesgo

                  `b_ts = β·min(0, φ̄ₜₛ − ψₛ)`. Un β mayor endurece la separación

                  viva/muerta (β → ∞ hace que las claves muertas sean exactamente

                  invisibles). Debe ser positiva. Solo aplica cuando `fpa` está en

                  `layer_pattern`.


                  **Referencias:** (paper: arxiv:2610.22714)'
                default: 1.0
                examples:
                - 1.0
                - 2.0
              tau:
                type: number
                exclusiveMinimum: 0
                title: Soft-Minimum Temperature
                title_es: Temperatura del Mínimo Suave
                description: 'Temperature τ of the soft-minimum **straight-through gradient** of

                  `fpa` (paper: arxiv:2610.22714, §2 "Training": τ = 1). The forward

                  pass and evaluation always use the hard range minimum; τ only scales

                  the differentiable surrogate `−τ·log Σ_{s<u≤t} exp(−φ_u/τ)` whose

                  gradient is substituted in the backward pass. Must be positive. Only

                  applies when `fpa` is in `layer_pattern`.


                  **References:** (paper: arxiv:2610.22714)'
                description_es: 'Temperatura τ del **gradiente directo (straight-through)** del mínimo

                  suave de `fpa` (paper: arxiv:2610.22714, §2 "Training": τ = 1). La

                  pasada hacia adelante y la evaluación siempre usan el mínimo de rango

                  duro; τ solo escala el sustituto diferenciable

                  `−τ·log Σ_{s<u≤t} exp(−φ_u/τ)` cuyo gradiente se sustituye en la

                  pasada hacia atrás. Debe ser positiva. Solo aplica cuando `fpa` está

                  en `layer_pattern`.


                  **Referencias:** (paper: arxiv:2610.22714)'
                default: 1.0
                examples:
                - 1.0
                - 0.5
          gma:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `gma` (Gaussian Mixture Attention): number of mixture components, routing dimension and numerical floors. Only applies when `gma` appears in `layer_pattern`.

              **References:** (paper: arxiv:2606.18283)'
            description_es: 'Hiperparámetros para `gma` (Gaussian Mixture Attention): número de componentes de la mezcla, dimensión de enrutamiento y pisos numéricos. Solo aplica cuando `gma` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2606.18283)'
            properties:
              num_components:
                type: integer
                title: GMA Mixture Components
                title_es: Componentes de Mezcla GMA
                description: "Number `K` of learned Gaussian mixture components per head for\n`gma` (Gaussian Mixture Attention (paper: arxiv:2606.18283)). Each\ncomponent routes values into one latent memory slot, so `K`\ncontrols the routing capacity of the layer. The dominant\nactivation storage scales as `O(NK)` for fixed `K`, which is\nlinear in the sequence length `N`. Only applies when `gma`\nappears in `layer_pattern`.\n\n**Examples explained:**\n- `gma_num_components=8`: default. Good balance of routing\n  capacity and parameter cost for small/medium models. Per head\n  adds `K * d_r` mean + covariance parameters.\n- `gma_num_components=16`: richer routing. More latent memory\n  slots, finer-grained probabilistic routing. Doubles the\n  responsibility storage but keeps the `O(NK)` linear scaling.\n- `gma_num_components=4`: aggressive compression. Fewer\n  routing components, stronger bottleneck. Faster but may\n  degrade quality on tasks requiring many distinct routing\n  patterns.\n\
                  \n**References:** (paper: arxiv:2606.18283)"
                description_es: "Número `K` de componentes de mezcla Gaussianos aprendidos por\ncabeza para `gma` (Gaussian Mixture Attention,\n(paper: arxiv:2606.18283)). Cada componente enruta valores a un slot de\nmemoria latente, por lo que `K` controla la capacidad de\nenrutamiento de la capa. El almacenamiento de activaciones\ndominante escala como `O(NK)` para `K` fijo, lineal en la\nlongitud de secuencia `N`. Solo aplica cuando `gma`\naparece en `layer_pattern`.\n\n**Ejemplos explicados:**\n- `gma_num_components=8`: por defecto. Buen balance entre\n  capacidad de enrutamiento y costo de parámetros para modelos\n  pequeños/medianos. Por cabeza añade `K * d_r` parámetros de\n  media + covarianza.\n- `gma_num_components=16`: enrutamiento más rico. Más slots de\n  memoria latente, enrutamiento probabilístico más fino.\n  Duplica el almacenamiento de responsabilidades pero mantiene\n  el escalado lineal `O(NK)`.\n- `gma_num_components=4`: compresión agresiva. Menos componentes\n  de enrutamiento,\
                  \ cuello de botella más fuerte. Más rápido\n  pero puede degradar calidad en tareas que requieren muchos\n  patrones de enrutamiento distintos.\n\n**Referencias:** (paper: arxiv:2606.18283)"
                examples:
                - 8
              routing_dim:
                type:
                - integer
                - 'null'
                default: null
                title: GMA Routing Dimension
                title_es: Dimensión de Enrutamiento GMA
                description: 'Routing dimension `d_r` used to compute Gaussian

                  responsibilities for `gma` (paper: arxiv:2606.18283). Queries and

                  keys are projected from `hidden_size` into `num_heads * d_r`

                  before being mapped to posterior responsibilities over the `K`

                  mixture components. `null` defaults to the per-head dimension

                  `hidden_size // num_heads`. Decoupled from the value dimension

                  `d_v` (which equals `head_dim`). Only applies when `gma`

                  is in `layer_pattern`.


                  **Impact:** Larger `d_r` gives finer-grained Gaussian

                  posteriors and richer routing at the cost of `O(NK d_r)`

                  responsibility compute. Smaller `d_r` compresses the routing

                  space, trading expressivity for speed. The paper recommends

                  `d_r = head_dim` as a reasonable default.


                  **References:** (paper: arxiv:2606.18283)'
                description_es: 'Dimensión de enrutamiento `d_r` usada para calcular las

                  responsabilidades Gaussianas para `gma` (paper: arxiv:2606.18283).

                  Queries y keys se proyectan de `hidden_size` a

                  `num_heads * d_r` antes de mapearse a responsabilidades

                  posteriores sobre los `K` componentes de mezcla. `null` por

                  defecto es la dimensión por cabeza `hidden_size // num_heads`.

                  Desacoplada de la dimensión de valor `d_v` (que es igual a

                  `head_dim`). Solo aplica cuando `gma` está en

                  `layer_pattern`.


                  **Impacto:** `d_r` mayor da posteriores Gaussianos más finos y

                  enrutamiento más rico a costa de cómputo de responsabilidades

                  `O(NK d_r)`. `d_r` menor comprime el espacio de enrutamiento,

                  intercambiando expresividad por velocidad. El paper recomienda

                  `d_r = head_dim` como valor por defecto razonable.


                  **Referencias:** (paper: arxiv:2606.18283)'
                examples:
                - 64
              epsilon:
                type: number
                title: GMA Read Normalizer Epsilon
                title_es: Épsilon Normalizador de Lectura GMA
                description: 'Numerical-stability constant `epsilon` added to the read-step

                  denominator `Gamma^Q Z + epsilon` of `gma`

                  (paper: arxiv:2606.18283). Prevents division by zero when a mixture

                  component receives negligible key-responsibility mass. Must be

                  strictly positive. Only applies when `gma` is in

                  `layer_pattern`.


                  **Impact:** Smaller values (e.g. 1e-8) preserve the row-stochastic

                  interpretation of the induced attention weights but risk

                  numerical instability on rare empty components. Larger values

                  (e.g. 1e-4) improve stability at the cost of slightly biasing the

                  row sums below 1. Default 1e-6 is a safe middle ground.


                  **References:** (paper: arxiv:2606.18283)'
                description_es: 'Constante de estabilidad numérica `epsilon` añadida al

                  denominador del paso de lectura `Gamma^Q Z + epsilon` de

                  `gma` (paper: arxiv:2606.18283). Previene división por cero cuando

                  un componente de mezcla recibe masa de responsabilidad de clave

                  despreciable. Debe ser estrictamente positivo. Solo aplica

                  cuando `gma` está en `layer_pattern`.


                  **Impacto:** Valores menores (e.g. 1e-8) preservan la

                  interpretación estocástica por fila de los pesos de atención

                  inducidos pero arriesgan inestabilidad numérica en componentes

                  vacíos raros. Valores mayores (e.g. 1e-4) mejoran la

                  estabilidad a costa de sesgar las sumas por fila por debajo de

                  1. El valor por defecto 1e-6 es un punto medio seguro.


                  **Referencias:** (paper: arxiv:2606.18283)'
                examples:
                - 1.0e-06
              sigma_eps:
                type: number
                title: GMA Covariance Floor
                title_es: Piso de Covarianza GMA
                description: 'Lower bound `epsilon_sigma` for the diagonal variances of the

                  Gaussian mixture components of `gma` (paper: arxiv:2606.18283).

                  Variances are reparameterised as

                  `sigma^2 = softplus(omega) + epsilon_sigma`, which guarantees

                  strict positive-definiteness during gradient-based training.

                  Must be strictly positive. Only applies when `gma` is in

                  `layer_pattern`.


                  **Impact:** Smaller values allow sharper, more peaked

                  components but risk singular covariances and exploding

                  Mahalanobis distances. Larger values enforce broader, more

                  overlapping components, improving numerical stability at the

                  cost of routing sharpness. Default 1e-4 follows the paper.


                  **References:** (paper: arxiv:2606.18283)'
                description_es: 'Cota inferior `epsilon_sigma` para las varianzas diagonales de

                  los componentes de la mezcla Gaussiana de `gma`

                  (paper: arxiv:2606.18283). Las varianzas se reparametrizan como

                  `sigma^2 = softplus(omega) + epsilon_sigma`, lo que garantiza

                  definida-positividad estricta durante el entrenamiento basado

                  en gradientes. Debe ser estrictamente positivo. Solo aplica

                  cuando `gma` está en `layer_pattern`.


                  **Impacto:** Valores menores permiten componentes más afilados

                  y picudos pero arriesgan covarianzas singulares y distancias

                  de Mahalanobis explosivas. Valores mayores imponen componentes

                  más anchos y superpuestos, mejorando la estabilidad numérica a

                  costa de la nitidez del enrutamiento. El valor por defecto 1e-4

                  sigue el paper.


                  **Referencias:** (paper: arxiv:2606.18283)'
                examples:
                - 0.0001
              init_mean_std:
                type: number
                title: GMA Mean Init Std
                title_es: Desviación de Inicialización de Medias GMA
                description: 'Standard deviation of the zero-mean Gaussian used to initialise

                  the mixture component means `mu` of `gma`

                  (paper: arxiv:2606.18283). Means are drawn as `mu ~ N(0,

                  init_mean_std^2)`. Only applies when `gma` is in

                  `layer_pattern`.


                  **Impact:** Larger values spread the initial components across

                  a wider region of the routing space, encouraging diverse

                  routing early in training. Smaller values cluster the

                  components near the origin, relying on optimisation to spread

                  them. Default 1.0 matches the scale of typical normalised

                  projections.


                  **References:** (paper: arxiv:2606.18283)'
                description_es: 'Desviación estándar de la Gaussiana de media cero usada para

                  inicializar las medias de los componentes de mezcla `mu` de

                  `gma` (paper: arxiv:2606.18283). Las medias se extraen como

                  `mu ~ N(0, init_mean_std^2)`. Solo aplica cuando `gma`

                  está en `layer_pattern`.


                  **Impacto:** Valores mayores dispersan los componentes iniciales

                  a lo largo de una región más amplia del espacio de

                  enrutamiento, fomentando enrutamiento diverso temprano en el

                  entrenamiento. Valores menores agrupan los componentes cerca del

                  origen, confiando en la optimización para dispersarlos. El

                  valor por defecto 1.0 coincide con la escala de proyecciones

                  normalizadas típicas.


                  **Referencias:** (paper: arxiv:2606.18283)'
                examples:
                - 1.0
          gmla:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `gmla` (DeepSeek-style Gated MLA): joint KV latent rank, low-rank query bottleneck, decoupled NoPE/RoPE key widths, value width and the full-rank output gate. Only applies when `gmla` appears in `layer_pattern`.

              **References:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)'
            description_es: 'Hiperparámetros para `gmla` (Gated MLA estilo DeepSeek): rango del latente KV conjunto, cuello de botella low-rank de queries, anchos NoPE/RoPE desacoplados de claves, ancho de valores y compuerta de salida full-rank. Solo aplica cuando `gmla` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)'
            properties:
              latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: GMLA Latent Rank
                title_es: Rango Latente GMLA
                description: 'Rank of the joint key-value latent `c_KV` cached per token. Kimi K3

                  uses 512. `null` (default) uses `hidden_size // 2`.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Rango del latente clave-valor conjunto `c_KV` cacheado por token.

                  Kimi K3 usa 512. `null` (por defecto) usa `hidden_size // 2`.

                  **Referencias:** (paper: arxiv:2607.24653)'
                examples:
                - 512
              q_lora_rank:
                type:
                - integer
                - 'null'
                default: null
                title: GMLA Query LoRA Rank
                title_es: Rango LoRA de Queries GMLA
                description: 'Query bottleneck width `W_UQ(W_DQ x)`. Kimi K3 uses 1536. `null`

                  (default) skips the low-rank path (a direct query projection).

                  **References:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)'
                description_es: 'Ancho del cuello de botella de queries `W_UQ(W_DQ x)`. Kimi K3 usa

                  1536. `null` (por defecto) omite la ruta low-rank (proyección directa).

                  **Referencias:** (paper: arxiv:2607.24653) (paper: arxiv:2405.04434)'
                examples:
                - 1536
              num_heads:
                type:
                - integer
                - 'null'
                default: null
                title: GMLA Number of Heads
                title_es: Número de Cabezas GMLA
                description: 'Attention-head count, overriding `dims.num_heads`. Kimi K3 uses 96.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Número de cabezas de atención, sobrescribiendo `dims.num_heads`.

                  Kimi K3 usa 96.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 96
              qk_nope_head_dim:
                type: integer
                default: 128
                title: GMLA NoPE Head Width
                title_es: Ancho de Cabeza NoPE GMLA
                description: 'Width of the non-positional (NoPE) key/query slice per head. Kimi K3

                  uses 128.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Ancho de la porción de clave/query no posicional (NoPE) por cabeza.

                  Kimi K3 usa 128.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 128
              qk_rope_head_dim:
                type: integer
                default: 64
                title: GMLA RoPE Head Width
                title_es: Ancho de Cabeza RoPE GMLA
                description: 'Width of the rotary key/query slice per head (unused when

                  `use_nope: true`). Kimi K3 uses 64.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Ancho de la porción rotatoria de clave/query por cabeza (sin uso con

                  `use_nope: true`). Kimi K3 usa 64.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 64
              v_head_dim:
                type: integer
                default: 128
                title: GMLA Value Head Width
                title_es: Ancho de Cabeza de Valores GMLA
                description: 'Value width per head. Kimi K3 uses 128.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Ancho de valores por cabeza. Kimi K3 usa 128.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 128
              use_nope:
                type: boolean
                default: true
                title: GMLA NoPE
                title_es: NoPE GMLA
                description: 'Drop the rotary key/query slice entirely (NoPE). Kimi K3 sets

                  `mla_use_nope: true`, so the latent attention is position-independent

                  and extrapolates to 1M tokens without RoPE retuning.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Elimina por completo la porción rotatoria de clave/query (NoPE).

                  Kimi K3 usa `mla_use_nope: true`, así que la atención latente es

                  independiente de la posición y extrapola a 1M de tokens sin reajustar

                  RoPE.

                  **Referencias:** (paper: arxiv:2607.24653)'
                examples:
                - true
              use_output_gate:
                type: boolean
                default: true
                title: GMLA Output Gate
                title_es: Compuerta de Salida GMLA
                description: 'Apply the full-rank input-dependent output gate `silu(W_g x)`. Kimi

                  K3 enables it.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Aplica la compuerta de salida full-rank dependiente de la entrada

                  `silu(W_g x)`. Kimi K3 la activa.

                  **Referencias:** (paper: arxiv:2607.24653)'
                examples:
                - true
          gqla:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `gqla` (Group-Query Latent Attention): joint KV latent rank, GQA groups and the decoding path. Only applies when `gqla` appears in `layer_pattern`.

              **References:** (paper: arxiv:2605.15250)'
            description_es: 'Hiperparámetros para `gqla` (Group-Query Latent Attention): rango del latente KV conjunto, grupos GQA y la ruta de decodificación. Solo aplica cuando `gqla` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2605.15250)'
            properties:
              latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: GQLA Latent Rank
                title_es: Rango Latente GQLA
                description: 'Rank of the joint KV latent for `gqla` (Group-Query Latent

                  Attention (paper: arxiv:2605.15250)). `null` defaults to `hidden_size // 2`.

                  Only applies when `gqla` is in `layer_pattern`.


                  **References:** (paper: arxiv:2605.15250)'
                description_es: 'Rango del latente KV conjunto para `gqla` (Group-Query Latent

                  Attention (paper: arxiv:2605.15250)). `null` por defecto es `hidden_size // 2`.

                  Solo aplica cuando `gqla` está en `layer_pattern`.


                  **Referencias:** (paper: arxiv:2605.15250)'
                examples:
                - 384
              num_groups:
                type:
                - integer
                - 'null'
                default: null
                title: GQLA Number of Groups
                title_es: Número de Grupos GQLA
                description: 'Number of GQA groups used by the expanded `gqa` decoding path of

                  `gqla`. Must divide `num_heads` evenly. `null` defaults to

                  `num_heads // 4`. Only applies when `gqla` is in `layer_pattern`.


                  **References:** (paper: arxiv:2605.15250)'
                description_es: 'Número de grupos GQA usados por la ruta de decodificación `gqa`

                  expandida de `gqla`. Debe dividir `num_heads`. `null` por

                  defecto es `num_heads // 4`. Solo aplica con `gqla`.


                  **Referencias:** (paper: arxiv:2605.15250)'
                examples:
                - 4
              decode_path:
                type: string
                title: GQLA Decode Path
                title_es: Ruta de Decodificación GQLA
                description: 'Selected decoding path for `gqla`. `"mqa_absorb"` matches MLA''s

                  absorbed MQA form (best for H100-class bandwidth). `"gqa"` expands the

                  latent into per-group full heads (best for commodity GPUs with MTP).

                  Both paths are algebraically equivalent for the forward output.


                  **References:** (paper: arxiv:2605.15250)'
                description_es: 'Ruta de decodificación seleccionada para `gqla`. `"mqa_absorb"`

                  corresponde a la forma MQA absorbida de MLA (mejor para H100).

                  `"gqa"` expande el latente en cabezas completas por grupo (mejor para

                  GPUs commodity con MTP). Ambas rutas son algebraicamente equivalentes.


                  **Referencias:** (paper: arxiv:2605.15250)'
                enum:
                - mqa_absorb
                - gqa
                examples:
                - gqa
          gta:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `gta` (Grouped-head laTenT Attention): head groups sharing one attention map and the value latent rank. Only applies when `gta` appears in `layer_pattern`.

              **References:** (paper: arxiv:2506.17286)'
            description_es: 'Hiperparámetros para `gta` (Grouped-head laTenT Attention): grupos de cabezas que comparten un mapa de atención y el rango del latente de valores. Solo aplica cuando `gta` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2506.17286)'
            properties:
              num_shared_groups:
                type:
                - integer
                - 'null'
                default: null
                title: GTA Shared Groups
                title_es: Grupos Compartidos GTA
                description: 'Number of head groups sharing a single attention map for `gta`

                  (Grouped-head laTenT Attention (paper: arxiv:2506.17286)). Must divide

                  `num_heads`. `null` defaults to `num_heads // 4`. Smaller values =

                  more sharing = smaller key cache.


                  **References:** (paper: arxiv:2506.17286)'
                description_es: 'Número de grupos de cabezas que comparten un único mapa de atención

                  para `gta` (Grouped-head laTenT Attention (paper: arxiv:2506.17286)).

                  Debe dividir `num_heads`. `null` por defecto es `num_heads // 4`.

                  Valores menores = más compartir = menor caché de claves.


                  **Referencias:** (paper: arxiv:2506.17286)'
                examples:
                - 4
              value_latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: GTA Value Latent Rank
                title_es: Rango Latente de Value GTA
                description: 'Rank of the value-cache latent for `gta`. The value cache is

                  compressed by a down-projection and reconstructed by a non-linear

                  (silu) decoder. `null` defaults to `hidden_size // 2`.


                  **References:** (paper: arxiv:2506.17286)'
                description_es: 'Rango del latente del caché de valores para `gta`. El caché de

                  valores se comprime con una proyección de bajada y se reconstruye con

                  un decodificador no lineal (silu). `null` por defecto es

                  `hidden_size // 2`.


                  **Referencias:** (paper: arxiv:2506.17286)'
                examples:
                - 384
          iha:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `iha` (Interleaved Head Attention): number of interleaved pseudo-heads per head. Only applies when `iha` appears in `layer_pattern`.

              **References:** (paper: arxiv:2602.21371)'
            description_es: 'Hiperparámetros para `iha` (Interleaved Head Attention): número de pseudo-cabezas intercaladas por cabeza. Solo aplica cuando `iha` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2602.21371)'
            properties:
              num_pseudo_heads:
                type:
                - integer
                - 'null'
                default: null
                title: IHA Pseudo-Heads
                title_es: Pseudo-Cabezas IHA
                description: 'Number of pseudo-heads `P` per head for `iha` (Interleaved Head

                  Attention (paper: arxiv:2602.21371)). Typically `P = num_heads`. Pseudo

                  Q/K/V are learned linear combinations of all `H` original heads,

                  inducing up to `P**2` attention patterns per head with modest

                  `O(H**2 * P)` parameter overhead. `null` defaults to `num_heads`.


                  **References:** (paper: arxiv:2602.21371)'
                description_es: 'Número de pseudo-cabezas `P` por cabeza para `iha` (Interleaved

                  Head Attention (paper: arxiv:2602.21371)). Típicamente `P = num_heads`. Las

                  pseudo Q/K/V son combinaciones lineales aprendidas de todas las `H`

                  cabezas originales, induciendo hasta `P**2` patrones de atención por

                  cabeza con overhead `O(H**2 * P)`. `null` por defecto es `num_heads`.


                  **Referencias:** (paper: arxiv:2602.21371)'
                examples:
                - 12
          kda:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `kda` (Kimi Delta Attention): head geometry and the

              K3 refinements (input-dependent bounded decay, short convolution and the

              full-rank output gate). Only applies when `kda` appears in

              `layer_pattern`.

              **References:** (paper: arxiv:2510.26692) (paper: arxiv:2607.24653)'
            description_es: 'Hiperparámetros para `kda` (Kimi Delta Attention): geometría de cabezas

              y los refinamientos de K3 (decaimiento acotado dependiente de la entrada,

              convolución corta y compuerta de salida full-rank). Solo aplica cuando

              `kda` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2510.26692) (paper: arxiv:2607.24653)'
            properties:
              num_heads:
                type:
                - integer
                - 'null'
                default: null
                title: KDA Number of Heads
                title_es: Número de Cabezas KDA
                description: 'Attention-head count for `kda`, overriding `dims.num_heads`. KDA may

                  expand the head width beyond `hidden_size` (Kimi K3 uses 96 heads ×

                  128 = 12288 with `hidden_size` 7168). `null` (default) uses

                  `dims.num_heads`.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Número de cabezas de atención para `kda`, sobrescribiendo

                  `dims.num_heads`. KDA puede expandir el ancho de cabeza más allá de

                  `hidden_size` (Kimi K3 usa 96 cabezas × 128 = 12288 con

                  `hidden_size` 7168). `null` (por defecto) usa `dims.num_heads`.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 96
              head_dim:
                type:
                - integer
                - 'null'
                default: null
                title: KDA Head Dimension
                title_es: Dimensión de Cabeza KDA
                description: 'Per-head width for `kda`. `null` (default) uses

                  `hidden_size // num_heads`, which still requires divisibility. Set it

                  explicitly to decouple the head geometry from `hidden_size` (Kimi K3:

                  128).

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Ancho por cabeza para `kda`. `null` (por defecto) usa

                  `hidden_size // num_heads`, lo que sigue exigiendo divisibilidad.

                  Definirlo explícitamente desacopla la geometría de cabezas de

                  `hidden_size` (Kimi K3: 128).

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 128
              decay_mode:
                type: string
                enum:
                - kimilinear
                - k3
                default: kimilinear
                title: KDA Decay Mode
                title_es: Modo de Decaimiento KDA
                description: '`kimilinear` keeps the Kimi Linear log-decay

                  (`exp(base − softplus(delta))`, free parameters). `k3` selects the

                  Kimi K3 input-dependent bounded decay: the logit is a low-rank

                  projection of the input plus a per-head bias, mapped through

                  `g_min·σ(e^{A_h} z)` so retention is bounded below by `exp(g_min)`.

                  **References:** (paper: arxiv:2510.26692) (paper: arxiv:2607.24653)'
                description_es: '`kimilinear` mantiene el log-decay de Kimi Linear

                  (`exp(base − softplus(delta))`, parámetros libres). `k3` selecciona el

                  decaimiento acotado dependiente de la entrada de Kimi K3: el logit es

                  una proyección low-rank de la entrada más un sesgo por cabeza, mapeado

                  por `g_min·σ(e^{A_h} z)`, de modo que la retención queda acotada

                  inferiormente por `exp(g_min)`.

                  **Referencias:** (paper: arxiv:2510.26692) (paper: arxiv:2607.24653)'
                examples:
                - kimilinear
                - k3
              decay_min_log:
                type: number
                default: -5.0
                title: KDA Minimum Log-Decay
                title_es: Log-Decaimiento Mínimo KDA
                description: 'Lower bound `g_min` of the K3 decay logit (only used when

                  `decay_mode=k3`). Kimi K3 uses `−5`, bounding retention below by

                  `e^{−5} ≈ 6.7e−3`. Must be `< 0`.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Cota inferior `g_min` del logit de decaimiento K3 (solo se usa con

                  `decay_mode=k3`). Kimi K3 usa `−5`, acotando la retención por

                  `e^{−5} ≈ 6.7e−3`. Debe ser `< 0`.

                  **Referencias:** (paper: arxiv:2607.24653)'
                maximum: 0
                examples:
                - -5.0
              decay_low_rank:
                type:
                - integer
                - 'null'
                default: null
                title: KDA Decay Low-Rank Width
                title_es: Ancho Low-Rank del Decaimiento KDA
                description: 'Width of the low-rank projection that produces the input-dependent

                  decay logits in `decay_mode=k3`. `null` (default) uses

                  `max(1, hidden_size // 16)`.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Ancho de la proyección low-rank que produce los logits de

                  decaimiento dependientes de la entrada en `decay_mode=k3`. `null`

                  (por defecto) usa `max(1, hidden_size // 16)`.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 128
              short_conv_kernel:
                type: integer
                default: 0
                title: KDA Short Convolution Kernel
                title_es: Kernel de Convolución Corta KDA
                description: 'Depthwise causal short-convolution kernel applied to the input

                  (followed by SiLU) before the Q/K/V projections. Kimi K3 uses `4`;

                  `0` (default) disables it. When enabled, the incremental cache keeps

                  the last `kernel − 1` pre-conv rows.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Kernel de convolución corta causal depthwise aplicado a la entrada

                  (seguido de SiLU) antes de las proyecciones Q/K/V. Kimi K3 usa `4`;

                  `0` (por defecto) lo desactiva. Cuando está activo, el caché

                  incremental conserva las últimas `kernel − 1` filas pre-conv.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 0
                examples:
                - 0
                - 4
              use_full_rank_gate:
                type: boolean
                default: true
                title: KDA Full-Rank Output Gate
                title_es: Compuerta de Salida Full-Rank KDA
                description: 'Use a full-rank input-dependent output gate (`silu(W_g x)`) instead

                  of a per-head scalar gate. Kimi K3 uses the full-rank gate (default).

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Usar una compuerta de salida full-rank dependiente de la entrada

                  (`silu(W_g x)`) en vez de una compuerta escalar por cabeza. Kimi K3

                  usa la compuerta full-rank (por defecto).

                  **Referencias:** (paper: arxiv:2607.24653)'
                examples:
                - true
          lsa:
            type: object
            additionalProperties: false
            title: Latent Sparse Attention
            title_es: Atención Dispersa Latente
            description: 'Hyperparameters for `lsa` (Latent Sparse Attention / Native-LSA

              (paper: arxiv:2610.42147)). Keys are L2-normalised, pooled every

              `pool_size` tokens and Ward-clustered per complete `cluster_block` into

              `cluster_block / keys_per_bucket` buckets whose unit-norm centroids are

              scored per query; the top `num_buckets` buckets expand into

              `num_long_range` long-range keys attended on top of `num_sinks` sink

              keys and a one-block window. N-LSA adds no parameters and trains

              natively on the next-token loss. Only applies when `lsa` appears in

              `layer_pattern`.


              **References:** (paper: arxiv:2610.42147)'
            description_es: 'Hiperparámetros para `lsa` (Atención Dispersa Latente / Native-LSA

              (paper: arxiv:2610.42147)). Las claves se normalizan L2, se agrupan cada

              `pool_size` tokens y se agrupan con Ward por cada `cluster_block`

              completo en `cluster_block / keys_per_bucket` buckets cuyos centroides

              unitarios se puntúan por consulta; los `num_buckets` buckets mejores se

              expanden a `num_long_range` claves de largo alcance que se atienden

              junto a `num_sinks` claves sumidero y una ventana de un bloque. N-LSA no

              añade parámetros y entrena de forma nativa con la pérdida del siguiente

              token. Solo aplica cuando `lsa` aparece en `layer_pattern`.


              **Referencias:** (paper: arxiv:2610.42147)'
            properties:
              num_long_range:
                type: integer
                minimum: 1
                title: LSA Long-Range Keys
                title_es: Claves de Largo Alcance LSA
                description: 'Long-range key budget `k` selected per query in `lsa`

                  (Latent Sparse Attention (paper: arxiv:2610.42147)). The selected

                  buckets are expanded best-first until `k` long-range keys are

                  found; each query additionally attends to `num_sinks` sinks and a

                  one-block window. Paper N-LSA default: 2048 (the D-LSA bucket

                  variants use 4096). Larger budgets improve retrieval at the cost of

                  attention work.


                  **References:** (paper: arxiv:2610.42147)'
                description_es: 'Presupuesto de claves de largo alcance `k` seleccionadas por

                  consulta en `lsa` (Atención Dispersa Latente (paper:

                  arxiv:2610.42147)). Los buckets elegidos se expanden mejor-primero

                  hasta encontrar `k` claves; cada consulta atiende además a

                  `num_sinks` sumideros y una ventana de un bloque. Por defecto en

                  N-LSA: 2048 (las variantes D-LSA usan 4096). Presupuestos mayores

                  mejoran la recuperación a cambio de más cómputo de atención.


                  **Referencias:** (paper: arxiv:2610.42147)'
                default: 2048
                examples:
                - 512
                - 2048
                - 4096
              num_buckets:
                type: integer
                minimum: 1
                title: LSA Buckets per Query
                title_es: Buckets por Consulta LSA
                description: 'Number of buckets `p` scored and selected per query in `lsa`

                  (Latent Sparse Attention (paper: arxiv:2610.42147)). The paper

                  chooses `p` such that `p · pool_size ≥ k`; the runtime raises `p`

                  to `ceil(k / pool_size)` when the configured value is smaller, and

                  clamps it to the number of cached buckets. Paper N-LSA default: 512.


                  **References:** (paper: arxiv:2610.42147)'
                description_es: 'Número de buckets `p` puntuados y seleccionados por consulta en

                  `lsa` (Atención Dispersa Latente (paper: arxiv:2610.42147)). El

                  paper elige `p` de forma que `p · pool_size ≥ k`; en ejecución se

                  eleva `p` a `ceil(k / pool_size)` si el valor configurado es menor,

                  y se recorta al número de buckets en caché. Por defecto en N-LSA:

                  512.


                  **Referencias:** (paper: arxiv:2610.42147)'
                default: 512
                examples:
                - 64
                - 512
                - 1024
              num_sinks:
                type: integer
                minimum: 1
                title: LSA Attention Sinks
                title_es: Sumideros de Atención LSA
                description: 'Number of leading sink tokens `n_sink` that every query always

                  attends to in `lsa` (Latent Sparse Attention (paper:

                  arxiv:2610.42147), building on StreamingLLM (paper: arxiv:2309.17453)).

                  The paper fixes `n_sink = 4` and excludes sinks from the long-range

                  expansion (a selected key already covered by the sink prefix is

                  skipped). Must be at least 1 and smaller than `cluster_block`; sinks

                  are causal-clipped in decoder mode. Only applies when `lsa` is

                  in `layer_pattern`.


                  **References:** (paper: arxiv:2610.42147) (paper: arxiv:2309.17453)'
                description_es: 'Número de tokens sumidero iniciales `n_sink` a los que toda consulta

                  atiende siempre en `lsa` (Atención Dispersa Latente (paper:

                  arxiv:2610.42147), sobre StreamingLLM (paper: arxiv:2309.17453)). El

                  paper fija `n_sink = 4` y excluye los sumideros de la expansión de

                  largo alcance (una clave ya cubierta por el prefijo sumidero se

                  omite). Debe ser al menos 1 y menor que `cluster_block`; los

                  sumideros se recortan de forma causal en modo decoder. Solo aplica

                  cuando `lsa` está en `layer_pattern`.


                  **Referencias:** (paper: arxiv:2610.42147) (paper: arxiv:2309.17453)'
                default: 4
                examples:
                - 4
              pool_size:
                type: integer
                minimum: 1
                title: LSA Pool Size
                title_es: Tamaño de Pool LSA
                description: 'Number of consecutive index keys `n_pool` summed into one pool key

                  before Ward clustering in `lsa` (Latent Sparse Attention

                  (paper: arxiv:2610.42147)). Clustering therefore runs over

                  `T / pool_size` pool keys instead of `T` keys. The paper uses 4, so

                  the bucket cache holds one centroid per `keys_per_bucket` keys.

                  Larger values make clustering cheaper but coarser.


                  **References:** (paper: arxiv:2610.42147)'
                description_es: 'Número de claves índice consecutivas `n_pool` que se suman en una

                  clave de pool antes del clustering Ward en `lsa` (Atención

                  Dispersa Latente (paper: arxiv:2610.42147)). El clustering recorre

                  por tanto `T / pool_size` claves de pool en lugar de `T` claves. El

                  paper usa 4, de modo que la caché de buckets guarda un centroide por

                  cada `keys_per_bucket` claves. Valores mayores abaratan el

                  clustering pero lo hacen más grueso.


                  **Referencias:** (paper: arxiv:2610.42147)'
                default: 4
                examples:
                - 4
                - 8
              cluster_block:
                type: integer
                minimum: 2
                title: LSA Cluster Block
                title_es: Bloque de Clustering LSA
                description: 'Cluster block size `n_cluster` for `lsa` (Latent Sparse

                  Attention (paper: arxiv:2610.42147)). Keys are clustered in

                  consecutive blocks of this size; a query''s own block is not yet

                  clustered and is covered by the window, so this value is also the

                  window length `n_w` ("we set the window to one cluster block").

                  Once a block is complete its buckets never change, which makes

                  incremental decoding exact. Paper default: 512.


                  **References:** (paper: arxiv:2610.42147)'
                description_es: 'Tamaño de bloque de clustering `n_cluster` para `lsa` (Atención

                  Dispersa Latente (paper: arxiv:2610.42147)). Las claves se agrupan en

                  bloques consecutivos de este tamaño; el bloque propio de una consulta

                  aún no está clusterizado y queda cubierto por la ventana, por lo que

                  este valor es también la longitud de ventana `n_w` ("fijamos la

                  ventana a un bloque de clustering"). Una vez completo un bloque sus

                  buckets nunca cambian, lo que hace exacta la decodificación

                  incremental. Por defecto del paper: 512.


                  **Referencias:** (paper: arxiv:2610.42147)'
                default: 512
                examples:
                - 128
                - 512
              keys_per_bucket:
                type: integer
                minimum: 1
                title: LSA Keys per Bucket
                title_es: Claves por Bucket LSA
                description: 'Average number of keys per bucket `n̄_b` in `lsa` (Latent

                  Sparse Attention (paper: arxiv:2610.42147)). Each complete block is

                  Ward-clustered into `m = cluster_block / keys_per_bucket` buckets;

                  with the defaults (512 / 8) every block holds 64 buckets. Must

                  divide `cluster_block`. Paper default: 8.


                  **References:** (paper: arxiv:2610.42147)'
                description_es: 'Número medio de claves por bucket `n̄_b` en `lsa` (Atención

                  Dispersa Latente (paper: arxiv:2610.42147)). Cada bloque completo se

                  agrupa con Ward en `m = cluster_block / keys_per_bucket` buckets; con

                  los valores por defecto (512 / 8) cada bloque contiene 64 buckets.

                  Debe dividir `cluster_block`. Por defecto del paper: 8.


                  **Referencias:** (paper: arxiv:2610.42147)'
                default: 8
                examples:
                - 8
                - 16
              max_keys_per_bucket:
                type: integer
                minimum: 1
                title: LSA Max Keys per Bucket
                title_es: Máximo de Claves por Bucket LSA
                description: 'Maximum number of keys `n_max_b` a bucket may hold in `lsa`

                  (Latent Sparse Attention (paper: arxiv:2610.42147)). Ward merges

                  that would push a bucket above this cap are skipped, which bounds

                  the width of the bucket index table. Must be at least

                  `keys_per_bucket`. Paper default: 16.


                  **References:** (paper: arxiv:2610.42147)'
                description_es: 'Número máximo de claves `n_max_b` que puede contener un bucket en

                  `lsa` (Atención Dispersa Latente (paper: arxiv:2610.42147)). Las

                  fusiones Ward que superarían este límite se omiten, lo que acota el

                  ancho de la tabla de índices del bucket. Debe ser al menos

                  `keys_per_bucket`. Por defecto del paper: 16.


                  **Referencias:** (paper: arxiv:2610.42147)'
                default: 16
                examples:
                - 16
                - 32
          mla:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `mla` (Multi-Head Latent Attention): rank of the joint key-value latent. Only applies when `mla` appears in `layer_pattern`.

              **References:** (paper: arxiv:2506.09342)'
            description_es: 'Hiperparámetros para `mla` (Multi-Head Latent Attention): rango del latente conjunto clave-valor. Solo aplica cuando `mla` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2506.09342)'
            properties:
              latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: MLA Latent Rank
                title_es: Rango Latente MLA
                description: "Rank of the joint key-value latent for `mla` (Multi-Head Latent\nAttention (paper: arxiv:2506.09342)). The paper's Pareto-optimal setting is\n`hidden_size // 2` with RoPE, which halves the KV cache while\nmatching MHA quality. Set to `null` (the default) to use\n`hidden_size // 2`. Only applies when `mla` appears in\n`layer_pattern`.\n\n**Examples explained:**\n- `mla_latent_rank=384` with `hidden_size=768`: half-rank latent, the\n  paper's recommended setting. ~50% KV-cache reduction with negligible\n  quality loss on small models.\n- `mla_latent_rank=192` with `hidden_size=768`: quarter-rank, more\n  aggressive compression. Larger quality impact, useful for very\n  cache-constrained deployment.\n- `mla_latent_rank=null`: defaults to `hidden_size // 2`.\n\n**References:** (paper: arxiv:2506.09342)"
                description_es: 'Rango del latente conjunto clave-valor para `mla` (Multi-Head

                  Latent Attention (paper: arxiv:2506.09342)). La configuración Pareto-óptima del

                  paper es `hidden_size // 2` con RoPE, lo que reduce a la mitad el caché

                  KV manteniendo la calidad de MHA. `null` (por defecto) usa

                  `hidden_size // 2`. Solo aplica cuando `mla` está en `layer_pattern`.


                  **Referencias:** (paper: arxiv:2506.09342)'
                examples:
                - 384
              num_heads:
                type:
                - integer
                - 'null'
                default: null
                title: MLA Number of Heads
                title_es: Número de Cabezas MLA
                description: 'Attention-head count for `mla`, overriding `dims.num_heads`. Kimi K3

                  uses 96 heads. `null` (default) uses `dims.num_heads`.

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Número de cabezas de atención para `mla`, sobrescribiendo

                  `dims.num_heads`. Kimi K3 usa 96 cabezas. `null` (por defecto) usa

                  `dims.num_heads`.

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 96
              head_dim:
                type:
                - integer
                - 'null'
                default: null
                title: MLA Head Dimension
                title_es: Dimensión de Cabeza MLA
                description: 'Per-head width for `mla`. `null` (default) uses

                  `hidden_size // num_heads`. Set it explicitly to decouple the head

                  geometry from `hidden_size` (Kimi K3 MLA head width: 128).

                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Ancho por cabeza para `mla`. `null` (por defecto) usa

                  `hidden_size // num_heads`. Definirlo explícitamente desacopla la

                  geometría de cabezas de `hidden_size` (ancho de cabeza MLA de Kimi K3:

                  128).

                  **Referencias:** (paper: arxiv:2607.24653)'
                minimum: 1
                examples:
                - 128
          mlra:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `mlra` (Multi-Head Low-Rank Attention): total latent rank and number of disjoint latent sub-spaces. Only applies when `mlra` appears in `layer_pattern`.

              **References:** (paper: arxiv:2603.02188)'
            description_es: 'Hiperparámetros para `mlra` (Multi-Head Low-Rank Attention): rango latente total y número de sub-espacios latentes disjuntos. Solo aplica cuando `mlra` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2603.02188)'
            properties:
              latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: MLRA Latent Rank
                title_es: Rango Latente MLRA
                description: 'Total latent rank for `mlra` (Multi-Head Low-Rank Attention,

                  (paper: arxiv:2603.02188)), partitioned across `mlra_num_latent_heads`

                  sub-heads for tensor-parallel decoding. `null` defaults to

                  `hidden_size // 2`. Must be divisible by `mlra_num_latent_heads`.


                  **References:** (paper: arxiv:2603.02188)'
                description_es: 'Rango latente total para `mlra` (Multi-Head Low-Rank Attention,

                  (paper: arxiv:2603.02188)), particionado entre `mlra_num_latent_heads`

                  sub-cabezas para decodificación tensor-paralela. `null` por defecto es

                  `hidden_size // 2`. Debe ser divisible por `mlra_num_latent_heads`.


                  **Referencias:** (paper: arxiv:2603.02188)'
                examples:
                - 384
              num_latent_heads:
                type: integer
                title: MLRA Latent Heads
                title_es: Cabezas Latentes MLRA
                description: 'Number of disjoint latent sub-spaces for `mlra`. Enables

                  partitionable 4-way tensor-parallel decoding (each device loads a

                  disjoint slice). Must divide `mlra_latent_rank` evenly. Default: 4.


                  **References:** (paper: arxiv:2603.02188)'
                description_es: 'Número de sub-espacios latentes disjuntos para `mlra`. Habilita

                  decodificación tensor-paralela de 4 vías (cada dispositivo carga un

                  slice disjunto). Debe dividir `mlra_latent_rank`. Por defecto: 4.


                  **Referencias:** (paper: arxiv:2603.02188)'
                examples:
                - 4
          msa:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `msa` (MiniMax Sparse Attention): block size, top-k block selection, Index Branch dimension and its KL alignment loss. Only applies when `msa` appears in `layer_pattern`.

              **References:** (paper: arxiv:2606.13392)'
            description_es: 'Hiperparámetros para `msa` (MiniMax Sparse Attention): tamaño de bloque, selección top-k de bloques, dimensión de la rama índice y su pérdida de alineación KL. Solo aplica cuando `msa` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2606.13392)'
            properties:
              block_size:
                type: integer
                title: MSA Block Size
                title_es: Tamaño de Bloque MSA
                description: 'Block size `B_k` for `msa` (MiniMax Sparse Attention,

                  (paper: arxiv:2606.13392)). Tokens are partitioned into contiguous blocks of

                  this size; the Index Branch scores blocks and the Main Branch

                  attends to selected blocks. Paper default: 128.


                  **References:** (paper: arxiv:2606.13392)'
                description_es: 'Tamaño de bloque `B_k` para `msa` (MiniMax Sparse Attention,

                  (paper: arxiv:2606.13392)). Los tokens se particionan en bloques contiguos de

                  este tamaño; la rama índice puntúa bloques y la rama principal atiende

                  a los seleccionados. Por defecto del paper: 128.


                  **Referencias:** (paper: arxiv:2606.13392)'
                examples:
                - 128
              topk_blocks:
                type: integer
                title: MSA Top-k Blocks
                title_es: Top-k Bloques MSA
                description: 'Number of blocks selected per GQA group per query for `msa`.

                  The block containing the query is always forced into the selected

                  set. Paper default: 16 (giving a fixed 2048-token budget per

                  query at `block_size=128`).


                  **References:** (paper: arxiv:2606.13392)'
                description_es: 'Número de bloques seleccionados por grupo GQA por consulta para

                  `msa`. El bloque que contiene la consulta siempre se incluye.

                  Por defecto del paper: 16 (presupuesto fijo de 2048 tokens por

                  consulta con `block_size=128`).


                  **Referencias:** (paper: arxiv:2606.13392)'
                examples:
                - 16
              index_dim:
                type: integer
                title: MSA Index Head Dim
                title_es: Dim de Cabeza Índice MSA
                description: 'Dimensionality `d_idx` of the Index Branch heads for `msa`.

                  Constraint: `num_kv_heads * d_idx << num_heads * head_dim`. Default:

                  64. The exact value is an appendix hyperparameter in the paper.


                  **References:** (paper: arxiv:2606.13392)'
                description_es: 'Dimensionalidad `d_idx` de las cabezas de la rama índice para

                  `msa`. Restricción: `num_kv_heads * d_idx << num_heads *

                  head_dim`. Por defecto: 64.


                  **Referencias:** (paper: arxiv:2606.13392)'
                examples:
                - 64
              kl_loss_weight:
                type: number
                title: MSA KL Loss Weight
                title_es: Peso de Pérdida KL MSA
                description: 'Weight `lambda` of the KL alignment loss that trains the Index Branch

                  of `msa`. Set to 0 to disable (Index Branch then only learns via

                  the indexer warmup). The paper leaves the exact value to appendix

                  ablations. Default: 0.0.


                  **References:** (paper: arxiv:2606.13392)'
                description_es: 'Peso `lambda` de la pérdida de alineación KL que entrena la rama

                  índice de `msa`. 0 para deshabilitar. El paper deja el valor

                  exacto a ablacions del apéndice. Por defecto: 0.0.


                  **Referencias:** (paper: arxiv:2606.13392)'
                examples:
                - 0.0
          mtla:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `mtla` (Multi-head Temporal Latent Attention): feature-axis latent rank plus the temporal KV merge factor and stride. Only applies when `mtla` appears in `layer_pattern`.

              **References:** (paper: arxiv:2505.13544)'
            description_es: 'Hiperparámetros para `mtla` (Multi-head Temporal Latent Attention): rango latente del eje de características más el factor y el stride de fusión temporal de KV. Solo aplica cuando `mtla` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2505.13544)'
            properties:
              latent_rank:
                type:
                - integer
                - 'null'
                default: null
                title: MTLA Latent Rank
                title_es: Rango Latente MTLA
                description: 'Latent rank along the feature axis for `mtla` (Multi-head

                  Temporal Latent Attention (paper: arxiv:2505.13544)). `null` defaults to

                  `hidden_size // 2`.


                  **References:** (paper: arxiv:2505.13544)'
                description_es: 'Rango latente a lo largo del eje de features para `mtla`

                  (Multi-head Temporal Latent Attention (paper: arxiv:2505.13544)). `null` por

                  defecto es `hidden_size // 2`.


                  **Referencias:** (paper: arxiv:2505.13544)'
                examples:
                - 384
              merge_factor:
                type: integer
                title: MTLA Merge Factor
                title_es: Factor de Fusión MTLA
                description: 'Number of consecutive KV cache entries merged into a single

                  temporal slot for `mtla`. Shrinks the temporal length by this

                  factor. Must be >= 1. Default: 2.


                  **References:** (paper: arxiv:2505.13544)'
                description_es: 'Número de entradas consecutivas del caché KV fusionadas en un único

                  slot temporal para `mtla`. Reduce la longitud temporal por este

                  factor. Debe ser >= 1. Por defecto: 2.


                  **Referencias:** (paper: arxiv:2505.13544)'
                examples:
                - 2
              stride:
                type:
                - integer
                - 'null'
                default: null
                title: MTLA Stride
                title_es: Stride MTLA
                description: 'Stride between merged temporal slots for `mtla`. `null`

                  defaults to `mtla_merge_factor`. Smaller stride = overlapping

                  windows; larger stride = non-overlapping.


                  **References:** (paper: arxiv:2505.13544)'
                description_es: 'Stride entre slots temporales fusionados para `mtla`. `null`

                  por defecto es `mtla_merge_factor`. Stride menor = ventanas

                  superpuestas; stride mayor = no superpuestas.


                  **Referencias:** (paper: arxiv:2505.13544)'
                examples:
                - 2
          ode:
            type: object
            additionalProperties: false
            title: ODE Layer
            title_es: Capa ODE
            description: 'Configuration for the continuous-depth `ode` mixer. Only applies when `ode`

              appears in `model.dims.layer_pattern`. This mirrors the per-mixer layout used

              by every other configurable mixer.


              **References:** (paper: arxiv:1906.02762) (paper:

              https://ojs.aaai.org/index.php/AAAI/article/view/17692)'
            description_es: 'Configuración del mixer `ode` de profundidad continua. Solo aplica cuando

              `ode` aparece en `model.dims.layer_pattern`. Refleja el layout por mixer

              usado por el resto de mixers configurables.


              **Referencias:** (paper: arxiv:1906.02762) (paper:

              https://ojs.aaai.org/index.php/AAAI/article/view/17692)'
            properties:
              solver:
                type: string
                title: ODE Solver
                title_es: Solucionador ODE
                description: "Numerical integration method:\n- `rk4`: Runge-Kutta 4th order — higher accuracy and stability, 4× the\n  cost of `euler`.\n- `euler`: Euler method — faster, may require smaller `steps` or careful\n  tuning.\n\n**References:** (paper: arxiv:1906.02762) (paper:\nhttps://ojs.aaai.org/index.php/AAAI/article/view/17692)"
                description_es: "Método de integración numérica:\n- `rk4`: Runge-Kutta de orden 4 — mayor precisión y estabilidad, 4× el\n  costo de `euler`.\n- `euler`: Método de Euler — más rápido, puede requerir `steps` menores o\n  ajuste cuidadoso.\n\n**Referencias:** (paper: arxiv:1906.02762) (paper:\nhttps://ojs.aaai.org/index.php/AAAI/article/view/17692)"
                enum:
                - rk4
                - euler
                default: rk4
                examples:
                - rk4
                - euler
              steps:
                type: integer
                minimum: 1
                title: ODE Integration Steps
                title_es: Pasos de Integración ODE
                description: 'Number of integration steps between consecutive transformer layers.

                  Typical: 2–4. More steps improve the continuous-dynamics approximation at

                  linear compute cost; `rk4` usually needs fewer than `euler`.


                  **References:** (paper: arxiv:1906.02762) (paper:

                  https://ojs.aaai.org/index.php/AAAI/article/view/17692)'
                description_es: 'Número de pasos de integración entre capas transformer consecutivas.

                  Típico: 2–4. Más pasos mejoran la aproximación de dinámicas continuas con

                  costo lineal; `rk4` suele necesitar menos que `euler`.


                  **Referencias:** (paper: arxiv:1906.02762) (paper:

                  https://ojs.aaai.org/index.php/AAAI/article/view/17692)'
                default: 2
                examples:
                - 2
                - 4
          retnet:
            type: object
            additionalProperties: false
            title: RetNet / Retention
            title_es: RetNet / Retención
            description: 'Configuration for the `retnet` retention mixer. Only applies

              when either appears in `model.dims.layer_pattern`.


              **References:** (paper: arxiv:2307.08621) (paper: arxiv:2506.06708)'
            description_es: 'Configuración del mixer de retención `retnet`. Solo aplica

              cuando alguno aparece en `model.dims.layer_pattern`.


              **Referencias:** (paper: arxiv:2307.08621) (paper: arxiv:2506.06708)'
            properties:
              heads:
                type: integer
                minimum: 1
                title: Retention Heads
                title_es: Cabezas de Retención
                description: 'Number of retention heads. Must divide `dims.hidden_size` evenly. Only

                  affects `retnet` layers; usually set equal to

                  `dims.num_heads`.


                  **References:** (paper: arxiv:2307.08621)'
                description_es: 'Número de cabezas de retención. Debe dividir `dims.hidden_size`

                  exactamente. Solo afecta capas `retnet`; normalmente se

                  iguala a `dims.num_heads`.


                  **Referencias:** (paper: arxiv:2307.08621)'
                default: 8
                examples:
                - 8
                - 12
          sparda:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `sparda` (SparDA): KV block size, top-k block selection and the Forecast projection dimension. Only applies when `sparda` appears in `layer_pattern`.

              **References:** (paper: arxiv:2606.04511)'
            description_es: 'Hiperparámetros para `sparda` (SparDA): tamaño de bloque KV, selección top-k de bloques y la dimensión de la proyección Forecast. Solo aplica cuando `sparda` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2606.04511)'
            properties:
              block_size:
                type: integer
                title: SparDA Block Size
                title_es: Tamaño de Bloque SparDA
                description: 'KV block size for `sparda` (SparDA (paper: arxiv:2606.04511)). The

                  Forecast projection scores blocks of this size. Default: 128.


                  **References:** (paper: arxiv:2606.04511)'
                description_es: 'Tamaño de bloque KV para `sparda` (SparDA (paper: arxiv:2606.04511)). La

                  proyección Forecast puntúa bloques de este tamaño. Por defecto: 128.


                  **Referencias:** (paper: arxiv:2606.04511)'
                examples:
                - 128
              topk_blocks:
                type: integer
                title: SparDA Top-k Blocks
                title_es: Top-k Bloques SparDA
                description: 'Number of KV blocks selected per GQA group per query for

                  `sparda`. Default: 16.


                  **References:** (paper: arxiv:2606.04511)'
                description_es: 'Número de bloques KV seleccionados por grupo GQA por consulta para

                  `sparda`. Por defecto: 16.


                  **Referencias:** (paper: arxiv:2606.04511)'
                examples:
                - 16
              forecast_dim:
                type: integer
                title: SparDA Forecast Dim
                title_es: Dim de Forecast SparDA
                description: 'Dimensionality of the Forecast projection for `sparda`. One

                  Forecast head per GQA group. Default: 64.


                  **References:** (paper: arxiv:2606.04511)'
                description_es: 'Dimensionalidad de la proyección Forecast para `sparda`. Una

                  cabeza Forecast por grupo GQA. Por defecto: 64.


                  **Referencias:** (paper: arxiv:2606.04511)'
                examples:
                - 64
          ssog:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `ssog` (SSOG): Gaussian atoms per head, content steering, token grid geometry and numerical floors. Only applies when `ssog` appears in `layer_pattern`.

              **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
            description_es: 'Hiperparámetros para `ssog` (SSOG): átomos Gaussianos por cabeza, dirección por contenido, geometría de la cuadrícula de tokens y pisos numéricos. Solo aplica cuando `ssog` aparece en `layer_pattern`.

              **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
            properties:
              num_atoms:
                type: integer
                title: SSOG Gaussian Atoms per Head
                title_es: Atomos Gaussianos SSOG por Cabeza
                description: "Number `R` of Gaussian atoms per head for `ssog`\n(Separable Sum of Gaussians attention, Pisoni 2026,\nhttps://www.pisoni.ai/posts/ssog/). Each atom is five numbers\n(mu_y, mu_x, sigma_y, sigma_x, lambda) defining a 2D Gaussian\nover relative position. The field applies as two 1D filter\npasses per atom, so the `N x N` attention matrix never exists\nand cost scales as `O(R * N * sqrt(N) * d)`. Only applies when\n`ssog` appears in `layer_pattern`.\n\n**Examples explained:**\n- `num_atoms=4`: default and the recipe's sweet spot at small\n  scale. Four deformable blobs per head; strong accuracy at\n  negligible parameter cost (20 numbers per head).\n- `num_atoms=1`: the minimal mechanism. A single deformable\n  blob per head loses only ~0.7 points on CIFAR-100 in the\n  reference recipe — a good first ablation.\n- `num_atoms=8`: more geometric capacity; \"showing off\" at\n  small scale, but larger models may put more atoms to work.\n\n**References:** (paper: https://www.pisoni.ai/posts/ssog/)"
                description_es: "Numero `R` de atomos Gaussianos por cabeza para `ssog`\n(Separable Sum of Gaussians, Pisoni 2026,\nhttps://www.pisoni.ai/posts/ssog/). Cada atomo son cinco\nnumeros (mu_y, mu_x, sigma_y, sigma_x, lambda) que definen una\nGaussiana 2D sobre posicion relativa. El campo se aplica como\ndos pasadas de filtro 1D por atomo, por lo que la matriz de\natencion `N x N` nunca existe y el costo escala como\n`O(R * N * sqrt(N) * d)`. Solo aplica cuando `ssog`\naparece en `layer_pattern`.\n\n**Ejemplos explicados:**\n- `num_atoms=4`: por defecto y punto optimo de la receta a\n  escala pequena. Cuatro blobs deformables por cabeza; buena\n  precision a costo de parametros insignificante (20 numeros\n  por cabeza).\n- `num_atoms=1`: el mecanismo minimo. Un solo blob deformable\n  por cabeza pierde solo ~0.7 puntos en CIFAR-100 con la receta\n  de referencia — buena primera ablacion.\n- `num_atoms=8`: mas capacidad geometrica; \"presumir\" a escala\n  pequena, aunque modelos\
                  \ mayores pueden aprovechar mas atomos.\n\n**Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)"
                examples:
                - 4
              lookat:
                type: boolean
                title: SSOG Content Steering
                title_es: Direccionamiento por Contenido SSOG
                description: 'Enable content-conditioned steering for `ssog`: tiny

                  zero-initialized linear probes predict bounded per-token

                  residuals on the atom centers (mu), widths (sigma) and mixture

                  weights (lambda) behind cold-started gates. Content never

                  scores content — it only deforms the field. `false` gives the

                  purely fixed, content-blind geometric field (still competitive:

                  within ~1 point of SDPA on ImageNet-1k in the reference

                  recipe). Steering closes the gap and beats SDPA at small scale.


                  **Impact:** On ImageNet-1k (matched recipe) the fixed field

                  scores ~1 point behind dot-product attention; mu-steering alone

                  matches it; full steering (mu+sigma+lambda) beats it by ~0.9.

                  On small grids (e.g. CIFAR at 16x16) steering is roughly

                  neutral — the fixed field already covers everything worth

                  covering.


                  **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
                description_es: 'Habilita el direccionamiento por contenido para `ssog`:

                  pequenas sondas lineales inicializadas en cero predicen

                  residuos acotados por token sobre los centros de los atomos

                  (mu), anchos (sigma) y pesos de mezcla (lambda), detras de

                  compuertas de arranque en frio. El contenido nunca puntua al

                  contenido — solo deforma el campo. `false` da el campo

                  geometrico puro, ciego al contenido (aun competitivo: a ~1

                  punto de SDPA en ImageNet-1k con la receta de referencia). El

                  direccionamiento cierra la brecha y supera a SDPA a escala

                  pequena.


                  **Impacto:** En ImageNet-1k (receta igualada) el campo fijo

                  queda ~1 punto por debajo de la atencion de producto punto;

                  solo dirigir mu la iguala; el direccionamiento completo

                  (mu+sigma+lambda) la supera por ~0.9. En rejillas pequenas

                  (p.ej. CIFAR a 16x16) el direccionamiento es casi neutral — el

                  campo fijo ya cubre todo lo relevante.


                  **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
                examples:
                - true
                - false
              max_offset:
                type: number
                title: SSOG Max Steering Offset (grid cells)
                title_es: Desplazamiento Maximo SSOG (celdas de rejilla)
                description: 'Bound on per-token mu travel for `ssog` steering, in grid

                  cells. Residuals pass through `tanh`, so centers move at most

                  `+/- max_offset` cells from the shared field. Must be > 0.


                  **Impact:** The mechanism knows its regime: small grids want

                  small offsets (+/-1-2 cells won on CIFAR''s 32x32 images,

                  nowhere to travel) while 224^2 ImageNet wanted the full +/-4.

                  Zero-shot resolution transfer degrades once the evaluation grid

                  is much larger than the training grid and the offset bound

                  can no longer reach distant content.


                  **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
                description_es: 'Cota del desplazamiento por token de mu para el

                  direccionamiento `ssog`, en celdas de rejilla. Los

                  residuos pasan por `tanh`, asi que los centros se mueven como

                  maximo `+/- max_offset` celdas respecto al campo compartido.

                  Debe ser > 0.


                  **Impacto:** El mecanismo conoce su regimen: rejillas pequenas

                  quieren offsets pequenos (+/-1-2 celdas ganaron en imagenes

                  32x32 de CIFAR, no hay a donde ir) mientras que ImageNet a

                  224^2 queria el +/-4 completo. La transferencia de resolucion

                  zero-shot degrada cuando la rejilla de evaluacion es mucho

                  mayor que la de entrenamiento y la cota de offset ya no alcanza

                  el contenido lejano.


                  **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
                examples:
                - 4.0
                - 2.0
              cold_init:
                type: boolean
                title: SSOG Cold-Start Gates
                title_es: Compuertas de Arranque en Frio SSOG
                description: 'Start the `ssog` steering gates at ~0 (softplus(-8) ~=

                  3e-4) so the model begins life as a frozen geometric field and

                  learns how far to open each content tap. `false` warm-starts

                  the gates (softplus(-2) ~= 0.13).


                  **Impact:** The cold start matters: warm-init gates lose ~1.1

                  points on CIFAR-100 in the reference recipe. Starting

                  geometric and learning to listen to content beats doing both

                  from scratch.


                  **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
                description_es: 'Inicia las compuertas de direccionamiento `ssog` en ~0

                  (softplus(-8) ~= 3e-4) para que el modelo arranque como un

                  campo geometrico congelado y aprenda cuanto abrir cada toma de

                  contenido. `false` arranca las compuertas en caliente

                  (softplus(-2) ~= 0.13).


                  **Impacto:** El arranque en frio importa: inicializar las

                  compuertas en caliente pierde ~1.1 puntos en CIFAR-100 con la

                  receta de referencia. Empezar geometrico y aprender a escuchar

                  al contenido supera hacer ambos desde cero.


                  **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
                examples:
                - true
                - false
              sigma_floor:
                type: number
                title: SSOG Minimum Atom Width (grid cells)
                title_es: Ancho Minimo de Atomo SSOG (celdas de rejilla)
                description: 'Minimum Gaussian atom width for `ssog`, in grid cells.

                  Widths are reparametrized as `sigma = softplus(raw) + eps +

                  sigma_floor`, guaranteeing strictly positive widths during

                  gradient training. Must be >= 0.


                  **Impact:** Larger floors forbid razor-thin atoms (the field

                  stays smooth and translation-invariant); smaller floors allow

                  tight, convolution-like blobs around the query in early

                  layers. Default 0.25 follows the reference recipe.


                  **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
                description_es: 'Ancho minimo de los atomos Gaussianos para `ssog`, en

                  celdas de rejilla. Los anchos se reparametrizan como

                  `sigma = softplus(raw) + eps + sigma_floor`, garantizando

                  anchos estrictamente positivos durante el entrenamiento por

                  gradiente. Debe ser >= 0.


                  **Impacto:** Pisos mayores prohiben atomos filosos (el campo

                  se mantiene suave e invariante a traslacion); pisos menores

                  permiten blobs ajustados tipo convolucion alrededor del query

                  en capas tempranas. El por defecto 0.25 sigue la receta de

                  referencia.


                  **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
                examples:
                - 0.25
              grid_h:
                type:
                - integer
                - 'null'
                title: SSOG Grid Rows
                title_es: Filas de Rejilla SSOG
                description: 'Rows of the token grid the `ssog` field is defined over.

                  Tokens must be the row-major raster of `grid_h x grid_w`.

                  `null` (default) derives `image_height // patch_size` — the

                  right choice for `frankenstein_vit`. For non-vision grids set

                  it explicitly; `grid_h=1` degenerates naturally to a 1D

                  positional-field attention over sequences.


                  **Impact:** The field lives on coordinates, not token indices,

                  so SSOG transfers zero-shot to other resolutions — but the

                  sequence length must always equal `grid_h * grid_w` (a

                  mismatch raises a clear runtime error).


                  **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
                description_es: 'Filas de la rejilla de tokens sobre la que se define el campo

                  `ssog`. Los tokens deben ser el raster row-major de

                  `grid_h x grid_w`. `null` (por defecto) deriva

                  `image_height // patch_size` — la eleccion correcta para

                  `frankenstein_vit`. Para rejillas no visuales debe fijarse

                  explicitamente; `grid_h=1` degenera naturalmente en una

                  atencion de campo posicional 1D sobre secuencias.


                  **Impacto:** El campo vive en coordenadas, no en indices de

                  token, asi que SSOG transfiere zero-shot a otras resoluciones

                  — pero la longitud de secuencia siempre debe igualar

                  `grid_h * grid_w` (un desajuste lanza un error claro en

                  ejecucion).


                  **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
                examples:
                - null
                - 1
              grid_w:
                type:
                - integer
                - 'null'
                title: SSOG Grid Columns
                title_es: Columnas de Rejilla SSOG
                description: 'Columns of the token grid the `ssog` field is defined

                  over. `null` (default) derives `image_width // patch_size`.

                  For non-vision grids set it explicitly (e.g. the maximum

                  sequence length for a 1D `grid_h=1` configuration).


                  **Impact:** Together with `grid_h` this fixes the raster the

                  Gaussian atoms are evaluated on; the per-query steering

                  kernels scale with the grid, not with `N^2`.


                  **References:** (paper: https://www.pisoni.ai/posts/ssog/)'
                description_es: 'Columnas de la rejilla de tokens sobre la que se define el

                  campo `ssog`. `null` (por defecto) deriva

                  `image_width // patch_size`. Para rejillas no visuales debe

                  fijarse explicitamente (p.ej. la longitud maxima de secuencia

                  para una configuracion 1D con `grid_h=1`).


                  **Impacto:** Junto con `grid_h` fija el raster sobre el que se

                  evaluan los atomos Gaussianos; los kernels de direccionamiento

                  por query escalan con la rejilla, no con `N^2`.


                  **Referencias:** (paper: https://www.pisoni.ai/posts/ssog/)'
                examples:
                - null
                - 128
          swa:
            type: object
            additionalProperties: false
            title: Sliding Window Attention with Sinks
            title_es: Atención de Ventana Deslizante con Sumideros
            description: 'Hyperparameters for `swa` (Sliding Window Attention with

              attention sinks (paper: arxiv:2608.28444)). Every query attends to the first

              `num_sinks` tokens (the attention sinks) plus the `window_size -

              num_sinks` most recent tokens; the mechanism is a pure attention-mask

              change with no extra parameters. In decoder mode the pattern is causal

              (paper-exact); in encoder mode the local window is symmetric around the

              query. Only applies when `swa` appears in `layer_pattern`.


              **References:** (paper: arxiv:2608.28444) (paper: arxiv:2309.17453)'
            description_es: 'Hiperparámetros para `swa` (Atención de Ventana Deslizante con

              sumideros de atención (paper: arxiv:2608.28444)). Cada consulta atiende a los

              primeros `num_sinks` tokens (los sumideros de atención) más los

              `window_size - num_sinks` tokens más recientes; el mecanismo es un

              cambio puro de máscara de atención sin parámetros extra. En modo

              decoder el patrón es causal (exacto al paper); en modo encoder la

              ventana local es simétrica alrededor de la consulta. Solo aplica cuando

              `swa` aparece en `layer_pattern`.


              **Referencias:** (paper: arxiv:2608.28444) (paper: arxiv:2309.17453)'
            properties:
              window_size:
                type: integer
                minimum: 2
                title: SWA Window Size
                title_es: Tamaño de Ventana SWA
                description: "Total number of tokens `w` each query can attend to in `swa`\n(paper: arxiv:2608.28444), including the `num_sinks` sink tokens. The\nsliding part therefore spans `window_size - num_sinks` tokens. The\npaper evaluates `w` in `{64, 128, 256, 512}` and keeps the sinks\nfixed at 4. Larger windows improve generative and long-context\ntasks while increasing KV-cache memory and per-token compute;\nsmaller windows are faster and cheaper but collapse on generative\nreasoning. Must be at least 2 and strictly greater than\n`num_sinks`. Only applies when `swa` is in `layer_pattern`.\n\n**Examples explained:**\n- `window_size=64`: paper's headline setting for log-likelihood\n  benchmarks (MMLU, ARC, HellaSwag, PIQA, WinoGrande); lowest\n  memory and fastest decoding, but collapses on GSM8K.\n- `window_size=256`: balanced default. Good long-context behaviour\n  (BABILong) at moderate memory, matching the LoLCATs fused-kernel\n  window.\n- `window_size=512`: paper's best average\
                  \ for generative math/code\n  (GSM8K, HumanEval) and long-context (RULER, LongBench) tasks;\n  the largest evaluated window and the most memory-hungry.\n\n**References:** (paper: arxiv:2608.28444)"
                description_es: "Número total de tokens `w` a los que cada consulta puede atender en\n`swa` (paper: arxiv:2608.28444), incluidos los `num_sinks` tokens\nsumidero. La parte deslizante abarca por tanto `window_size -\nnum_sinks` tokens. El paper evalúa `w` en `{64, 128, 256, 512}` y\nmantiene los sumideros fijos en 4. Ventanas mayores mejoran las\ntareas generativas y de contexto largo a costa de más memoria de\ncaché KV y cómputo por token; ventanas menores son más rápidas y\nbaratas pero colapsan en razonamiento generativo. Debe ser al menos\n2 y estrictamente mayor que `num_sinks`. Solo aplica cuando\n`swa` está en `layer_pattern`.\n\n**Ejemplos explicados:**\n- `window_size=64`: ajuste principal del paper para benchmarks de\n  verosimilitud (MMLU, ARC, HellaSwag, PIQA, WinoGrande); mínima\n  memoria y decodificación más rápida, pero colapsa en GSM8K.\n- `window_size=256`: valor por defecto equilibrado. Buen\n  comportamiento en contexto largo (BABILong) con memoria\n  moderada,\
                  \ equivalente a la ventana del kernel fusionado de\n  LoLCATs.\n- `window_size=512`: mejor promedio del paper para tareas\n  generativas de matemáticas/código (GSM8K, HumanEval) y de\n  contexto largo (RULER, LongBench); la ventana evaluada más grande\n  y la que más memoria consume.\n\n**Referencias:** (paper: arxiv:2608.28444)"
                default: 256
                examples:
                - 64
                - 256
                - 512
              num_sinks:
                type: integer
                minimum: 1
                title: SWA Attention Sinks
                title_es: Sumideros de Atención SWA
                description: 'Number of leading sink tokens `s` that every query always attends

                  to in `swa` (paper: arxiv:2608.28444). Attention sinks are the first

                  few tokens transformers learn to use as repositories for unused

                  attention mass; excluding them from the mask causes a catastrophic

                  quality drop once they leave the sliding window. The paper fixes

                  `s = 4` across all experiments. Must be at least 1 and strictly

                  smaller than `window_size`. In decoder mode sinks are causal-clipped

                  (early queries never see future sinks). Only applies when `swa`

                  is in `layer_pattern`.


                  **Impact:** Increasing `s` gives the model more global "dump"

                  capacity and marginally helps long-context retrieval, at the cost

                  of a smaller effective sliding window for the same `window_size`.

                  Reducing `s` to 1 or 2 weakens the sink mechanism; setting it to 0

                  is not allowed because sink-free SWA fails catastrophically.


                  **References:** (paper: arxiv:2309.17453)'
                description_es: 'Número de tokens sumidero iniciales `s` a los que toda consulta

                  atiende siempre en `swa` (paper: arxiv:2608.28444). Los sumideros de

                  atención son los primeros tokens que los transformers aprenden a

                  usar como repositorios de la masa de atención no utilizada;

                  excluirlos de la máscara provoca una caída catastrófica de calidad

                  en cuanto salen de la ventana deslizante. El paper fija `s = 4` en

                  todos los experimentos. Debe ser al menos 1 y estrictamente menor

                  que `window_size`. En modo decoder los sumideros se recortan de

                  forma causal (las consultas tempranas nunca ven sumideros futuros).

                  Solo aplica cuando `swa` está en `layer_pattern`.


                  **Impacto:** Aumentar `s` da al modelo más capacidad global de

                  "descarga" y ayuda marginalmente a la recuperación en contexto

                  largo, a costa de una ventana deslizante efectiva menor para el

                  mismo `window_size`. Reducir `s` a 1 o 2 debilita el mecanismo de

                  sumideros; fijarlo a 0 no está permitido porque la SWA sin

                  sumideros falla catastróficamente.


                  **Referencias:** (paper: arxiv:2309.17453)'
                default: 4
                examples:
                - 4
          tucker:
            type: object
            additionalProperties: false
            description: 'Hyperparameters for `tucker` (Tucker Attention): ranks of the Tucker factorization for the query, key and value weight tensors. Only applies when `tucker` appears in `layer_pattern`.

              **References:** (paper: arxiv:2603.30033)'
            description_es: 'Hiperparámetros para `tucker` (Tucker Attention): rangos de la factorización Tucker de los tensores de pesos de query, key y value. Solo aplica cuando `tucker` aparece en `layer_pattern`.

              **Referencias:** (paper: arxiv:2603.30033)'
            properties:
              query_rank:
                type:
                - integer
                - 'null'
                default: null
                title: Tucker Query Rank
                title_es: Rango de Query Tucker
                description: 'Tucker rank along the hidden axis for the query weight tensor of

                  `tucker` (paper: arxiv:2603.30033). `null` defaults to `hidden_size`

                  (recovers MHA query rank). Special cases: MHA = `hidden_size`;

                  MLA = latent rank.


                  **References:** (paper: arxiv:2603.30033)'
                description_es: 'Rango Tucker a lo largo del eje oculto para el tensor de pesos de

                  query de `tucker` (paper: arxiv:2603.30033). `null` por defecto es

                  `hidden_size` (recupera el rango de query de MHA).


                  **Referencias:** (paper: arxiv:2603.30033)'
                examples:
                - 768
              key_rank:
                type:
                - integer
                - 'null'
                default: null
                title: Tucker Key Rank
                title_es: Rango de Key Tucker
                description: 'Tucker rank for the key weight tensor of `tucker`. `null`

                  defaults to `hidden_size // 2`. Setting `key_rank = value_rank =

                  hidden_size` recovers MHA; setting both to a small latent rank

                  recovers MLA.


                  **References:** (paper: arxiv:2603.30033)'
                description_es: 'Rango Tucker para el tensor de pesos de key de `tucker`. `null`

                  por defecto es `hidden_size // 2`. Igualar `key_rank = value_rank =

                  hidden_size` recupera MHA; igualar ambos a un rango latente pequeño

                  recupera MLA.


                  **Referencias:** (paper: arxiv:2603.30033)'
                examples:
                - 384
              value_rank:
                type:
                - integer
                - 'null'
                default: null
                title: Tucker Value Rank
                title_es: Rango de Value Tucker
                description: 'Tucker rank for the value weight tensor of `tucker`. `null`

                  defaults to `hidden_size // 2`. See `tucker_key_rank` for the

                  MHA/MLA special cases.


                  **References:** (paper: arxiv:2603.30033)'
                description_es: 'Rango Tucker para el tensor de pesos de value de `tucker`. `null`

                  por defecto es `hidden_size // 2`. Ver `tucker_key_rank` para los

                  casos especiales MHA/MLA.


                  **Referencias:** (paper: arxiv:2603.30033)'
                examples:
                - 384
      moe:
        type: object
        additionalProperties: false
        title: Mixture of Experts (MoE)
        title_es: Mezcla de Expertos (MoE)
        description: "Mixture-of-Experts configuration. When enabled, the standard FFN is replaced\nby a router that selects `top_k` of `num_experts` specialised sub-networks\nfor each token, scaling model capacity without a proportional compute\nincrease (only the selected experts run).\n\nThe block is organised in seven sub-blocks, mirroring the anatomy of an MoE\nlayer: `router` (logits → weights), `routing` (who selects the experts),\n`balancing` (load across experts), `shared` (always-on experts), `latent`\n(experts in a smaller latent space), `layout` (which layers are MoE) and\n`experts` (the expert FFN itself).\n\n**Examples explained:**\n- `enabled: false`: standard dense FFN. Every token passes through the same\n  network. Predictable, no routing overhead; the right default below ~100M\n  parameters.\n- `enabled: true, num_experts: 4, top_k: 1`: 4× total FFN capacity for ~1×\n  compute (plus routing). The router learns to specialise experts.\n- `enabled: true, num_experts: 8, top_k:\
          \ 2`: more capacity and compute,\n  harder to train — requires load balancing to avoid expert collapse.\n\n**References:** (paper: arxiv:2407.06204) (paper: arxiv:2103.16716)"
        description_es: "Configuración de Mezcla de Expertos. Cuando está habilitada, la FFN estándar\nse reemplaza por un router que selecciona `top_k` de `num_experts` sub-redes\nespecializadas por token, escalando la capacidad sin un aumento proporcional\nde cómputo (solo se ejecutan los expertos seleccionados).\n\nEl bloque se organiza en siete sub-bloques que reflejan la anatomía de una\ncapa MoE: `router` (logits → pesos), `routing` (quién selecciona los\nexpertos), `balancing` (carga entre expertos), `shared` (expertos siempre\nactivos), `latent` (expertos en un espacio latente menor), `layout` (qué\ncapas son MoE) y `experts` (la FFN del experto).\n\n**Ejemplos explicados:**\n- `enabled: false`: FFN densa estándar. Cada token pasa por la misma red.\n  Predecible, sin sobrecarga de ruteo; valor por defecto para modelos <100M.\n- `enabled: true, num_experts: 4, top_k: 1`: 4× capacidad FFN total por ~1×\n  cómputo (más ruteo). El router aprende a especializar expertos.\n- `enabled:\
          \ true, num_experts: 8, top_k: 2`: más capacidad y cómputo, más\n  difícil de entrenar — requiere balanceo de carga para evitar colapso.\n\n**Referencias:** (paper: arxiv:2407.06204) (paper: arxiv:2103.16716)"
        properties:
          enabled:
            type: boolean
            title: Enable MoE
            title_es: Habilitar MoE
            description: 'Replace the dense FFN with a routed mixture of experts.


              **References:** (paper: arxiv:2407.06204) (paper: arxiv:2103.16716)'
            description_es: 'Reemplaza la FFN densa por una mezcla de expertos con router.


              **Referencias:** (paper: arxiv:2407.06204) (paper: arxiv:2103.16716)'
            default: true
            examples:
            - true
            - false
          num_experts:
            type: integer
            minimum: 1
            title: MoE Expert Count
            title_es: Número de Expertos MoE
            description: 'Total number of routed experts. Each expert is a separate FFN; the

              router selects `top_k` per token. Typical: 4–8 (efficient), up to 256

              (scaling). Inactive experts occupy memory but consume no FLOPs.


              **References:** (paper: arxiv:2407.06204) (paper: arxiv:2103.16716)'
            description_es: 'Número total de expertos ruteados. Cada experto es una FFN separada; el

              router selecciona `top_k` por token. Típico: 4–8 (eficiente), hasta 256

              (escalado). Los expertos inactivos ocupan memoria pero no FLOPs.


              **Referencias:** (paper: arxiv:2407.06204) (paper: arxiv:2103.16716)'
            default: 8
            examples:
            - 4
            - 8
            - 64
          top_k:
            type: integer
            minimum: 1
            title: Top-K Expert Selection
            title_es: Selección Top-K de Expertos
            description: 'Number of experts activated per token (must be ≤ `num_experts`).

              `top_k: 1` maximises sparsity and specialisation; `top_k: 2+` adds

              capacity at the cost of sparsity. With `router.scoring: softmax` and

              `top_k: 1`, set `router.pre_softmax: true` or the router receives no

              gradient (the single chosen weight is always 1).


              **References:** (paper: arxiv:2101.03961)'
            description_es: 'Número de expertos activados por token (debe ser ≤ `num_experts`).

              `top_k: 1` maximiza dispersión y especialización; `top_k: 2+` agrega

              capacidad a costa de la dispersión. Con `router.scoring: softmax` y

              `top_k: 1`, usar `router.pre_softmax: true` o el router no recibe

              gradiente (el único peso elegido es siempre 1).


              **Referencias:** (paper: arxiv:2101.03961)'
            default: 2
            examples:
            - 1
            - 2
            - 8
          expert_hidden_size:
            type: integer
            minimum: 1
            title: Expert Hidden Dimension
            title_es: Dimensión Oculta del Experto
            description: 'Intermediate width of each routed expert. `null` falls back to

              `ffn.hidden_size`, which keeps the dense and MoE layers the same width.

              DeepSeek-V3, for example, uses a dense width of 18432 but 2048 per

              expert; setting this key is what separates the two.


              **References:** (paper: arxiv:2412.19437)'
            description_es: 'Ancho intermedio de cada experto ruteado. `null` usa `ffn.hidden_size`,

              manteniendo igual ancho para capas densas y MoE. DeepSeek-V3, por ejemplo,

              usa ancho denso 18432 pero 2048 por experto; definir esta clave es lo que

              separa ambos valores.


              **Referencias:** (paper: arxiv:2412.19437)'
            default: null
            examples:
            - 2048
          router:
            type: object
            additionalProperties: false
            title: MoE Router Scoring
            title_es: Puntuación del Router MoE
            description: 'How router logits become expert weights: the gating function, the output

              scale and the numerical precision of the routing decision.


              **References:** (paper: arxiv:2101.03961) (paper: arxiv:2412.19437)'
            description_es: 'Cómo los logits del router se convierten en pesos de expertos: la función

              de compuerta, la escala de salida y la precisión numérica de la decisión

              de ruteo.


              **Referencias:** (paper: arxiv:2101.03961) (paper: arxiv:2412.19437)'
            properties:
              scoring:
                type: string
                enum:
                - softmax
                - sigmoid
                - softplus_sqrt
                title: Gating Function
                title_es: Función de Compuerta
                description: "Score function applied to the router logits. All three rank experts\nidentically; they differ in how much weight each chosen expert gets.\n- `softmax`: normalised probabilities; confident routers concentrate\n  weight on the top expert. Default and most common.\n- `sigmoid`: independent per-expert scores; saturates, so confident\n  experts end up with equal weights. Required for the expert bias of\n  `balancing.bias_update` (DeepSeek-V3).\n- `softplus_sqrt`: `sqrt(softplus(x))`, between the two; DeepSeek-V4.\n\n**References:** (paper: arxiv:2412.19437) (paper: arxiv:2606.19348)"
                description_es: "Función de puntuación aplicada a los logits del router. Las tres\nordenan los expertos igual; difieren en cuánto peso recibe cada\nexperto elegido.\n- `softmax`: probabilidades normalizadas; los routers confiados\n  concentran el peso en el experto superior. Por defecto y la más común.\n- `sigmoid`: puntuaciones independientes por experto; satura, así que\n  los expertos confiados terminan con pesos iguales. Requerida por el\n  sesgo de experto de `balancing.bias_update` (DeepSeek-V3).\n- `softplus_sqrt`: `sqrt(softplus(x))`, intermedia; DeepSeek-V4.\n\n**Referencias:** (paper: arxiv:2412.19437) (paper: arxiv:2606.19348)"
                default: softmax
                examples:
                - softmax
                - sigmoid
                - softplus_sqrt
              pre_softmax:
                type: boolean
                title: Softmax Before Top-K
                title_es: Softmax Antes del Top-K
                description: 'Compute the softmax over all experts before selecting the top-k, so

                  the kept weights are the raw probabilities and are not renormalised

                  over the selection. Required for `scoring: softmax` at `top_k: 1`

                  (otherwise the router gets no gradient). Ignored for `sigmoid` and

                  `softplus_sqrt`.


                  **References:** (paper: arxiv:2101.03961)'
                description_es: 'Calcula el softmax sobre todos los expertos antes de seleccionar el

                  top-k, de modo que los pesos conservados son las probabilidades

                  crudas y no se renormalizan sobre la selección. Requerido para

                  `scoring: softmax` con `top_k: 1` (de lo contrario el router no

                  recibe gradiente). Se ignora para `sigmoid` y `softplus_sqrt`.


                  **Referencias:** (paper: arxiv:2101.03961)'
                default: false
                examples:
                - false
                - true
              renormalize:
                type: boolean
                title: Renormalize Top-K Weights
                title_es: Renormalizar Pesos Top-K
                description: 'Rescale the selected weights so they sum to 1. Keeps the routed

                  output''s magnitude stable from token to token; renormalising lowered

                  validation loss in the granularity ablation. Ignored when

                  `pre_softmax: true`.


                  **References:** (paper: arxiv:2506.02890)'
                description_es: 'Reescala los pesos seleccionados para que sumen 1. Mantiene estable

                  la magnitud de la salida ruteada entre tokens; renormalizar redujo la

                  pérdida de validación en la ablación de granularidad. Se ignora

                  cuando `pre_softmax: true`.


                  **Referencias:** (paper: arxiv:2506.02890)'
                default: true
                examples:
                - true
                - false
              routed_scaling_factor:
                type: number
                title: Routed Scaling Factor
                title_es: Factor de Escala Ruteado
                description: 'Constant multiplied onto the combined routed output. With equal

                  weights on k uncorrelated experts the output RMS drops to `1/√k`;

                  a factor near `√k` restores it. DeepSeek-V3 uses 2.5 at k = 8.

                  Shipped models disagree on the value (Kimi K3 uses 1.0 at k = 16).


                  **References:** (paper: arxiv:2412.19437) (paper: arxiv:2607.24653)'
                description_es: 'Constante multiplicada sobre la salida ruteada combinada. Con pesos

                  iguales en k expertos incorrelacionados el RMS de salida cae a

                  `1/√k`; un factor cercano a `√k` lo restaura. DeepSeek-V3 usa 2.5

                  con k = 8. Los modelos publicados discrepan (Kimi K3 usa 1.0 con

                  k = 16).


                  **Referencias:** (paper: arxiv:2412.19437) (paper: arxiv:2607.24653)'
                default: 1.0
                examples:
                - 1.0
                - 2.5
              dtype:
                type: string
                enum:
                - float32
                - bfloat16
                title: Router Compute Precision
                title_es: Precisión de Cómputo del Router
                description: 'Precision of the router''s logits and selection math. Use

                  `float32`: a bf16 router diverged in Switch Transformers, and top-k

                  ties are broken arbitrarily. The experts themselves can stay in the

                  training precision.


                  **References:** (paper: arxiv:2101.03961) (paper: arxiv:2202.08906)'
                description_es: 'Precisión de los logits y del cálculo de selección del router. Usar

                  `float32`: un router bf16 divergió en Switch Transformers y los

                  empates del top-k se rompen arbitrariamente. Los expertos pueden

                  quedar en la precisión de entrenamiento.


                  **Referencias:** (paper: arxiv:2101.03961) (paper: arxiv:2202.08906)'
                default: float32
                examples:
                - float32
              jitter_eps:
                type: number
                title: Router Input Jitter
                title_es: Jitter de Entrada del Router
                description: 'Switch-style multiplicative uniform noise on the router input,

                  `x · (1 + eps · (2u − 1))`. 0 disables it. A small value (e.g. 1e-2)

                  discourages the router from collapsing early in training.


                  **References:** (paper: arxiv:2101.03961)'
                description_es: 'Ruido uniforme multiplicativo estilo Switch sobre la entrada del

                  router, `x · (1 + eps · (2u − 1))`. 0 lo desactiva. Un valor pequeño

                  (p. ej. 1e-2) evita el colapso temprano del router.


                  **Referencias:** (paper: arxiv:2101.03961)'
                default: 0.0
                minimum: 0
                examples:
                - 0.0
                - 0.01
              z_loss_coeff:
                type: number
                title: Router Z-Loss Coefficient
                title_es: Coeficiente de Z-Loss del Router
                description: 'Weight of the ST-MoE z-loss, `coeff · mean(logsumexp(logits)²)`.

                  Penalises logit drift, which is what destabilises bf16 routers.

                  0 disables it; ST-MoE uses 1e-3.


                  **References:** (paper: arxiv:2202.08906)'
                description_es: 'Peso de la z-loss de ST-MoE, `coeff · mean(logsumexp(logits)²)`.

                  Penaliza la deriva de logits, que es lo que desestabiliza los routers

                  bf16. 0 la desactiva; ST-MoE usa 1e-3.


                  **Referencias:** (paper: arxiv:2202.08906)'
                default: 0.0
                minimum: 0
                examples:
                - 0.0
                - 0.001
          routing:
            type: object
            additionalProperties: false
            title: MoE Routing Strategy
            title_es: Estrategia de Ruteo MoE
            description: 'Who selects the experts — each token (learned top-k), each expert

              (expert choice), or a fixed token-id table (hash layers) — and how many

              assignments an expert accepts.


              **References:** (paper: arxiv:2202.09368) (paper: arxiv:2106.04426)'
            description_es: 'Quién selecciona los expertos — cada token (top-k aprendido), cada

              experto (expert choice) o una tabla fija por id de token (hash layers) —

              y cuántas asignaciones acepta cada experto.


              **Referencias:** (paper: arxiv:2202.09368) (paper: arxiv:2106.04426)'
            properties:
              type:
                type: string
                enum:
                - token_choice
                - expert_choice
                title: Routing Type
                title_es: Tipo de Ruteo
                description: "- `token_choice`: each token keeps its k best experts. Default.\n- `expert_choice`: each expert keeps its best tokens, which equalises\n  the load by construction. The selection depends on later tokens, so\n  inference routing differs from training; use for encoder/training\n  experiments, not autoregressive serving.\n\n**References:** (paper: arxiv:2202.09368)"
                description_es: "- `token_choice`: cada token conserva sus k mejores expertos. Por\n  defecto.\n- `expert_choice`: cada experto conserva sus mejores tokens, lo que\n  iguala la carga por construcción. La selección depende de tokens\n  posteriores, así que el ruteo en inferencia difiere del de\n  entrenamiento; usar en experimentos de encoder/entrenamiento, no en\n  serving autorregresivo.\n\n**Referencias:** (paper: arxiv:2202.09368)"
                default: token_choice
                examples:
                - token_choice
                - expert_choice
              capacity_factor:
                type: number
                minimum: 0
                title: Expert Capacity Factor
                title_es: Factor de Capacidad por Experto
                description: 'Maximum tokens an expert keeps, as a multiple of the perfectly

                  balanced load `tokens · top_k / num_experts`. Tokens past the cap are

                  dropped (highest-probability tokens win). 0 means dropless: every

                  token is kept whatever the load. Dropping buys speed and bounded

                  memory at a small quality cost.


                  **References:** (paper: arxiv:2202.08906) (paper: arxiv:2505.04519)'
                description_es: 'Máximo de tokens que conserva un experto, como múltiplo de la carga

                  perfectamente balanceada `tokens · top_k / num_experts`. Los tokens

                  que exceden el tope se descartan (ganan los de mayor probabilidad).

                  0 significa dropless: todo token se conserva sea cual sea la carga.

                  Descartar compra velocidad y memoria acotada a un costo pequeño de

                  calidad.


                  **Referencias:** (paper: arxiv:2202.08906) (paper: arxiv:2505.04519)'
                default: 0.0
                examples:
                - 0.0
                - 1.5
              hash_layers:
                type: integer
                minimum: 0
                title: Hash-Routed MoE Layers
                title_es: Capas MoE con Ruteo Hash
                description: 'Number of leading MoE layers that select experts from a fixed

                  token-id → experts table instead of the learned router. The router is

                  still used for the weights (DeepSeek-V4 keeps its gate for that) but

                  receives no gradient from the selection. Hash routing is context-free

                  and cannot be rebalanced; 0 disables it.


                  **References:** (paper: arxiv:2106.04426) (paper: arxiv:2606.19348)'
                description_es: 'Número de capas MoE iniciales que seleccionan expertos desde una

                  tabla fija id de token → expertos en vez del router aprendido. El

                  router se sigue usando para los pesos (DeepSeek-V4 conserva su gate

                  para eso) pero no recibe gradiente de la selección. El ruteo hash no

                  tiene contexto y no puede rebalancearse; 0 lo desactiva.


                  **Referencias:** (paper: arxiv:2106.04426) (paper: arxiv:2606.19348)'
                default: 0
                examples:
                - 0
                - 3
              hash_table:
                type: string
                enum:
                - random
                - round_robin
                title: Hash Table Construction
                title_es: Construcción de la Tabla Hash
                description: 'How the token-id table is filled. `random` assigns each token id

                  `top_k` seeded random experts; `round_robin` cycles through experts

                  in order. Roller et al. found random and frequency-greedy tables

                  reach about the same perplexity, with the greedy table better

                  balanced; frequency-balanced tables need corpus statistics and are

                  not built here.


                  **References:** (paper: arxiv:2106.04426)'
                description_es: 'Cómo se llena la tabla por id de token. `random` asigna a cada id

                  `top_k` expertos aleatorios con semilla; `round_robin` cicla por los

                  expertos en orden. Roller et al. hallaron que las tablas aleatorias y

                  las voraces por frecuencia alcanzan perplejidad similar, con mejor

                  balance la voraz; las tablas balanceadas por frecuencia requieren

                  estadísticas del corpus y no se construyen aquí.


                  **Referencias:** (paper: arxiv:2106.04426)'
                default: random
                examples:
                - random
                - round_robin
              hash_seed:
                type: integer
                minimum: 0
                title: Hash Table Seed
                title_es: Semilla de la Tabla Hash
                description: 'RNG seed for the `random` hash table.


                  **References:** (paper: arxiv:2106.04426)'
                description_es: 'Semilla del RNG para la tabla hash `random`.


                  **Referencias:** (paper: arxiv:2106.04426)'
                default: 42
                examples:
                - 42
          balancing:
            type: object
            additionalProperties: false
            title: MoE Load Balancing
            title_es: Balanceo de Carga MoE
            description: 'Keep tokens spread over the experts. Two independent families: an

              auxiliary loss that steers the router''s probabilities through its

              gradient, and a loss-free expert bias that changes only which experts are

              selected. They can be combined (DeepSeek-V3 pairs a batch-wide bias with

              a small sequence-wise loss).


              **References:** (paper: arxiv:2408.15664) (paper: arxiv:2412.19437)'
            description_es: 'Mantiene los tokens repartidos entre los expertos. Dos familias

              independientes: una pérdida auxiliar que guía las probabilidades del

              router vía gradiente, y un sesgo de experto libre de pérdida que cambia

              solo qué expertos se seleccionan. Pueden combinarse (DeepSeek-V3 combina

              un sesgo de batch con una pérdida pequeña por secuencia).


              **Referencias:** (paper: arxiv:2408.15664) (paper: arxiv:2412.19437)'
            properties:
              aux_loss:
                type: string
                enum:
                - none
                - batch
                - sequence
                title: Auxiliary Load-Balancing Loss
                title_es: Pérdida Auxiliar de Balanceo
                description: "Scope of the load-balancing loss, `E · Σ f_e · P_e`:\n- `none`: no auxiliary loss.\n- `batch`: one micro-batch (Switch/DeepSeekMoE default).\n- `sequence`: one sequence at a time, averaged over the batch\n  (DeepSeek-V3). Prevents a single sequence from piling onto a few\n  experts even when the batch as a whole looks balanced.\n\n**References:** (paper: arxiv:2401.06066) (paper: arxiv:2412.19437)"
                description_es: "Alcance de la pérdida de balanceo, `E · Σ f_e · P_e`:\n- `none`: sin pérdida auxiliar.\n- `batch`: un micro-batch (por defecto en Switch/DeepSeekMoE).\n- `sequence`: una secuencia a la vez, promediada sobre el batch\n  (DeepSeek-V3). Evita que una secuencia se apile en pocos expertos\n  aunque el batch completo parezca balanceado.\n\n**Referencias:** (paper: arxiv:2401.06066) (paper: arxiv:2412.19437)"
                default: batch
                examples:
                - none
                - batch
                - sequence
              aux_loss_coeff:
                type: number
                minimum: 0
                title: Auxiliary Loss Coefficient
                title_es: Coeficiente de Pérdida Auxiliar
                description: 'Weight of the load-balancing loss. Too high costs LM loss; too low

                  leaves the load uneven. Typical: 1e-3 (Megatron default), 0.01

                  (Switch/DeepSeekMoE), 1e-4 for DeepSeek-V3''s sequence-wise guard.


                  **References:** (paper: arxiv:2412.19437) (paper: arxiv:2505.09388)'
                description_es: 'Peso de la pérdida de balanceo. Demasiado alto cuesta pérdida de LM;

                  demasiado bajo deja la carga desigual. Típico: 1e-3 (por defecto en

                  Megatron), 0.01 (Switch/DeepSeekMoE), 1e-4 para la guarda por

                  secuencia de DeepSeek-V3.


                  **Referencias:** (paper: arxiv:2412.19437) (paper: arxiv:2505.09388)'
                default: 0.01
                examples:
                - 0.001
                - 0.01
              bias_update:
                type: string
                enum:
                - none
                - sign
                - centered_sign
                - quantile
                title: Expert Bias Update Rule
                title_es: Regla de Actualización del Sesgo
                description: 'Auxiliary-loss-free balancing (DeepSeek-V3 `noaux_tc`): a per-expert

                  bias is added to the scores before selection only. `sign` adds

                  `+rate` to underloaded experts and `−rate` to overloaded ones;

                  `centered_sign` subtracts the mean step so the bias mean does not

                  drift; `quantile` (Kimi K3 Quantile Balancing) replaces the fixed

                  step with the router-score quantile that matches each expert''s

                  target load, derived from a single forward pass (Top-(k+1) cutoff,

                  (q+1)-th largest margin, q = m·k/n) and applied per micro-batch.

                  `sign`/`centered_sign` move once per optimizer step. Requires

                  `router.scoring` different from `softmax`.


                  **References:** (paper: arxiv:2408.15664) (paper: arxiv:2502.16982) (paper: arxiv:2607.24653)'
                description_es: 'Balanceo libre de pérdida auxiliar (DeepSeek-V3 `noaux_tc`): un sesgo

                  por experto se suma a las puntuaciones solo antes de la selección.

                  `sign` suma `+rate` a los expertos subcargados y `−rate` a los

                  sobrecargados; `centered_sign` resta el paso medio para que la media

                  del sesgo no derive; `quantile` (Quantile Balancing de Kimi K3)

                  reemplaza el paso fijo por el cuantil de puntuaciones que iguala la

                  carga objetivo de cada experto, derivado de un único forward

                  (cutoff Top-(k+1), margen (q+1)-ésimo mayor, q = m·k/n) y aplicado

                  por micro-batch. `sign`/`centered_sign` se mueven una vez por paso de

                  optimizador. Requiere `router.scoring` distinto de `softmax`.


                  **Referencias:** (paper: arxiv:2408.15664) (paper: arxiv:2502.16982) (paper: arxiv:2607.24653)'
                default: none
                examples:
                - none
                - sign
                - centered_sign
                - quantile
              bias_update_rate:
                type: number
                minimum: 0
                title: Expert Bias Update Rate
                title_es: Tasa de Actualización del Sesgo
                description: 'Fixed step `γ` for the expert bias. DeepSeek-V3 uses 1e-3; a step

                  that is too coarse for the expert count leaves the load uneven (above

                  ~128 experts a finer step or an auxiliary loss is needed).


                  **References:** (paper: arxiv:2408.15664) (paper: arxiv:2605.11689)'
                description_es: 'Paso fijo `γ` del sesgo de experto. DeepSeek-V3 usa 1e-3; un paso

                  demasiado grueso para el número de expertos deja la carga desigual

                  (por encima de ~128 expertos se necesita un paso más fino o una

                  pérdida auxiliar).


                  **Referencias:** (paper: arxiv:2408.15664) (paper: arxiv:2605.11689)'
                default: 0.001
                examples:
                - 0.001
          shared:
            type: object
            additionalProperties: false
            title: Shared Experts
            title_es: Expertos Compartidos
            description: 'Always-on experts that process every token next to the routed ones,

              learning common patterns and leaving the routed experts free to

              specialise. They sit outside the router and add compute per token.


              **References:** (paper: arxiv:2401.06066)'
            description_es: 'Expertos siempre activos que procesan cada token junto a los ruteados,

              aprendiendo patrones comunes y dejando libres a los expertos ruteados

              para especializarse. Quedan fuera del router y agregan cómputo por token.


              **Referencias:** (paper: arxiv:2401.06066)'
            properties:
              count:
                type: integer
                minimum: 0
                title: Shared Expert Count
                title_es: Número de Expertos Compartidos
                description: 'Number of shared experts. 0 disables them; DeepSeek-V3 uses 1,

                  DeepSeek-V2 and Kimi K3 use 2.


                  **References:** (paper: arxiv:2401.06066) (paper: arxiv:2412.19437)'
                description_es: 'Número de expertos compartidos. 0 los desactiva; DeepSeek-V3 usa 1,

                  DeepSeek-V2 y Kimi K3 usan 2.


                  **Referencias:** (paper: arxiv:2401.06066) (paper: arxiv:2412.19437)'
                default: 0
                examples:
                - 0
                - 1
                - 2
              hidden_size:
                type: integer
                minimum: 1
                title: Shared Expert Width
                title_es: Ancho del Experto Compartido
                description: 'Intermediate width of each shared expert. `null` uses the routed

                  expert width.


                  **References:** (paper: arxiv:2401.06066)'
                description_es: 'Ancho intermedio de cada experto compartido. `null` usa el ancho de

                  los expertos ruteados.


                  **Referencias:** (paper: arxiv:2401.06066)'
                default: null
                examples:
                - null
                - 2048
              gate:
                type: string
                enum:
                - none
                - sigmoid
                title: Shared Expert Gate
                title_es: Compuerta del Experto Compartido
                description: 'How the shared branch mixes with the routed output. `none` adds it at

                  weight 1; `sigmoid` multiplies it by a learned per-token gate in

                  (0, 1), so the shared branch can take between 0 and 50% of the output

                  (Qwen3-Next).


                  **References:** (paper: arxiv:2401.06066) (paper: arxiv:2509.01322)'
                description_es: 'Cómo se mezcla la rama compartida con la salida ruteada. `none` la

                  suma con peso 1; `sigmoid` la multiplica por una compuerta aprendida

                  por token en (0, 1), así que la rama compartida puede tomar entre 0 y

                  50% de la salida (Qwen3-Next).


                  **Referencias:** (paper: arxiv:2401.06066) (paper: arxiv:2509.01322)'
                default: none
                examples:
                - none
                - sigmoid
          latent:
            type: object
            additionalProperties: false
            title: Latent MoE
            title_es: MoE Latente
            description: 'Run the experts in a smaller latent space: project each token from

              `dims.hidden_size` down to `latent.dim` before dispatch and back up after

              combining. At the same expert parameters, compute and traffic, this

              affords `α = d / ℓ` times more experts and a larger top-k, or keeps

              quality at lower cost. NVIDIA reports +5.65 MMLU-Pro at 95B with

              `α = 4`; Kimi K3 and Nemotron 3 ship it.


              **References:** (paper: arxiv:2601.18089)'
            description_es: 'Ejecuta los expertos en un espacio latente menor: proyecta cada token de

              `dims.hidden_size` a `latent.dim` antes del despacho y de vuelta después

              de combinar. Con los mismos parámetros, cómputo y tráfico de expertos,

              esto permite `α = d / ℓ` veces más expertos y un top-k mayor, o mantiene

              la calidad a menor costo. NVIDIA reporta +5.65 en MMLU-Pro a 95B con

              `α = 4`; Kimi K3 y Nemotron 3 lo usan.


              **Referencias:** (paper: arxiv:2601.18089)'
            properties:
              enabled:
                type: boolean
                title: Enable Latent MoE
                title_es: Habilitar MoE Latente
                description: 'Project tokens into the latent space before the experts and back

                  after combining.


                  **References:** (paper: arxiv:2601.18089)'
                description_es: 'Proyecta los tokens al espacio latente antes de los expertos y de

                  vuelta después de combinar.


                  **Referencias:** (paper: arxiv:2601.18089)'
                default: false
                examples:
                - false
                - true
              dim:
                type: integer
                minimum: 1
                title: Latent Dimension
                title_es: Dimensión Latente
                description: 'Latent width `ℓ`. Must be smaller than `dims.hidden_size`; the

                  compression ratio is `α = hidden_size / ℓ`. Quality is preserved up

                  to `α = 4` in NVIDIA''s ablations (e.g. 7168 → 3584 in Kimi K3).


                  **References:** (paper: arxiv:2601.18089) (paper: arxiv:2607.24653)'
                description_es: 'Ancho latente `ℓ`. Debe ser menor que `dims.hidden_size`; la razón de

                  compresión es `α = hidden_size / ℓ`. La calidad se conserva hasta

                  `α = 4` en las ablaciones de NVIDIA (p. ej. 7168 → 3584 en Kimi K3).


                  **Referencias:** (paper: arxiv:2601.18089) (paper: arxiv:2607.24653)'
                default: null
                examples:
                - null
                - 3584
              norm_before_up_proj:
                type: boolean
                title: Normalize Before Up-Projection
                title_es: Normalizar Antes de la Proyección de Salida
                description: 'Apply RMSNorm to the combined expert output before the latent

                  up-projection. Kimi K3 added it to stop routed-branch activation

                  growth at 2.8T parameters.


                  **References:** (paper: arxiv:2607.24653)'
                description_es: 'Aplica RMSNorm a la salida combinada de los expertos antes de la

                  proyección de salida latente. Kimi K3 la agregó para detener el

                  crecimiento de activaciones de la rama ruteada a 2.8T parámetros.


                  **Referencias:** (paper: arxiv:2607.24653)'
                default: false
                examples:
                - false
                - true
          layout:
            type: object
            additionalProperties: false
            title: MoE Layer Layout
            title_es: Distribución de Capas MoE
            description: 'Which layers get experts. MoE in every layer maximises capacity but adds

              router/communication cost everywhere; leading dense layers and

              interleaving trade capacity for fewer MoE layers.


              **References:** (paper: arxiv:2412.19437) (paper: arxiv:2507.17702)'
            description_es: 'Qué capas llevan expertos. MoE en todas las capas maximiza capacidad pero

              agrega costo de router/comunicación en todas; capas densas iniciales y la

              intercalación cambian capacidad por menos capas MoE.


              **Referencias:** (paper: arxiv:2412.19437) (paper: arxiv:2507.17702)'
            properties:
              dense_layers:
                type: integer
                minimum: 0
                title: Leading Dense Layers
                title_es: Capas Densas Iniciales
                description: 'Number of leading layers that keep the dense FFN. DeepSeek-V3 and

                  GLM keep 3; Ling found 1–3 barely changed efficiency at matched

                  FLOPs. Dense layers use `ffn.hidden_size`; MoE layers use

                  `expert_hidden_size`.


                  **References:** (paper: arxiv:2412.19437) (paper: arxiv:2507.17702)'
                description_es: 'Número de capas iniciales que conservan la FFN densa. DeepSeek-V3 y

                  GLM conservan 3; Ling halló que 1–3 apenas cambian la eficiencia con

                  FLOPs igualados. Las capas densas usan `ffn.hidden_size`; las MoE usan

                  `expert_hidden_size`.


                  **Referencias:** (paper: arxiv:2412.19437) (paper: arxiv:2507.17702)'
                default: 0
                examples:
                - 0
                - 3
              every_n_layers:
                type: integer
                minimum: 1
                title: MoE Layer Frequency
                title_es: Frecuencia de Capas MoE
                description: 'Place an MoE layer every N layers after the dense prefix. 1 means

                  every layer is MoE; 2 alternates dense and MoE as in Llama 4

                  Maverick.


                  **References:** (paper: arxiv:2412.19437)'
                description_es: 'Coloca una capa MoE cada N capas después del prefijo denso. 1

                  significa MoE en todas las capas; 2 alterna densa y MoE como en

                  Llama 4 Maverick.


                  **Referencias:** (paper: arxiv:2412.19437)'
                default: 1
                examples:
                - 1
                - 2
          experts:
            type: object
            additionalProperties: false
            title: Expert FFN
            title_es: FFN del Experto
            description: 'The function inside each expert.


              **References:** (paper: arxiv:2602.10604)'
            description_es: 'La función dentro de cada experto.


              **Referencias:** (paper: arxiv:2602.10604)'
            properties:
              activation_clamp:
                type: number
                minimum: 0
                title: Expert Activation Clamp
                title_es: Tope de Activación del Experto
                description: 'Upper bound applied to each expert''s gated intermediate, following

                  the gated-FFN clamp recipe. 0 disables it. DeepSeek-V4.1 uses 10,

                  Step-5 Preview 7; Step-3.5-Flash found outlier experts whose output

                  norms grew without any loss signal, and clipping contained them at

                  unchanged loss.


                  **References:** (paper: arxiv:2602.10604) (paper: arxiv:2609.19969)'
                description_es: 'Cota superior aplicada al intermedio con compuerta de cada experto,

                  siguiendo la receta de recorte de FFN con compuerta. 0 lo desactiva.

                  DeepSeek-V4.1 usa 10, Step-5 Preview 7; Step-3.5-Flash encontró

                  expertos atípicos cuyas normas de salida crecían sin señal en la

                  pérdida, y el recorte los contuvo sin cambiar la pérdida.


                  **Referencias:** (paper: arxiv:2602.10604) (paper: arxiv:2609.19969)'
                default: 0.0
                examples:
                - 0.0
                - 10.0
        allOf:
        - if:
            properties:
              router:
                properties:
                  scoring:
                    const: softmax
              top_k:
                const: 1
            required:
            - router
            - top_k
          then:
            properties:
              router:
                properties:
                  pre_softmax:
                    const: true
        - if:
            properties:
              latent:
                properties:
                  enabled:
                    const: true
            required:
            - latent
          then:
            properties:
              latent:
                required:
                - dim
                properties:
                  dim:
                    type: integer
                    minimum: 1
      bitnet:
        type: object
        additionalProperties: false
        title: BitNet (1.58-bit quantization)
        title_es: BitNet (cuantización de 1.58 bits)
        description: 'BitNet b1.58 ternary-weight quantization (Ma et al., arXiv:2402.17764).

          When enabled, primary and gate `nn.Linear` layers are replaced by

          ``BitLinear``: weights are quantized to ``{-1, 0, 1}`` via the

          straight-through estimator and activations to int8, reducing weight memory

          by roughly 10×.


          **References:** (paper: arxiv:2310.11453)'
        description_es: 'Cuantización de pesos ternarios BitNet b1.58 (Ma et al., arXiv:2402.17764).

          Cuando está habilitada, las capas `nn.Linear` primarias y de compuerta se

          reemplazan por ``BitLinear``: los pesos se cuantizan a ``{-1, 0, 1}`` con el

          estimador de paso directo y las activaciones a int8, reduciendo la memoria

          de pesos ~10×.


          **Referencias:** (paper: arxiv:2310.11453)'
        properties:
          enabled:
            type: boolean
            title: Enable BitNet
            title_es: Habilitar BitNet
            description: 'Enable ternary ``BitLinear`` weights for Q/K/V/O projections, FFN up/down,

              embeddings, LM head, and recurrent-state gates. Best enabled from the

              start of training; requires careful learning-rate tuning.


              **References:** (paper: arxiv:2310.11453)'
            description_es: 'Habilita pesos ternarios ``BitLinear`` para proyecciones Q/K/V/O, FFN

              up/down, embeddings, cabeza LM y compuertas de estado recurrente. Se

              recomienda habilitar desde el inicio del entrenamiento; requiere ajuste

              cuidadoso del learning rate.


              **Referencias:** (paper: arxiv:2310.11453)'
            default: true
            examples:
            - true
            - false
          routers:
            type: boolean
            title: Quantize Routers/Scoring
            title_es: Cuantizar Routers/Scoring
            description: 'Also quantize routing/scoring projections (MoE router, MoD router, sparse

              block-index/forecast projections, SparseK score net). Default ``false``

              keeps them full-precision: top-k decisions are sensitive to ternary noise.

              Requires `enabled: true`.


              **References:** (paper: arxiv:2310.11453)'
            description_es: 'Cuantiza también las proyecciones de ruteo/scoring (router MoE, router

              MoD, índices/forecast de bloques sparse, red de score SparseK). Por

              defecto ``false`` las mantiene en precisión completa: las decisiones

              top-k son sensibles al ruido ternario. Requiere `enabled: true`.


              **Referencias:** (paper: arxiv:2310.11453)'
            default: false
            examples:
            - false
            - true
          conv:
            type: boolean
            title: Quantize Embedding Conv
            title_es: Cuantizar Conv de Embedding
            description: 'When enabled, also replace the factorized-embedding Conv1d pre-projection

              with ``BitConv1d`` (ternary weights + int8 activations). Only applies when

              `enabled: true` and `model.embedding.conv.enabled: true`. Default

              ``false`` keeps the convolution full-precision.


              **References:** (paper: arxiv:2310.11453)'
            description_es: 'Cuando está habilitado, reemplaza también la Conv1d de pre-proyección del

              embedding factorizado por ``BitConv1d`` (pesos ternarios + activaciones

              int8). Solo aplica cuando `enabled: true` y

              `model.embedding.conv.enabled: true`. Por defecto ``false`` mantiene la

              convolución en precisión completa.


              **Referencias:** (paper: arxiv:2310.11453)'
            default: false
            examples:
            - false
            - true
      mixture_of_depths:
        type: object
        additionalProperties: false
        title: Mixture of Depths (MoD)
        title_es: Mezcla de Profundidades (MoD)
        description: 'Mixture-of-Depths token routing inside each transformer block. Each layer

          scores tokens with a lightweight router and only the top `capacity_ratio`

          subset is updated; skipped tokens pass through unchanged, allocating more

          depth to salient tokens and reducing per-layer compute.


          **References:** (paper: arxiv:2404.02258)'
        description_es: 'Ruteo de tokens Mixture-of-Depths dentro de cada bloque transformer. Cada capa

          puntúa tokens con un router ligero y solo el subconjunto superior

          `capacity_ratio` se actualiza; los tokens omitidos pasan sin cambios,

          asignando más profundidad a tokens salientes y reduciendo el cómputo por capa.


          **Referencias:** (paper: arxiv:2404.02258)'
        properties:
          enabled:
            type: boolean
            title: Enable Mixture of Depths
            title_es: Habilitar Mixture of Depths
            description: 'Enable per-layer token routing. Saves compute but can degrade quality if

              too many tokens are skipped; tune `capacity_ratio`.


              **References:** (paper: arxiv:2404.02258)'
            description_es: 'Habilita el ruteo de tokens por capa. Ahorra cómputo pero puede degradar

              la calidad si se omiten demasiados tokens; ajustar `capacity_ratio`.


              **Referencias:** (paper: arxiv:2404.02258)'
            default: false
            examples:
            - false
            - true
          capacity_ratio:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            title: MoD Capacity Ratio
            title_es: Ratio de Capacidad MoD
            description: 'Fraction of tokens each layer updates. Effective capacity =

              `ceil(seq_len × ratio)`, minimum 1 token. Typical: 0.125–0.5 (aggressive),

              0.5–1.0 (conservative).


              **References:** (paper: arxiv:2404.02258)'
            description_es: 'Fracción de tokens que cada capa actualiza. Capacidad efectiva =

              `ceil(seq_len × ratio)`, mínimo 1 token. Típico: 0.125–0.5 (agresivo),

              0.5–1.0 (conservador).


              **Referencias:** (paper: arxiv:2404.02258)'
            default: 0.5
            examples:
            - 0.5
          router_aux_loss_weight:
            type: number
            minimum: 0
            title: MoD Router Aux Loss Weight
            title_es: Peso de Pérdida Auxiliar del Router MoD
            description: 'Weight for the auxiliary router regularizer, which encourages the average

              router activation probability to match `capacity_ratio`. Set to 0 to

              disable. Typical: 0.0 or 0.01–0.1.


              **References:** (paper: arxiv:2404.02258)'
            description_es: 'Peso del regularizador auxiliar del router, que incentiva que la

              probabilidad promedio de activación coincida con `capacity_ratio`. 0 para

              deshabilitar. Típico: 0.0 o 0.01–0.1.


              **Referencias:** (paper: arxiv:2404.02258)'
            default: 0.0
            examples:
            - 0.0
            - 0.01
      ssmax:
        type: object
        additionalProperties: false
        title: Scalable Softmax (SSMax)
        title_es: Softmax Escalable (SSMax)
        description: 'Scalable Softmax (paper: arxiv:2505.22842, §Scalable Softmax): a transversal

          pre-softmax logit rescale by `s · ln(n)` where `s` is a learnable per-head

          scalar and `n` is the sequence length. Counteracts "attention fading" as

          context grows and improves length extrapolation for every positional

          encoding.


          **References:** (paper: arxiv:2505.22842)'
        description_es: 'Softmax Escalable (paper: arxiv:2505.22842, §Scalable Softmax): un reescalado

          transversal de logits pre-softmax por `s · ln(n)`, donde `s` es un escalar

          aprendible por cabeza y `n` la longitud de secuencia. Contrarresta el

          "attention fading" al crecer el contexto y mejora la extrapolación de

          longitud para toda codificación posicional.


          **Referencias:** (paper: arxiv:2505.22842)'
        properties:
          enabled:
            type: boolean
            title: Enable SSMax
            title_es: Habilitar SSMax
            description: 'Enable the per-head `s · ln(n)` logit rescale. Composable with any

              `model.positional_encoding`; off by default.


              **References:** (paper: arxiv:2505.22842)'
            description_es: 'Habilita el reescalado de logits `s · ln(n)` por cabeza. Componible con

              cualquier `model.positional_encoding`; desactivado por defecto.


              **Referencias:** (paper: arxiv:2505.22842)'
            default: false
            examples:
            - false
            - true
          s_init:
            type: number
            exclusiveMinimum: 0
            title: SSMax s Init
            title_es: Init s de SSMax
            description: 'Initial value of the per-head learnable scalar `s`. The paper''s

              post-training distribution peaks around `s ≈ 1.5–3`; `1.0` is a neutral

              start.


              **References:** (paper: arxiv:2505.22842)'
            description_es: 'Valor inicial del escalar aprendible por cabeza `s`. La distribución

              post-entrenamiento del paper se sitúa en `s ≈ 1.5–3`; `1.0` es un inicio

              neutral.


              **Referencias:** (paper: arxiv:2505.22842)'
            default: 1.0
            examples:
            - 1.0
      numerics:
        type: object
        additionalProperties: false
        title: Fixed Numerics
        title_es: Numéricas Corregidas
        description: 'Numerical fixes for softmax and cross-entropy from Barron, Gnanapragasam &

          Tschannen (paper: arxiv:2610.31642, "A Fix for Softmax and Cross-Entropy").

          Standard implementations subtract the maximum logit before exponentiating,

          which prevents overflow but still rounds the target/argmax gradient to zero

          once the logit margin passes the floating-point precision cliff (Softmax

          Collapse: ≈5.5 in bf16, 16.6 in fp32, 36.7 in fp64). This leaves gradients

          that no longer sum to zero and produces the "Slingshot" loss spikes seen

          with adaptive optimizers. Both flags are off by default and preserve the

          mathematical semantics of the standard operations.


          **References:** (paper: arxiv:2610.31642)'
        description_es: 'Correcciones numéricas de softmax y cross-entropy de Barron, Gnanapragasam

          y Tschannen (paper: arxiv:2610.31642, "A Fix for Softmax and Cross-Entropy").

          Las implementaciones estándar restan el logit máximo antes de exponenciar,

          lo que evita el desbordamiento pero aún redondea a cero el gradiente del

          logit objetivo/argmax cuando el margen de logits cruza el acantilado de

          precisión (Softmax Collapse: ≈5.5 en bf16, 16.6 en fp32, 36.7 en fp64).

          Esto deja gradientes que ya no suman cero y produce los picos de pérdida

          "Slingshot" con optimizadores adaptativos. Ambos flags están desactivados

          por defecto y preservan la semántica matemática de las operaciones estándar.


          **Referencias:** (paper: arxiv:2610.31642)'
        properties:
          fixed_softmax:
            type: boolean
            title: Fixed Softmax / Log-Softmax
            title_es: Softmax / Log-Softmax Corregido
            description: 'Replace every explicit softmax and log-softmax in the model (attention

              mixers, MoE/MoD routers, depth-wise attention residuals, KV-cache

              recompute paths and decoder sampling) with the cancellation-free

              formulation: the argmax logit is excluded from the log-sum-exp and the

              resulting margin is combined with `softplus`, so the argmax/softmax

              Jacobian keeps its true magnitude past the precision cliff instead of

              rounding to zero. Forward outputs are mathematically identical to

              standard softmax; only the backward pass changes. Note: the internal

              SSOG LSE kernels keep their own formulation.


              **References:** (paper: arxiv:2610.31642)'
            description_es: 'Reemplaza cada softmax y log-softmax explícito del modelo (mixers de

              atención, routers MoE/MoD, residuales de atención en profundidad, rutas

              de recomputación de la caché KV y muestreo del decoder) por la

              formulación sin cancelación: el logit argmax se excluye del log-sum-exp

              y el margen resultante se combina con `softplus`, de modo que el

              jacobiano argmax/softmax conserva su magnitud real más allá del

              acantilado de precisión en lugar de redondearse a cero. Las salidas

              forward son matemáticamente idénticas a softmax estándar; solo cambia

              el backward. Nota: los núcleos LSE internos de SSOG conservan su propia

              formulación.


              **Referencias:** (paper: arxiv:2610.31642)'
            default: false
            examples:
            - false
            - true
          fixed_cross_entropy:
            type: boolean
            title: Fixed Cross-Entropy
            title_es: Cross-Entropy Corregida
            description: 'Replace the task cross-entropy losses (mlm, causal_lm, classification,

              segmentation, text_classification and patch_prediction) with the

              hard-target formulation from (paper: arxiv:2610.31642) §2: the target logit is

              used as the reference and the loss is `softplus(logsumexp(z - z_t))`

              over the non-target logits, so autograd yields a target gradient equal

              to minus the sum of the non-target gradients — the gradient sums to

              zero by construction even when the margin exceeds the precision cliff.

              Soft-target/distillation cross-entropy is not affected. `ignore_index`

              and the `mean` reduction follow `torch.nn.functional.cross_entropy`

              semantics.


              **References:** (paper: arxiv:2610.31642)'
            description_es: 'Reemplaza las pérdidas de cross-entropy de las tareas (mlm, causal_lm,

              classification, segmentation, text_classification y patch_prediction)

              por la formulación de objetivo duro de (paper: arxiv:2610.31642) §2: el logit

              objetivo se usa como referencia y la pérdida es

              `softplus(logsumexp(z - z_t))` sobre los logits no objetivo, de modo que

              autograd produce un gradiente objetivo igual a menos la suma de los

              gradientes no objetivo — el gradiente suma cero por construcción incluso

              cuando el margen supera el acantilado de precisión. La cross-entropy de

              objetivo blando/destilación no se ve afectada. `ignore_index` y la

              reducción `mean` siguen la semántica de

              `torch.nn.functional.cross_entropy`.


              **Referencias:** (paper: arxiv:2610.31642)'
            default: false
            examples:
            - false
            - true
      ffn:
        type: object
        additionalProperties: false
        title: Feed-Forward Network (FFN)
        title_es: Red Feed-Forward (FFN)
        description: 'Feed-forward network configuration shared by every HybridLayer: hidden

          dimension, activation function, and learnable-activation parameters.


          **References:** (paper: arxiv:1706.03762) (paper: arxiv:2002.05202)'
        description_es: 'Configuración de la red feed-forward compartida por cada HybridLayer:

          dimensión oculta, función de activación y parámetros de activaciones

          aprendibles.


          **Referencias:** (paper: arxiv:1706.03762) (paper: arxiv:2002.05202)'
        properties:
          hidden_size:
            type: integer
            minimum: 1
            title: FFN Hidden Dimension
            title_es: Dimensión Oculta de FFN
            description: "Intermediate dimension of feed-forward layers. Typical ratio: 4×\n`dims.hidden_size` (e.g. 768→3072 for BERT-base). When `moe.enabled` is\ntrue and `moe.expert_hidden_size` is unset, this is each expert's hidden\nsize; set `moe.expert_hidden_size` to give dense and MoE layers different\nwidths (DeepSeek-V3: dense 18432, experts 2048).\n\n**Examples explained:**\n- `hidden_size=3072` with `dims.hidden_size=768`: standard 4× ratio,\n  ~4.7M params per FFN layer. Good balance for most tasks.\n- `hidden_size=2048` with `dims.hidden_size=768`: reduced 2.67× ratio,\n  ~3.1M params per FFN layer; saves ~35% FFN params.\n- `hidden_size=4608` with `dims.hidden_size=768`: expanded 6× ratio for\n  knowledge-intensive tasks; higher memory.\n- With MoE: each expert uses this hidden size, so FFN params multiply by\n  `moe.num_experts` (stored, not all active). Prefer 2–3× ratios with MoE.\n\n**References:** (paper: arxiv:1706.03762)"
            description_es: "Dimensión intermedia de las capas feed-forward. Ratio típico: 4×\n`dims.hidden_size` (p. ej. 768→3072 para BERT-base). Cuando\n`moe.enabled` es true y `moe.expert_hidden_size` no está definido, es el\ntamaño oculto de cada experto; definir `moe.expert_hidden_size` permite\nanchos distintos para capas densas y MoE (DeepSeek-V3: denso 18432,\nexpertos 2048).\n\n**Ejemplos explicados:**\n- `hidden_size=3072` con `dims.hidden_size=768`: ratio 4× estándar,\n  ~4.7M params por capa FFN. Buen balance para la mayoría de tareas.\n- `hidden_size=2048` con `dims.hidden_size=768`: ratio 2.67× reducido,\n  ~3.1M params por capa FFN; ahorra ~35% de params FFN.\n- `hidden_size=4608` con `dims.hidden_size=768`: ratio 6× expandido para\n  tareas intensivas en conocimiento; mayor memoria.\n- Con MoE: cada experto usa este tamaño oculto, así que los params FFN se\n  multiplican por `moe.num_experts` (almacenados, no todos activos).\n  Preferir ratios 2–3× con MoE.\n\n**Referencias:**\
              \ (paper: arxiv:1706.03762)"
            default: null
            examples:
            - 3072
          activation:
            type: string
            title: FFN Activation
            title_es: Activación de FFN
            description: 'Non-linear activation for feed-forward networks. Grouped by family:


              **Common / classical** (survey: Lederer (paper: arxiv:2101.09957); Dubey et al. (paper: arxiv:2109.14545)):

              - `silu`: Sigmoid Linear Unit / Swish₁ — smoother, used in Llama/PaLM. **Recommended default for new models.**

              - `gelu`: Gaussian Error Linear Unit — classic, used in BERT/GPT-2/GPT-3. More stable for very small models.

              - `gelu_tanh`: GELU with the tanh approximation (faster; GPT-2/BERT original).

              - `relu`: Rectified Linear Unit.

              - `sigmoid`, `tanh`, `arctan`, `softsign`, `elliott`, `identity`, `softplus`, `mish`.


              **Rectified family** (survey §4): `leaky_relu`, `relu6`, `hardswish`, `prelu` (learnable),

              `abs_relu` (ABReLU), `nl_relu`, `brelu`, `vrelu`, `hexpo`, `ptanh`, `dis_relu`, `lisht`.


              **Exponential / ELU family** (survey §5): `elu`, `selu`, `celu`, `pelu`, `mpelu`, `felu`,

              `eelu`, `pdelu`, `preu`, `softexp`, `elish`, `hardelish`.


              **Learnable / adaptive**: `swish` (β-hyperparam), `swish_trainable` (β-trainable), `maxout`,

              `raf` (**Rational Activation Function**, learnable Padé polynomial ratio, Fang et al.

              (paper: arxiv:2208.14111)). Configure via `ffn.activation_config`.


              **Gated FFN variants** (own their projections, replace the FFN block): `swiglu`, `geglu`, `reglu`, `situ`.


              **Impact:** `silu`/`gelu` tend to converge well. With BitNet or quantization, `silu` may be

              more robust. Learnable activations (`raf`, `prelu`, `swish_trainable`) add parameters but can

              adapt per-task, especially in low-data regimes.


              **References:** `silu`/`swish` (paper: arxiv:1710.05941) (paper: arxiv:1702.03118); `gelu` (paper:

              arxiv:1606.08415); `relu` (paper: https://www.cs.toronto.edu/~fritz/absps/reluICML.pdf);

              `leaky_relu` (paper: https://ai.stanford.edu/~amaas/papers/relu_hybrid_icml2013_final.pdf); `elu`

              (paper: arxiv:1511.07289); `selu` (paper: arxiv:1706.02515); `celu` (paper: arxiv:1704.07483);

              `mish` (paper: arxiv:1908.08681); `prelu` (paper: arxiv:1502.01852); `softplus` (paper:

              https://proceedings.mlr.press/v15/glorot11a.html); `elish`/`hardelish` (paper: arxiv:1905.10144);

              `hardswish` (paper: arxiv:1905.02244); `pau` (paper: arxiv:2007.14617); `maxout` (paper:

              arxiv:1302.4389); `lisht` (paper: arxiv:1811.05870); `pelu` (paper: arxiv:1605.09332); `softexp`

              (paper: arxiv:1602.01321); `raf` (paper: arxiv:2208.14111); `swiglu`/`geglu`/`reglu` (paper:

              arxiv:2002.05202); surveys (paper: arxiv:2101.09957) (paper: arxiv:2109.14545)

              '
            description_es: 'Activación no lineal para redes feed-forward, agrupada por familia:


              **Comunes / clásicas** (survey: Lederer (paper: arxiv:2101.09957); Dubey et al. (paper: arxiv:2109.14545)):

              - `silu`: Sigmoid Linear Unit / Swish₁ — más suave, usada en Llama/PaLM. **Recomendada por defecto.**

              - `gelu`: Gaussian Error Linear Unit — clásica, usada en BERT/GPT-2/GPT-3.

              - `gelu_tanh`: GELU con aproximación tanh (más rápida; GPT-2/BERT original).

              - `relu`: Rectified Linear Unit.

              - `sigmoid`, `tanh`, `arctan`, `softsign`, `elliott`, `identity`, `softplus`, `mish`.


              **Familia rectificada** (survey §4): `leaky_relu`, `relu6`, `hardswish`, `prelu` (aprendible),

              `abs_relu` (ABReLU), `nl_relu`, `brelu`, `vrelu`, `hexpo`, `ptanh`, `dis_relu`, `lisht`.


              **Familia exponencial / ELU** (survey §5): `elu`, `selu`, `celu`, `pelu`, `mpelu`, `felu`,

              `eelu`, `pdelu`, `preu`, `softexp`, `elish`, `hardelish`.


              **Aprendibles / adaptativas**: `swish` (β hiperparámetro), `swish_trainable` (β entrenable),

              `maxout`, `raf` (**Rational Activation Function**, razón polinómica Padé aprendible, Fang et al.

              (paper: arxiv:2208.14111)). Configurar vía `ffn.activation_config`.


              **Variantes FFN con compuerta** (tienen sus proyecciones, reemplazan el bloque FFN): `swiglu`, `geglu`, `reglu`, `situ`.


              **Referencias:** `silu`/`swish` (paper: arxiv:1710.05941) (paper: arxiv:1702.03118); `gelu` (paper:

              arxiv:1606.08415); `relu` (paper: https://www.cs.toronto.edu/~fritz/absps/reluICML.pdf);

              `leaky_relu` (paper: https://ai.stanford.edu/~amaas/papers/relu_hybrid_icml2013_final.pdf); `elu`

              (paper: arxiv:1511.07289); `selu` (paper: arxiv:1706.02515); `celu` (paper: arxiv:1704.07483);

              `mish` (paper: arxiv:1908.08681); `prelu` (paper: arxiv:1502.01852); `softplus` (paper:

              https://proceedings.mlr.press/v15/glorot11a.html); `elish`/`hardelish` (paper: arxiv:1905.10144);

              `hardswish` (paper: arxiv:1905.02244); `pau` (paper: arxiv:2007.14617); `maxout` (paper:

              arxiv:1302.4389); `lisht` (paper: arxiv:1811.05870); `pelu` (paper: arxiv:1605.09332); `softexp`

              (paper: arxiv:1602.01321); `raf` (paper: arxiv:2208.14111); `swiglu`/`geglu`/`reglu` (paper:

              arxiv:2002.05202); surveys (paper: arxiv:2101.09957) (paper: arxiv:2109.14545)

              '
            enum:
            - abs_relu
            - arctan
            - brelu
            - celu
            - dis_relu
            - eelu
            - elish
            - elliott
            - elu
            - felu
            - geglu
            - gelu
            - gelu_tanh
            - hardelish
            - hardswish
            - hexpo
            - identity
            - leaky_relu
            - lisht
            - maxout
            - mish
            - mpelu
            - nl_relu
            - pdelu
            - pelu
            - prelu
            - preu
            - ptanh
            - raf
            - reglu
            - relu
            - relu6
            - selu
            - sigmoid
            - silu
            - situ
            - softexp
            - softplus
            - softsign
            - swiglu
            - swish
            - swish_trainable
            - tanh
            - vrelu
            default: silu
            examples:
            - gelu
            - silu
          activation_config:
            type: object
            title: FFN Activation Configuration
            title_es: Configuración de Activación de FFN
            description: "Optional nested parameters for learnable / parametric activations. Ignored for\nstateless activations. All keys are optional.\n\n**RAF (Rational Activation Function (paper: arxiv:2208.14111)):**\n- `raf_degrees`: `[m, n]` Padé numerator/denominator degrees (ints ≥ 1). Default `[5, 4]`.\n- `raf_version`: denominator form, one of `A` (default, \"safe\"), `B`, `C`, `D`, `N`.\n- `raf_approx_func`: init target — `gelu` (default), `relu`, `leaky_relu`, `leaky_relu_0.1`,\n  `sigmoid`, `tanh`, `swish`, `silu`, `identity`.\n- `raf_trainable`: freeze the rational coefficients when `false`. Default `true`.\n- `raf_input_scaling`: per-token min-max scaling to `[-3, 3]` before the RAF (RAFT\n  preprocessing). Default `false`.\n\n**Parametric activations:** `prelu_init` (default `0.25`), `elu_alpha` (`1.0`),\n`celu_alpha`, `swish_beta` (`1.0`), `leaky_relu_slope` (`0.01`), `pelu_alpha`, `mpelu_alpha`,\n`mpelu_beta`, `felu_alpha`, `eelu_alpha`, `eelu_beta`, `pdelu_alpha`, `preu_alpha`,\n\
              `preu_beta`, `softexp_alpha`, `maxout_pieces` (int ≥ 1, default `2`).\n\n**SiTU-GLU:** `situ_beta_gate` (`4.0`) and `situ_beta_up` (`25.0`) set the\nsmooth-cap betas of the gate and up branches.\n\n**References:** (paper: arxiv:2208.14111) (paper: arxiv:1502.01852) (paper: arxiv:1710.05941)\n"
            description_es: "Parámetros anidados opcionales para activaciones aprendibles / paramétricas. Se ignoran para\nactivaciones sin estado. Todas las claves son opcionales.\n\n**RAF (Rational Activation Function (paper: arxiv:2208.14111)):**\n- `raf_degrees`: grados `[m, n]` del numerador/denominador Padé (ints ≥ 1). Por defecto `[5, 4]`.\n- `raf_version`: forma del denominador, uno de `A` (por defecto, \"segura\"), `B`, `C`, `D`, `N`.\n- `raf_approx_func`: objetivo de inicialización — `gelu` (por defecto), `relu`, `leaky_relu`,\n  `leaky_relu_0.1`, `sigmoid`, `tanh`, `swish`, `silu`, `identity`.\n- `raf_trainable`: congela los coeficientes racionales cuando es `false`. Por defecto `true`.\n- `raf_input_scaling`: escalado min-max por token a `[-3, 3]` antes del RAF (preprocesamiento\n  RAFT). Por defecto `false`.\n\n**Activaciones paramétricas:** `prelu_init` (`0.25`), `elu_alpha` (`1.0`), `celu_alpha`,\n`swish_beta` (`1.0`), `leaky_relu_slope` (`0.01`), `pelu_alpha`, `mpelu_alpha`,\
              \ `mpelu_beta`,\n`felu_alpha`, `eelu_alpha`, `eelu_beta`, `pdelu_alpha`, `preu_alpha`, `preu_beta`,\n`softexp_alpha`, `maxout_pieces` (int ≥ 1, `2`).\n\n**SiTU-GLU:** `situ_beta_gate` (`4.0`) y `situ_beta_up` (`25.0`) fijan los\nbetas de tope suave de las ramas gate y up.\n\n**Referencias:** (paper: arxiv:2208.14111) (paper: arxiv:1502.01852) (paper: arxiv:1710.05941)\n"
            additionalProperties: false
            properties:
              raf_degrees:
                description: 'Numerator/denominator polynomial degrees `[m, n]` of the rational (Padé) function for `raf`.

                  **References:** (paper: arxiv:2208.14111)'
                description_es: 'Grados polinómicos `[m, n]` de numerador/denominador de la función racional (Padé) para `raf`.

                  **Referencias:** (paper: arxiv:2208.14111)'
                type: array
                items:
                  type: integer
                  minimum: 1
                minItems: 2
                maxItems: 2
                default:
                - 5
                - 4
                examples:
                - - 5
                  - 4
              raf_version:
                description: 'Denominator formulation of the RaF rational function: `A` (safe, default), `B`, `C`, `D` or `N`.

                  **References:** (paper: arxiv:2208.14111)'
                description_es: 'Formulación del denominador de la función racional RaF: `A` (segura, por defecto), `B`, `C`, `D` o `N`.

                  **Referencias:** (paper: arxiv:2208.14111)'
                type: string
                enum:
                - A
                - B
                - C
                - D
                - N
                default: A
              raf_approx_func:
                description: 'Base function the RaF coefficients are initialized to approximate (`gelu` by default).

                  **References:** (paper: arxiv:2208.14111)'
                description_es: 'Función base que los coeficientes RaF se inicializan para aproximar (`gelu` por defecto).

                  **Referencias:** (paper: arxiv:2208.14111)'
                type: string
                enum:
                - gelu
                - relu
                - leaky_relu
                - leaky_relu_0.1
                - sigmoid
                - tanh
                - swish
                - silu
                - identity
                default: gelu
              raf_trainable:
                description: 'Whether the RaF rational coefficients remain trainable (`true`) or stay frozen after init (`false`).

                  **References:** (paper: arxiv:2208.14111)'
                description_es: 'Si los coeficientes racionales RaF permanecen entrenables (`true`) o quedan congelados tras el init (`false`).

                  **Referencias:** (paper: arxiv:2208.14111)'
                type: boolean
                default: true
              raf_input_scaling:
                description: 'Enable per-token min-max input scaling to `[-3, 3]` before the RaF (RAFT preprocessing).

                  **References:** (paper: arxiv:2208.14111)'
                description_es: 'Activa el escalado min-max por token a `[-3, 3]` antes del RaF (preprocesamiento RAFT).

                  **Referencias:** (paper: arxiv:2208.14111)'
                type: boolean
                default: false
              prelu_init:
                description: 'Initial value of the learnable PReLU slope.

                  **References:** (paper: arxiv:1502.01852)'
                description_es: 'Valor inicial de la pendiente aprendible de PReLU.

                  **Referencias:** (paper: arxiv:1502.01852)'
                type: number
                default: 0.25
                examples:
                - 0.25
              elu_alpha:
                description: 'Alpha of the ELU saturation region.

                  **References:** (paper: arxiv:1511.07289)'
                description_es: 'Alfa de la región de saturación del ELU.

                  **Referencias:** (paper: arxiv:1511.07289)'
                type: number
                default: 1.0
                examples:
                - 1.0
              celu_alpha:
                description: 'Alpha of the CELU (continuously differentiable ELU).

                  **References:** (paper: arxiv:1704.07483)'
                description_es: 'Alfa del CELU (ELU continuamente diferenciable).

                  **Referencias:** (paper: arxiv:1704.07483)'
                type: number
                default: 1.0
                examples:
                - 1.0
              swish_beta:
                description: 'Beta of the parametric Swish/SiLU form `x · sigmoid(β·x)`.

                  **References:** (paper: arxiv:1710.05941)'
                description_es: 'Beta de la forma paramétrica Swish/SiLU `x · sigmoid(β·x)`.

                  **Referencias:** (paper: arxiv:1710.05941)'
                type: number
                default: 1.0
                examples:
                - 1.0
              leaky_relu_slope:
                description: 'Slope of the negative branch for `leaky_relu`.

                  **References:** (paper: https://ai.stanford.edu/~amaas/papers/relu_hybrid_icml2013_final.pdf)'
                description_es: 'Pendiente de la rama negativa para `leaky_relu`.

                  **Referencias:** (paper: https://ai.stanford.edu/~amaas/papers/relu_hybrid_icml2013_final.pdf)'
                type: number
