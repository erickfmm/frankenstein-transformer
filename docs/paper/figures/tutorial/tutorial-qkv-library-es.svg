<div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>softmax</b><br />puntaje → porcentaje<br />cuánto tomar<br />de cada libro</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-books-4" data-look="classic" transform="translate(946.046875, 83)"><rect class="basic label-container" style="" x="-105.609375" y="-63" width="211.21875" height="126"/><g class="label" style="" transform="translate(-75.609375, -48)"><rect/><foreignObject width="151.21875" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>Valor (V)</b><br />el contenido del libro:<br />lo que el visitante<br />se lleva a casa</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-leave-5" data-look="classic" transform="translate(1207.65625, 83)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>El visitante se va<br />con una mezcla</b><br />55% <i>gato</i> + 35% <i>pescado</i> + …<br />(% × contenidos, sumados)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-roles-16" data-look="classic" transform="translate(684.4375, 227)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>cada palabra juega los tres roles:<br />pregunta (Q) · anuncia (K) · entrega (V)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient><style>/* Web-only Mermaid theme overrides (Paper tab).
