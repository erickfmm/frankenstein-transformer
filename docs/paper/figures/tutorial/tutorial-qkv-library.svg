t="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>Query (Q)</b><br />the visitor’s question:<br />“I am the word <i>eats</i> —<br />who here matters to me?”</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-cards-1" data-look="classic" transform="translate(129.1484375, 215)"><rect class="basic label-container" style="" x="-114.921875" y="-63" width="229.84375" height="126"/><g class="label" style="" transform="translate(-84.921875, -48)"><rect/><foreignObject width="169.84375" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>Key (K)</b><br />the catalog cards:<br />each book announces<br />“this is what I am about”</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-lib-2" data-look="classic" transform="translate(401.8984375, 143)"><rect class="basic label-container" style="" x="-125.6015625" y="-63" width="251.203125" height="126"/><g class="label" style="" transform="translate(-95.6015625, -48)"><rect/><foreignObject width="191.203125" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>The librarian<br />(attention)</b><br />compares question ↔ card<br />(dot product → score)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-soft-3" data-look="classic" transform="translate(683.5, 71)"><rect class="basic label-container" style="" x="-94.9296875" y="-63" width="189.859375" height="126"/><g class="label" style="" transform="translate(-64.9296875, -48)"><rect/><foreignObject width="129.859375" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>softmax</b><br />score → share %<br />how much of each<br />book to borrow</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-books-4" data-look="classic" transform="translate(934.8828125, 71)"><rect class="basic label-container" style="" x="-95.3828125" y="-63" width="190.765625" height="126"/><g class="label" style="" transform="translate(-65.3828125, -48)"><rect/><foreignObject width="130.765625" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>Value (V)</b><br />the book contents:<br />what the visitor<br />takes home</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-leave-5" data-look="classic" transform="translate(1175.8828125, 71)"><rect class="basic label-container" style="" x="-119.6171875" y="-63" width="239.234375" height="126"/><g class="label" style="" transform="translate(-89.6171875, -48)"><rect/><foreignObject width="179.234375" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p><b>The visitor leaves<br />with a mix</b><br />55% <i>cat</i> + 35% <i>fish</i> + …<br />(% × contents, added up)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-roles-16" data-look="classic" transform="translate(683.5, 215)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>every word plays all three roles:<br />asks (Q) · advertises (K) · delivers (V)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient><style>/* Web-only Mermaid theme overrides (Paper tab).
